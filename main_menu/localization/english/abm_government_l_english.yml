l_english:

# --- from abm_gov_reforms_l_english.yml ---
 # Wu - Granary Circuit (WUU)
 abm_wuu_people_granary_circuit_reform: "Granary Circuit System"
 abm_wuu_people_granary_circuit_reform_desc: "A system of state-managed granaries ensuring food security and attracting labourers to our lands. Requires the Granary Circuit advance and is only available from the Age of Discovery onward."

 # Fang - Noble Admiralty (CFN)
 abm_cfn_noble_board_regime: "Noble Board Regime"
 abm_cfn_noble_board_regime_desc: "A regime where noble admirals dominate the state, leveraging maritime power for trade and privateering. Only available to Wu (Fang) with access to ports. Cannot be combined with Military Regime or Admiralty Regime reforms."

 # Pirate Republic
 abm_china_pirates: "Chinese Pirate Republic"
 abm_china_pirates_desc: "A lawless maritime state built on plunder and privateering. Restricted to nations of the Chinese culture group with their capital in East Asia. Locks the government type to Republic and uses Pirate Elective succession."

 # Meritocratic Government
 abm_china_meritocratic_government: "Chinese Meritocratic Government"
 abm_china_meritocratic_government_desc: "A state governed by officials selected through merit rather than birthright, fostering trade and commerce. Restricted to nations of the Chinese culture group with their capital in East Asia. Government type must be Monarchy or Republic."

 # Buddhist Holy Order
 abm_china_buddhist_order: "Buddhist Holy Order"
 abm_china_buddhist_order_desc: "A theocratic state where the Buddhist clergy commands the military, raising levies and training light infantry. Available from the Age of Traditions. Restricted to Buddhist nations whose original capital is in East Asia. Government type must be Theocracy. Uses Oligarchic Elective succession."

 # Ahimsa Code
 abm_china_ahimsa_crown_commitment: "Crown Commitment to Ahimsa"
 abm_china_ahimsa_crown_commitment_desc: "The Crown commits itself to the principles of Ahimsa."
 abm_china_ahimsa_code: "Ahimsa Code"
 abm_china_ahimsa_code_desc: "A pacifist code of non-violence that forbids declaring war in exchange for steady development and prosperity. Available to Buddhist theocracies whose original capital is in East Asia after every estate has committed to Ahimsa. May only be enacted by specific tags."

 # India — Maritime League
 abm_india_maritime_league: "Indian Maritime League"
 abm_india_maritime_league_desc: "A confederation of port cities and trading houses operating under a shared maritime charter. Grants modest trade bonuses, replaces one local governor with two naval governors, and is available to Indian monarchies and republics with access to the sea."

 # India — Bazaar Republic
 abm_india_bazaar_republic: "Bazaar Republic"
 abm_india_bazaar_republic_desc: "A republic governed through the great marketplaces, where merchant guilds hold sway over state policy. Boosts trade income and maritime presence while curbing noble and clergy power. Replaces one local governor with two naval governors. Restricted to Indian republics."

 # India — Hasshashun Branch
 abm_india_hasshashun_branch: "Hasshashun Branch"
 abm_india_hasshashun_branch_desc: "A clandestine order operating within Shia theocracies, blending spiritual authority with political influence. Available to Sindh or Ahmadnagar with strong spiritualist leanings."

 # India — Kshatra Heathen War Code
 abm_india_kshatra_heathen_war_code: "Kshatra Heathen War Code"
 abm_india_kshatra_heathen_war_code_desc: "A martial code rooted in Hindu Kshatriya tradition, authorizing holy war against heathens and heretics. Increases crown estate power and enforces strict religious orthodoxy. Restricted to Hindu theocracies with strong spiritualist leanings."

 # India — Bengaleese Meritocracy
 abm_bengaleese_meritocracy: "Bengaleese Meritocracy"
 abm_bengaleese_meritocracy_desc: "A naval administration where merit and maritime skill determine rank and office. Strengthens galley warfare and coastal combat. Available to Bengali, Orissan, Zo, Tripuri, and Burmese cultures, or the Bengal tag."

 # Zaporizhzhia — Cossack Hetmanate
 abm_cossack_hetmanate_reform: "Cossack Hetmanate"
 abm_cossack_hetmanate_reform_desc: "A militarized Cossack republic balancing warrior traditions with democratic self-governance. Boosts the Cossack estate and military efficiency during wartime, while fostering cultural prosperity and diplomacy in times of peace. Available to Zaporizhzhia or any Cossack-culture republic with the Hetmanate advance."

 # Eastern Christianity — Militant Church
 abm_eastern_christian_militant_church: "Militant Church"
 abm_eastern_christian_militant_church_desc: "The clergy take up the sword in defense of the true faith, blessing the armies as they march against the heathen. Grants a combat bonus against heathens and strengthens the crown, at the cost of harsher treatment of non-believers. Restricted to Orthodox, Miaphysite, and Nestorian theocracies."

 # Colonial Republic
 abm_colonial_republic: "Colonial Republic"
 abm_colonial_republic_desc: "A republican government born across the sea, where power rests on maritime trade and the self-rule of new settlements. Grants an additional government reform slot, increases maritime presence, and eases the cost of governing distant ports and roads. Available to republics whose capital lies in the Americas or Oceania."

 # Merchant Emporium
 abm_trade_emporium: "Trade Emporium"
 abm_trade_emporium_desc: "A trading state where power rests on the great markets and the sea lanes that feed them. Available to republics and monarchies whose original capital lies in West or East Africa, Southeast Asia, or the Middle East. Increases merchant capacity and power, sea trade efficiency, foreign construction, and production, and turns the state toward the capital economy, innovation, and naval strength."

 abm_koj_kingdom_of_heaven_reform: "Kingdom of Heaven"
 abm_koj_kingdom_of_heaven_reform_desc: "The crown of Jerusalem no longer rules a frontier march but a Kingdom of Heaven made manifest on earth. The Holy Sepulchre is ours, the Latin Patriarch crowns our king, and the princes of Christendom look to Jerusalem for leadership. Spiritual and temporal authority are one, and the laws of the realm are the laws of Heaven."
 abm_koj_proclaim_kingdom_of_heaven: "Proclaim the Kingdom of Heaven"
 abm_koj_proclaim_kingdom_of_heaven_desc: "By holding the greater part of the Levant as our own integrated land, we have earned the right to declare the Kingdom of Heaven on Earth. The crown of Jerusalem will be surrendered to God: the realm becomes a theocracy governed by the holy orders as a military order, its laws the laws of Heaven and its faith beyond question."
 abm_koj_proclaim_kingdom_of_heaven_tt: "We own and have fully integrated at least 80% of the Levant"
 abm_geo_greater_georgia_reform: "Greater Georgia"
 abm_geo_greater_georgia_reform_desc: "The crowns of Tbilisi and Kutaisi are one again, and with them the mountain lords of the whole Caucasus bend the knee to a single Bagration. The realm of David the Builder and Queen Tamar has been restored on a grander scale than either ever knew: an empire of passes and high valleys, where the king's writ runs from the Black Sea to the Caspian and the crown answers to no earthly master. Central authority is strengthened, the throne is honoured by free men and vassals alike, and the prestige of Georgia is spoken of in Constantinople, Tabriz and beyond."
 abm_geo_greater_georgia: "Proclaim Greater Georgia"
 abm_geo_greater_georgia_desc: "The greater part of the Caucasus lies under our rule, its lands fully integrated and its peoples sworn to the Georgian crown. The time has come to cast aside the modest style of a mere kingdom and proclaim what the Bagrationi have in truth become: an empire spanning the mountains, heir to the glory of David the Builder and Queen Tamar. Let the world know that Greater Georgia stands."
 abm_geo_greater_georgia_tt: "We own and have fully integrated at least 80% of the Caucasus region"
 abm_arm_greater_armenia_reform: "Greater Armenia"
 abm_arm_greater_armenia_reform_desc: "From the fortresses of Cilicia to the high valleys of the Armenian plateau, the scattered principalities of the Armenians answer once more to a single crown. Yerevan, Sis and Sivas are ours, and with them the memory of Tigranes and of the Bagratid kings who once held the whole of the highlands. The catholicos blesses the throne, the nakharar lords ride at our command, and the realm stands as the one Armenian state the world must reckon with. Crown authority is consolidated, the succession is secured, and the name of Armenia is spoken with respect from Constantinople to Tabriz."
 abm_arm_greater_armenia: "Proclaim Greater Armenia"
 abm_arm_greater_armenia_desc: "Cilicia, Cappadocia and the Armenian highlands lie largely under our rule, their lands fully integrated, and the three great seats of Yerevan, Sis and Sivas are in our hands. The time has come to put aside the modest title of a mere principality and proclaim the Greater Armenia that our people have awaited for centuries: one crown, one faith, and one realm spanning the mountains from the Mediterranean to the Caucasus."
 abm_arm_greater_armenia_tt: "We have fully integrated at least 80% of Cilicia, Cappadocia, the Armenian highlands and Armenia, and hold Yerevan, Sis and Sivas"
 abm_greater_caucasus_reform: "Greater Caucasus"
 abm_greater_caucasus_reform_desc: "The mountains no longer divide us; they carry our authority. From the passes of the northern range to the plains of Shirvan and the highlands of the south, the many peoples of the Caucasus - mounted clans and mountain villages, city merchants and valley lords alike - acknowledge one crown above their own. Where each valley once answered only to its own elders, there is now a single court, a single coin, and a single name spoken with weight from Derbent to the Armenian marches. The crown draws strength from every clan it has bound together, the succession is settled, and the rulers of Persia, Anatolia and the steppe must treat the Caucasus as a power rather than a hunting ground."
 abm_greater_caucasus: "Proclaim Greater Caucasus"
 abm_greater_caucasus_desc: "The greater part of the Caucasus lies under our rule, its lands fully integrated and its clans bound to our court. No longer a mere mountain principality among rivals, we stand as the one power that has done what none before us could: bring the whole of the Caucasus under a single sovereign. Let the world learn our name, and let every valley know to whom the passes now belong."
 abm_greater_caucasus_tt: "We own and have fully integrated at least 80% of the Caucasus region"

 # Rough-terrain homeland reform (government_reforms/abm_gov_reforms_rough_terrain.txt)
 abm_homeland_proximity_reform: "Homeland Proximity Administration"
 abm_homeland_proximity_reform_desc: "Rough-terrain institutions keep authority flowing over mountains, plateaus and hills, but only in the home region: the region of our [historical_capital|e] if we have one, otherwise the region of our original [capital|e]. Everywhere else the terrain costs what it always did."
 abm_homeland_proximity_reform_tt: "Rough [topography|e] - mountains, hills and plateaus - costs no [proximity|e] in those [locations|e]."

 # Location tooltips for the reform's location_modifier potential_trigger
 abm_tt_homeland_historical_capital_region: "[locations|e] we own in the [region|e] of our [historical_capital|e] gain:"
 abm_tt_homeland_original_capital_region: "[locations|e] we own in the [region|e] of our original [capital|e] gain:"

# --- from abm_estate_privileges_l_english.yml ---
 abm_cossack_black_sea_raids: "Cossack Black Sea Raids"
 abm_cossack_black_sea_raids_desc: "Our Cossacks take to the seas in their swift chayka boats, raiding the coasts for plunder and captives. Grants the ability to hire privateers and raid for slaves, but only while we control a port."

 # Open plains privilege (steppe nations, kingdom rank or above)
 abm_cossack_open_plains_privilege: "Cossack Open Plains"
 abm_cossack_open_plains_privilege_desc: "The Host takes over the administration of the open plains: post stations and patrols make the steppe governable. Our flatland [locations|e] gain #G +10%#! [proximity|e] efficiency, the [proximity|e] cost through [roads|e] drops by #G 2#!, and the state is pushed #G 10#! points towards centralisation. Requires a kingdom or empire whose original capital lies in the steppes and a settled faith, and cannot be combined with the tribal version."
 abm_tribal_open_plains_privilege: "Tribal Open Plains"
 abm_tribal_open_plains_privilege_desc: "The tribal elders take over the administration of the open plains: their riders keep the roads and the grazing routes open. Our flatland [locations|e] gain #G +10%#! [proximity|e] efficiency, the [proximity|e] cost through [roads|e] drops by #G 2#!, and the state is pushed #G 10#! points towards centralisation. Requires a kingdom or empire whose original capital lies in the steppes and a settled faith, and cannot be combined with the cossack version."
 abm_open_plains_privilege_tt: "Flatland [locations|e]: #G +10%#! [proximity|e] efficiency. [roads|e]: #G -2#! [proximity|e] cost. One-time: #G +10#! centralisation."
 abm_tt_steppe_flatland_location: "Our flatland [locations|e] gain:"

