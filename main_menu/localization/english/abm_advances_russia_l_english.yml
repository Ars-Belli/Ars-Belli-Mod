l_english:

 abm_nov_ideas_tradition_1: "Novgorodian Tradition I"
 abm_nov_ideas_tradition_1_desc: "Novgorodian Tradition I"
 abm_nov_ideas_tradition_2: "Novgorodian Tradition II"
 abm_nov_ideas_tradition_2_desc: "Novgorodian Tradition II"
 abm_northern_center_of_arts: "Northern Center of Arts"
 abm_northern_center_of_arts_desc: "The city of Novgorod is an important cultural center in Europe. Epic stories based on a high level of literacy, beautiful icons and grandiose architectures increase the prestige of our flourishing city and the whole nation."
 abm_city_of_churches: "City of Churches"
 abm_city_of_churches_desc: "Over 80 Orthodox Churches in Novgorod, especially Dom Svyatoy Sofiy, are some of the largest landholders in the principality. With their wealth and religious prestige, the Churches influence the population in many areas, and our citizens are more pious, in a good way."
 abm_ivans_hundred: "Ivan's Hundred"
 abm_ivans_hundred_desc: "The heads of the Ivan's Hundred, our local merchant guild, are permanent members of the commerce court of Novgorod and ruling council of the Novgorod Republic. With their presence in the politics and the agreements made between them and the nobles, the successful trade in our nation is ensured to last."
 abm_control_of_the_hanseatic_kontor: "Control of the Hanseatic Kontor"
 abm_control_of_the_hanseatic_kontor_desc: "Peterhof is a closed area in Novgorod where the Hanseatic merchants have trade privileges. If we can increase our control over these independent traders, trading in the Baltic Sea will be even easier and more profitable."
 abm_grand_dukes_army: "Grand Duke's Army"
 abm_grand_dukes_army_desc: "Leading troops is the most important duty for the grand duke. Under his strong leadership, we can mobilize more soldiers."
 abm_exploration_tradition: "Funding the Ushkuiniks"
 abm_exploration_tradition_desc: "The Viking-like Ushkuiniks pirates were a useful tool to suppress our competitors. Unfortunately it was stopped due to foreign intervention, mainly from Moscow. We should begin to fund them again and push these pirate activities to further seas to remind everyone who's the real master of the north..."
 abm_baltic_shipyard: "Baltic Shipyard"
 abm_baltic_shipyard_desc: "Build a Grand shipyard at the eastern coast of the Baltic Sea and dominate the oversea trade!"
 abm_nov_ideas_ambition: "Novgorodian Ambition"
 abm_nov_ideas_ambition_desc: "Novgorodian Ambition"
 abm_mos_ideas_tradition_1: "Muscovite Tradition I"
 abm_mos_ideas_tradition_1_desc: "Muscovite Tradition I"
 abm_mos_ideas_tradition_2: "Muscovite Tradition II"
 abm_mos_ideas_tradition_2_desc: "Muscovite Tradition II"
 abm_gatherers_of_tribute: "Gatherers of Tribute"
 abm_gatherers_of_tribute_desc: "The Tatar Yoke was for a long time a harsh hindrance to Russian society, but Muscovy still thrived as our state had the right to collect the tribute to the Khan. Even now we enjoy the benefits of the organization we built to perform this function."
 abm_legacy_of_dmitriy_donskoi: "Legacy of Dmitriy Donskoi"
 abm_legacy_of_dmitriy_donskoi_desc: "After centuries of suffering the Tatar yoke Dmitry of Don was able to soundly defeat the forces of the Golden Horde. We must cherish his memory and never again accept suffering in silence."
 abm_seat_of_metropolitan_bishop: "Seat of Metropolitan Bishop"
 abm_seat_of_metropolitan_bishop_desc: "The Russian people need firm religious guidance. We have historically had good cooperation with the church, and this is a friendship we could both gain from expanding. If we can get the seat of the Metropolitan Bishop to move to Moscow, we will be able to further strengthen the bonds between the Russian Orthodox faith and our state."
 abm_pomestnoe_voisko: "Pomestnoe Voisko"
 abm_pomestnoe_voisko_desc: "By redistributing plots of confiscated lands to noble cavalrymen we can build a new class of soldiers to support our principality."
 abm_strength_of_the_boyars: "Strength of the Boyars"
 abm_strength_of_the_boyars_desc: "The Boyar class is in many ways the foundation of the Russian Imperial enterprise but just as we need to strengthen the Boyars, we need to control them. We must both protect seats for the Boyars in the Duma and make sure that they need to rely on us to further their influence."
 abm_zasechnaya_cherta: "Zasechnaya Cherta"
 abm_zasechnaya_cherta_desc: "In order to withstand the Tatar raids our ancestors have always kept a line of tightly positioned and well defended forts. As our state expands, we should keep expanding this 'Abatis Line' to ensure that we can always protect our people against far flung attacks."
 abm_descendants_of_byzantine_emperors: "Descendants of Byzantine Emperors"
 abm_descendants_of_byzantine_emperors_desc: "We are united with the Byzantine Emperors of old through marriages and alliances. This makes us the descendants of an ancient imperial line of both great influence and ability and will further our political ambitions."
 abm_mos_ideas_ambition: "Muscovite Ambition"
 abm_mos_ideas_ambition_desc: "Muscovite Ambition"
 abm_rus_ideas_tradition_1: "Russian Tradition I"
 abm_rus_ideas_tradition_1_desc: "Russian Tradition I"
 abm_rus_ideas_tradition_2: "Russian Tradition II"
 abm_rus_ideas_tradition_2_desc: "Russian Tradition II"
 abm_land_of_the_rus: "Land of the Rus"
 abm_land_of_the_rus_desc: "The Rus together will be a force to reckon with."
 abm_siberian_frontier: "Siberian Frontier"
 abm_siberian_frontier_desc: "The distant wastes of Siberia call to us. We must clear a way there and let our cossacks go forth and bring land for the Russian people."
 abm_russian_artillery_yard: "Russian Artillery Yard"
 abm_russian_artillery_yard_desc: "Superior firepower is what determines the sieges of today as well as the pitched battles of tomorrow. We must build a state-of-the-art artillery yard in the heart of our country, to ensure our armies are never without cannons nor ammunition."
 abm_life_long_conscription: "Life-Long Conscription"
 abm_life_long_conscription_desc: "In order to feed our ever-growing armies we should expand the terms of military service so that it becomes a lifelong commitment. This will offer social mobility to those that would otherwise lead lives in lesser occupations, and it will give us a reliable source of soldiers for our imperial endeavors."
 abm_abolish_the_mestnichestvo: "Abolish the Mestnichestvo"
 abm_abolish_the_mestnichestvo_desc: "The Mestnichestvo was an ancient system that states that state jobs should be offered to persons based upon how ancient their lineage was. This was problematic because this did not take into account the suitability of the candidate. The abolishment of this system will improve state bureaucracy by allowing appointment by merit."
 abm_table_of_ranks: "The Table of Ranks"
 abm_table_of_ranks_desc: "The abolishment of the Mestnichestvo was the first move to make the state bureaucracy more meritocratic. The table of ranks codified this and made service and promotion in the army conditional on service in lower ranks."
 abm_curriculum_of_the_cadet_corps: "Broaden the curriculum of the Cadet Corps"
 abm_curriculum_of_the_cadet_corps_desc: "We have more cadets than there are officer places in our army, we should use the cadet corps to create not just potential officers, but scientists and engineers as well."
 abm_rus_ideas_ambition: "Russian Ambition"
 abm_rus_ideas_ambition_desc: "Russian Ambition"
 abm_prm_ideas_tradition_1: "Permian Tradition I"
 abm_prm_ideas_tradition_1_desc: "Permian Tradition I"
 abm_prm_ideas_tradition_2: "Permian Tradition II"
 abm_prm_ideas_tradition_2_desc: "Permian Tradition II"
 abm_capital_of_prikamye: "Capital of Prikamye"
 abm_capital_of_prikamye_desc: "Our capital city, Cherdyn, is one of the oldest cities in this part of Siberia. Mentioned in many different sources, from Norse Sagas to Arab chronicles, Cherdyn has always been the natural center of our Kama river region."
 abm_turkic_mercenaries: "Turkic Mercenaries"
 abm_turkic_mercenaries_desc: "For centuries various Turkic peoples have come to the lands around us and in time many have migrated on elsewhere. Capable and strong warriors, these men are unmatched in the art of cavalry warfare and for a coin will serve as superb mercenary cavalry."
 abm_the_old_traditions: "The Old Traditions"
 abm_the_old_traditions_desc: "Even though our people have been Christianized in and around the main centers of our lands many on the outer edges still cling to the old religion and the ways of our forefathers. If we are to create a strong country a balance between our new and old religion must be maintained. There are too few of us to allow these things to drive us apart."
 abm_the_great_perm: "Great Perm"
 abm_the_great_perm_desc: "The main road of this region is the Koma river and our capital Cherdyn enjoys the riches that the traders of this river bring us."
 abm_warriors_of_taiga: "Warriors of the Taiga"
 abm_warriors_of_taiga_desc: "Deep in the north, beyond all the ancient cities and kremlins of the Rus', lies the land of boreal forests: pines, spruces and larches reign this snowy realm supreme and unchallenged. Between these trees our warriors travel - unmatched in their knowledge and understanding of the laws of taiga. In our lands no army will ever find or catch us - unless we want it to."
 abm_komi_tolerance: "Komi Tolerance"
 abm_komi_tolerance_desc: "Our people still remember days not too long ago when they had another religion. Although most now love this new God that the Rus' brought to us we don't look down upon our brethren who cling to the ways of nature whose spirits still surround us in the depths of our forests."
 abm_permian_army_reform: "Permian Army Reform"
 abm_permian_army_reform_desc: "As a people of semi nomadic hunters and traders our people have for centuries relied mostly on Turkic mercenaries and our ruler's personal retainers to fight to protect these lands. However the times are changing and rumors of new ways of fighting have reached us from Europe. If we are to outgrow our humble beginnings and become equal members of the family of modern European countries we have to reform our army and create a standing force capable of protecting our homes. It is after all better to be safe than sorry."
 abm_prm_ideas_ambition: "Permian Ambition"
 abm_prm_ideas_ambition_desc: "Permian Ambition"
