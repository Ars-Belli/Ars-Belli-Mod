l_english:

# --- from abm_steppe_minerals_decisions_l_english.yml ---
 abm_develop_luhan_rgos.title: "Develop the Luhansk Coalfield"
 abm_develop_luhan_rgos.desc: "The western end of the Donets basin runs beneath the pasture at Luhansk and Mityakinskaya. Once every land in the province is a full core of ours, held by our own culture and faith, we can sink the first shafts and open the Donets coalfield."
 abm_develop_luhan_rgos.a: "Open the pits."
 abm_develop_bakhmut_rgos.title: "Develop the Bakhmut Coalfield"
 abm_develop_bakhmut_rgos.desc: "Coal seams reach the surface along the northern Donets around Lysychansk and Kreminna, close to the salt works at Bakhmut. Once every land in the province is a full core of ours, held by our own culture and faith, we can work them properly."
 abm_develop_bakhmut_rgos.a: "Open the pits."
 abm_develop_tana_rgos.title: "Develop the Kalmius Coalfield"
 abm_develop_tana_rgos.desc: "The eastern Donets basin runs through the Kalmius country, where the seams lie shallow under the grass. Once every land in the province is a full core of ours, held by our own culture and faith, we can begin to mine them."
 abm_develop_tana_rgos.a: "Open the pits."
 abm_develop_izium_rgos.title: "Open the Donets Ridge Iron Mines"
 abm_develop_izium_rgos.desc: "Iron ore outcrops along the Donets Ridge near Barvinkove. Once every land in the province is a full core of ours, held by our own culture and faith, we can open workings there and feed the forges of the steppe."
 abm_develop_izium_rgos.a: "Open the mines."
 abm_develop_kursk_rgos.title: "Prospect the Kursk Iron Field"
 abm_develop_kursk_rgos.desc: "The iron ore of the Kursk field lies close to the surface around Stary Oskol, beneath the farmland of the northern forest-steppe. Once every land in the province is a full core of ours, held by our own culture and faith, we can begin to work it."
 abm_develop_kursk_rgos.a: "Open the mines."
 abm_develop_belgorod_rgos.title: "Open the Belgorod Iron Mines"
 abm_develop_belgorod_rgos.desc: "The southern edge of the iron field reaches the lands around Muzhech. Once every land in the province is a full core of ours, held by our own culture and faith, we can open workings and supply our foundries."
 abm_develop_belgorod_rgos.a: "Open the mines."
 abm_develop_donetsk_rgos.title: "Establish Timber Works on the Donets"
 abm_develop_donetsk_rgos.desc: "The wooded valleys of the upper Donets tributaries around Khotmyzh and Kotelva carry timber enough for the shipyards and mines of the south. Once every land in the province is a full core of ours, held by our own culture and faith, we can put the woods to work."
 abm_develop_donetsk_rgos.a: "Fell the woods."

 abm_develop_majar_rgos.title: "Develop the Kuma Copper Shows"
 abm_develop_majar_rgos.desc: "Where the Caucasus foothills break out of the steppe around Pyatigorsk, copper ores lie close to the surface. Once every land in the province is a full core of ours, held by our own culture and faith, we can work them."
 abm_develop_majar_rgos.a: "Open the copper pits."

 abm_develop_terek_rgos.title: "Develop the Terek Copper"
 abm_develop_terek_rgos.desc: "The Terek basin has long carried copper shows that the mountain communities worked by hand. Once every land in the province is a full core of ours, held by our own culture and faith, we can work them."
 abm_develop_terek_rgos.a: "Open the copper pits."

 abm_develop_stavropol_rgos.title: "Work the Foothill Lead"
 abm_develop_stavropol_rgos.desc: "Argentiferous galena runs through the North Caucasus foothills, carrying lead and a little silver with it. Once every land in the province is a full core of ours, held by our own culture and faith, we can work it."
 abm_develop_stavropol_rgos.a: "Open the lead mine."

 abm_develop_taskala_rgos.title: "Work the Orenburg Copper and Tin"
 abm_develop_taskala_rgos.desc: "On the Ural margin at Taskala lies the old Kargaly copper field, worked since the Bronze Age, and further out towards the Kazakh steppe a workable tin. Once every land in the province is a full core of ours, held by our own culture and faith, we can work them."
 abm_develop_taskala_rgos.a: "Open the copper and tin workings."

# --- from abm_steppe_rgo_conversion_l_english.yml ---
 abm_reorganize_pastoral_rgo: "Reorganise Pastoral Province"
 abm_reorganize_pastoral_rgo_desc: "The pasturelands of the Pontic steppe have long fed nothing but herds. Where the land is secure, settled, and thickly peopled with our own culture and faith, we may turn a valley to another crop, another herd, or — on the coast — even to the sand pits that feed the glassworks. Choose a province, choose the land, and choose what it shall produce."
 abm_reorganize_pastoral_rgo_select_province: "Which province shall we reorganise?"
 abm_reorganize_pastoral_rgo_select_location: "Which land within it?"
 abm_reorganize_pastoral_rgo_cost: "10 [stability|e], 10 [political_influence|e] and 100-300 [gold|e] depending on the location [development|e]"
 abm_reorganize_pastoral_rgo_select_good: "What shall it produce?"
 abm_reorganize_pastoral_rgo_no_province: "@trigger_no! No pastoral steppe province meets the requirements: every land in it must be a full core of ours, held by our own culture and faith, and have at least 10 development."
 abm_reorganize_pastoral_rgo_no_location: "@trigger_no! No land in this province can be reorganised: it must be a full core of ours, of our culture and faith, with a pastoral raw material, and each location may be reorganised only once."
 abm_reorganize_pastoral_rgo_no_good: "@trigger_no! No other raw material is available for this land."
 abm_reorganize_pastoral_rgo_decision.title: "Reorganise a Pastoral Province"
 abm_reorganize_pastoral_rgo_decision.desc: "The pasturelands of the Pontic steppe have long fed nothing but herds. Where the land is secure, settled, and thickly peopled with our own culture and faith, we may turn a valley to another crop, another herd, or — on the coast — even to the sand pits that feed the glassworks."
 abm_reorganize_pastoral_rgo_decision.a: "Choose a province to reorganise."
 abm_establish_timber_working: "Establish a Timber Working"
 abm_establish_timber_working_desc: "A stand of timber is worth more than open pasture, but only where the logs can be floated out. Along the rivers and lake shores of the Pontic steppe we may clear a working, provided the land is a full core of ours, held by our own culture and faith, and wealthy enough to sustain it. One such working may be founded in a province, no more than three of them ours in any one area, and no more than six in an area in all."
 abm_establish_timber_working_select_province: "Which province shall we work for timber?"
 abm_establish_timber_working_select_location: "Which land within it?"
 abm_establish_timber_working_cost: "10 [stability|e], 10 [political_influence|e] and 1500 [gold|e]"
 abm_establish_timber_working_no_province: "@trigger_no! No pastoral steppe province meets the requirements: every land in it must be a full core of ours, held by our own culture and faith, have at least 10 development, and contain no timber working already."
 abm_establish_timber_working_no_location: "@trigger_no! No land in this province can be turned to timber: it must be a full core of ours, of our culture and faith, with a pastoral raw material, lie on a river or a lake shore, and its area may hold at most six timber workings, of which no more than three may be ours."
 abm_establish_timber_working_decision.title: "Establish a Timber Working"
 abm_establish_timber_working_decision.desc: "Open steppe is no place for forestry, but the river valleys and lake shores of the Pontic steppe carry timber worth the felling. Such a working is a costly undertaking, and the land must be secure and settled before it can be kept."
 abm_establish_timber_working_decision.a: "Choose a province to work for timber."

# --- from abm_settle_the_steppe_l_english.yml ---
 abm_settle_the_steppe: "Settle the Steppe"
 abm_settle_the_steppe_desc: "The grassland between the rivers is empty of ploughland and full of grass. We will send settlers out to break the turf, dig wells and raise villages where only herds have been, so that the steppe is peopled by our own folk rather than left to wanderers."
 abm_settle_the_steppe_action: "Settle [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 abm_settle_the_steppe_active: "Settling [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 abm_settle_the_steppe_action_progress: "[SCOPE.sProvince('target').GetAverageDevelopment]@development!"
 abm_settle_the_steppe_action_progress_wordier: "$abm_settle_the_steppe_action_progress$"
 abm_settle_the_steppe_action_progress_tooltip: "#T Settle the Steppe#!\nAverage [development|e] per [location|e] in [SCOPE.sProvince('target').GetName]: [SCOPE.sProvince('target').GetAverageDevelopmentInfo]\n\n#T Completed When#!\nEvery [location|e] in the province has at least 20 [development|e] and is at least 50% of its [population_capacity|e] full.\n\n[SCOPE.sCabinet('cabinet').GetActionEndConditions]"
 abm_settle_the_steppe_select_province: "Which province shall we settle?"
 abm_settle_the_steppe_no_provinces: "@trigger_no! No suitable [provinces|e] found. A target province must:\nBe in the steppes region and entirely ours;\nHave a primary or accepted [culture|e] of ours as the dominant culture in every location;\nStill have a [location|e] below 20 [development|e] or below 50% of its [population_capacity|e];\nNot already be supported by this action.\n\nThis action also requires a [monarchy|e], [theocracy|e] or [republic|e], and a non-pagan [religion|e]."
 abm_settle_the_steppe_advance: "$abm_settle_the_steppe$"
 abm_settle_the_steppe_advance_desc: "$abm_settle_the_steppe_desc$"

# --- from abm_pontic_steppe_l_english.yml ---
 abm_develop_or_qapi_rgos.title: "Develop the Or Qapi Province"
 abm_develop_or_qapi_rgos.desc: "Good stone lies close under the plain at Kezlev, within easy reach of the coast and the salt pans. Once every land in the province is held by a settled government and its people share the culture and faith of their rulers, we can open the quarries and set the province to work."
 abm_develop_or_qapi_rgos.a: "Set the province to work."
 abm_develop_cafa_rgos.title: "Develop the Cafa Province"
 abm_develop_cafa_rgos.desc: "The coast of the Cafa province can be made to serve a settled realm. Timber from the hills above Soldaia, iron from the workings at Vosporo, and dyes from the looms of Kaffa would free us from the merchants of the steppe. Once every land in the province is held by a settled government and its people share the culture and faith of their rulers, the work can begin."
 abm_develop_cafa_rgos.a: "Set the province to work."
 abm_develop_gothia_rgos.title: "Develop the Gothia Province"
 abm_develop_gothia_rgos.desc: "The old Gothic lands behind the coast have long lain fallow. Coal seams run beneath the plain at Qirq Yer and Qarasuvbazar, while the wooded hills around Lusta and Theodoro can supply timber for the shipyards of the Pontus. Once every land in the province is held by a settled government and its people share the culture and faith of their rulers, we can put these resources to work."
 abm_develop_gothia_rgos.a: "Set the province to work."
