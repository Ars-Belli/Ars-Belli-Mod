l_english:
 abm_crown_of_great_moravia_decision.title: "The Crown of Great Moravia"
 abm_crown_of_great_moravia_decision.desc: "Svatopluk's realm fell to the Magyars and the Czech lands were split between Premyslid and foreign lords. Yet the memory of Great Moravia lives on in the language of the church, in the old fortresses of Nitra and Veligrad, and in the blood of our people. If we hold the heartland — Bohemia, Moravia, Slovakia, Silesia, the Saxon and Polish marches and the Danube frontier — we can crown ourselves once more and claim the inheritance of the Moravian kings."
 abm_crown_of_great_moravia_decision.a: "We are the heirs of Svatopluk."
 abm_crown_of_great_moravia_reform: "The Crown of Great Moravia"
 abm_crown_of_great_moravia_reform_desc: "The crown of Svatopluk has been restored. Our court speaks the Slavic tongue the Apostles of the Slavs gave us, our legitimacy rests on the old Moravian kings, and the scholars of our realm study the legacy of Cyril and Methodius."
 GMA: "Great Moravia"
 GMA_ADJ: "Great Moravian"
