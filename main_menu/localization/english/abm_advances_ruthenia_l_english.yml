l_english:

 # BIRTH
 abm_birth_of_russian_orthodoxy: "Birth of Russian Orthodoxy"
 abm_birth_of_russian_orthodoxy_desc: "The early Rus' suffered from various religious troubles. In the year 988 Vladimir the Great was baptized after the capture of Korsun. Upon returning to Kiev he ordered the mass baptism of the citizenry in the Dnieper river, marking the first step in the Christianization of Rus'."

 # CENTER
 abm_center_of_orthodox_church: "Center Of Orthodox Church"
 abm_center_of_orthodox_church_desc: "It was Kiev itself where the baptism of Rus' began. For years and centuries, despite all political games and pretentious claims by our northern brethren, Kiev still remains the unquestionable center of the Eastern European Orthodox Church."

 # CENTRALIZED
 abm_centralized_rule: "One To Rule Them All"
 abm_centralized_rule_desc: "The great and mighty Kievan Rus', once centered in our very city, fell apart into countless petty principalities, endlessly fighting among themselves, bickering and unaware of the fact that larger realms were looking at them and considering them to be ripe for the picking. Never again will we allow this. Our new country shall root out any idea of autonomy and mercilessly keep the tightest of grips over all our former domains. Centralized, we shall stand united without equals."

 # CHERNOZEM
 abm_chernozem_land: "Chernozem"
 abm_chernozem_land_desc: "The Ruthenian Chernozem is the most fertile piece of land in the whole of Europe. If we manage to secure peace in our lands and prevent invaders from destroying our crops, we can become Europe's largest exporter of grain bringing countless fortunes to our home."

 # CHR
 abm_chr_ambition: "Chernihiv Ambition"
 abm_chr_ambition_desc: "Chernihiv Ambition"
 abm_chr_cossack_regiments: "Field Cossack Regiments"
 abm_chr_cossack_regiments_desc: "We must adapt to the new reality of the steppes; the growing influence of the Cossacks. We must make agreements with them that guarantee their autonomy while ensuring their military service to the state."
 abm_chr_cultivate_the_east_dniepr: "Tame the Grasslands"
 abm_chr_cultivate_the_east_dniepr_desc: "The left bank of the Dnieper could be the breadbasket of Europe, if only the wild grasslands could be tamed. We must invest in the region's cultivation so that its full potential can be realized."
 abm_chr_ideas_tradition_1: "Chernihiv Traditions"
 abm_chr_ideas_tradition_1_desc: "Chernihiv Traditions"
 abm_chr_ideas_tradition_2: "Chernihiv Traditions"
 abm_chr_ideas_tradition_2_desc: "Chernihiv Traditions"
 abm_chr_konotop_fortress: "Konotop Fortress"
 abm_chr_konotop_fortress_desc: "We must construct a new fortress along the banks of the Konotopka river. It shall be a modern bastion, utilizing the latest engineering techniques and a model for our future fortification efforts."
 abm_chr_legacy_of_the_old_principality: "Legacy of the Old Principality"
 abm_chr_legacy_of_the_old_principality_desc: "Chernigov was once the largest principality in Kievan Rus, and second in political importance only to Kiev itself. We are no strangers to the administration of lands that stretch far beyond our capital."
 abm_chr_local_councils: "Local Governance Councils"
 abm_chr_local_councils_desc: "The needs of each locality in our realm can differ wildly, and it can be difficult to administer them with a common policy. We should encourage local councils to govern themselves to an extent so that they can attend to their own needs."
 abm_chr_regimental_barracks: "Expand Regimental Barracks"
 abm_chr_regimental_barracks_desc: "To house both our native soldiers and the Cossack regiments we employ, we must expand our regimental barracks and implement a formal system of recruitment."
 abm_chr_renovate_transfiguration_cathedral: "Renovate the Transfiguration Cathedral"
 abm_chr_renovate_transfiguration_cathedral_desc: "As the oldest remaining structure in the city, the Transfiguration Cathedral is a reminder of past glories as well as a symbol of our enduring faith. The Cathedral should be renovated, symbolizing a renewal of our ambitions and spiritual dedication."

 # CULTURAL
 abm_cultural_center: "Cultural Center"
 abm_cultural_center_desc: "In addition to being one of the three most important political centers of Kievan Rus', Polotsk also acted as a hub for both culture and religion. A bastion of Orthodox Christianity in Eastern Europe, Polotsk is home to the Cathedral of Saint Sophia, which housed many beautiful works of Medieval art and craftsmanship."

 # DIPLOMATIC
 abm_diplomatic_initiative: "Diplomatic Initiative"
 abm_diplomatic_initiative_desc: "Although the history of our principality is full of heroic princes and armies the truth is that we are a small realm surrounded by giants. In order for our nation to survive and continue to thrive we must forge relationships with as many countries as we possibly can. Our only chance for survival is to obtain strong allies and hope that our sheer audacity will be enough to our neighbors rethink their plans of conquest."

 # EAST
 abm_east_and_west: "East and West"
 abm_east_and_west_desc: "Our geographic location between the states of the east and the west provided our merchants with an opportunity to be the middle men in the extremely lucrative trade routes of the region."

 # FENDING
 abm_fending_off_the_invaders: "Fending Off The Invaders"
 abm_fending_off_the_invaders_desc: "For ages barbaric nomads from the steppe have crossed into Rus' lands pillaging and burning our towns and forts, even Kiev itself on many occasions. Well, no more. We shall build walls so high and wide that even mightiest of Khans will never breach them."

 # FOREST
 abm_forest_of_europe: "Forest of Europe"
 abm_forest_of_europe_desc: "Long before our forefathers settled here these lands were covered in ancient forests and marshes. As they were abundant in timber our people built their home here. Since those times we have relied on the forest to provide us with the materials and sustenance that we need to survive. When our homes were sacked, pillaged and burnt to the ground by rivaling tribes we turned to the forest that had provided and protected us and used its bounty to quickly rebuild all that we had lost."

 # HERITAGE
 abm_heritage_of_rus: "Heritage of the Rus'"
 abm_heritage_of_rus_desc: "Ruthenia is the heartland of the former Kievan Rus' and within this heartland lies Kiev, the place to which all roads lead. With Kiev in our hands restoration of the Rus' itself is only a single step away."
 abm_heritage_of_the_rus: "Heritage of The Rus'"
 abm_heritage_of_the_rus_desc: "Polotsk is one of the oldest cities in Eastern Europe. It was one of the most important centers of the Kievan Rus' and owning the city bestowed a large amount of prestige on its owner. However for us ownership of Polotsk would be a stepping stone in our desire and ambition to restore Rus'."

 # INTERNATIONAL
 abm_international_influences: "Foreign Influences"
 abm_international_influences_desc: "Russian lands were historically divided among several nations, among them Poles, Lithuanians, Tatars and Hungarians. As such, our citizens come from multiple cultures and follow different religions. To be a unified state we must respect their faith."

 # KIE
 abm_kie_ideas_ambition: "Kievan Ambition"
 abm_kie_ideas_ambition_desc: "Kievan Ambition"
 abm_kie_ideas_tradition_1: "Kievan Traditions"
 abm_kie_ideas_tradition_1_desc: "Kievan Traditions"
 abm_kie_ideas_tradition_2: "Kievan Traditions"
 abm_kie_ideas_tradition_2_desc: "Kievan Traditions"

 # LAND
 abm_land_of_strongholds: "Land of Strongholds"
 abm_land_of_strongholds_desc: "Located in the heart of Eastern Europe, Polotsk has had the misfortune of being located between major rivals on all sides. It was commonplace to see armies march through our lands on their way somewhere else. To protect ourselves in case we became a target, our people built many layers of walls and battlements to protect ourselves."

 # LEGACY
 abm_legacy_of_ancient_rus: "Heritage of the Old Rus'"
 abm_legacy_of_ancient_rus_desc: "The social systems of the old Rus' often varied greatly from the Muscovite despotism. In Ruthenia more freedom was given to the peasants, state serfdom was not enforced, and the nobility did serve the state instead of exploiting it. It helped to transform Ruthenia into a modern Kievan Rus'."
 abm_legacy_of_the_werewolf_prince: "Legacy of the Werewolf Prince"
 abm_legacy_of_the_werewolf_prince_desc: "Vseslav of Polotsk was one of the most accomplished princes in our history. He fought and sacked the wealthy Duchy of Novgorod and was even proclaimed as the Grand Prince of Kiev by its peasants. Vseslav fought many battles against neighboring Princes, and while he could not always win his reign begat a time of great prosperity in Polotsk."

 # MOTHER
 abm_mother_of_all_cities: "Mother of All Cities"
 abm_mother_of_all_cities_desc: "For centuries the ancient city of Kiev has been the 'mother of all cities of the Rus' and 'a true pearl in the crown of Rus'. Although in its rich history it has been sacked and ravaged countless times it still remains one of the most beautiful and significant cities of Eastern Europe."
 abm_mother_of_russian_cities: "The Mother of Russian States"
 abm_mother_of_russian_cities_desc: "Historically Kiev was the center of Rus' before the Mongol invasion. Many other Russian states attempted to fill the void after Kiev's fall: Moscow, Tver, Novgorod... But none of them could match Kiev's former glory.Unlike these northern upstarts, however, we are true heirs of the Kievan legacy, our people walk the same land as our Kievan ancestors and our capital aspires to the same greatness. Our claims must be respected!"

 # PLT
 abm_plt_ideas_ambition: "Polotskian Ambition"
 abm_plt_ideas_ambition_desc: "Polotskian Ambition"
 abm_plt_ideas_tradition_1: "Polotskian Traditions"
 abm_plt_ideas_tradition_1_desc: "Polotskian Traditions"
 abm_plt_ideas_tradition_2: "Polotskian Traditions"
 abm_plt_ideas_tradition_2_desc: "Polotskian Traditions"

 # REUNITING
 abm_reuniting_rus: "Reuniting Rus'"
 abm_reuniting_rus_desc: "Kievan Rus' has been reborn in Ruthenian lands, but many people of the old Rus live under foreign rule or in small principalities. Rus must be reunited!"

 # SMO
 abm_smo_armories_of_smolensk: "The Armories of Smolensk"
 abm_smo_armories_of_smolensk_desc: "After a long age of Lithuanian and Polish tyranny over our lands, we have obtained many western styled weapons and tactics from our former oppressors. We are in a unique position to become the only Russian principality joining the military lessons of both west and east."
 abm_smo_artillery_before_all: "Artillery Before All"
 abm_smo_artillery_before_all_desc: "Field artillery is a relatively new invention in the European battlefields. Powerful as it is, it is also highly unreliable and capable of doing devastating collateral damage. Therefore it is paramount that we develop reliable and unique tactics providing our future military commanders with unmatched understanding of how to apply artillery to its fullest potential."
 abm_smo_hold_the_line: "Hold The Line"
 abm_smo_hold_the_line_desc: "We understand one truth that the rest of our Russian brothers do not: the age of bardiche is over. No longer will we break the line and charge the enemy in senseless melee. Men, you will reload your muskets, and hold the line!"
 abm_smo_ideas_ambition: "Smolenskian Ambition"
 abm_smo_ideas_ambition_desc: "Smolenskian Ambition"
 abm_smo_ideas_tradition_1: "Smolenskian Traditions"
 abm_smo_ideas_tradition_1_desc: "Smolenskian Traditions"
 abm_smo_ideas_tradition_2: "Smolenskian Traditions"
 abm_smo_ideas_tradition_2_desc: "Smolenskian Traditions"
 abm_smo_smolenskian_resolve: "Smolenskian Resolve"
 abm_smo_smolenskian_resolve_desc: "For a very long time Smolensk has been a subdued land, owned by various foreigners, treating it as little more than a rich bounty. If we are ever to change that, we have to muster all our inner strength and dismiss all religious differences that divide us. After and before all, there is only Smolensk."
 abm_smo_the_great_foundry: "The Great Foundry"
 abm_smo_the_great_foundry_desc: "Construct the largest military foundry in Eastern Europe capable of constructing cannons bigger and better than anyone else around us. All our enemies will tremble at the roar of Smolenskian artillery."
 abm_smo_tsar_mortars: "Tsar Mortars"
 abm_smo_tsar_mortars_desc: "Develop a new and terrifying type of artillery, capably not only of direct, but also of indirect fire against whose devastation no walls can protect our enemies. The age of castles and forts shall be shattered by the Tsar Mortars."
 abm_smo_western_mercenaries: "Western Mercenaries"
 abm_smo_western_mercenaries_desc: "Our foreign contacts with various western courts allow us to hire mercenaries from western Europe of unmatched quality in our lands. A fact envied by some, but certainly feared by most."

 # SUPPORT
 abm_support_local_traders: "Support Local Traders"
 abm_support_local_traders_desc: "By introducing and supporting seasonal markets and fairs in our cities, we aim to develop a strong and stable trade network within our country - one that will attract even the foreigners to our lands and expand our access to far away markets."

 # TRADE
 abm_trade_hub: "Trade Hub"
 abm_trade_hub_desc: "Due to our central location in Eastern Europe our lands were frequently the location of many battles and wars. These wars brought merchants and profiteers to our city, and helped create a steady flow of trade for our people. Over many years trade routes began to form around Polotsk, and now most trade that heads towards Moscow or Novgorod runs through us first."

