 abm_boh_ideas_tradition_1: "Bohemian Tradition I"
 abm_boh_ideas_tradition_1_desc: "Bohemian Tradition I"
 abm_boh_ideas_tradition_2: "Bohemian Tradition II"
 abm_boh_ideas_tradition_2_desc: "Bohemian Tradition II"
 abm_compacta_of_prague: "Compacta of Prague"
 abm_compacta_of_prague_desc: "The Hussite wars are over and it is time to unite the nation. Let all be forgiven so the Czech people can live in peace."
 abm_boh_elective_monarchy: "Elective Monarchy"
 abm_boh_elective_monarchy_desc: "For too long the fractious nobility of Bohemia have been a huge impediment to royal authority. From now on we will ensure that every new monarch has the full support of the nobles prior to his or her coronation. That should avoid any problems."
 abm_wagenburg: "Wagenburg"
 abm_wagenburg_desc: "During the Hussite wars our armies relied on wagon forts, which would allow us to win battles we should have lost. Although we may not always use wagons, using infantry sharp shooters from defensive position will become the tactic of choice for our ever invincible Czech armies."
 abm_letter_of_majesty: "Letter of Majesty"
 abm_letter_of_majesty_desc: "The Hussite wars have left a legacy of dangerous divisions on ecclesiastical matters in the Czech lands. If Bohemia is to prosper we must end this divisive conflict and bring order to our lands. We will promulgate a letter of majesty in our realms granting the freedom of conscience to all."
 abm_hussite_legacy: "Hussite Legacy"
 abm_hussite_legacy_desc: "While the Church in Rome gets increasingly reactionary in the face of theological challenges we in Bohemia are much more relaxed about this. This leads us to be more relaxed towards new ideas."
 abm_kutnohorian_deal: "The Kutnohorian Deal"
 abm_kutnohorian_deal_desc: "The nobility will always remain sensitive regarding their prerogatives, so we need to guarantee that their privileges are guaranteed forever."
 abm_czech_nationalism: "Czech Nationalism"
 abm_czech_nationalism_desc: "The Czech people have survived everything the world has thrown at them, we have shown our resilience."
 abm_boh_ideas_ambition: "Bohemian Ambition"
 abm_boh_ideas_ambition_desc: "Bohemian Ambition"
