l_english:
 abm_bng_ideas_tradition_1: "Bengal Sultanate Traditions I"
 abm_bng_ideas_tradition_1_desc: "Bengal Sultanate Traditions I"

 abm_bng_ideas_tradition_2: "Bengal Sultanate Traditions II"
 abm_bng_ideas_tradition_2_desc: "Bengal Sultanate Traditions II"

 abm_bng_combat_piracy: "Combat Coastal Piracy"
 abm_bng_combat_piracy_desc: "Pirates have infested the waters of the Bay of Bengal for too long. We must protect traders en route to our ports by discovering and eliminating pirate havens along the Arakan coast."

 abm_bng_habshi_generals: "Promote Habshi Generals"
 abm_bng_habshi_generals_desc: "Abyssinian slave-soldiers purchased in Arab markets play a significant role as elite infantry soldiers. Those that excel as leaders shall be given greater levels of command, while those who demonstrate exceptional loyalty shall make up the palace guard."

 abm_bng_clearing_the_delta: "Clear the Delta"
 abm_bng_clearing_the_delta_desc: "The Bengal Delta contains an immense expanse of potentially very profitable land that goes unexploited due to thick forestation. We must subsidize efforts to clear the forests to make way for new farmlands, cities, and trading posts."

 abm_bng_attract_sufis: "Attract Sufi Scholars"
 abm_bng_attract_sufis_desc: "Sufis have long been innovators of Islamic thought as well as wise councilors. If we wish to be a leading voice in the future of the Islamic world, we must patronize Sufi lodges and convince the wisest among their order to settle in our domain."

 abm_bng_conquest_of_the_gangetic_plain: "Conquest of the Gangetic Plain"
 abm_bng_conquest_of_the_gangetic_plain_desc: "To our west are the fertile and populated lands of the Indo-Gangetic Plain. The Sultans of Bengal have long coveted its great cities and vast wealth, but only now as a new and ambitious crop of generals rise to power is our ambition likely to become a reality. We must do all we can to ready our forces for the coming conquest."

 abm_bng_rupees: "Begin the Minting of Rupees"
 abm_bng_rupees_desc: "The lack of a widely adopted standardized currency is stunting the development of Indian commerce. As one of the foremost economic powers in the subcontinent, we are well placed to begin the minting of a new silver coinage with standard weights, which we shall call the rupee."

 abm_bng_bengali_industrialization: "Bengali Industrialization"
 abm_bng_bengali_industrialization_desc: "Bengal is uniquely situated in India to begin a revolution unlike any seen before. We stand poised to exploit new developments in our already world-class textile and shipbuilding industries. Let us begin an industrial revolution!"

 abm_bng_ideas_ambition: "Bengal Sultanate Ambition"
 abm_bng_ideas_ambition_desc: "Bengal Sultanate Ambition"

 abm_bengali_ideas_tradition_1: "Bengali Traditions I"
 abm_bengali_ideas_tradition_1_desc: "Bengali Traditions I"

 abm_bengali_ideas_tradition_2: "Bengali Traditions II"
 abm_bengali_ideas_tradition_2_desc: "Bengali Traditions II"

 abm_hindu_sufi_syncretism: "Bengali Hindu-Sufi Syncretism"
 abm_hindu_sufi_syncretism_desc: "Beyond the eastern frontiers of the Islamic world, came Sufi mystics to settle land grants or to commune with nature in Bengal, intermingling with the Hindu population. Cooperation led to extensive land reclamations in forested and marshy areas and helped to introduce new syncretic forms of music, painting, dancing and sculpture reflected in the temples and shrines constructed during this period."

 abm_ganges_brahmaputra_confluence: "Ganges-Brahmaputra Confluence"
 abm_ganges_brahmaputra_confluence_desc: "The mighty Ganges and Brahmaputra have traveled far to intermingle and spread out into the Bengal Delta, funneling trade and commerce in its wake. For thousands of years the area around the delta has been a natural place for the easy exchange of goods and ideas."

 abm_rice_fields: "Bengal's Endlessly Productive Rice Fields"
 abm_rice_fields_desc: "We Bengalis are primarily rice eaters, and the rainfall and soil in the area lends itself to massive surplus rice production, with the mighty silt laden rivers and monsoon allowing for three separate growing and harvest seasons a year."

 abm_mustard_oil_ilish_mach: "Mustard Oil & Ilish Mach"
 abm_mustard_oil_ilish_mach_desc: "Wars may torch the granaries and markets. The weather may wither or crush the crops in the fields. Elephants and ants may try to eat what we have planted. Give us a little oil, however, and our fish-laden rivers will give us the food we Bengalis desire most!"

 abm_jute_production: "Jute Production"
 abm_jute_production_desc: "Native to our region, Jute is a long, soft, shiny vegetable fiber that can be spun into coarse, strong rope, matting or thread. In high demand for its resilience and relatively light weight, we can benefit from its cultivation and production."

 abm_opium_fields: "Opium Fields of Bengal"
 abm_opium_fields_desc: "What's that? People will give us gold and silver for our flowers!? The opium of our region is highly prized and easily grown, commanding twice the price of any other opium in the world. Let the trade begin!"

 abm_bengali_renaissance: "The Bengal Renaissance"
 abm_bengali_renaissance_desc: "The Bengal Renaissance that took place in this region was a reaction to the encounter and impact of Europeans arriving for not only commerce, but for study, art and scholarship. The Bengal Renaissance blended together Hindu teachings from the past with Western education, politics and law, as well as a re-casting of Bengali culture. This led to a flourishing of the arts and sciences."

 abm_bengali_ideas_ambition: "Bengali Ambition"
 abm_bengali_ideas_ambition_desc: "Bengali Ambition"

 abm_ass_ideas_tradition_1: "Assamese Traditions I"
 abm_ass_ideas_tradition_1_desc: "Assamese Traditions I"

 abm_ass_ideas_tradition_2: "Assamese Traditions II"
 abm_ass_ideas_tradition_2_desc: "Assamese Traditions II"

 abm_buranjis: "The Buranjis"
 abm_buranjis_desc: "All our kings descend from the great Sukaphaa who founded our kingdom in 1228 after his long journey into Assam. Swargdeo Sukaphaa was also the first of our rulers to realize the great need of documentation for the coming generations and it was he who had the first 'Store that teaches the ignorant' or Buranji created. Thanks to this and other Buranjis created throughout the history of our kingdom we know the history of our people well and it is not hard to identify the many heirs of Sukaphaa."

 abm_wet_rice_cultivation: "Wet Rice Cultivation"
 abm_wet_rice_cultivation_desc: "When our Tai ancestors first arrived in Assam the lands that were available to them were marches and swamps. They quickly realized that these lands were not as productive as they could be. Making use of the wet rice cultivation techniques of our old homeland has allowed us to prosper in an area that others found too poor to care about. While we are no longer restricted to the marches of Upper Assam, rice cultivation remains the backbone of our economy."

 abm_river_warfare: "River Warfare"
 abm_river_warfare_desc: "The Assamese terrain and the Brahmaputra river in particular is our greatest ally against foreign invaders. Any foreign army that wishes to advance along the Brahmaputra river will have to endure the rains of summer at which point they will have to take great care not to be cut off from their supply lines along the river. By preparing for guerilla tactics, assaulting the invaders supply lines and raiding their stores we can ensure that an enemy risk getting cut off in very hostile lands with starvation and epidemic diseases taking their toll."

 abm_reform_paik_system: "Reform the Paik System"
 abm_reform_paik_system_desc: "Since our people arrived here in the 13th century we have made use of a corvee labor system inspired by our South-East Asian roots. Paiks are used for defense, civil construction and military production and are an integral part of our kingdom. As our country grows, however, this system is in need of restructuring. A thorough reexamination of all Paik duties, Paik quotas and a new and clear graded system for the officers of the system will create a resilient system that will be of great help to us against any foreign threats."

 abm_process_of_appeal: "Process of Appeal"
 abm_process_of_appeal_desc: "Due to the hierarchical organization of our society it is important that we are seen to uphold justice in our lands and that our subjects feel that they enjoy the protection of the state. Making use of the Paik system we can create a chain of appeals from lower officers all the way up to the ministers of the king."

 abm_ahom_land_survey: "Land Survey"
 abm_ahom_land_survey_desc: "We have observed that our western neighbors have devised an ambitious administrative system where all lands are routinely surveyed to better evaluate their worth. We should introduce similar measures here. By inviting land surveyors from the west and training our own in their methods we might be able to increase our tax revenue substantially. We must also henceforth make renewed surveys regularly to account for the changing trends of economy and demographics."

 abm_ahom_diplomacy: "Ahom Diplomacy"
 abm_ahom_diplomacy_desc: "Our country draws much of its strength from old traditions and from making the most of the resources within our borders. It is time, however, to look outwards and see what other parts of the world can offer us. By instituting official positions specifically for diplomacy and by encouraging exchange with other kingdoms we might both enrich our culture and find new allies against our local enemies."

 abm_ass_ideas_ambition: "Assamese Ambition"
 abm_ass_ideas_ambition_desc: "Assamese Ambition"

 abm_sdy_ideas_tradition_1: "Sadiyan Traditions I"
 abm_sdy_ideas_tradition_1_desc: "Sadiyan Traditions I"

 abm_sdy_ideas_tradition_2: "Sadiyan Traditions II"
 abm_sdy_ideas_tradition_2_desc: "Sadiyan Traditions II"

 abm_sdy_land_of_glory: "Land of Glory"
 abm_sdy_land_of_glory_desc: "Sadiya has thrived in this region as a kingdom ever since the great Birpal founded our country. While our people did not originate here we have made this area our home and our history here goes much farther back than our Ahom neighbors. This is our land and we will defend it to the last man or woman, death before dishonor."

 abm_sdy_crossroad_of_religions: "Crossroad of Religions"
 abm_sdy_crossroad_of_religions_desc: "Our country lies at the axis of Tibet, Burma and India and the influence of all of these neighbors can be felt here. High in the mountain areas we control lie Buddhist monasteries while animist religions still thrive among the tribes in the hills. Most of the Sutiya people themselves have, however, adopted the Hindu religion of our southern neighbors. Our state is used to harboring many different faiths and this strength allows us to thrive in this heterogeneous region."

 abm_sdy_hills_and_jungles: "Hills and Jungles"
 abm_sdy_hills_and_jungles_desc: "Dominated by hills, woods and the high mountains of the eastern Himalayas our country is a rare beauty to some but an inhospitable defense-line to others. Let us marvel at what is ours and defend it at the same time by constructing fortifications that make good use of our natural defenses."

 abm_sdy_temples: "Temples of Sadiya"
 abm_sdy_temples_desc: "Nature is a powerful force in this region, always close ready to reclaim that which is not maintained. A strong state must build and keep great temples of monuments, to please the gods and to show the glory of our country to our people and foreigners alike."

 abm_sdy_dihang: "Dihang"
 abm_sdy_dihang_desc: "The waters of the great river Dihang has traveled far to reach us before turning southwest into the lower areas where it is known as the Brahmaputra. The river provides is both a source of food, water and transportation. It binds the valley together and lets us travel further in a day than we could otherwise hope to. "

 abm_sdy_army_reform: "Reform the Sadiya Armies"
 abm_sdy_army_reform_desc: "Some claim that it was from us that the Chinese once learned of Gunpowder. If this is true it is not a legacy we have poorly managed. Let us adopt the tactics of the nations of the far west and make our infantry the strongest part of our army."

 abm_sdy_black_tea: "Black Tea"
 abm_sdy_black_tea_desc: "Tea is a native plant in this part of the world and our lands are ideally suited to grow it. With the arrival of foreign traders in both India and China the demand for this plant has increased astronomically. Let us give the foreign traders what they seek and invest in large tea plantations in our country."

 abm_sdy_ideas_ambition: "Sadiyan Ambition"
 abm_sdy_ideas_ambition_desc: "Sadiyan Ambition"

 abm_mlb_ideas_tradition_1: "Manipur Traditions I"
 abm_mlb_ideas_tradition_1_desc: "Manipur Traditions I"

 abm_mlb_ideas_tradition_2: "Manipur Traditions II"
 abm_mlb_ideas_tradition_2_desc: "Manipur Traditions II"

 abm_mlb_sanamahism: "Sanamahism"
 abm_mlb_sanamahism_desc: "Neither Brahmanic or Buddhist influences have ever gained much of a following here. The people of Manipur is firmly rooted in the faith of our ancestors with their over 360 deites. This ancient religion may not gain us many friends in a world of castes, monks and greater religious communities but in these hills our traditions give us strength."

 abm_mlb_martial_traditions: "Martial Traditions"
 abm_mlb_martial_traditions_desc: "As a small valley state surrounded by bigger neighbors we have always had to comit fully to warfare or risk being destroyed. The Kings and Queens of Manipur have always stood ready to lead our armies in the field against our Shan or Kachar enemies."

 abm_mlb_kingdom_of_the_meitei: "Kingdom of the Meitei"
 abm_mlb_kingdom_of_the_meitei_desc: "Unlike most states in this area the kingdom of Manipur has roots that go back millenia. Our legends and myths tell stories of kings that united the Meitei, Nagas and other tribes in this region to found the core of what is our state today."

 abm_mlb_mayek: "Mayek"
 abm_mlb_mayek_desc: "Where others have sought the comfort of widely spread scripts and literary traditions our kingdom have instead cultivated the ancient script of our ancestors. The Manipuri literary traditions are distinctly our own and mirror neither those of the Shan to our east or the Bengali to the west."

 abm_mlb_unite_the_hill_tribes: "Unite the Hill Tribes"
 abm_mlb_unite_the_hill_tribes_desc: "The Hills and valleys of Manipur have always been rather diverse and a great deal of minor chiefs and chieftains hold power over various tribal constallations. Let us unite our areas, with force if necessary, to create a stronger more unified Manipurean state."

 abm_mlb_bengali_influence: "Bengali Influence"
 abm_mlb_bengali_influence_desc: "While our kingdom has always shunned stronger outside influences yet perhaps the time is ripe to cultivate closer ties to the west. Increasing numbers of our people have already come to embrace the Hindu religion alongside the faith of our forefathers and learning the script and language of our neighbors can only help increase our influence in the area. "

 abm_mlb_far_reaching_diplomacy: "Far-Reaching Diplomacy"
 abm_mlb_far_reaching_diplomacy_desc: "It is good to stand strong against invaders but a state without friends cannot survive forever. Let us seek new allies among the far-western countries and seek to involve and entangle them in the politics of this region to serve our purposes."

 abm_mlb_ideas_ambition: "Manipur Ambition"
 abm_mlb_ideas_ambition_desc: "Manipur Ambition"

 abm_ori_ideas_tradition_1: "Orissan Traditions I"
 abm_ori_ideas_tradition_1_desc: "Orissan Traditions I"

 abm_ori_ideas_tradition_2: "Orissan Traditions II"
 abm_ori_ideas_tradition_2_desc: "Orissan Traditions II"

 abm_lord_of_elephants: "Lord of the Elephants"
 abm_lord_of_elephants_desc: "Horses are alien to Orissa and the lands here are unsuited to raise them. Our jungles are, however, famously teeming with elephants. In the dense jungles of Eastern India well executed tactical cooperation between elephants and infantry can be just as deadly as a cavalry arm. Let us further increase the size of our elephant corps and refine their tactics."

 abm_servitor_of_jagganath: "Servitor of Jagannath"
 abm_servitor_of_jagganath_desc: "Worship of Jagannath, the lord of the universe, is what unites these lands. Older rulers of Orissa have been considered to be the sons of Jagannath. Our current dynasty might not be his sons but we must certainly make sure to imprint on all that our ruler is the servitor of Jagannath and that any disobedience to him equals treason against lord Jagannath himself."

 abm_parikshas: "Parikshas"
 abm_parikshas_desc: "The lands of Orissa have long been divided among many different princelings. However the time of these Mandaleshvaras is over! We must take control of these lands and appoint regional governors, Parikshas, instead of allowing these petty princelings to dilute our imperial authority."

 abm_refined_cloth_production: "Refined Cloth Production"
 abm_refined_cloth_production_desc: "Orissa is famed for its high quality textiles since ancient times. Let us further encourage the textile guilds of Orissa to refine their methods of production of the fine Kalingam cloth."

 abm_patronize_temple_construction: "Patronize Temple Construction"
 abm_patronize_temple_construction_desc: "The glory of past dynasties is reflected by the greatness of the temples they left behind. We should strive to improve on the many great temple complexes in our lands and hire architects to construct new ones to further the development of Kalingan architecture."

 abm_encourage_salt_trade: "Encourage the Salt Trade"
 abm_encourage_salt_trade_desc: "The high quality salt of Orissa is in demand all over India. Let us do what we can to encourage the salt trade so that we may grow rich from it."

 abm_heritage_of_the_sadhabas: "Heritage of the Sadhabas"
 abm_heritage_of_the_sadhabas_desc: "Tradition tells us that our ancestors sailed to distant shores in Indonesia, China, Persia and Africa but today the seas are dominated by foreigners. We should expand our navy and reclaim our maritime heritage!"

 abm_ori_ideas_ambition: "Orissan Ambition"
 abm_ori_ideas_ambition_desc: "Orissan Ambition"

 abm_tpr_ideas_tradition_1: "Tripuran Traditions I"
 abm_tpr_ideas_tradition_1_desc: "Tripuran Traditions I"

 abm_tpr_ideas_tradition_2: "Tripuran Traditions II"
 abm_tpr_ideas_tradition_2_desc: "Tripuran Traditions II"

 tpr_rajmala: "Rajmala"
 tpr_rajmala_desc: "Few can boast a lineage as great as ours, as we are descendants of the moon, Chandra, himself. Let us commission a great genealogy to commemorate our ties to the Lunar dynasty and to describe the history of our people."

 tpr_adaptive_administration: "Adaptive Administration"
 tpr_adaptive_administration_desc: "Our kingdom lies on the border of Hindu, Tribal, and Muslim kingdoms, and these states all have something to offer in terms of administrative strength. We must strive to adapt our practices to what is best suited for the disparate parts of our kingdom. In the plains we will appoint governors directly as the Muslims do, but in the tribal hills we will rely on the traditional feudal chiefs that hold the land."

 tpr_religious_syncretism: "Religious Syncretism"
 tpr_religious_syncretism_desc: "While our Kingdom has worshipped Shiva and other Hindu Gods for centuries, many of our subjects also practice Tribal and even Muslim customs, as well. We have learned that, if we are to thrive, we must be flexible and not let matters of worship get in the way of true kingship."

 tpr_extended_army_control: "Extended Military Control"
 tpr_extended_army_control_desc: "Great power has to be vested in the commanders of our armies for them to be able to achieve success, yet there is danger in giving them too much power. We must strive to divide the responsibility for our armed forces among several specialized generals and ministers that we trust, rather than to risk one person having total control."

 tpr_appointment_of_missips: "Appointment of Missips"
 tpr_appointment_of_missips_desc: "The village headmen are responsible for tax collection and the local implementation of royal decrees, and have served our kingdom well for centuries. As we grow, however, so too does the need to oversee these headmen. Let us appoint trustworthy men as ‘Missips’ to oversee local representatives and ensure better central control over our provinces."

 jute_production: "Jute Production"
 jute_production_desc: "Native to our region, Jute is a long, soft, shiny vegetable fiber that can be spun into coarse, strong rope, matting or thread. In high demand for its resilience and relatively light weight, we can benefit from its cultivation and production."

 tpr_strenghten_local_defences: "Strengthen Local Defenses"
 tpr_strenghten_local_defences_desc: "Many of our farmers complain about being harassed by raids from the tribal inlands. Let us create local defenses to protect our people from the whims of raiders, bandits, and marauding enemy armies. A peaceful countryside is one that can grow rich and profitable."

 abm_tpr_ideas_ambition: "Tripuran Ambition"
 abm_tpr_ideas_ambition_desc: "Tripuran Ambition"

 abm_trt_ideas_tradition_1: "Tirhuti Traditions I"
 abm_trt_ideas_tradition_1_desc: "Tirhuti Traditions I"

 abm_trt_ideas_tradition_2: "Tirhuti Traditions II"
 abm_trt_ideas_tradition_2_desc: "Tirhuti Traditions II"

 trt_scholars_and_poets: "Scholars and Poets"
 trt_scholars_and_poets_desc: "It is the duty of any righteous ruler to maintain a great number of poets and scholars at court. Traditionally this has been especially true in our lands and many famous men and lineages have thrived here. We must open our arms to all men of learning, from the 'Pandits singing the essence of the Vedas to the Munshis elated with Persian knowledge'."

 trt_gateway_to_india: "Gateway to India"
 trt_gateway_to_india_desc: "Throughout the centuries Tirhut has been a crossroad for traders. In order to thrive Tirhut must welcome and protect all of them, from the rich merchants moving their wares along the Grand Trunk Road between Bengal and Kabul to the many baniyas traveling between their shops in Nepal and their shops in Bihar. Even the small scale Paikars who sell various things along our roads must be protected by our state."

 trt_brahmin_kings: "Brahmin Kings"
 trt_brahmin_kings_desc: "Our lands have a long history of strict preservation of Brahmin learning. Indeed even our rulers are of the Brahmin caste. Let us continue to safeguard and support the Mithila Brahmins and their sanskrit schools."

 trt_purbias: "Purbias"
 trt_purbias_desc: "The Tirhuti Purbias took to the use of firearms early and today they are known both for their marksmanship and for their skill in producing gunpowder itself. Let us make this group the core of our infantry arm and create a strong and modern army."

 trt_river_landscape: "Riverine Landscape"
 trt_river_landscape_desc: "A great number of tributaries to the Ganges criss cross our country. Rivers such as the Kosi, Gandak, Mahananda or Bagmati water our lands and provide transportation for our merchants. At times, however, they are also a great hindrance. Great rains can sometimes flood large areas of our state, spreading disease, destroying roads and harming our crops. As natives of these lands this is something we have grown used to handling. An invader on the other hand could easily find himself in a much harsher situation."

 trt_tirhuta: "Tirhuta"
 trt_tirhuta_desc: "Once poetry, songs and even scholarly works were being produced in the Maithili language and the Tirhuta script. Let us once again ensure that the language of our region becomes the carrier of our culture."

 trt_indigo: "Indigo & Cash Crops"
 trt_indigo_desc: "A multitude of lakes in our lands as well as the quality our soil and climate make Tirhut ideal for the cultivation of many of the cash crops that are so sought after in the west. Let us expand the cultivation of Indigo and Sugar so that we may grow rich from their expensive fancies."

 abm_trt_ideas_ambition: "Tirhuti Ambition"
 abm_trt_ideas_ambition_desc: "Tirhuti Ambition"

 abm_nag_ideas_tradition_1: "Nagpuri Traditions I"
 abm_nag_ideas_tradition_1_desc: "Nagpuri Traditions I"

 abm_nag_ideas_tradition_2: "Nagpuri Traditions II"
 abm_nag_ideas_tradition_2_desc: "Nagpuri Traditions II"

 abm_nag_unite_gonds_and_garjats: "Unite the Gonds and Garjats"
 abm_nag_unite_gonds_and_garjats_desc: "The fractured tribes of Gonds and Garjats that inhabit Central India must be united under our rule. Old feuds and squabbles must be put to an end so that we can achieve our common goals."

 abm_nag_harsh_terrain: "Exploit Harsh Terrain"
 abm_nag_harsh_terrain_desc: "Much of our land is difficult for armies to traverse, much less to do battle on. Our own warriors have known this region for centuries and know how to exploit it to their advantage."

 abm_nag_send_for_artisans: "Send for Artisans"
 abm_nag_send_for_artisans_desc: "Nagpur is a new city, a new Kingdom. We must send for artisans and architects from all corners of India to develop our palaces, our infrastructure, and our temples to put Nagpur on the map."

 abm_nag_invite_maratha_warriors: "Invite Maratha Warriors"
 abm_nag_invite_maratha_warriors_desc: "Maratha warriors have erupted out of their homelands in Maharashtra. Many of their generals offer their services and their armies to rulers they deem worthy. We should court these generals to attract a new military caste into our nation."

 abm_nag_light_cav: "Light Cavalry Shock Tactics"
 abm_nag_light_cav_desc: "Heavy cavalry and cumbersome cannon make up a large portion of many Indian armies. By employing regiments of light cavalry, we can easily outflank and outrun our enemies, causing great damage where they least expect it."

 abm_nag_cultivating_the_forest: "Cultivating the Forest"
 abm_nag_cultivating_the_forest_desc: "The dense forests of Central India are not exactly renowned for their fertile farmlands. We must nevertheless ensure that we are able to grow enough food and extract enough wealth from our lands. It is time to begin clearing the forest to make room for our expansion."

 abm_nag_no_cb_best_cb: "Unjustified Expansion"
 abm_nag_no_cb_best_cb_desc: "Our enemies are weak and we are strong. They control rich lands that we desire for ourselves. What more reason should we need to take all that they have?"

 abm_nag_ideas_ambition: "Nagpuri Ambition"
 abm_nag_ideas_ambition_desc: "Nagpuri Ambition"

 abm_mlw_ideas_tradition_1: "Malvi Traditions I"
 abm_mlw_ideas_tradition_1_desc: "Malvi Traditions I"

 abm_mlw_ideas_tradition_2: "Malvi Traditions II"
 abm_mlw_ideas_tradition_2_desc: "Malvi Traditions II"

 abm_mlw_rajputs_of_malwa: "The Rajputs Malwa"
 abm_mlw_rajputs_of_malwa_desc: "Malwa was the seat of more than one great Rajput kingdom of old and even under Muslim rule the Rajputs remain very influential as landholders and nobles. Instead of fighting them for authority we should empower the Rajput clans within our lands and encourage Purbia soldiers to take service in our armies. Rajputs are excellent warriors and cooperation could bring great things to both them and us."

 abm_mlw_nimatnama: "Malvi Art & Architecture"
 abm_mlw_nimatnama_desc: "A great number of our nobles have, however, begun to commission the local Indian artisans, blending Indian and Persian fashions. Rather than try to emulate Samarkand, Shiraz or Delhi we should favor this new Indo-Muslim style by employing the best minds, voices and hands of both the Persianate and Indian worlds. Let us commission Cook Books, Kalpa Sutras and great secular pieces of architecture and enjoy the fruits of Malvi painters and singers and let others try to conserve the culture of our ancestors."

 abm_mlw_surat_delhi_route: "Protect the Delhi-Surat Trade Route"
 abm_mlw_surat_delhi_route_desc: "The ports of Gujarat are among the largest in the world and large quantities of Northern Indian goods pass through our lands to reach them. Thousands of pilgrims also enter our lands every year headed for the Arabian Sea and the Holy Cities of Mecca and Medina. As rulers of the main trade route between the sea and the rich northern Indian plains it is our duty to defend all traders as well as pilgrims."

 abm_mlw_fortified_strongholds: "Fortified Strongholds"
 abm_mlw_fortified_strongholds_desc: "While rich our heartland in the Malwa plateau is also open to attacks from any direction. We must guard our cities with great citadels, built to withstand any attacker and to control the trade and pilgrimage routes that crisscross our country. Let us make use of all the wealth we possess to make the great citadel of Mandu the model for all to follow. Beautiful and impregnable."

 abm_mlw_black_soil: "Black Soils"
 abm_mlw_black_soil_desc: "Unlike the surrounding regions the soil and climate of the Malwa plateau lends itself very well to both agricultural production and the growing of cash crops such as Sugar, Indigo or Opium. Our position on the route between the Indo-Gangetic plain and the sea also makes export of the goods we produce very efficient."

 abm_mlw_reliance_on_jain_bankers: "Jain Bankers"
 abm_mlw_reliance_on_jain_bankers_desc: "Our predecessors wisely broke the ties with the weak Sultans of Delhi after Timur sacked their capital in 1398. Malwa now stands independent but our close ties with the rest of the Persianate world have also been greatly weakened. If our state is to grow we must draw from local talents instead. Jain bankers and Merchants have run the economy of the Malwa plateau long before we came here and by allying these powerful groups our state can shed the last dependence on those that would control us."

 abm_mlw_malwa_opium: "Malwa Opium"
 abm_mlw_malwa_opium_desc: "Highly sought after for both its medicinal and recreational purposes Opium is one of the most famous exports of the Malwa plateau. Due to the growing presence of foreign traders in Western India we have noticed a marked increase in demand lately. Poppy farmers are already trying to increase their production, we would be wise to ease up on trading regulations to allow them to spread their product more efficiently."

 abm_mlw_ideas_ambition: "Malvi Ambition"
 abm_mlw_ideas_ambition_desc: "Malvi Ambition"

 abm_central_indic_ideas_tradition_1: "Gond Traditions I"
 abm_central_indic_ideas_tradition_1_desc: "Gond Traditions I"

 abm_central_indic_ideas_tradition_2: "Gond Traditions II"
 abm_central_indic_ideas_tradition_2_desc: "Gond Traditions II"

 abm_securing_defenses_central_indic: "Securing Our Defenses"
 abm_securing_defenses_central_indic_desc: "Many would consider controlling the hills and jungles of Gondwana, Jharkhand and the Garjats a daunting task and it is true that holding our realm together isn't always easy.\nThe key to doing so lies in controlling and maintaining the many little forts that dot these regions.\nBy securing the loyalty of the chieftains in control of these forts, and making sure they have what they need to keep them in good shape, we can be sure to be able to resist even quite powerful enemies."

 abm_tribal_religion_central_indic: "Tribal Religion"
 abm_tribal_religion_central_indic_desc: "The belief system of our people is diverse and perhaps a bit unorthodox. While we worship many of the same gods as our neighbors in the plains we also worship spirits, tree gods and animal gods. We should embrace this diversity and be seen to support all of the various faiths of our subjects."

 abm_tigers_and_elephants_central_indic: "Tigers and Elephants"
 abm_tigers_and_elephants_central_indic_desc: "The Elephant and the Tiger command respect all over India. Many rulers would seek to use these animals as symbols of their royal power. It is even said that some kings would travel far and go through many ordeals to obtain elephants for their Royal stables.\nWhat is a symbol to these far away rulers is part of our everyday life. In these lands such beasts, and others just as mighty, roam in great numbers. Our people know them well and many worship gods in the form of tigers, cobras or the very trees of these jungles. Any outsider would do well to think twice before risking the wrath of such gods or those who worship them."

 abm_flexible_caste_central_indic: "Flexible Caste System"
 abm_flexible_caste_central_indic_desc: "Caste as a rigid structure has never been an integral part of our society and many in our realm would deny belonging to any caste at all. Being pragmatic and flexible about these things allows our state to more easily absorb even the most diverse groups of people."

 abm_raiding_the_plains_central_indic: "Raiding the Lowlands"
 abm_raiding_the_plains_central_indic_desc: "Our forts do not only keep us safe from invaders, they are also excellent points from which to launch attacks on trade caravans or the cities of the plains. By using our knowledge of our lands to trick and ambush our opponents we may defeat stronger foes than would otherwise be possible."

 abm_ancient_roots_central_indic: "Ancient Roots"
 abm_ancient_roots_central_indic_desc: "While we may not have the grand ceremonies of the cosmopolitan courts of the great cities of India we do have our own traditions of kingship. Some of these traditions surely date back to the venerable kingdoms that came before us in these lands such as the Haihayas of Tripura or the Naga kings of Barasuru.\nThere is strength in tradition just as there is in novelty. Our courtly traditions command the respect of our people and are not merely meant to make foreign dignitaries feel at home."

 abm_formalize_relations_with_cheifs_central_indic: "Formalize Relations with the Chiefs"
 abm_formalize_relations_with_cheifs_central_indic_desc: "We command the respect and loyalty of the many chieftains who control the forts within our realm but it is now high time to replace these personal loyalties with a more formalized relationship. When the chieftains are all bound more directly to the state and acknowledge their obligations to it we will have a much easier time both taxing and controlling them."

 abm_central_indic_ideas_ambition: "Gond Ambition"
 abm_central_indic_ideas_ambition_desc: "Gond Ambition"

 abm_vindhyan_ideas_tradition_1: "Vindhyan Traditions I"
 abm_vindhyan_ideas_tradition_1_desc: "Vindhyan Traditions I"

 abm_vindhyan_ideas_tradition_2: "Vindhyan Traditions II"
 abm_vindhyan_ideas_tradition_2_desc: "Vindhyan Traditions II"

 abm_bundelkhandi_rajput_connections: "Rajput Connections"
 abm_bundelkhandi_rajput_connections_desc: "Before the Islamic conquest northern India was dominated by huge Rajput kingdoms and federations and while few such kingdoms of note now remain outside of the Rajputana today the Rajputs are still a force to be reckoned with among the northern Indian nobility. The ruling class in our kingdom is no exception to this rule and while few would consider Bundelkhand or Baghelkhand a part of the Rajputana our Rajput heritage is still cherished and the links to other Rajput dynasties in India are still strong."

 abm_forts_of_bundelkhand: "Forts of the Vindhyas"
 abm_forts_of_bundelkhand_desc: "Our ancestors knew that this is a region that is naturally well suited for fortifications and in the Bundelkhand or Baghelkhand you will find a fort on every hill. We must strive to uphold this legacy by constructing and repairing the many forts in our lands, from the huge fortifications such as Gwalior to the every last small jungle hill fort."

 abm_bundelkhandi_sacred_land: "A Sacred Land"
 abm_bundelkhandi_sacred_land_desc: "While neglected since the Muslim conquest, the temple complex of Khajuraho with its over 80 temples or the bears testimony of the piousness of the rulers that came before us. We must strive to emulate our predecessors and construct great temples in our lands. Let the pilgrims that seek our lands find the impressive temples that they deserve at their destinations rather than neglected sanctuaries."

 abm_bundeli_kalam: "Bundeli Kalam"
 abm_bundeli_kalam_desc: "The Rulers of these lands have always been patrons of the arts and literature. Let us patronize the local artists and writers for the greater glory of our dynasty."

 abm_untamed_bundelkhand: "Untamed Lands"
 abm_untamed_bundelkhand_desc: "This is a land of hills and forests. Despite the closeness of the Gangetic plain and its vast cities, our lands are home to wild tigers and tribal chiefdoms as well as the forts and cities of our kingdom. Over the years this has allowed our state to remain more or less independent even when bordered by strong, and seemingly superior, neighbors."

 abm_bundelkhandi_diamonds: "Diamond Mines"
 abm_bundelkhandi_diamonds_desc: "We have heard tales of great riches hidden in these lands in the form of precious stones. We must seek out the source of these rumors and create proper mines in which these diamonds may be methodically extracted from the earth."

 abm_candella_legacy: "Candella Legacy"
 abm_candella_legacy_desc: "Under the Candella dynasty Bundelkhand, or Jejakabhukti, was once the center of a great northern Indian kingdom that stretched along the Vindhyas in the south up to and including most of the central Gangetic plain. Some have surely forgotten but we never will, let us take up the titles of our fore-bearers and make sure the world knows of our rightful place."

 abm_vindhyan_ideas_ambition: "Vindhyan Ambition"
 abm_vindhyan_ideas_ambition_desc: "Vindhyan Ambition"

 abm_garjati_ideas_tradition_1: "Garjati Traditions I"
 abm_garjati_ideas_tradition_1_desc: "Garjati Traditions I"

 abm_garjati_ideas_tradition_2: "Garjati Traditions II"
 abm_garjati_ideas_tradition_2_desc: "Garjati Traditions II"

 abm_garjati_ancient_mandalas: "Ancient Mandalas"
 abm_garjati_ancient_mandalas_desc: "For centuries the Garjat country has been divided into a number of Mandalas, and while their origin is now a distant mystery they remain the central points to which many of the smaller tribes and states in this region are loyal. Regardless who has conquered or expanded into Orissa or the Garjat country these structures makes rule both more efficient and less full of friction than it would otherwise be."

 abm_garjati_tribal_feudatories: "Tribal Feudatories"
 abm_garjati_tribal_feudatories_desc: "The political landscape of the Garjats can seem hard to understand to some. We are able to call in troops from a much wider area than our geographic extent would at first indicate, as there are feudatories loyal to us all over this country."

 abm_garjati_extend_tanks_and_reservoirs: "Extend Tanks and Reservoirs"
 abm_garjati_extend_tanks_and_reservoirs_desc: "Not all lands under our control could be called fertile and suited for agriculture. Especially not if one compared them to the lowlands of the Mahanadi Delta or the Indo-Gangetic plain. For this reason kings and princes have for centuries spent whatever money they had on the construction of great tanks and reservoirs.\nWe must continue this tradition and invest what we can into such things, ensuring that we can have a productive agricultural sector even in lands such as these."

 abm_garjati_jungle_warfare: "Jungle Warfare"
 abm_garjati_jungle_warfare_desc: "The Garjat country is dissimilar from many parts of the subcontinent in that it is wilder, and less settled. Jungles and hills cover the entire region and traditional cavalry is much less useful here. Instead we have come to devise our own mode of warfare, reliant on small scale raiding, elephants, and good knowledge of a land that is hard to scout. As we expand we must adapt these skills to new areas, never forgetting that through such tactics even a small army can defeat a much larger foe."

 abm_garjati_jagannath_cult: "Jagannath Cult"
 abm_garjati_jagannath_cult_desc: "Our lands are in general more open to various religions and cults than many others but the cult of Jagannath, the ‘Lord of the Universe’, transcends faith and time. This deity has protected us and our ancestors for many generations and while some might find our worship a bit unorthodox it unifies the entire region as one."

 abm_garjati_patronize_economic_growth: "Patronize Economic Growth"
 abm_garjati_patronize_economic_growth_desc: "Some would claim that the Garjat country is not rich but there are in fact a great number of natural resources under our control. There are few places as abundant in good timber as the hills of our people and for many years it has been the primary export of this region. We must encourage the growth and effectivization of the timber industry and further capitalize on one of our greatest assets."

 abm_garjati_ideas_ambition: "Garjati Ambition"
 abm_garjati_ideas_ambition_desc: "Garjati Ambition"

 abm_dravidian_ideas_tradition_1: "South Indian Traditions I"
 abm_dravidian_ideas_tradition_1_desc: "South Indian Traditions I"

 abm_dravidian_ideas_tradition_2: "South Indian Traditions II"
 abm_dravidian_ideas_tradition_2_desc: "South Indian Traditions II"

 abm_water_tanks_and_canals: "Water Tanks and Canals"
 abm_water_tanks_and_canals_desc: "Southern India is home to many fertile regions such as those along the Krishna and Kaveri basin. However many areas are not so fortunate. Recent times has also seen increasing migration into our lands from the north, many of these new subjects tend to settle in the drier regions where they won't have to compete with existing settlements. In many cases these regions might also be quite productive given that a number of investments into canals and water tanks could be made. By ensuring that those who invest in these things are guaranteed a share in the increased income of the area we might quickly and cheaply encourage such a development in our lands."

 abm_polygar_system: "Polygar System"
 abm_polygar_system_desc: "The political landscape of southern India is full of ancient and well rooted petty chiefdoms and dependencies over which central authorities have limited control. While taking control over all these areas would be an arduous and lengthy process we might instead attempt to insert people loyal to us in the local hierarchies. With a royal mandate to create, improve and defend fortified settlements these new leaders would rely on authority bestowed on them by the state rather than ancient traditions. These new power holders will allow us to exert a much greater deal of control over our hinterlands and will prove a much more reliable source of troops than the old chiefdoms ever did."

 abm_south_indian_mercenaries: "South Indian Mercenaries"
 abm_south_indian_mercenaries_desc: "The cosmopolitan and militarized political situation in South India attracts all kind of mercenaries. Apart from the indigenous Telugu, Kannada and Tamil groups Maratha horsemen, Persian or Turani Horsemen, Turkoman gunners, Mavales and Berads are all competing to serve in our armies. Among other things this competition means that hiring these groups is cheaper than it might otherwise have been."

 abm_patronage_of_temples: "Patronage of Great Temples"
 abm_patronage_of_temples_desc: "If the mettle of a true king is his patronage of the temples and religious communities in his lands then there have been many great rulers in southern India. Grand temple cities such as Tirupati or Madurai bear witness of extensive royal patronage. Indeed in recent times these temple complexes have been growing even more grand and monumental, with south Indian temple complexes in many ways dwarfing those that can be found in northern India. In order to live up to the expectations placed upon us as rulers we should patronage the temple communities in our lands and make sure that they adequately communicate the greatness of our dynasty."

 abm_south_indian_literature: "South Indian Literature"
 abm_south_indian_literature_desc: "Let us gather the great poets and writers of this age at our court. The great works produced under our patronage shall be remembered for centuries to come!"

 abm_merchant_capitalists: "Merchant Capitalists"
 abm_merchant_capitalists_desc: "With the ties between west, east and the farther east growing stronger a new class of successful merchants have begun to emerge. These rich individuals exercise control over production, shipping and financing around the Indian Ocean. Merchant capitalists like these are now the main driving force behind the development of the trade in our lands and while their growing influence may seem alarming (as does their willingness to invest in foreign trading companies) their activities are also very beneficial to our country."

 abm_dravidian_ideas_ambition: "South Indian Ambition"
 abm_dravidian_ideas_ambition_desc: "South Indian Ambition"

 abm_cey_ideas_tradition_1: "Sinhalese Traditions I"
 abm_cey_ideas_tradition_1_desc: "Sinhalese Traditions I"

 abm_cey_ideas_tradition_2: "Sinhalese Traditions II"
 abm_cey_ideas_tradition_2_desc: "Sinhalese Traditions II"

 abm_gabadagam: "Gabadagam"
 abm_gabadagam_desc: "Barter is still the most common means of exchange on our island but the Gabadagam villages controlled by the state are required to make their revenue payments in cash. As the state is the largest landholder and the holder of most of the wealthier villages this is driving the development and monetization of our economy."

 abm_sinhalese_sandesas: "Sinhalese Sandesas"
 abm_sinhalese_sandesas_desc: "Sandesa poems tend to revolve around a messenger, often a bird, bringing tidings of the plight of a king or other hero to a deity. Ever since the days of the Gampola kingdom this genre has thrived on our island. We must continue to patronize and develop the genre so that it can achieve its full potential."

 abm_pearl_of_the_indian_ocean: "Pearl of the Indian Ocean"
 abm_pearl_of_the_indian_ocean_desc: "For hundreds of years our island has been a great source of high quality Pearls. The drive to acquire this prestigious commodity has brought merchants from all over the Indian Ocean and the Chinese world to our shores."

 abm_cey_centre_of_learning: "Centre of Learning"
 abm_cey_centre_of_learning_desc: "Over the centuries Buddhism has become quite marginalized in the areas of the classical Buddhist pilgrimages and universities in northern India. As the location of the sacred tooth and as a country with one of the oldest and strongest Buddhist traditions our island is one of the main centers of Buddhist learning. This position can be quite useful when dealing with the many princes and kings of South Asia who are either themselves Buddhist or have Buddhist subjects."

 abm_cey_cinnamon: "Develop the Cinnamon Trade"
 abm_cey_cinnamon_desc: "True Cinnamon only grows on our island and is highly sought after all over the world. We should act to develop the production and distribution of Cinnamon so that it may grow into a major source of income for our state."

 abm_cey_growth_of_new_castes: "Growth of New Castes"
 abm_cey_growth_of_new_castes_desc: "The South Asian world is an ever changing place, the arrival of Christian and Arabs as well as the Muslim conquest of much of India has resulted in an influx of new people to our island. The new castes formed by these newcomers such as the Salagamas, Duravas or Karavas have all come to occupy themselves with the new and developing sectors in our economy rather than the traditional agriculture which occupies most of our population."

 abm_sinhalese_guerilla_warfare: "Sinhalese Guerrilla Warfare"
 abm_sinhalese_guerilla_warfare_desc: "Our island is well suited for guerrilla warfare. By adopting western arms and developing traditional Sinhalese tactics we can make our country a nightmare to invade and control."

 abm_cey_ideas_ambition: "Sinhalese Ambition"
 abm_cey_ideas_ambition_desc: "Sinhalese Ambition"

 abm_telugu_ideas_tradition_1: "Telugu Traditions I"
 abm_telugu_ideas_tradition_1_desc: "Telugu Traditions I"

 abm_telugu_ideas_tradition_2: "Telugu Traditions II"
 abm_telugu_ideas_tradition_2_desc: "Telugu Traditions II"

 abm_yor_patronize_telugu_literature: "Patronize Telugu Literature"
 abm_yor_patronize_telugu_literature_desc: "Since the early Reddy rulers kingship and literature has been intertwined among our people. Our rulers are expected to be scholars and authors in their own right and to patronize the great poets and authors of our age."

 abm_yor_telugu_warrior_aristocrats: "Telugu Warrior Aristocrats"
 abm_yor_telugu_warrior_aristocrats_desc: "Our state rests on the traditions of generations of Telugu warriors before us. Men who have fought in the service of many of the great Indian empires and most recently made up the aristocracy of the erstwhile Kakatiya Empire. This ensures a steady supply of able warriors and captains for our armies regardless of what the future may have in store for us."

 abm_yor_kakatiya_legacy: "Kakatiya Legacy"
 abm_yor_kakatiya_legacy_desc: "Not long ago the Kakatiya empire ruled these lands, with it's Telugu aristocracy and disregard for the strict Caste hierarchies of some of our neighbors it is still a role-model for our state to aspire to. There are valuable lessons to be learned from the Kakatiya state and we must bring these with us while shape our own policies in the present."

 abm_yor_great_forts_of_the_east: "Great Forts of the East"
 abm_yor_great_forts_of_the_east_desc: "A number of great fortresses in the Eastern Ghats guard our lands from invasions from the upland powers. We must keep these strongholds well maintained and up to date or risk squandering the backbone of our defenses."

 abm_yor_legend_of_prataparudra: "Legend of Prataparudra"
 abm_yor_legend_of_prataparudra_desc: "The last Kakitya ruler, Prataparudra II, died as a prisoner of the Sultanate forces that subdued his kingdom. According to some, however, he survived and granted on his vassals the right to found new kingdoms, such as our state. Let us promote this legend and have it written down so that generations to come can learn of the roots of our great state."

 abm_yor_diamond_mines_of_kollur: "Diamond Mines of Kollur"
 abm_yor_diamond_mines_of_kollur_desc: "Andhra is home to some of the greatest Diamond mines in the world. Over the centuries these great mines have been the source of both the majority of the worlds known diamonds but also great stones such as the Koh-i-Noor. It is time, however, that we modernize our great mines and take care to develop them to their full potential."

 abm_yor_encourage_coromandel_trade: "Encourage Coromandel Trade"
 abm_yor_encourage_coromandel_trade_desc: "The Coromandel Coast has always been the source of wealth with it's great bustling ports and many traders from far-away countries. One of the old Reddy rulers of Andhra wisely tried to keep regulations on the Coromandel trade to a minimum, stimulating the growth of our ports greatly. Let us re-enact this policy in the modern era and reduce trading regulations in order to allow traders a freer rein."

 abm_telugu_ideas_ambition: "Telugu Ambition"
 abm_telugu_ideas_ambition_desc: "Telugu Ambition"

 abm_malabari_ideas_tradition_1: "Malabari Traditions I"
 abm_malabari_ideas_tradition_1_desc: "Malabari Traditions I"

 abm_malabari_ideas_tradition_2: "Malabari Traditions II"
 abm_malabari_ideas_tradition_2_desc: "Malabari Traditions II"

 abm_merchants_of_southern_india: "Merchants of Southern India"
 abm_merchants_of_southern_india_desc: "From the coast of Malabar to that of Coromandel the history of South India is closely tied to overseas trade. These lands attract all manners of merchants from west and east alike to compete and cooperate with our own merchant groups such as the itinerant Nanadesis or the Chetti merchants who travel abroad to establish their trading firms in far away ports. We must not take these traders for granted however. By establishing ports and villages that are free of taxes and tolls we may persuade domestic and foreign traders alike to keep their bases of operation in our lands rather than that of our neighbors. Let us create such sanctuaries and watch the merchants flock to our cities."

 abm_malabari_cultural_melting_pot: "Cultural Melting Pot"
 abm_malabari_cultural_melting_pot_desc: "For thousands of years this region has been one of the oldest trade centers in the world. Spices have been exported to ancient Egypt, and Persia, the Empires of China, Imperial Rome and many other places. As a result this region is also home to a wide variety of peoples, faiths and cultures. Christians, Jews, Zoroastrians, Buddhists, and many others have co-existed here for hundreds, if not thousands of years."

 abm_malabari_kerala_school: "Patronize the Kerala School"
 abm_malabari_kerala_school_desc: "We must ensure that the bright minds of our people are given the proper means and patronage to flourish. Over the last years a whole new generation of Mathematicians and Astronomers have begun to explore and describe the world. Their treatises will benefit future generations long after they are gone."

 abm_malabari_trade_factors: "Trade Factors"
 abm_malabari_trade_factors_desc: "Foreign merchants have been a constant part of our society but with the advent of an overseas route between India and Europe there are now a number of western trade companies are now looking to set up factories in our lands.\nLet us embrace these newcomers and encourage the direct trade between our ports and the great European market!"

 abm_malabari_control_inland: "Control the Inland"
 abm_malabari_control_inland_desc: "Our nation is one historically very dependent on overseas trade and so that is where our control is the greatest. The inland however is governed by a number of more or less loyal chiefs, often given great freedom in exchange for their service in times of need. We must tighten up this arrangement, formalize their obligations and assert direct control over the more important areas."

 abm_malabari_mapilla_sailors: "Mapilla Sailors"
 abm_malabari_mapilla_sailors_desc: "The Muslim community in our lands goes back many centuries and the arrival of traders and sailors from Arabia and Iran to our shores and while they are now an integral part of our society many remain very well versed sailors and fighters.\nWe must make good use of this community and employ them in our navy and our merchant marine alike. We may not have the numbers to match some of the great naval powers but through skillful maneuvering and good use of the coastal geography we can still inflict heavy losses on any adversary."

 abm_malabari_land_of_elephants: "Land of Elephants"
 abm_malabari_land_of_elephants_desc: "Kerala elephants have long been thought especially noble and here, more than in any other part of India, they have a special place in society, kingship and religion. We must care for these giant benefactors as we care for our human subjects. Let it not be said that we mistreat those that we depend on."

 abm_malabari_ideas_ambition: "Malabari Ambition"
 abm_malabari_ideas_ambition_desc: "Malabari Ambition"

 abm_mys_ideas_tradition_1: "Mysorean Traditions I"
 abm_mys_ideas_tradition_1_desc: "Mysorean Traditions I"

 abm_mys_ideas_tradition_2: "Mysorean Traditions II"
 abm_mys_ideas_tradition_2_desc: "Mysorean Traditions II"

 abm_mys_unification_of_mysore: "Unification of Mysore"
 abm_mys_unification_of_mysore_desc: "The Mysore plateau, once known as Gangavadi after an ancient dynasty, have been home to strong kingdoms for as long as anyone can remember. Today it is home to both Uddiyars and Ummaturs as well as many other groups. We must unite all of these groups and aim to expand together into the Deccani upland."

 abm_mys_patronize_kannada_literature: "Patronize Kannada Literature"
 abm_mys_patronize_kannada_literature_desc: "As the major Kannada court we have come to attract many great poets and authors of the beautiful Kannada language. We must patronize and spread Kannada literature and plays, acting as the primary benefactor for the culture of the people of Karnataka."

 abm_mys_religious_tolerance: "Religious Tolerance"
 abm_mys_religious_tolerance_desc: "We must not let ourselves be caught up in religious strife. Anyone who can serve the state of Mysore must have a place in our country. If we can win the loyalty of all our subjects, and not just those of the true faith, then we will have a solid base to stand on as an expansionist power. Let us donate lavishly to holy places of all religions within our borders and encourage giving out offices regardless of which faith the holder would have."

 abm_mys_reform_silk_industry: "Reform the Silk Industry"
 abm_mys_reform_silk_industry_desc: "While the Mysorean economy is strong in many ways we envy the silk industries of Bengal and Gujarat. The best way to improve and support our domestic production might be to send forth agents to study how others have fared and then implement reforms to mimic these things in our own way. Together with the excellent craftsmanship of our own artisans this should allow our economy to flourish."

 abm_mys_rockets: "Rockets!"
 abm_mys_rockets_desc: "The use of Rockets is nothing new in India but recent advances in metallurgy and chemistry has allowed us to pioneer the use of rockets in close combat. By equipping our troops with this new weapon, and by making sure we regularly practice their use, we will have an edge on any battlefield, siege or ambush."

 abm_mys_reform_mysorean_army: "Reform the Mysorean Army"
 abm_mys_reform_mysorean_army_desc: "None can question the courage or weaponry of the Mysorean soldier, and yet there are areas we might improve for our armed forces. Let us send forth officers to study in foreign countries so that they might observe what innovations others are employing on the battlefield. Drill, discipline and coordination are all areas in which we might adopt the ways of foreign powers, while adapting them to the realities of an Indian battlefield."

 abm_mys_dynamic_diplomacy: "Dynamic Diplomacy"
 abm_mys_dynamic_diplomacy_desc: "No country can exist in isolation, and a kingdom such as ours can attract many greedy rivals. It is time we look for allies overseas, as it seems few of our neighbors would like to contribute further to our rise to power."

 abm_mys_ideas_ambition: "Mysorean Ambition"
 abm_mys_ideas_ambition_desc: "Mysorean Ambition"

 abm_bah_ideas_tradition_1: "Bahmani Traditions I"
 abm_bah_ideas_tradition_1_desc: "Bahmani Traditions I"

 abm_bah_ideas_tradition_2: "Bahmani Traditions II"
 abm_bah_ideas_tradition_2_desc: "Bahmani Traditions II"

 abm_gharbians: "Gharbians"
 abm_gharbians_desc: "Cutting ties with Delhi to found our own kingdom almost one hundred years ago has also cut off our access to men, goods and technology from the Muslim dominated northern parts of India. As our state lack any form of entrenched Muslim aristocracy we are in a precarious situation and we could end up entirely at the mercy of local Hindu nobles.\nFortunately our reputation precedes us. Tales of the riches of the Deccan are told and retold all over the Muslim world and many ambitious fortune builders seek to make the sea voyage to our ports. By using the vast riches of India to attract talented westerners, Gharbians, to our court we can ensure that our country shall never lack able men to lead our armies, collect our taxes and rule our subjects."

 abm_legacy_of_gisu_daraz: "Legacy of Gisu Daraz"
 abm_legacy_of_gisu_daraz_desc: "India in general and the Bahmani sultanate in particular has a history as a center of Sufi teachings. The efforts of our sultans to attract and patronize Sufi sheiks, such as the great Muhammad Gisu Daraz from all over the world is a testament to the piety and the great spiritual strength of our monarchs and our court.\nThe state adopting the Sufi concepts of spiritual sovereignty and the inclusive nature of the Sufi teachings themselves will help to create an environment where the diverse religious faiths of Gharbians and the Deccani natives alike can mix and thrive without clashes or unproductive quarrels."

 abm_dakani_language: "Dakani Language"
 abm_dakani_language_desc: "The Deccan is a region of many languages and cultures. The great influx of Iranians, Turanians, Afghans and Arabs into these lands has gone even further to accentuate the cosmopolitan nature of our state. While historically the Persian language has fulfilled the needs of our predecessors a new mix of local languages as well as Persian and Arabic has grown increasingly common. We should adopt this Dakani language in our court and encourage its use among our poets and administrators."

 abm_karimis: "Karimis"
 abm_karimis_desc: "For centuries the Indo-Egyptian trade has been handled by Egyptian based groups of traders and captains known as the Karimis. Instrumental in the day-to-day business of the Indian Ocean trade this merchant organization is now both wealthy and powerful. From the Tamil coasts and the ports of the Swahili trading cities to the Egyptian port cities past the Gulf of Aden, Sultans, nobles and commoners alike come to buy exotic goods or borrow money for their projects from the Karimis.\nThis organization has lately come to take a very active interest in our state and we only stand to gain from cultivating our relationship with it further."

 abm_takht_e_firoza: "Takht-e-Firoza"
 abm_takht_e_firoza_desc: "The first thing any guest in our royal audience chamber notices is the Turquoise Throne of our dynasty. This unique piece of royal furniture was originally donated to us by the defeated Telugu Raja Kapaya and it is in many ways the ultimate symbol of our dynasty. Exquisite and splendidly unique it embodies the riches of the Deccan and the unusual combination of styles that is the hallmark of our cosmopolitan state."

 abm_bahmani_primogeniture: "Bahmani Primogeniture"
 abm_bahmani_primogeniture_desc: "Our unusual practice of always passing the throne to the eldest son of the current ruler has at times created some instability in our realm as power hungry regents and opportunistic nobles initially showed little hesitation in trying to take advantage of a child ruler or in supporting an envious relative's claim to the throne. By now, however, the practice has become firmly institutionalized and when the time for succession comes there are very few who would oppose the true heir of our dynasty."

 abm_madrasa_of_mahmud_gawan: "Great Madrasa of the Deccan"
 abm_madrasa_of_mahmud_gawan_desc: "For many years now our state has drained able men from the greater Muslim world while also incorporating the best of the states that came before us. This has created a rich cosmopolitan, Deccani, culture which is neither entirely Persian, Arab, Marathi, Telugu nor Kannada in nature. Creating a major Madrasa in our capital would serve to further the development of Deccani learning and would allow the world to see the greatness of our state."

 abm_bah_ideas_ambition: "Bahmani Ambition"
 abm_bah_ideas_ambition_desc: "Bahmani Ambition"

 abm_deccani_muslim_ideas_tradition_1: "Deccani Sultanate Traditions I"
 abm_deccani_muslim_ideas_tradition_1_desc: "Deccani Sultanate Traditions I"

 abm_deccani_muslim_ideas_tradition_2: "Deccani Sultanate Traditions II"
 abm_deccani_muslim_ideas_tradition_2_desc: "Deccani Sultanate Traditions II"

 abm_dec_legacy_of_bahmanis: "Legacy of the Bahmani Sultanate"
 abm_dec_legacy_of_bahmanis_desc: "The Bahmanis have fallen from their former glory, but their legacy lives on. From them we have inherited many of the institutions of the state, our courtly culture, and our martial traditions. We must demonstrate that we are their true successors by honoring these traditions."

 abm_dec_deccani_identity: "Promote Deccani Regional Identity"
 abm_dec_deccani_identity_desc: "A cultural revolution is underway in our nation. Distancing ourselves from the Persianate empires of the north, we are enthusiastically embracing and promoting the local cultures of the Deccan. We have even gone so far as to adopt Deccani languages for use in official state accounts."

 abm_dec_brahmin_administrators: "Appoint Brahmin Administrators"
 abm_dec_brahmin_administrators_desc: "To ignore the services that the Brahmins could offer us would be foolish. They would be most useful to us employed in the state bureaucracy, so long as we do not afford them too much influence."

 abm_dec_habshis: "Purchase Habshis"
 abm_dec_habshis_desc: "Habshis, Ethiopian slave-soldiers, can be purchased in great numbers from the Arab traders that frequent our markets. Far from mere cannon-fodder, the Habshis shall make up the elite of our infantry soldiers. Habshis that demonstrate their loyalty and martial prowess should be rewarded with power and responsibilities, for who better to guard the Sultan than one who owes him everything?"

 abm_dec_bargi_giri: "Bargi Giri"
 abm_dec_bargi_giri_desc: "Highly mobile Marathi light cavalry will be of great use should we find ourselves at war with the cannon-heavy armies of northern India. These horsemen are able to plunder the land and escape before our enemies can muster a force to repel them, or even disable enemy cannons in daring flanking attacks."

 abm_dec_marathi_cultivators: "Strengthen Ties with Marathi Cultivators"
 abm_dec_marathi_cultivators_desc: "As we have welcomed Marathi warriors into our fold, so too should we welcome those who work the land. The Marathas have strong ties with peasant communities which we must exploit to ensure that the land is productive."

 abm_dec_marathi_habshi_state: "Joint Marathi-Habshi State"
 abm_dec_marathi_habshi_state_desc: "The old political divide between Westerners and Deccanis is over, as both factions have exhausted themselves through infighting. The resulting power vacuum has been filled by our Habshi slave-soldiers and by the increasingly influential Marathas. Their joint power shall ensure the continued strength and survival of our nation."

 abm_deccani_muslim_ideas_ambition: "Deccani Sultanate Ambition"
 abm_deccani_muslim_ideas_ambition_desc: "Deccani Sultanate Ambition"

 abm_jaj_ideas_tradition_1: "Siddi Traditions I"
 abm_jaj_ideas_tradition_1_desc: "Siddi Traditions I"

 abm_jaj_ideas_tradition_2: "Siddi Traditions II"
 abm_jaj_ideas_tradition_2_desc: "Siddi Traditions II"

 abm_goma: "Goma"
 abm_goma_desc: "While our people can no longer be considered culturally African we have not forgotten the customs of our ancestors. The Goma, a sacred drum dance built on the mixing of Indo-Islamic and African styles and rhythms is a prime example of how we have come to accept the ways of these lands while at the same time making them our own. This is the Siddi way."

 abm_siddi_seamanship: "Siddi Seamanship"
 abm_siddi_seamanship_desc: "One of the first tasks of our enslaved ancestors would be to sail the ships of their captors across the Indian Ocean. While we are now free we still carry their legacy and our people are renowned for their great seamanship."

 abm_fortress_of_janjira: "Impregnable Island Fortress"
 abm_fortress_of_janjira_desc: "Our mastery of the sea means that every rocky island is a potential base for the ships and troops of our kingdom. Let us fortify the rock island that we now call our capital so heavily that for any outsider it will appear as if the fortress is rising from the sea itself."

 abm_siddi_diaspora: "The Siddi Diaspora"
 abm_siddi_diaspora_desc: "Trained at a young age to become expert sailors, soldiers and administrators our ancestors were once taken from their native homes in Eastern Africa. Now they man ships, desks and forts around India and Persia devoting their lives to serve masters of varying stature and importance. As the name of our state travels, however, so does a number of former slaves travel in the other direction to reach the world's only Siddi kingdom. A place to call home."

 abm_siddi_diplomacy: "Siddi Diplomacy"
 abm_siddi_diplomacy_desc: "Our kingdom is a strange little fish in the big pond of Indian states. It is vital for our survival that we maintain an active diplomacy towards all of our neighbors. We must never stand without allies and we must never allow ourselves to be unsure of our neighbors intentions."

 abm_siddi_konkani_trade: "Konkan Trade"
 abm_siddi_konkani_trade_desc: "Home to bustling trade ports such as Thana, Chaul or Goa the life nerve of the Konkan coast is the Indian Ocean trade network. By making good use of the naval assets at our disposal we can ensure that we grow rich as rich as the wealthiest merchant that pays our tolls."

 abm_siddi_expansion_of_navy: "Expansion of the Navy"
 abm_siddi_expansion_of_navy_desc: "Controlling the sea has always been what we Siddis do best and our navy is one of the finest in the Indian Ocean. As the influence of our kingdom grows we must ensure that our navy also grows. Quality alone will not win the day when the navies of European powers try to disrupt the trade of this region."

 abm_jaj_ideas_ambition: "Siddi Ambition"
 abm_jaj_ideas_ambition_desc: "Siddi Ambition"

 abm_npl_ideas_tradition_1: "Nepali Traditions I"
 abm_npl_ideas_tradition_1_desc: "Nepali Traditions I"

 abm_npl_ideas_tradition_2: "Nepali Traditions II"
 abm_npl_ideas_tradition_2_desc: "Nepali Traditions II"

 abm_divya_upadesh: "The Divya Upadesh"
 abm_divya_upadesh_desc: "The Divya Upadesh laid out nine principles that formed the core of Nepali political and national life as well as guidelines for successful foreign policy. While it was not written until the 18th century, it encapsulated centuries of Nepali thoughts on governance, war and peace. Following these principles Nepal has been able to avoid the subversion of nearby Empires and the marauding Westerners."

 abm_land_of_peaks: "Land of Peaks"
 abm_land_of_peaks_desc: "Our people live and die without losing sight of the great peaks that surround us. We know the hills and mountains like the back of our hands. Even the Gods have settled at the heights. We shall always keep in mind the important lesson we have learned... build our forts to take advantage of the environment."

 abm_valleys_united: "Our Valleys United"
 abm_valleys_united_desc: "Nepal was united just before our time by Jayasthiti Malla (ruled from 1382-1395), who united the valleys, imposed order across them, and issued universal coinage. Not only a military master, Jayasthiti Malla drafted the first comprehensive codification of law in Nepal, based on the dharma of ancient Hindu texts. All the varied principalities and hill tribes will now heed our call."

 abm_rajput_refugees: "Rajput Refugees"
 abm_rajput_refugees_desc: "The Islamic invasions of the 14th century left widespread damage across the plains to the south, and many noble Rajput families have been deposed and fled to our mountains to try to re-establish themselves as landholders. Let us grant them land and harness their fighting experiences and warrior traditions."

 abm_royal_kumari: "The Royal Kumari"
 abm_royal_kumari_desc: "The Malla kings shored up their position by claiming to be reincarnations of the Hindu god Vishnu and establishing the cult of the Kumari, in which a young girl was designated a living embodiment of the Goddess of War, Durga, whose role it was to bless the Malla's rule during an annual celebration. After the Malla Kings fell, this tradition continued onwards with other dynasties in Nepal. Let us anoint a new Kumari to inspire our people!"

 abm_gurkha_recruits: "The Gurkhas"
 abm_gurkha_recruits_desc: "The Gurkhas are a tribal people mainly from the mid-western and eastern Nepali hills. They are fierce fighters and we have found that including them as irregulars with our armies brings us great success on the battlefield. Their name derives from the Hindu warrior-saint Guru Gorakhnath, and their war cry is Jaya Mahakali, Ayo Gorkhali! (Glory to Great Kali, The Gurkhas approach!) Eventually our Gurkhas' military prowess will be feared world over."

 abm_envelopment_and_blockade: "Envelopment and Blockade "
 abm_envelopment_and_blockade_desc: "King Prithvi Narayan Shah (1723-1775) re-unified Nepal and picked off his enemies one-by-one by blockading trade routes and besieging valleys piece by piece. His military strategy proved effective in the hills and mountains of Nepal, keeping rival militaries starved for supplies and unable to coalesce into a force that could overwhelm him in a pitched battle."

 abm_npl_ideas_ambition: "Nepali Ambition"
 abm_npl_ideas_ambition_desc: "Nepali Ambition"

 abm_mug_ideas_tradition_1: "Mughal Traditions I"
 abm_mug_ideas_tradition_1_desc: "Mughal Traditions I"

 abm_mug_ideas_tradition_2: "Mughal Traditions II"
 abm_mug_ideas_tradition_2_desc: "Mughal Traditions II"

 mansabdari_system: "The Jagir and Mansabdari Systems"
 mansabdari_system_desc: "Land grants are problematic and may end up encouraging our nobles to build their own little states within our state. Let us create a strict system of revenue rights to lands rather than land grants as such. The holder of such a temporary grant should be entitled to take up taxes and obligated to supply troops to the imperial armies. All other political and administrative duties should remain with the imperial bureaucracy."

 control_of_the_ulema: "Control over the Clergy"
 control_of_the_ulema_desc: "The Mughal Ulema is too easily influenced by the trends and politics of the world outside of India. Let us gather the most influential men of faith in our lands and have them proclaim our Padshah the foremost authority on all legal matters."

 mughal_ibadat_khana: "Ibadat Khana - House of Worship"
 mughal_ibadat_khana_desc: "Let us gather the most learned of men from all faiths and philosophies in one place and allow them to debate the best ways for men to live and worship."

 an_indian_padshah: "An Indian Padishah"
 an_indian_padshah_desc: "Our realm has become one of many faiths and cultures and while we are foreigners to these lands the traditions and values of India speak to us. Despite their rich culture these people seem to lack a common purpose. We must strive to ensure that regardless of caste, religion or culture all our subjects are given equal opportunities to serve our great house."

 zabt_system: "Zabt System"
 zabt_system_desc: "These lands are far too dependent on ancient customs. As a result contracts and revenue units are often not organized in the most efficient way. By revoking all lands and placing them under direct imperial control for a time we can entirely reorganize and reassess our assets. This will greatly increase the efficiency of tax collection in our realm."

 mughal_architecture: "Mughal Architecture"
 mughal_architecture_desc: "A great empire demands monumental buildings. In our cosmopolitan empire architects are already creating marvelous buildings that will awe generations to come. Our dynasty should be at the forefront of this movement, creating great works of a kind the world has never seen."

 fatawa_e_alamgiri: "Fatawa-i-Alamgiri"
 fatawa_e_alamgiri_desc: "By creating a central collection of civil laws for all subjects to follow we will be able to ensure that the law is the same in all parts of our realm."

 abm_mug_ideas_ambition: "Mughal Ambition"
 abm_mug_ideas_ambition_desc: "Mughal Ambition"

 abm_pun_ideas_tradition_1: "Punjabi Traditions I"
 abm_pun_ideas_tradition_1_desc: "Punjabi Traditions I"

 abm_pun_ideas_tradition_2: "Punjabi Traditions II"
 abm_pun_ideas_tradition_2_desc: "Punjabi Traditions II"

 abm_breadbasket_of_india: "Breadbasket of India"
 abm_breadbasket_of_india_desc: "Punjab, the land of the five rivers, is one of the most fertile regions on Earth. Apart from allowing us to export food and cotton to our neighbors this also allows our many cities to grow and encourages all sorts of specialized production. We must do our outmost to encourage the growth of agriculture and to defend our farmers from the bandits and brigands of the adjoining areas."

 abm_encourage_indo_persian_trade: "Encourage Indo-Persian Trade"
 abm_encourage_indo_persian_trade_desc: "Situated at India's westernmost border the Punjab has always been at the crossroads of economic and cultural exchange between India and Persia. The ancient Grand Trunk Road, which connects eastern India to the Persian world, runs right through our lands before heading up into the Afghan mountain passes. These passes are, however, plagued by tribal raiders and bandits. We should encourage the traffic along this ancient and vibrant route and do everything in our power to look after the wellbeing of these traders by constructing caravansarais and policing these roads."

 abm_punjabi_textile_industry: "Punjabi Textile Industry"
 abm_punjabi_textile_industry_desc: "The Punjab is a major centre for textile production. Cloth from our weavers is specially made for markets all over Asia and Europe and our weavers are among the most productive in India."

 abm_foundation_of_the_khalsa: "The Khalsa"
 abm_foundation_of_the_khalsa_desc: "Sikhism, a religion native to the Punjab, is growing rapidly in our lands. Members of this faith come from all castes and background and will defend their state regardless of their former professions."

 abm_gurmukhi_script: "Adopt Standardized Gurmukhi Script"
 abm_gurmukhi_script_desc: "We should adopt a standardized script instead of the many different ones currently in use in our lands."

 abm_strength_of_the_misls: "Strength of the Misls"
 abm_strength_of_the_misls_desc: "The administrative system of the Misl states of the Punjab allow them to field impressive cavalry forces. In times of need we may call upon these forces to fight a common enemy."

 abm_reforming_the_punjabi_army: "Reforming the Punjabi Army"
 abm_reforming_the_punjabi_army_desc: "The ways of our forefathers were sound and have served us well over the years. In order for our armies to continue to triumph on the battlefields we must, however, aim to create a more professional force. By studying the way far away countries organize their armies and making adapting their methods when prudent we may create a more efficient Punjabi army while still retaining the unique qualities of our current military system."

 abm_pun_ideas_ambition: "Punjabi Ambition"
 abm_pun_ideas_ambition_desc: "Punjabi Ambition"

 abm_bha_ideas_tradition_1: "Bharathi Traditions I"
 abm_bha_ideas_tradition_1_desc: "Bharathi Traditions I"

 abm_bha_ideas_tradition_2: "Bharathi Traditions II"
 abm_bha_ideas_tradition_2_desc: "Bharathi Traditions II"

 abm_bha_modernized_war_elephants: "Modernized War Elephant Tactics"
 abm_bha_modernized_war_elephants_desc: "With the increasing prevalence of artillery on the battlefield, we have cause to re-evaluate our war elephant tactics. We must outfit both our elephants and their mahouts with sufficient armor, expand their use in military logistics, and consider their applications in the field of siegecraft."

 abm_bha_united_india: "Unite the Subcontinent"
 abm_bha_united_india_desc: "The many people, cultures, languages, and nations that make up the Indian subcontinent shall be united; our diversity shall give us strength."

 abm_bha_sanskrit_golden_age: "Golden Age of Sanskrit Literature"
 abm_bha_sanskrit_golden_age_desc: "Sanskrit literature has been on the decline since the Islamic conquests of centuries prior. It is time to revive our most ancient textual traditions, introducing them to new generations of scholars and promoting a literate society across our nation."

 abm_bha_indian_army: "Indian Army"
 abm_bha_indian_army_desc: "A single army marching under one banner, a disciplined military force wearing a single uniform; this is our vision for the Indian army."

 abm_bha_ganga: "Ganga"
 abm_bha_ganga_desc: "Many Hindus worship the river Ganges as a goddess, bringing purity and redemption to the faithful. We implore pilgrims to visit the river banks to bathe in the sacred waters. Through Ganga, our nation is made pure."

 abm_bha_brahmin_administration: "Brahmin Administration"
 abm_bha_brahmin_administration_desc: "Brahmins have long been involved in state administration throughout India. It is time to institutionalize their role in the bureaucracy. This will at once cement their power in the state and in society, while also ensuring that the Brahmins understand that their role is administrative rather than political."

 abm_bha_rocketry: "Develop Rocket Technology"
 abm_bha_rocketry_desc: "Iron-cased rockets have yet to be widely adapted for military purposes, yet their explosive power surely has tactical applications. We should experiment with this technology and test it on the battlefield."

 abm_bha_ideas_ambition: "Bharathi Ambition"
 abm_bha_ideas_ambition_desc: "Bharathi Ambition"

 abm_nepalese_minor_ideas_tradition_1: "Nepalese Princedom Traditions I"
 abm_nepalese_minor_ideas_tradition_1_desc: "Nepalese Princedom Traditions I"

 abm_nepalese_minor_ideas_tradition_2: "Nepalese Princedom Traditions II"
 abm_nepalese_minor_ideas_tradition_2_desc: "Nepalese Princedom Traditions II"

 abm_nep_construct_temples: "Continue Temple Construction"
 abm_nep_construct_temples_desc: "Each successive ruler of our nation continues the legacy of his predecessor by continuing the tradition of temple construction. Whether expanding existing temples, funding the development of new ones, or introducing new architectural styles, our rulers must continue to honor the gods."

 abm_nep_kashmiri_traders: "Invite Kashmiri Traders"
 abm_nep_kashmiri_traders_desc: "The merchants of Kashmir have extensive connections that span throughout India, Tibet, and Persia. We must convince some of them to visit our court so that we will be better informed about foreign markets and how they might be exploited."

 abm_nep_new_festivals: "Institute New Festivals"
 abm_nep_new_festivals_desc: "It is not enough to honor the gods by building temples; we must also celebrate them publicly by hosting regular festivals in their name. The deities most deserving of our affection are Indra, the King of Heaven, and Kumari, the living goddess who incarnates in the form of a young girl. As well as serving the gods, these festivals will also be popular among the common people."

 abm_nep_kavindra: "Kavindra"
 abm_nep_kavindra_desc: "Our ruler shall adopt the title of Kavindra, 'King of Poets'. All the people of Nepal will be moved by his works."

 abm_nep_seize_mountain_passes: "Seize the Mountain Passes"
 abm_nep_seize_mountain_passes_desc: "Nepal's mountainous terrain forces armies to march through certain passes if they wish to reach their destination safely and quickly. We must identify every likely route into our nation, seize the territory, and fortify the passes so that our enemies will not be able to enter without taking heavy casualties."

 abm_nep_judicial_reforms: "Enact Judicial Reforms"
 abm_nep_judicial_reforms_desc: "The laws of our nation have until now been disorganized, unevenly enforced, and arbitrary. It is time to implement a code of laws that is simple, just, and easily applied."

 abm_nep_end_division_of_domains: "End the Division of Domains"
 abm_nep_end_division_of_domains_desc: "The domains of Nepalese princes have been growing ever smaller as their lands are divided between his sons upon the death of the king. We must institute a clear and single line of succession to keep our realm unified."

 abm_nepalese_minor_ideas_ambition: "Nepalese Princedom Ambition"
 abm_nepalese_minor_ideas_ambition_desc: "Nepalese Princedom Ambition"

 abm_hin_ideas_tradition_1: "Hindustani Traditions I"
 abm_hin_ideas_tradition_1_desc: "Hindustani Traditions I"

 abm_hin_ideas_tradition_2: "Hindustani Traditions II"
 abm_hin_ideas_tradition_2_desc: "Hindustani Traditions II"

 abm_hin_sepahi: "Sepahi"
 abm_hin_sepahi_desc: "Neglecting the importance of infantry soldiers has been the downfall of many would-be conquerors in India. We must ensure that our Sipahi infantry are equipped with the most effective firearms and drilled in the most modern tactics."

 abm_hin_persianate_court: "Persianate Courtly Culture"
 abm_hin_persianate_court_desc: "Persian language and courtly customs have become the most politically and scholarly in the Muslim world. Our own nation has enthusiastically adopted these customs, and in doing so we have attracted many skilled and educated Persian-speaking advisors whose services to our administration cannot be understated."

 abm_hin_indian_empire: "Imperial Indian Ambition"
 abm_hin_indian_empire_desc: "No ruler, be they Muslim, Hindu, Buddhist, or Jain, has ever succeeded in conquering the entirety of India. We shall be the first universal rulers of India!"

 abm_hin_peacock_throne: "The Peacock Throne"
 abm_hin_peacock_throne_desc: "A great ruler must have a great throne. Adorned with every kind of precious jewel under the sun and inscribed with the names of our exalted monarchs, the Peacock Throne is truly splendorous."

 abm_hin_gunpowder_empire: "Gunpowder Empire"
 abm_hin_gunpowder_empire_desc: "Mastery of gunpowder warfare is the key to mastery over India. Our cannons and muskets must strike such fear into our enemies' hearts that they will not willingly meet us directly on the battlefield. When the battle is joined, our tactics should focus on causing the greatest possible numbers of casualties and chaos in enemy ranks."

 abm_hin_sufism: "Patronize Sufi Missionaries"
 abm_hin_sufism_desc: "Muslim princes across the world compete to attract the wisest Sufi teachers. As our renown has grown, more of these Sufis have joined us. Towns are founded where they settle, often in previously inhospitable regions, and the local people are inspired to convert to Islam by the wisdom of the Sufis."

 abm_hin_industrialization: "Proto-Industrialization"
 abm_hin_industrialization_desc: "Conditions in the Indian economy are ideal for rapid industrial expansion. As new technology becomes available for production, particularly in the textile industry, our pan-Indian state can ensure that it is adopted rapidly."

 abm_hin_ideas_ambition: "Hindustani Ambition"
 abm_hin_ideas_ambition_desc: "Hindustani Ambition"

 abm_indian_muslim_ideas_tradition_1: "Indian Sultanate Traditions I"
 abm_indian_muslim_ideas_tradition_1_desc: "Indian Sultanate Traditions I"

 abm_indian_muslim_ideas_tradition_2: "Indian Sultanate Traditions II"
 abm_indian_muslim_ideas_tradition_2_desc: "Indian Sultanate Traditions II"

 abm_tolerate_idol_worshippers_i: "Tolerate the Idol Worshipers"
 abm_tolerate_idol_worshippers_i_desc: "The great prophet Moses showed us that the worship of the cow was an affront to God. The idol worshipers continue to cling to their ways, but Allah is compassionate and merciful. We will do our duty and ensure that all of our subjects enjoy our protection and wait for them to come to Allah."

 abm_persian_court: "Court Persian"
 abm_persian_court_desc: "We need to ensure that all of our people, regardless of background (although we naturally assume that you are not poor), can understand what we are doing and are able to communicate their concerns. We will thus promote the Persian language as the language for court, literature, poetry, culture and science. Thus all men who wish to deal with us will know what language to learn."

 abm_comphrehensive_land_survey: "Comprehensive Land Survey"
 abm_comphrehensive_land_survey_desc: "In order to know who should pay tax we must first know who owns what. Thus we will organize a comprehensive land survey and then ensure it is kept up to date. We will always get the tax we are due."

 abm_counting_the_people: "Counting the People"
 abm_counting_the_people_desc: "Now that we know who owns what, the logical follow up is to get an idea of who lives where. This will allow us to know where to look when we seek men to serve in our armies."

 abm_equality_under_law: "Equality Under the Law"
 abm_equality_under_law_desc: "The growth of trade has led to the growth in a merchant class. However, the traditional landed aristocracy has been said to abuse their position and unjustly appropriate the earning of the merchants. This has to stop and from now on all people of sufficient wealth will be equal before the law."

 abm_high_court_culture: "High Court Culture"
 abm_high_court_culture_desc: "The promotion of the Persian language has over the years led to a collection of great poets and writers using the language to create works of unparalleled sophistication and artistry. People from neighboring countries marvel at the artistry of these people and already a fresh generation is preparing to write yet greater works."

 abm_sultanate_bureaucracy: "Sultanate Bureaucracy"
 abm_sultanate_bureaucracy_desc: "The Government Bureaucracy is an institution unto itself and it makes enforcing our will unnecessarily complicated. We must reform the bureaucracy to ensure that it is responsive to our will."

 abm_indian_muslim_ideas_ambition: "Indian Sultanate Ambition"
 abm_indian_muslim_ideas_ambition_desc: "Indian Sultanate Ambition"

 abm_ldk_ideas_tradition_1: "Ladakh Traditions I"
 abm_ldk_ideas_tradition_1_desc: "Ladakh Traditions I"

 abm_ldk_ideas_tradition_2: "Ladakh Traditions II"
 abm_ldk_ideas_tradition_2_desc: "Ladakh Traditions II"

 abm_ldk_two_kingdoms: "The Two Kingdoms of Ladakh"
 abm_ldk_two_kingdoms_desc: "Once Ladakh was divided into two kingdoms ruled by two brothers. One day once a fitting monarch has been born to one of the lineages these kingdoms will once again be united and a victorious new dynasty will lead our people into the future."

 abm_ldk_fortified_mountain_cities: "Fortified Mountain Cities"
 abm_ldk_fortified_mountain_cities_desc: "Our country has seen enemies come and go. From the Great Tibetan Empire to the great Karkota Kingdom of Kashmir under Lalitaditya to the Islamic raiders that now haunt us. The mountains that are our home, however, are also our castles. Let us further fortify the natural defenses that we have and never fear an invader or raider again."

 abm_ldk_wool_from_the_roof_of_the_world: "Wool from the Roof of the World"
 abm_ldk_wool_from_the_roof_of_the_world_desc: "High above the rest of the world the Ladakh plateau seemingly has little to offer compared to the fertile plains of India or even the trader cities of the Tarim Basin. For as long as anyone can remember, however, the nomadic Changpa has passed back and forth over our lands, herding their Changpa goats that give the finest wool imaginable, a highly sough after commodity to all our neighbors."

 abm_ldk_great_monasteries: "Construction of Great Monasteries"
 abm_ldk_great_monasteries_desc: "Our religious ties with Tibet has made our society stronger than our Muslim and Hindu neighbors who would control our lands to tax our trade and steal our wool. Let us further fortify the faith by constructing great monuments, Gompas and monasteries in these high mountains and by supporting the Monastic orders whenever we can."

 abm_ldk_la_dvags_rgyal_rabs: "La dvags rgyal rabs"
 abm_ldk_la_dvags_rgyal_rabs_desc: "By writing down the fates of the monarchs that has come before us we can be sure that the world will never forget the origins of our victorious dynasty. Even in a time far from now we can be sure that our royal chronicles will keep the memory of our kingdom alive. "

 abm_ldk_kingdom_united: "A Kingdom United"
 abm_ldk_kingdom_united_desc: "In order to avoid strife and discord between the many sons of our monarchs we must listen to the advice of the wise Lamas of our monasteries. Only one son must be allowed to inherit the crown while his brother may come to lead a monastery each among the many establishments in our country. In this way the family shall be able to make good use of its potential instead of squandering it squabling over the succession."

 abm_ldk_far_away_traders: "Invite Far-Away Traders"
 abm_ldk_far_away_traders_desc: "The Wool that our kingdom exports have gained greater and greater fame abroad. We have received letters from the Emperor och China as well as the Russian Tzar. We should make good use of the fame our goats have brought us and encourage the foreign trade so that we may grow rich from it."

 abm_ldk_ideas_ambition: "Ladakh Ambition"
 abm_ldk_ideas_ambition_desc: "Ladakh Ambition"

 abm_jnp_ideas_tradition_1: "Jaunpuri Traditions I"
 abm_jnp_ideas_tradition_1_desc: "Jaunpuri Traditions I"

 abm_jnp_ideas_tradition_2: "Jaunpuri Traditions II"
 abm_jnp_ideas_tradition_2_desc: "Jaunpuri Traditions II"

 abm_jnp_purbias: "Purbias"
 abm_jnp_purbias_desc: "Ever since the fall of Kannauj in the 9th century this region has been home to a great number of Rajput communities. Known as Purbias, these eastern Rajputs aren't an as dominant part of society as their cousins in Rajputana and lead a slightly different kind of life. Instead of a life on horseback the Purbias have elected to sow the fields and protect their settlements on foot. It was therefore with great joy that the Purbias greeted the advent of the firearm in the Indian subcontinent. With gunpowder weapons they have become every bit as dangerous on foot as their western cousins have on horseback. Let us send our recruiters to these villages to make good use of this free expertise."

 abm_shiraz_e_hind: "Shiraz-i Hind"
 abm_shiraz_e_hind_desc: "Ever since the days of our first independent Sultan our rulers have done their utmost to encourage scholars, holy men, poets and artists to come and settle in our fair city. Situated at the crossroad of the northern Indian trade routes, and with holy cities such as Varanasi and Prayag close by, this has not been a difficult task and as a result Jaunpur is now a blossoming intellectual environment."

 abm_jnp_sants_and_sufis: "Sants and Sufis"
 abm_jnp_sants_and_sufis_desc: "Northern India has always been a magnet for religious teachers and with the advent of independent Islamic kingdoms this tradition has been carried on by the Sufi teachers and the Sant poets. Where one represents an educated approach to Islamic mysticism the other has its roots among the lower castes, often questioning the need for rituals and clerics on the whole. Together with the more traditional Gurus these mystics provide an outlet for most religious convictions and in this diversity our region has found a certain stability."

 abm_jaunpuri_architecture: "Jaunpuri Architecture "
 abm_jaunpuri_architecture_desc: "A prioritized task for the Sultans of the newly born kingdom Jaunpur was to create an architectural style of their own, something to mark their break from the Delhi Sultanate and from earlier dynasties. In an area as rich in both resources and existing architectural styles as our kingdom this has proven easier than anyone would have imagined."

 abm_jnp_gangetic_plain: "Gangetic Plain"
 abm_jnp_gangetic_plain_desc: "The plain of the Ganges river and its tributaries is in many ways the heart of northern India. Extremely fertile and densely populated this region is the source of a large portion of the manufactured goods of the subcontinent. The many trade routes that criss-cross the region then in turn take these goods to the faraway places that demand them, from Persia to China and eventually even to Europe."

 abm_jnp_hindusthani_classical_music: "Hindustani Classical Music"
 abm_jnp_hindusthani_classical_music_desc: "Perhaps the finest of the art forms which our state has come to patronize is the northern Indian classical music tradition. Our Sultans have themselves both composed Ragas and contributed directly to the development of this musical genre."

 abm_modernization_of_jaunpuri_army: "Modernization of the Army"
 abm_modernization_of_jaunpuri_army_desc: "Old customs and traditions are holding us back. Let us reorganize our army, create new systems of recruitment and hire foreign drill instructors to train our men in a more modern fashion. Once, the Purbias made up the most efficient and modern infantry in India, we must see to it that this order of things is restored."

 abm_jnp_ideas_ambition: "Jaunpuri Ambition"
 abm_jnp_ideas_ambition_desc: "Jaunpuri Ambition"

 abm_kgr_ideas_tradition_1: "Kangra Traditions I"
 abm_kgr_ideas_tradition_1_desc: "Kangra Traditions I"

 abm_kgr_ideas_tradition_2: "Kangra Traditions II"
 abm_kgr_ideas_tradition_2_desc: "Kangra Traditions II"

 abm_kgr_katoch_lineage: "Katoch Lineage"
 abm_kgr_katoch_lineage_desc: "Few states can claim a heritage as old as ours. The Katoch have ruled for thousands of years, seen the likes of Alexander or Timur come and go and continue to play an important part in every way in our country."

 abm_kgr_riches_of_the_kangra_valley: "Riches of the Kangra Valley"
 abm_kgr_riches_of_the_kangra_valley_desc: "Legends tell of the demon Jalandhara whose head fell into the Kangra valley after a battle with Shiva. While surrounded by barren hills and high mountain our homeland is green and lush. The Kangra valley allows us to support a much greater population than our size and location would indicate but is also an enticing target for any would be conqueror."

 abm_kgr_martial_heritage: "Martial Heritage"
 abm_kgr_martial_heritage_desc: "The Martial traditions of our people go far back, and while our cousins in the Rajput states to the south may be more famous we have proven time after time that we can make life very miserable for an invader. Everyone leaves eventually."

 abm_kgr_hill_forts: "Control of the Hill Forts"
 abm_kgr_hill_forts_desc: "Our state was once built around the strong Kangra Fort and the control over the surrounding areas that it's strategic location allowed. Let us strive to control and maintain all the important forts of this wider region and control our surrounding areas in the same manner."

 abm_kgr_strengthen_the_mountain_trade: "Strengthen the Mountain Trade"
 abm_kgr_strengthen_the_mountain_trade_desc: "Not far to our south lies the fertile plains of the Punjab and yet the vast mountain and glaciers of Ladakh, Tibet and the Himalayan peaks are also quite close by. These seemingly different regions still have need for each other however. From our north comes precious woolen products that the southerners are willing to pay quite a price for, the north itself has simpler needs but still yearn for many of the more luxurious products the south can provide."

 abm_kgr_pahari_paintings: "Pahari Painting"
 abm_kgr_pahari_paintings_desc: " These mountains provides peace, quiet and an inspiring scenery to those who need it, to others they provide protection against those who have something to fear from the people of the lowlands. Let us invite and patronize the talented painters of this age, offer them shelter and let our mountain landscape inspire them to create greater works of love and our divine stories."

 abm_kgr_tigers_of_the_himalayas: "Tigers of the Himalayas"
 abm_kgr_tigers_of_the_himalayas_desc: "As time goes by our state faces newer threats, the names and religions of those who would occupy our lands may differ over time but whether Sikh, Ghurka, Timurid or Hellene we must be able to defend ourselves. Let us create a new army building upon the base of the mountain warfare we know so well yet with a healthy influx of new ideas from the various peoples that covet our lands."

 abm_kgr_ideas_ambition: "Kangra Ambition"
 abm_kgr_ideas_ambition_desc: "Kangra Ambition"

 abm_rjp_ideas_tradition_1: "Rajputana Traditions I"
 abm_rjp_ideas_tradition_1_desc: "Rajputana Traditions I"

 abm_rjp_ideas_tradition_2: "Rajputana Traditions II"
 abm_rjp_ideas_tradition_2_desc: "Rajputana Traditions II"

 abm_rjp_imperial_legacy: "Imperial Legacy"
 abm_rjp_imperial_legacy_desc: "We have revived the imperial Ambitions of the Rajputs and reclaimed Kannauj and Avanti, once again forming the empire that once ruled all of northern India. Now Rajput warriors from all over the region are flocking to our banners, ready to die for the common cause."

 abm_rjp_land_of_petty_princes: "King of Petty Princes"
 abm_rjp_land_of_petty_princes_desc: "For centuries the Rajput realms have been divided into a myriad of petty kingdoms, fighting each-other more than our common enemies. With the many princes of Rajputana now united under one banner, ready to serve one common ruler, we will be an unstoppable force."

 abm_marwari_horses: "Marwari Horses"
 abm_marwari_horses_desc: "Like their masters the Rajput cavalry horses are meticulously trained to perform on the field of battle. It is said that a Marwari horse may only leave the battlefield under one of three conditions - victory, death or carrying a wounded master to safety. By taking good care of these divine beings we ensure the everlasting dominance of our horsemen on the battlefields of India."

 abm_rjp_purbia_legacy: "Purbia Legacy"
 abm_rjp_purbia_legacy_desc: "Rajput gunners have a reputation throughout India and have at times been incorporated in many of the armies of sultanates and kingdoms alike. Now that we have united the Rajput kingdoms the experience they have with firearms will allow us to build a new type of army centered around the use of muskets, rockets and cannons."

 abm_rjp_protectors_of_the_dharma: "Protectors of the Dharma"
 abm_rjp_protectors_of_the_dharma_desc: "Few resisted outside invasions of India as much as the Rajput kingdoms of old. We are now the new bulwark of our faith, ready to defend the subcontinent from those that would impose their rule and their faith upon our people."

 abm_rjp_expanded_artillery_arm: "Expanded Artillery Arm"
 abm_rjp_expanded_artillery_arm_desc: "Sieges are what wins wars. We must experiment with ways of creating bigger and better cannon to bring down the many forts of our enemies within India and outside it."

 abm_rjp_monumental_architecture: "Monumental Architecture"
 abm_rjp_monumental_architecture_desc: "A new empire requires a new style. We must build upon the classical monumental architecture of Rajputana and Imperial Kannauj to create a new style worthy of our growing empire."

 abm_rjp_ideas_ambition: "Rajputana Ambition"
 abm_rjp_ideas_ambition_desc: "Rajputana Ambition"

 abm_rajput_ideas_tradition_1: "Rajput Traditions I"
 abm_rajput_ideas_tradition_1_desc: "Rajput Traditions I"

 abm_rajput_ideas_tradition_2: "Rajput Traditions II"
 abm_rajput_ideas_tradition_2_desc: "Rajput Traditions II"

 abm_clan_loyalties: "Clan Loyalties"
 abm_clan_loyalties_desc: "The influence of our clan extends far beyond our own borders. We are able to draw upon the Rajputs of our clan from all over northern India when filling the ranks of our armies."

 abm_fortifying_rajputana: "Fortifying Rajputana"
 abm_fortifying_rajputana_desc: "The lands of Rajputana can be harsh and unforgiving. The only way to achieve lasting control of many of these areas is through control of the impressive fortresses that exist in the region. The repair, maintenance and construction of these forts should be our priority."

 abm_rajput_resistance: "Rajput Resistance"
 abm_rajput_resistance_desc: "Rajput bards tell stories of our people's many battles against foreign invaders and how our ancestors would rather die than admit themselves defeated. We must encourage this spirit of unity and give the bards reason to write new ballads of bravery in the face of death."

 abm_rajput_painting_school: "Create Rajput Painting School"
 abm_rajput_painting_school_desc: "Rajput painters already have an excellent reputation. We must encourage our artists to develop their skills and add to the glory of our dynasty by creating a school of painting particular to our state."

 abm_rajput_martial_ethos: "Martial Ethos"
 abm_rajput_martial_ethos_desc: "The upbringing and traditions of Rajput warriors ensure a wide base for recruiting officers to lead our armies. In order to capitalize on this we should ensure that career opportunities are abound to encourage all these promising young men to serve as officers both in our own armies and abroad."

 abm_marwari_trading_houses: "Rajput Trading Houses"
 abm_marwari_trading_houses_desc: "Throughout the years migratory Rajput traders have traveled the roads of Hindustan. These entrepreneurs must be encouraged and given incentives to grow their enterprises. Soon our clan-members will have established trading houses all over India."

 abm_rajput_ideas_ambition: "Rajput Ambition"
 abm_rajput_ideas_ambition_desc: "Rajput Ambition"

 abm_gujarati_ideas_tradition_1: "Gujarati Princedom Traditions I"
 abm_gujarati_ideas_tradition_1_desc: "Gujarati Princedom Traditions I"

 abm_gujarati_ideas_tradition_2: "Gujarati Princedom Traditions II"
 abm_gujarati_ideas_tradition_2_desc: "Gujarati Princedom Traditions II"

 abm_guj_kathiawari_horses: "Kathiawari Horses"
 abm_guj_kathiawari_horses_desc: "The horses bred on the Kathiawar peninsula are particularly suited to desert warfare. They are able to endure scorching heat, require minimal feeding, and are able to endure journeys over great distances. We must ensure that there are always enough of these steeds for our cavalrymen to ride into battle."

 abm_guj_trading_outposts: "Establish New Trading Ports"
 abm_guj_trading_outposts_desc: "The proximity of the west Indian coast to Arabia opens up opportunities for trade. Merchants being as fickle as they are, we need not conquer existing trading hubs to attract their attention. If we establish our own trading posts and enact policies favorable to foreign merchants, they can be persuaded to do business with us instead of our rivals."

 abm_guj_jain_bankers: "Safe Harbor for Jain Bankers"
 abm_guj_jain_bankers_desc: "The Jains continue to be persecuted throughout much of India, but they shall find a safe haven in the Gujarati kingdoms. Fair treatment of the Jain community has won us the respect of wealthy Jain banking families, who are prepared to offer favorable interest rates to our nation."

 abm_guj_rajput_dynasties: "Rajput Dynasties"
 abm_guj_rajput_dynasties_desc: "Rajput clans have entrenched themselves in Gujarati politics. Their ancient customs and feuds are often a source of tension, but they also lend us credence as a nation relevant to the wider political world."

 abm_guj_protect_dwarkadhish_temple: "Protect the Dwarkadhish Temple"
 abm_guj_protect_dwarkadhish_temple_desc: "One of the most important pilgrimage sites in the Hindu faith, the Dwarkadhish Temple is dedicated to the god Krishna. Regardless of its present custodian, all the Gujarati kingdoms have a responsibility to ensure that it is not sacked or looted by foreign invaders. Fulfilling this duty ensures the continued faith and loyalty of our Hindu subjects."

 abm_guj_ashapura_mata: "Ashapura Mata"
 abm_guj_ashapura_mata_desc: "Worship of the goddess Ashapura Mata is almost exclusive to Gujarat. She is regarded as the guardian deity of the region, and so respect must be paid to her if we wish our rule to be seen as legitimate by the Gujarati people."

 abm_guj_african_trade: "Extend Trade Routes to Africa"
 abm_guj_african_trade_desc: "Gujarati traders have established trading routes that extend to the far corners of Asia. Some have even found their way to East Africa, where they trade in ivory, gold, and slaves. We must ensure that the riches of Africa find their way into our coffers."

 abm_gujarati_ideas_ambition: "Gujarati Princedom Ambition"
 abm_gujarati_ideas_ambition_desc: "Gujarati Princedom Ambition"

 abm_snd_ideas_tradition_1: "Sindhi Traditions I"
 abm_snd_ideas_tradition_1_desc: "Sindhi Traditions I"

 abm_snd_ideas_tradition_2: "Sindhi Traditions II"
 abm_snd_ideas_tradition_2_desc: "Sindhi Traditions II"

 abm_snd_enduring_dynasty: "Enduring Samma Dynasty"
 abm_snd_enduring_dynasty_desc: "Sindh's Samma dynasty has stood the test of time. Tracing their descent to legendary Rajput warriors, they have endured the rule of the Delhi Sultans for over a century. Now that Delhi has collapsed, the ambitions of the Samma dynasty can finally be realized."

 abm_snd_bab_ul_islam: "Bab ul Islam"
 abm_snd_bab_ul_islam_desc: "As one of the first in India to accept the word of the Prophet, the rulers of Sindh carry the duty of spreading the wisdom of the Quran to the people. Along the Indus river we have already been successful in this task, but now we must look beyond our borders for new kafirs to convert."

 abm_snd_gujarati_connections: "Strengthen Gujarati Connections"
 abm_snd_gujarati_connections_desc: "Our nations fortunes are tied both politically and economically to those of Gujarat. We must develop strong ties with Gujarat's most influential merchants to ensure that we are extracting maximum profit from trade in both the Arabian sea and along the Indus river."

 abm_snd_makli_necropolis: "Expand the Makli Necropolis"
 abm_snd_makli_necropolis_desc: "The Makli Necropolis is the site of the Tomb of Shaikh Jamali, a renowned Sufi saint. Since his death, the rulers of Thatta have begun a tradition of constructing new tombs for themselves on the Makli Hill in the hope that proximity to the venerated saint will improve their standing with Allah. We must continue to add new monuments to the Necropolis."

 abm_snd_end_judicial_corruption: "End Judicial Corruption"
 abm_snd_end_judicial_corruption_desc: "It has come to our attention that judicial authorities are taking payments from plaintiffs and defendants alike to secure favorable verdicts. They claim that they are forced to do this to augment their meager incomes. Upon review, it seems that we are indeed underpaying these authorities. A general rise in pay for public workers should reduce instances of corruption in our government."

 abm_snd_oversee_rise_of_thatta: "Oversee the Rise of Thatta"
 abm_snd_oversee_rise_of_thatta_desc: "The city of Thatta has the potential to be a great center of culture and trade. We must invent in its infrastructure, its economy, and its religious institutions."

 abm_snd_recruit_baloch_tribesmen: "Recruit Balochi Tribesmen"
 abm_snd_recruit_baloch_tribesmen_desc: "The tribes of Baluchistan have been both enemies and allies of Sindh for generations, their allegiances shifting with the sands. We should approach some of the tribes with an offer; we will pay them well to fight for us, so long as the tribes remain on friendly terms with our nation."

 abm_snd_ideas_ambition: "Sindhi Ambition"
 abm_snd_ideas_ambition_desc: "Sindhi Ambition"

 abm_guj_ideas_tradition_1: "Gujarat Sultanate Traditions I"
 abm_guj_ideas_tradition_1_desc: "Gujarat Sultanate Traditions I"

 abm_guj_ideas_tradition_2: "Gujarat Sultanate Traditions II"
 abm_guj_ideas_tradition_2_desc: "Gujarat Sultanate Traditions II"

 abm_garba: "Garba!"
 abm_garba_desc: "Originating out of the worship of the Hindu Goddess Ambaji by women through dance, our people have refined a new and very graceful form of dance called the Garba. The basics of the dance are singing and clapping rhythmically in a circular formation. Today, our men and women gather together to use this dance to celebrate any occasion with great fervor, coming together as a community and wearing exquisitely embroidered outfits. All of us together, young and old, peasant and prince, Muslim and Hindu, dancing in an ever growing circle."

 abm_jain_routes: "Jain Connections"
 abm_jain_routes_desc: "Jainism is an ancient way of life, put into its current form by Mahavira (599 BCE – 527 BCE). For a thousand years, Gujarat has been the stronghold of the Jain community and faith, with many holy sites and temples. Royal dynasties have patronized the religion, forming a common community with Hindus. Muslim invasions from the east, by Mahmud Ghazni (1001 CE) and Mohammad Ghori (1175 CE), oppressed the Jaina community, vandalizing temples or converting them into mosques, as well as having burned Jaina libraries. However, the Jains of Gujarat have survived, adapted and prospered, using their connections with Jain communities across the world to serve as a hub for both the faith and commerce."

 abm_gujarati_lipi: "Gujarati Lipi"
 abm_gujarati_lipi_desc: "In the late 16th century, Gujarati Lipi, a new script and writing system was developed. It was developed by mercantile interests and became also known as the saraphi (bankers), vaniasai (merchants) or mahajani (traders) script, due to its association with commerce. It's use became widespread rapidly throughout Gujarat, Kutch and Sindh, to represent those languages, study Sanskrit and became adopted by the Zoroastrian Community to write Avestan. It provided a common writing system for many different communities, binding them together as well as facilitating unity and a common identity."

 abm_merchant_diaspora: "Gujarati Merchant Diaspora"
 abm_merchant_diaspora_desc: "There is nowhere our people do not trade! On every shore our people pursue commerce, following the trade winds... our fleets sail to and fro seeking new opportunities. Our merchants know the craft and value of making good and hardy ships on a merchant's budget."

 abm_spice_trade: "Hub of the Indian Ocean Trade"
 abm_spice_trade_desc: "Due to the nature of the monsoon trade winds and its geographic location, Gujarat has long served as the hub of all trade in the Indian Ocean going east. Gujarat is an essential intermediary in east–west trade, between the Red Sea, Egypt and Malacca: Gujarati merchants were important middlemen bringing spices from the Mallaku Islands as well as silk from China, and then selling them to the Egyptians and Arabs."

 abm_western_factors: "Foreign Merchants set up Factories"
 abm_western_factors_desc: "Following Arabs and Portuguese in the early 17th century, the British East India Company established a factory in Gujarati land in 1614. Many foreigners from the west are coming to our lands to purchase our goods wholesale in ever greater quantities... this can only have a good outcome! Right?"

 abm_guj_africa: "Gujarati Diaspora Descends on Africa"
 abm_guj_africa_desc: "The beginning of the 19th century saw tens of thousands of Gujaratis move to Africa to work as mercantile middle-men between the colonial powers and the indigenous populations with whom they already had trading relationships. Our people are establishing permanent trading communities and sending the wealth home."

 abm_guj_ideas_ambition: "Gujarat Sultanate Ambition"
 abm_guj_ideas_ambition_desc: "Gujarat Sultanate Ambition"

 abm_mer_ideas_tradition_1: "Mewari Traditions I"
 abm_mer_ideas_tradition_1_desc: "Mewari Traditions I"

 abm_mer_ideas_tradition_2: "Mewari Traditions II"
 abm_mer_ideas_tradition_2_desc: "Mewari Traditions II"

 abm_mer_rajput_heartland: "Rajput Heartland"
 abm_mer_rajput_heartland_desc: "Mewar is both the geographical and political heart of Rajput culture. Rajputs throughout India look to us for guidance and grounding in our time-honored traditions."

 abm_mer_victory_tower: "Construct the Victory Tower"
 abm_mer_victory_tower_desc: "In our capital we shall construct an imposing tower that will dominate the landscape. Adorned with icons of the gods and inscriptions telling our noble deeds, the Tower of Victory will be a symbol of our endless quest for glory."

 abm_mer_kumbhalgarh: "The Fort of Kumbhalgarh"
 abm_mer_kumbhalgarh_desc: "Chittorgarh remains our largest and most vital fort, but we must not neglect the defenses of the rest of the realm. We must hire the most skilled architects to design impregnable forts throughout our kingdom, beginning with the strategic site of Kumbhalgarh. The immensely long walls that will be needed to protect the area make this an ambitious project, but our determination to defend our people shall ensure that it is done."

 abm_mer_city_of_lakes: "City of Lakes"
 abm_mer_city_of_lakes_desc: "Guided by the blessings of a wise hermit, our rulers have decided that it is time to build a magnificent new capital for our nation. Using dams to control the flow of the rivers, we shall create several artificial lakes from which we can draw fresh water for Udaipur, appropriately named the City of Lakes."

 abm_mer_recall_purbias: "Recall the Purbias"
 abm_mer_recall_purbias_desc: "The Rajputs have spread themselves throughout northern India in their pursuit of glory for their clan. It is time that we reminding them of their duty to their ancestral homeland; we shall send out word that all loyal Rajputs should come to serve at Mewar."

 abm_mer_firearm_drilling: "Mandatory Firearm Drills"
 abm_mer_firearm_drilling_desc: "Many Rajput soldiers have become experts in the use of personal firearms. We must put these hardened veterans to work training the next generation of soldiers rather than risking the loss of their expertise in battle. All of our soldiers must be drilled in firearms tactics before they are expected meet our enemies on the front line."

 abm_mer_reorganized_rajput_regiments: "Reorganized Rajput Regiments"
 abm_mer_reorganized_rajput_regiments_desc: "Traditional clan structures are an excellent foundation for a modernized regimental system. Existing hierarchies based on kinship and unconditional loyalty can be easily translated into an organized and formal chain of command."

 abm_mer_ideas_ambition: "Mewari Ambition"
 abm_mer_ideas_ambition_desc: "Mewari Ambition"

 abm_mar_ideas_tradition_1: "Maratha Traditions I"
 abm_mar_ideas_tradition_1_desc: "Maratha Traditions I"

 abm_mar_ideas_tradition_2: "Maratha Traditions II"
 abm_mar_ideas_tradition_2_desc: "Maratha Traditions II"

 abm_tradition_of_military_service: "Tradition of Military Service"
 abm_tradition_of_military_service_desc: "Maratha cavalrymen have a long tradition of service as 'Bargirs' for the Deccan sultanates. The increased militarization of the Deccan due to the many wars fought in the area has made our cavalry one of the most dangerous forces in India."

 abm_forts_of_maharashtra: "Forts of Maharashtra"
 abm_forts_of_maharashtra_desc: "In these hilly and densely forested lands keeping many and well maintaned forts is a necessity for offense as well as defense. Keeping our many forts well maintained should be a top priority."

 abm_peasant_soldiers: "Peasant Soldiers"
 abm_peasant_soldiers_desc: "The villages of the Desh are full with able men who would be more than willing to serve in our armies. Let us train and recruit all Marathi speakers to serve in our armies."

 abm_office_of_the_peshwa: "Office of the Peshwa"
 abm_office_of_the_peshwa_desc: "Let us create an office entirely devoted to the running of our state and its armies. With a skillfull minister in charge, the Peshwa, our country will be versatile enough to expand quickly and efficiently."

 abm_encourage_ties_with_brahmin_financial_families: "Strengthen ties with Brahmin Financial Families"
 abm_encourage_ties_with_brahmin_financial_families_desc: "The financial sector of our state is dominated by Brahmin banking families. Let us integrate them further in our state by hiring them as tax collectors, creating regulations to strengthen their rights and protect their traditions. We will have gained the favor of our financiers as well as access to able and learned administrators."

 abm_reform_the_bureaucracy: "Reform The Bureaucracy"
 abm_reform_the_bureaucracy_desc: "A growing state needs a bureaucracy capable of quickly assessing new lands. We must expand and differentiate our bureaucracy, reexamining any demands on revenue and quickly assess the demands and worth of new lands."

 abm_expand_maratha_navy: "Expand Maratha Navy"
 abm_expand_maratha_navy_desc: "Westerners and Muslims cannot be allowed to dominate the Indian Ocean. We must endevour to expand our navy and create viable naval bases along our western coast."

 abm_mar_ideas_ambition: "Maratha Ambition"
 abm_mar_ideas_ambition_desc: "Maratha Ambition"

 abm_dhu_ideas_tradition_1: "Dhundhari Traditions I"
 abm_dhu_ideas_tradition_1_desc: "Dhundhari Traditions I"

 abm_dhu_ideas_tradition_2: "Dhundhari Traditions II"
 abm_dhu_ideas_tradition_2_desc: "Dhundhari Traditions II"

 abm_dhu_improve_amer_fort: "Improve the Fort at Amer"
 abm_dhu_improve_amer_fort_desc: "Amer Fort has fallen into disrepair. As both the seat of our government and the most important fortification in our nation, it must be renovated as a matter of urgency. As we do so, the Palace would benefit from a touch of grandeur as well."

 abm_dhu_seek_protection_of_great_powers: "Seek the Protection of Great Powers"
 abm_dhu_seek_protection_of_great_powers_desc: "Dhundar faces threats from many directions. Alone we are vulnerable, but through skillful diplomacy we can make powerful friends. We should seek to marry into the dynasties of great powers and secure a place as part of the new world they are building."

 abm_dhu_restore_hindu_ceremonies: "Restore Hindu Ceremonies"
 abm_dhu_restore_hindu_ceremonies_desc: "Several Hindu ceremonies have been neglected throughout India for centuries. Why have we forgotten Ashvamedha, the horse sacrifice? Do we think ourselves so pure that we need not perform the Vajapeya fire rituals? These traditions must be renewed at once."

 abm_dhu_foundation_of_jaipur: "Found the city of Jaipur"
 abm_dhu_foundation_of_jaipur_desc: "Rajasthan lacks any truly great city. Given the difficult conditions in the region, it is not hard to see why previous rulers have been unable to create a truly impressive capital. Our ambition however is greater, our architects more skilled, and our knowledge of commerce more complete. We shall found Jaipur within Dhundar province, and it shall be the jewel of all Rajasthan."

 abm_dhu_battles_in_foreign_lands: "Battles in Foreign Lands"
 abm_dhu_battles_in_foreign_lands_desc: "Our service to mighty emperors takes our generals to the far corners of India. They return having fought in glorious and bloody battles, bringing with them wisdom and expertise."

 abm_dhu_astronomical_education: "Astronomical Education"
 abm_dhu_astronomical_education_desc: "Our astronomers take an outrageous amount of time to determine matters as simple as when would be the most auspicious time for a man to begin a great journey. Clearly our nation is in dire need of education in matters astronomical. We must fund the construction of many new observatories and patronize the teaching of astronomy to as many of our people as possible."

 abm_dhu_recruit_from_the_pindari: "Pindari Mercenaries"
 abm_dhu_recruit_from_the_pindari_desc: "Pindari horseman make curious mercenaries, as they prefer to be paid not in coin but in the right to plunder. Hiring these men will not make us popular with those whose lands we plunder, but their effectiveness cannot be denied. They have a particular skill for foraging the land, improving our ability to supply our armies."

 abm_dhu_ideas_ambition: "Dhundhari Ambition"
 abm_dhu_ideas_ambition_desc: "Dhundhari Ambition"

 abm_lna_ideas_tradition_1: "Lan Na Traditions I"
 abm_lna_ideas_tradition_1_desc: "Lan Na Traditions I"

 abm_lna_ideas_tradition_2: "Lan Na Traditions II"
 abm_lna_ideas_tradition_2_desc: "Lan Na Traditions II"

 abm_legacy_of_mangrai: "Legacy of Mangrai"
 abm_legacy_of_mangrai_desc: "Before his death by lightning strike, the legendary King Mangrai created most of the institutions of our kingdom. We still strive to emulate his example."

 abm_million_ice_paddies: "A Million Rice Paddies"
 abm_million_ice_paddies_desc: "Just as a Pan-Na is a thousand rice paddies, a Lan-Na is one million. A nation so blessed readily yields all the food and wealth it needs."

 abm_waters_of_the_naga: "Waters of the Naga"
 abm_waters_of_the_naga_desc: "It is said that the waters of the Mae Kong River have their origins in a great benevolent serpent. Whatever the truth, they provide our realm with great fertility and abundance."

 abm_the_white_elephant: "The White Elephant"
 abm_the_white_elephant_desc: "Half the relic of Sumanathera was carried by a white elephant to the top of the mountain, where it stopped and fell dead. Here the king instantly ordered a great temple be constructed."

 abm_red_and_black: "Red and Black Vassals"
 abm_red_and_black_desc: "Our kingdom has long brought in tribute from smaller realms to the east and south. We can slowly assimilate them under our control."

 abm_elephant_charge: "Elephant Charge"
 abm_elephant_charge_desc: "Elephants are a potent weapon of war, and we would be wise to use them to scatter and destroy the armies of our enemies."

 abm_dynastic_spread: "Dynastic Spread"
 abm_dynastic_spread_desc: "We must do what we can to intertwine our great families with the dynasties of neighboring states. This will both help us achieve our goals and gain us valuable friendships in the long run."

 abm_lna_ideas_ambition: "Lan Na Ambition"
 abm_lna_ideas_ambition_desc: "Lan Na Ambition"

 abm_lig_ideas_traditions_1: "Ligori Traditions I"
 abm_lig_ideas_traditions_1_desc: "Ligori Traditions I"

 abm_lig_ideas_traditions_2: "Ligori Traditions II"
 abm_lig_ideas_traditions_2_desc: "Ligori Traditions II"

 abm_autonomous_subject: "Autonomous Subject"
 abm_autonomous_subject_desc: "We have earned our freedom as a mueang, or city state, and are no longer under the government of the Siamese kingdoms. Being our own nation has brought the attention of the rest of the South-East to us. And that is how it should be."

 abm_religious_conversion: "Buddhist Conversion"
 abm_religious_conversion_desc: "Tradition is what makes us stronger. Ligor should stand out as the last bastion against the Islamic sultanates that are taking over Nusantara. It is our duty to share the wise teachings of Lord Buddha with the rest of the world."

 abm_vassal_cities: "Vassal Cities"
 abm_vassal_cities_desc: "As a mueang, in Ligor we can mantain our own dynasty and have vassal states of our own. If we want to expand our influence, looking for other mueangs in the Malay peninsula to annex seems like a good place to start."

 abm_trade_primacy: "Trade Primacy"
 abm_trade_primacy_desc: "We should take advantage of our seafaring tradition and focus on maritime trade. We need to think big, so looking at the new merchants coming from the East is by no means a bad idea."

 abm_bridge_to_malaya: "Bridge to Siam"
 abm_bridge_to_malaya_desc: "Siam and Ligor were once part of the same empire and our ties have not yet faded. We should seek protection in their diplomatic importance while remaining our own nation. Ancient allies must never be dismissed."

 abm_spirit_of_rebellion: "Rebellious Spirits"
 abm_spirit_of_rebellion_desc: "Ours is a nation of uprising and rebellion. Nor Ligor nor its people must not be easily governed. Everything comes with a price."

 abm_trade_protection: "Protect Ligori Trade"
 abm_trade_protection_desc: "Our ships are the pride of our nation, and without them our trade would be lost. Protecting them to ensure a good arrival in port must be a top priority."

 abm_lig_ideas_ambition: "Ligori Ambition"
 abm_lig_ideas_ambition_desc: "Ligori Ambition"

 abm_ark_ideas_traditions_1: "Arakanese Traditions I"
 abm_ark_ideas_traditions_1_desc: "Arakanese Traditions I"

 abm_ark_ideas_traditions_2: "Arakanese Traditions II"
 abm_ark_ideas_traditions_2_desc: "Arakanese Traditions II"

 abm_mrauk_u_dynasty: "Mrauk U Dynasty"
 abm_mrauk_u_dynasty_desc: "With the ascension of Min Saw Mon on the Arakanese throne a new era has begun. Our royal dynasty has ties far into the past yet the move of our capital to Mrauk-u promises great new things for our kingdom and people. The Arakanese Chronicle will forever tell this story of our line and our people to future descendants."

 abm_rohingya_immigrants: "Rohingya Immigrants"
 abm_rohingya_immigrants_desc: "The Bengali Sultanate is an influential neighbor, both culturally economically and as a military force in our region. As a neighboring kingdom we would be wise to integrate any Bengali immigrants into our society and open our minds to their ideas and their faith."

 abm_bengal_bay_trade: "Bay of Bengal Trade"
 abm_bengal_bay_trade_desc: "The bay of Bengal is a rich trading hub around which everything in this region revolves and Arakan's position is quite close to its center. We must make good use of this position and do what we can to encourage Arakan's growing role in international trade."

 abm_magh_and_ferenghi: "Magh and Ferenghi"
 abm_magh_and_ferenghi_desc: "The rich trade ports of the Bengal delta are full of easy pray for pirates. This has attracted adventurers from our lands as well as from far away places such as India or even Europe. We should welcome these pirates and allow them to use our country as a base for their raids on the ports of our enemies."

 abm_buddhist_sultans: "Buddhist Sultans"
 abm_buddhist_sultans_desc: "Arakan has never been a Muslim nation, yet the monarch has styled himself a Sultan. Making sure that we act as a part of the greater Indo-Persian world and keeping track of the court culture of our Muslim neighbors can be quite beneficial."

 abm_muslim_advisers: "Muslim Advisors"
 abm_muslim_advisers_desc: "The Sultan takes advice from Muslims who have had experience in the courts of India. Looking abroad for outstanding courtiers can only bring good things."

 abm_trade_contracts_ark: "Arakanese Trade Contracts"
 abm_trade_contracts_ark_desc: "Complex trade contracts made with other nations give an impression of sophistication and encourage foreign merchants to trade in our cities"

 abm_ark_ideas_ambition: "Arakanese Ambition"
 abm_ark_ideas_ambition_desc: "Arakanese Ambition"

 tau_traditions_1: "Burmese Traditions I"
 tau_traditions_1_desc: "Burmese Traditions I"

 tau_traditions_2: "Burmese Traditions II"
 tau_traditions_2_desc: "Burmese Traditions II"

 mandala_system: "Mandala System"
 mandala_system_desc: "The relationship between the lord and his vassals in Southeast Asia is defined as 'mandala', the circle. While the lord controlled the country from the center, the vassals would have greater independence. If the personal relation between us and our vassals are beneficial, then our tributaries will pay tribute to us and would also help us with providing men in time of war."

 tau_elephant_battles: "Elephant Warfare"
 tau_elephant_battles_desc: "The dense jungles of South-East Asia are difficult for horses to traverse, and so we have traditionally trained elephants as mounts for our greatest commanders. We must expand the Royal Stables so that we can field hundreds of these mighty beasts in our armies."

 nat_worship: "Nat Worship"
 nat_worship_desc: "Nats are Burmese spirits revered often in conjunction with Buddhist practice. The 37 Great Nats and other small spirits are worshiped, especially in rural areas. This popular religious custom unites our diverse subjects together."

 chakravartin: "Chakravartin"
 chakravartin_desc: "The Chakravartin is an ideal universal ruler in both Hinduism and Buddhism, one who rules ethically and benevolently over the entire world. It is a symbol of not only spiritual kingship and leadership, but also temporal as well."

 the_hluttaw: "The Hluttaw"
 the_hluttaw_desc: "The 'Hluttaw', the royal release, is the central council of ministers in our court. Its fiscal, executive, and judicial branches are the administrative organs of our nation."

 tau_organized_campaigns: "Organized Military Campaigns"
 tau_organized_campaigns_desc: "To reach our enemies we must often travel great distances across harsh terrain. We must plan our campaigns far in advance, making sure that we are well supplied and that conditions in the camps do not ferment disease or desertion. With these preparations in place we will march our armies into Siam and beyond!"

 bayingyi: "Bayingyi"
 bayingyi_desc: "The Europeans have begun to appear in our realm. If we settle and grant them land, those 'Bayingyi' would be willing serve us as soldiers of our army."

 tau_ambition: "Burmese Ambition"
 tau_ambition_desc: "Burmese Ambition"

 abm_peg_ideas_traditions_1: "Pegu Traditions I"
 abm_peg_ideas_traditions_1_desc: "Pegu Traditions I"

 abm_peg_ideas_traditions_2: "Pegu Traditions II"
 abm_peg_ideas_traditions_2_desc: "Pegu Traditions II"

 abm_riches_of_pegu: "Riches of Pegu"
 abm_riches_of_pegu_desc: "At the mouth of the Irrawaddy river our ports are the natural entrepots for all the goods of Upper Burma. Jewels, rubies, elephants, teak, musk and other precious goods are shipped through our ports to China, India and even further west. The riches of our great city are such that the reflection of the smallest glimpse of light from our gilded cloth and walls may blind the unaware traveler at night."

 abm_martabans: "Martabans"
 abm_martabans_desc: "Our country is famed for the vases and jars we produce from the clay and sands of our riverbanks. Martaban vases are used all over South East Asia, both ashore and on ships to store the water necessary for longer voyages."

 abm_dhammazedi_pyatton: "Dhammazedi Pyatton"
 abm_dhammazedi_pyatton_desc: "Our rulers pride themselves to always be both fair and careful when dispensing the justice of the state. For this purpos they all educate themselves fully in all matters related to law and religion and their wise rulings have become widely known both here and abroad. Let us create collections of these rulings so that even the most distant local courts may benefit from the wisdom of the throne."

 abm_rammanadesa: "Ramannadesa"
 abm_rammanadesa_desc: "The history of the Mon people in this region goes over a thousand years back in time. The Mon or Ramans have lived here long before many of the groups that would now seek to control it. Let us seek inspiration in the old legends of our country and find cherish our ancient traditions."

 abm_dynamic_warfare: "Dynamic Warfare"
 abm_dynamic_warfare_desc: "Our military traditions have served us well over the years but there are things we might learn from outsiders. Let us invite foreign officers from far and near. From France to the closer Shan states there are techniques and weapons we have not yet mastered that we would do well to incorporate."

 abm_buddhist_traditions: "Buddhist Kingship"
 abm_buddhist_traditions_desc: "The Mon monarchy has always been strongly tied to the Theravada traditions of our people and in this country even a Monk might be king. Let us never forget this historical strength and do what we can to uphold the moral of our religious community or risk being deposed as an unworthy ruler."

 abm_mon_diaspora: "Mon Diaspora"
 abm_mon_diaspora_desc: "Over the centuries of fighting over the riverine landscape of Lower Burma many of the Mon people have fled to other parts of Asia. Mon traders, soldiers and monks play a role in the domestic politics of many of our neighbors and now that we have consolidated our hold over the Mon homelands we may use their influence to our advantage."

 abm_peg_ideas_ambition: "Pegu Ambition"
 abm_peg_ideas_ambition_desc: "Pegu Ambition"

 abm_lao_ideas_traditions_1: "Lao Traditions I"
 abm_lao_ideas_traditions_1_desc: "Lao Traditions I"

 abm_lao_ideas_traditions_2: "Lao Traditions II"
 abm_lao_ideas_traditions_2_desc: "Lao Traditions II"

 lao_phra_lak_phra_lam: "Phra Lak Phra Lam"
 lao_phra_lak_phra_lam_desc: "The national epic of our people tells the story of the two brothers Phra Lak and Phra Ram and is ever present in our culture, from dances and drama to songs, paintings sculptures or manuscripts. The two brothers are the epitome of moral leadership, ethics, selflessness, and living true to Dharma and remain the foremost role model for every member of our people from the peasants to the rulers themselves."

 lao_nithan_khun_borom: "Nithan Khun Borom"
 lao_nithan_khun_borom_desc: "The legendary ancestor of our people, Khun Borom was sent by his father Indra, the king of gods to be the ruler of the Tai people. Khun Borom ruled the Tai people for 25 years and taught them to use new tools and other arts. Khun Borom then divided the Tai kingdom among his seven sons, giving each one of them a portion of the kingdom to rule. Thus Laos was born and this divine ancestry sets us apart from other peoples"

 lao_satsana_phi: "Satsana Phi"
 lao_satsana_phi_desc: "The Phi are the tutelary gods of our people. Belief in these ancestral spirits live on side by side with religions such as Buddhism and Hinduism in our lands and this syncretism strengthens our state and its ability to harbor citizens of many faiths."

 lao_elephant_cavalry: "Laotian Elephant Cavalry"
 lao_elephant_cavalry_desc: "Although elephants were used in other areas of the world in warfare, nowhere are they used in such numbers as here. In Laos, They are the key element of warfare and their numbers reach into the thousands. Allowing us to deliver devastating charges even in the thick jungles of South East Asia."

 lao_southern_silk_road: "Southern Silk Road"
 lao_southern_silk_road_desc: "Lao people live at the center of the overland trade routes in Southeast Asia. In the south trade flows down the Mekong to Vientiane. In the north and northwest the overland trade routes from Burma and Lan Na pass toward Yunnan, where they join with the Chinese Southern Silk Road. We have to capitalize on these riches and build a state that can thrive on the trade that is brought to us."

 lao_hill_warriors: "Laotian Hill Warfare"
 lao_hill_warriors_desc: "Our people live on the highlands between dangerous and countless kingdoms if we are not prepared to defend our homeland ferociously we will easily come to be ruled by others."

 abm_lao_ideas_ambition: "Lao Ambition"
 abm_lao_ideas_ambition_desc: "Lao Ambition"

 abm_cha_ideas_traditions_1: "Cham Traditions I"
 abm_cha_ideas_traditions_1_desc: "Cham Traditions I"

 abm_cha_ideas_traditions_2: "Cham Traditions II"
 abm_cha_ideas_traditions_2_desc: "Cham Traditions II"

 abm_my_son_temples: "Memory of the My Son Temples"
 abm_my_son_temples_desc: "The Great Temple Complex of our ancestors at My Son have been a part of royal traditions and ceremonies for centuries. When the Temples where lost by us to outside forces they have fell into disrepair and ruin. Now their memory is a symbol of what our civilization once achieved and what we must strive to live up to."

 abm_seafaring_people: "Seafaring People"
 abm_seafaring_people_desc: "Seafaring People"

 abm_indian_influences: "South Indian Connections"
 abm_indian_influences_desc: "Through our culture and history our people is tied to India and the greater Indian World. Our familiarity with their culture is of great help when dealing with the Tamil and Telugu Maritime Traders and Merchants of South East Asia."

 abm_cham_migrations: "Cham Migrations"
 abm_cham_migrations_desc: "Our people have come to be more and more marginalized in many of the regions that where once under Champa control. As a result they are now migrating to new lands. For some the Cham diaspora has meant settling in Khmer lands, others move to the islands. While this is far from an organized movement of people if we provide them with places to settle they will surely prefer to do so under our protection over moving into the lands of our neighbors."

 abm_che_man_legacy: "Che Man's Legacy"
 abm_che_man_legacy_desc: "While we have been driven south by the Dai Viet our people was once said to cooperate with them. Let us aim to once again put our differences aside, or at least find new friends to protect us."

 abm_agarwood: "Agarwood"
 abm_agarwood_desc: "The ships that trafic our rivers bring us the rare Agarwood that is so highly sought abroad. We must do what we can to uphold this monopoly and make sure that we are the only source of the finest varieties."

 abm_resisting_foreign_rule: "Resisting Foreign Rule"
 abm_resisting_foreign_rule_desc: "Our people are surrounded on all sides by different religions, cultures and societies. While we have thrived under these circumstances in the past it is said that many now wish our demise. We must fortify our cities and be prepared for whatever our enemies may have in store for us."

 abm_cha_ideas_ambition: "Cham Ambition"
 abm_cha_ideas_ambition_desc: "Cham Ambition"

 abm_lxa_ideas_traditions_1: "Lan Xang Traditions I"
 abm_lxa_ideas_traditions_1_desc: "Lan Xang Traditions I"

 abm_lxa_ideas_traditions_2: "Lan Xang Traditions II"
 abm_lxa_ideas_traditions_2_desc: "Lan Xang Traditions II"

 abm_lao_ethnic_diversity: "Laotian Ethnic Diversity"
 abm_lao_ethnic_diversity_desc: "The Mekong river basin forms the political and economic artery of the Kingdom of Lan Xang. This rich fertile land crisscrossed with rivers has attracted many different peoples to migrate through these areas over the centuries, resulting in a uniquely diverse country of mixed traditions and cultures."

 abm_elephant_cavalry: "Elephant Cavalry"
 abm_elephant_cavalry_desc: "Although elephants were used in other areas of the world in warfare, nowhere were they used in such numbers as in South East Asia. The Kingdom of Lan Xang fielded as many as two thousand elephants in some campaigns, making these animals a key component of the region's military tradition."

 abm_court_history_of_lang_xang: "Court History Of Lan Xang"
 abm_court_history_of_lang_xang_desc: "The institution of court chronicles plays an important role in the preservation of the cultural memory of the Laotian people and allows us to draw a line of continuation between our cultural mythology and the present day political situation. This can be very useful in many situations, from supporting the ruling dynasty to justifying alliances or wars."

 abm_white_elephant: "White Elephant"
 abm_white_elephant_desc: "We have gained a white elephant, this is a very auspicious omen and we will use this to our advantage. With this prestige we will use it to overhaul the government bureaucracy. In particular we will split the military and government roles to ensure that those who collect the money send it to us."

 abm_flowering_of_culture: "Flowering Of Culture"
 abm_flowering_of_culture_desc: "Although our state was born from the military conquests of our ancestors and lives today in no small part due to the military prowess of their sons, we must not forget that every war must have a reason or risk becoming a pointless waste of life. Now that we have achieved so much with the strength of our arms it is time to turn towards our bright minds and support a blossoming of culture, religion and other beautiful things of peace."

 abm_merchants_of_vientiane: "Merchants of Vientiane"
 abm_merchants_of_vientiane_desc: "The City of Vientiane has always been the commercial hub of our state. Geographically it is located in an almost perfect position to open up both river trade and communication with neighboring lands. Vientiane is, however, also situated in a place that is extremely difficult to defend. In order to allow our trade to exist and prosper we must learn how to build walls both taller and stronger than in any other part of our state to protect the wealth that so greatly benefit our people."

 abm_renaissance_of_lan_xang: "Renaissance of Lan Xang"
 abm_renaissance_of_lan_xang_desc: "Located at the very heart of South East Asia, Lan Xang is the natural crossroad for many different cultures. The stronger and more glorious our state becomes the more scholars, merchants and travelers from faraway places will arrive bringing with them new ideas and new knowledge."

 abm_lxa_ideas_ambition: "Lan Xang Ambition"
 abm_lxa_ideas_ambition_desc: "Lan Xang Ambition"

 abm_shan_ideas_traditions_1: "Shan Traditions I"
 abm_shan_ideas_traditions_1_desc: "Shan Traditions I"

 abm_shan_ideas_traditions_2: "Shan Traditions II"
 abm_shan_ideas_traditions_2_desc: "Shan Traditions II"

 abm_fortified_cities: "Fortified Cities"
 abm_fortified_cities_desc: "When other peoples settled in the hills the Shan chose to build fortified cities in the valleys. From these valleys our rule has extended far and wide and now the hill peoples are our subjects."

 abm_wet_rice: "Wet Rice Cultivation"
 abm_wet_rice_desc: "Wet rice cultivation is the best way to get the most out of the Shan lands. Thanks to this technique the Shan valleys can support a much larger population than would otherwise be possible."

 abm_sao_pha: "Sao Pha"
 abm_sao_pha_desc: "Known as Saopha, or lords of the sky, the Shan rulers and their venerable dynasties command the respect of all of their subjects. Despite this an ideal Shan ruler should not be distant from his population and tradition dictates that our rulers travel the land to learn of the views of their subjects themselves."

 abm_control_of_the_gem_trade: "Control of the Gem Trade"
 abm_control_of_the_gem_trade_desc: "Large quantities of Rubies, Amber, Sapphires and Jade leave these lands for the demanding markets in China and India every year. We must protect and control these caravans and profit from this ancient trade."

 abm_raiders: "Raiders"
 abm_raiders_desc: "Through constant warfare between the small Shan states and chiefdoms our warriors have become experienced and battle-hardened. While we have fought each other our neighbors have grown rich and weak. Joining together to raid foreign lands would be far more profitable than to continue these internal struggles."

 abm_chronicles: "Shan Chronicles"
 abm_chronicles_desc: "Traditionally any larger Shan state keeps its own records and royal chroniclers have followed our ancestors as far back as to the beginning of our dynasty. As time goes on, however, chronicles age. By copying and preserving the annals of our predecessors we ensure that nothing is forgotten."

 abm_expansionism: "Expansionism"
 abm_expansionism_desc: "As our population grows the lands we control have become too scarce to support them well. Rather than risk domestic violence escalating as resources become scarce we should create a larger army and expand at the expense of our neighbors."

 abm_shan_ideas_ambition: "Shan Ambition"
 abm_shan_ideas_ambition_desc: "Shan Ambition"

 abm_ava_ideas_traditions_1: "Ava Traditions I"
 abm_ava_ideas_traditions_1_desc: "Ava Traditions I"

 abm_ava_ideas_traditions_2: "Ava Traditions II"
 abm_ava_ideas_traditions_2_desc: "Ava Traditions II"

 abm_legacy_of_the_pagan_dynasty: "Legacy of the Pagan dynasty"
 abm_legacy_of_the_pagan_dynasty_desc: "The Pagan dynasty was the first kingdom established by the Burmese. If we can unify their land along with Ayeyarwady river, other countries will recognize that we are the successor of the old kingdom of Pagan."

 abm_rajadhiraja: "Rajadhiraja"
 abm_rajadhiraja_desc: "We have taken the title Rajadhiraja; King of Kings, for many petty rulers pay homage to our dynasty. By winning the respect of all the Burmese people our armies will swell with recruits ready to serve the King."

 abm_manu_kye_dhammathat: "Manu Kye Dhammathat"
 abm_manu_kye_dhammathat_desc: "If we compile our existing laws and customs into a new law book written in simple Burmese language, this Manu Kye Dhammathat, the Manu Kye Law Book, will gain enormous popularity among our subjects."

 abm_bamar_literature: "Patronize Burmese Literature"
 abm_bamar_literature_desc: "It has been traditional to patronize literary works in the Pali language, prestigious as it is in Buddhist circles. However, we must not neglect to patronize our native Burmese vernacular as well. A strong literary tradition will enrich our court culture and inspire our leaders."

 abm_hill_tribes: "Recruit from the Hill Tribes"
 abm_hill_tribes_desc: "The hills east of Ava are home to many disparate, warring tribes. Though they sometimes foolishly attempt to fight against us, we should convince the tribes with words or with coin that it would be better to fight under our banner."

 abm_shan_in_line: "Keep the Shan in Line"
 abm_shan_in_line_desc: "The many Shan Mongs are a constant thorn in our side. They seek to usurp our authority and withhold rightfully owed tribute at every opportunity. It is time to exercise greater control over the clans that pay us homage."

 abm_provincial_governors: "Rein in Provincial Governors"
 abm_provincial_governors_desc: "We allow our provincial governors far too much leeway. Far too often they have conspired for the throne or failed to provide the soldiers we are due. We will institute a robust system by which we will reward only our most loyal servants with governorates, with each appointed directly by the King."

 abm_ava_ideas_ambition: "Ava Ambition"
 abm_ava_ideas_ambition_desc: "Ava Ambition"

 abm_suk_ideas_traditions_1: "Sukhothai Traditions I"
 abm_suk_ideas_traditions_1_desc: "Sukhothai Traditions I"

 abm_suk_ideas_traditions_2: "Sukhothai Traditions II"
 abm_suk_ideas_traditions_2_desc: "Sukhothai Traditions II"

 abm_birthplace_of_a_culture: "Birthplace of a Culture"
 abm_birthplace_of_a_culture_desc: "Sukhothai could be said to be the first independent Thai kingdom. Sri Indraditya and his brother would have taken the city from Mon hands in 1239, from there the kingdom would expanded as far north as Luang Prabang and as far south as Chaiya."

 abm_akson_thai: "Akson Thai"
 abm_akson_thai_desc: "Originally based on the old Khmer script the Thai script would have become distinct during the reign of Ram Khamhaeng. Having a unique written language has helped our people develop as a unique culture."

 abm_sawankalok_ware: "Sawankalok Ware"
 abm_sawankalok_ware_desc: "King Ram Khamhaeng has been credited with bringing the skills of ceramic from China and laying a foundation of a strong ceramic ware industry in the Sukhothai Kingdom. As a result of this, Sukhothai has been one of the main exporters of ceramic ware known as 'Sawankalok ware' to areas as far off as Japan and China. During Khamhaeng's reign this trade was the main revenue generator to the kingdom."

 abm_wat_si_sawai: "Wat Si Sawai"
 abm_wat_si_sawai_desc: "Sukhothai is known for its many grand temples such as the Wat Si Sawai, the faith of our people is strong."

 abm_father_governs_children: "Father Governs Children"
 abm_father_governs_children_desc: "The Sukhothai kings are famed for their close connection with the common man. May our people live free and happily under the guiding light of their majestic, heavenly rulers."

 abm_ramkhamhaeng_stele: "Ramkhamhaeng Stele "
 abm_ramkhamhaeng_stele_desc: "Most of the history of the early Sukhothai kingdom comes from inscriptions on the Ramkhamheang Stele, while our neighbors may try to claim that this sacred peace of heritage is merely a forgery they are merely fools. The Ramkhamhaeng Stele is a sacred peace of heritage and one that surely proves our place in history."

 abm_war_elephants: "War Elephants"
 abm_war_elephants_desc: "War Elephants dominated the battlefields of the Nusantara region, usually the victors in wars are decided simply on who has the most of them. Luckily our nation has long had a history of its powerful War Elephants, the beasts providing great aid during the conquests of Ramkhamhaeng."

 abm_suk_ideas_ambition: "Sukhothai Ambition"
 abm_suk_ideas_ambition_desc: "Sukhothai Ambition"

 abm_mlc_ideas_traditions_1: "Malaccan Traditions I"
 abm_mlc_ideas_traditions_1_desc: "Malaccan Traditions I"

 abm_mlc_ideas_traditions_2: "Malaccan Traditions II"
 abm_mlc_ideas_traditions_2_desc: "Malaccan Traditions II"

 abm_vassal_princes: "Vassal Princes"
 abm_vassal_princes_desc: "Malacca holds a strategic place in the Spice archipelago, if we want to take advantage of this we should start by acquiring some vassal states."

 abm_maritime_laws: "Maritime Laws"
 abm_maritime_laws_desc: "Nusantara is the home of our ancestors, we must accept the place that Allah has given to us and become the main trading port of the region. Nearby nations represent no maritime threat to us."

 abm_new_hegemony: "Malaccan Hegemony"
 abm_new_hegemony_desc: "Ours may be a young nation, but our history is surely not. We must restore the ancient Srivijaya empire to its former glory. Malacca shall be remembered."

 abm_islamic_sultanate: "Islamic Sultanate"
 abm_islamic_sultanate_desc: "It is difficult to spread our faith so far from the home of the Prophet, if we want a peaceful government we should be a little more... flexible. For now."

 abm_habor_masters: "Harbor Masters"
 abm_habor_masters_desc: "Our efforts to ensure religious tolerance in our nation have been paying off and Malacca is now a Nusantaran melting pot, where people from different cultures and faith find a place to rest. As a result of our benevolence, nearby islands are helping us to direct trade to our harbors."

 abm_jawi_script: "Jawi Script"
 abm_jawi_script_desc: "With Classical Malay as Nusantara's lingua franca, it is now time to change the Brahmic scripts into something more fitting to our faith. Jawi is based on our distant cousins Arabic script and it shall be an excellent option to unify Nusantaran writing systems."

 abm_mlc_ideas_ambition: "Malaccan Ambition"
 abm_mlc_ideas_ambition_desc: "Malaccan Ambition"

 abm_malayan_idea_traditions_1: "Malayan Sultanate Traditions I"
 abm_malayan_idea_traditions_1_desc: "Malayan Sultanate Traditions I"

 abm_malayan_idea_traditions_2: "Malayan Sultanate Traditions II"
 abm_malayan_idea_traditions_2_desc: "Malayan Sultanate Traditions II"

 abm_malayan_indian_ocean_trade: "Malayan Indian Ocean Trade"
 abm_malayan_indian_ocean_trade_desc: "Malayan Indian Ocean Trade"

 abm_malayan_sufi_legacy: "Malayan Sufi Legacy"
 abm_malayan_sufi_legacy_desc: "Malayan Sufi Legacy"

 abm_malayan_mal_spice_islands: "Malayan Mal Spice Islands"
 abm_malayan_mal_spice_islands_desc: "Malayan Mal Spice Islands"

 abm_malayan_classical_malay: "Malayan Classical Malay"
 abm_malayan_classical_malay_desc: "Malayan Classical Malay"

 abm_malayan_trading_fleets: "Malayan Trading Fleets"
 abm_malayan_trading_fleets_desc: "Malayan Trading Fleets"

 abm_malayan_heirs_of_pasai: "Malayan Heirs Of Pasai"
 abm_malayan_heirs_of_pasai_desc: "Malayan Heirs Of Pasai"

 abm_malayan_settle_the_islands: "Malayan Settle The Islands"
 abm_malayan_settle_the_islands_desc: "Malayan Settle The Islands"

 abm_malayan_idea_ambition: "Malayan Sultanate Ambition"
 abm_malayan_idea_ambition_desc: "Malayan Sultanate Ambition"

 abm_sumatran_ideas_tradition_1: "Sumatran Traditions I"
 abm_sumatran_ideas_tradition_1_desc: "Sumatran Traditions I"

 abm_sumatran_ideas_tradition_2: "Sumatran Traditions II"
 abm_sumatran_ideas_tradition_2_desc: "Sumatran Traditions II"

 abm_reliance_on_trade: "Reliance on Trade"
 abm_reliance_on_trade_desc: "Trade has always been the primary resource of our immense wealth. As such, we have for generations specialized in honing our bartering skills, learning to make the most of our dealings with others."

 abm_sumatran_ideas_porch_of_mecca: "Sumatran Ideas Porch Of Mecca"
 abm_sumatran_ideas_porch_of_mecca_desc: "Sumatran Ideas Porch Of Mecca"

 abm_spice_pirates: "Spice Pirates"
 abm_spice_pirates_desc: "For as long as there has been trade in the strait of Malacca, there have been pirates. Perhaps we should strike a deal with the seasoned pirate leaders and turn their presence into something beneficial?"

 abm_center_of_scholarship: "Center of Scholarship"
 abm_center_of_scholarship_desc: "For centuries, the magnificent cities of Sumatra have been a place for scholarly learning and knowledge. Drawing towards them the best and the brightest of first the Buddhist and now the Muslim world, there is no match for our academic minds!"

 abm_merchants_of_the_indian_ocean: "Merchants of The Indian Ocean"
 abm_merchants_of_the_indian_ocean_desc: "Traveling far and wide, our merchants travel to the most exotic places of the world; from the Maghreb in the west to China in the east - and well beyond! The plentiful riches from trading in spices attract many new able bodies to the merchant craft."

 abm_legacy_of_srivijaya: "Legacy of Srivijaya"
 abm_legacy_of_srivijaya_desc: "Srivijaya was a dominant Sumatran state that influenced most of South East Asia. They held a strong hegemony in the region for several centuries, expanding through trade and sheer military force. And we are their proud heirs! Rejoice!"

 abm_rule_of_the_sea: "Rule of The Sea"
 abm_rule_of_the_sea_desc: "The proud Sumatran empires have always had strong thalassocratic traditions. We must ensure continued dominance of the seas both to protect our trade as well as our cities!"

 abm_sumatran_ideas_ambition: "Sumatran Ambition"
 abm_sumatran_ideas_ambition_desc: "Sumatran Ambition"

 abm_atj_ideas_tradition_1: "Acehnese Traditions I"
 abm_atj_ideas_tradition_1_desc: "Acehnese Traditions I"

 abm_atj_ideas_tradition_2: "Acehnese Traditions II"
 abm_atj_ideas_tradition_2_desc: "Acehnese Traditions II"

 abm_export_economy: "Export Economy"
 abm_export_economy_desc: "Aceh's economy relies chiefly on the selling of valuable goods such as nutmeg, cloves, and betel nuts. What it struggles with is domestic food production which would allow for extended military and commercial ventures. We should organise trade partnerships to secure this surplus food in exchange for preferrential prices for our spices."

 abm_islamise_sumatra: "Islamize Sumatra"
 abm_islamise_sumatra_desc: "Aceh was the first region in the Malay world to adopt Islam. Despite this, many still practice heathen faiths both in nearby nations and within our own lands. To demonstrate our faith in Allah, we should strive to convert others to the way of the Prophet."

 abm_rise_of_aceh: "Rise of Aceh"
 abm_rise_of_aceh_desc: "We have ambitions beyond being a trade entrepot. Aceh will lead a great empire that will span throughout Nusantara."

 abm_military_adventures: "Military Adventures"
 abm_military_adventures_desc: "Expansionism without a little risk bears few rewards. We should not be afarid to embark upon long campaigns in distant lands to increase our influence across the world."

 abm_atj_ideas_porch_of_mecca: "Atj Ideas Porch Of Mecca"
 abm_atj_ideas_porch_of_mecca_desc: "Atj Ideas Porch Of Mecca"

 abm_acehnese_moneylending: "Acehnese Moneylending"
 abm_acehnese_moneylending_desc: "A gold currency puts us at an economic advantage compared to many other states, but what really makes Aceh a hive of trade and commerce are the favourably low rates of interest. Our merchants are able to embark on new ventures without worrying that the moneylenders will take half their profits or more."

 abm_settle_the_islands: "Settle the Islands"
 abm_settle_the_islands_desc: "The other islands of this archipelago need to feel the benefit of enlightened Muslim rule as well. By settling them, we get access to their rich goods and they get access to the words of the Prophet. What could be fairer?"

 abm_atj_ideas_ambition: "Acehnese Ambition"
 abm_atj_ideas_ambition_desc: "Acehnese Ambition"

 abm_pgr_ideas_tradition_1: "Pagarruyung Traditions I"
 abm_pgr_ideas_tradition_1_desc: "Pagarruyung Traditions I"

 abm_pgr_ideas_tradition_2: "Pagarruyung Traditions II"
 abm_pgr_ideas_tradition_2_desc: "Pagarruyung Traditions II"

 abm_pgr_tantric_legacy: "Tantric Legacy"
 abm_pgr_tantric_legacy_desc: "The founder of Pagarruyung Kingdom was Adityawarman, cousin of the king of Majapahit Empire. From the many inscriptions he left behind our people have inherited his devotion for esoteric Buddhism. We have to ensure his great legacy will endure as the influence of Muslim Sultanates spread among these islands."

 abm_pgr_gold_trade: "Gold Trade"
 abm_pgr_gold_trade_desc: "Our kingdom is prosperous thanks to export of gold, wise politics and the trade connections of our merchants in the archipelago. Many of the Minangkabau people have worked as intermediary traders for the Srivijaya empire, Aceh or Malacca. Trade is in the blood of our veins."

 abm_pgr_istano_basa: "Istano Basa"
 abm_pgr_istano_basa_desc: "Istano Basa Pagarruyung, our royal palace is built in the traditional Minangkabau Rumah Gadang vernacular architectural style. It is the center of our state and our entire culture, the proof of eternal right of Pagarruyung dynasty to these lands - and it will be our heart for centuries."

 abm_pgr_rajo_tigo_selo: "Rajo Tigo Selo"
 abm_pgr_rajo_tigo_selo_desc: "The royal power of Istano Basa Pagarruyung has been split into three recognized reigning kings: the King of the World (Raja Alam), the King of Adat (Raja Adat), and the King of Religion (Raja Ibadat). Collectively they are called the Kings of the Three Seats (Rajo Tigo Selo). Their cooperation ensures our strong diplomatic position in the civilized world - unlike other savages who would be ruled by a sole Tyrant chief!"

 abm_pgr_high_education: "High Education"
 abm_pgr_high_education_desc: "Our people are not as numerous as the people of Java but we are very influential as there is nothing more important than education in our culture. In addition to being renowned as merchants, the Minangs produce some of Indonesia's most influential poets, statesmen and scholars; adaptation to new techniques is the key to the greatness of Pagarruyung."

 abm_pgr_rumah_gadang: "Rumah Gadang"
 abm_pgr_rumah_gadang_desc: "Our traditional architecture and the functions of the Rumah Gadang House reflect the culture and values of the Minangkabau. A Rumah Gadang serves as a residence, a hall for family meetings, and for ceremonial activities; rich ornaments and splendid looks make that the symbol of Pagarruyung and our architectural capabilities."

 abm_pgr_matrilinear_culture: "Matrilineal Culture"
 abm_pgr_matrilinear_culture_desc: "Adat Perpatih is a combination of practices and rules of life for the Minangkabau people. Property and land is passed down from mother to daughter, while religious and political affairs are the responsibility of men. Tradition protects the honor and dignity of the Adat Perpatih so that, however, poor an Adat Perpatih woman may be, she will always be cared for. This ensures that our society is not divided by petty conflicts."

 abm_pgr_ideas_ambition: "Pagarruyung Ambition"
 abm_pgr_ideas_ambition_desc: "Pagarruyung Ambition"

 abm_plb_ideas_tradition_1: "Palembang Traditions I"
 abm_plb_ideas_tradition_1_desc: "Palembang Traditions I"

 abm_plb_ideas_tradition_2: "Palembang Traditions II"
 abm_plb_ideas_tradition_2_desc: "Palembang Traditions II"

 abm_plb_ancient_scriptures: "Ancient Scriptures"
 abm_plb_ancient_scriptures_desc: "The oldest recordings of our nation tell the story of one of our greatest kings, who took twenty thousand men and hundreds of boats and sailed into the unknown. This story shall not be forgotten."

 abm_plb_pirate_ancestry: "Pirate Ancestry"
 abm_plb_pirate_ancestry_desc: "The rebellious nature of our people may be seen by some ignorant foreigners as recklessness, but we have always taken pride in it. After all, a little fight never killed anybody... or did it?"

 abm_plb_controlling_the_strait: "Controlling the Strait"
 abm_plb_controlling_the_strait_desc: "Voices travel a little too fast when the tides help them advance towards our lands. Watchful, the eyes of our nation are spread out over the sea as a creature of the deep."

 abm_plb_center_of_the_dynasty: "Center of the Dynasty"
 abm_plb_center_of_the_dynasty_desc: "During the rule of the Shailendra dynasty, our land was home to the most powerful of people. Our cities held sumptuous feasts, held magnificent celebrations, and nurtured strong alliances."

 abm_plb_trading_hub: "Trading Hub"
 abm_plb_trading_hub_desc: "Merchants from the continent must stay in our land during the long monsoon season. Thus, our cities are well prepared to hold large markets and store an abundant variety of goods."

 abm_plb_through_the_monsoon: "Through the Monsoon"
 abm_plb_through_the_monsoon_desc: "To tame the storm is impossible, to become the storm is admirable. Generations of sailors have passed on knowledge that has made our people tremble with emotion at the sight of the first cloud."

 abm_plb_learned_scholars: "Learned Scholars"
 abm_plb_learned_scholars_desc: "Since the time of the Srivijaya Empire, our nation has been home to many monks and academics who have devoted their lives to the study of all things."

 abm_plb_ideas_ambition: "Palembang Ambition"
 abm_plb_ideas_ambition_desc: "Palembang Ambition"

 abm_sun_ideas_tradition_1: "Sundanese tradition I"
 abm_sun_ideas_tradition_1_desc: "Sundanese tradition I"

 abm_sun_ideas_tradition_2: "Sundanese tradition II"
 abm_sun_ideas_tradition_2_desc: "Sundanese tradition II"

 abm_candi_shrines: "Candi Shrines"
 abm_candi_shrines_desc: "To strive for a more tolerant society we must allow other faiths to worship in peace. The Candi Shrines are dual purpose allowing Hindus and Buddhists to worship together creating a greater sense of religious harmony. If we can continue this policy with other religions, we can ensure religious unity."

 abm_sunda_galuh: "Union of Sunda and Galuh"
 abm_sunda_galuh_desc: "The Kingdoms of Sunda and Galuh were once independence but interconnected states. We have united them into a single indivisible realm."

 abm_defensive_moats: "Defensive Moats"
 abm_defensive_moats_desc: "Our defensive fortification have held back invaders countless times, and will continue to be effective for many years to come."

 abm_wooden_architecture: "Elaborate Wooden Architecture"
 abm_wooden_architecture_desc: "Sundanese architectural tradition emphasises the beauty of wooden structures. Our temples and palaces are the envy of the Malay world."

 abm_pan_asian_trade: "Pan-Asian Trade"
 abm_pan_asian_trade_desc: "Our economy relies on trading links stretching from India in the west and China to the North, by finding new markets to exploit and new trading partners we can further grow our economy."

 abm_seren_taun: "Seren Taun"
 abm_seren_taun_desc: "The festival of Seren Taun demonstrates the Sundanese agriculture way of life, and it is held in high importance in Sundanese villages."

 abm_bi_yearly_harvest: "Bi-Yearly Harvest"
 abm_bi_yearly_harvest_desc: "Our fertile lands, and advanced irrigation practices ensure that we can harvest twice a year instead of the traditional once. This further strengthens the output of the realm."

 abm_sun_ideas_ambition: "Sundanese Ambition"
 abm_sun_ideas_ambition_desc: "Sundanese Ambition"

 abm_bli_ideas_tradition_1: "Balinese tradition I"
 abm_bli_ideas_tradition_1_desc: "Balinese tradition I"

 abm_bli_ideas_tradition_2: "Balinese tradition II"
 abm_bli_ideas_tradition_2_desc: "Balinese tradition II"

 abm_bli_island_settlers: "Island Settlers"
 abm_bli_island_settlers_desc: "The surrounding islands, with the notable exception of Java, are weak and uncultured in comparison to Bali. It would be relatively easy to settle these islands and introduce good governance, right religion, and a Balinese nobility."

 abm_javanese_culture: "Imported Javanese Culture"
 abm_javanese_culture_desc: "The old rule of Majapahit marked the strong influx of Javanese culture into Bali, most of all in architecture, dance and the theatre, in literature with the introduction of the Kawi script, in painting and sculpture and the wayang puppet theatre."

 abm_aristocratic_refugees: "Aristocratic Refugees"
 abm_aristocratic_refugees_desc: "With Islam rising and great kingdoms falling in the Indonesian archipelago, displaced Hindu nobility flock to Bali to restore their ancient honour."

 abm_staunch_hindus: "Staunch Hindus"
 abm_staunch_hindus_desc: "Religious change engulfs the Malay world. Islam and Christianity represent a threat to our ancient Hindu culture, and efforts must be made to preserve it at any cost."

 abm_conquerer_dalems: "Conquerer Dalems"
 abm_conquerer_dalems_desc: "Balinese monarchs, known as Dalems, have not shied away from ambitious conquests despite the relatively small size of their kingdoms. Dalem Baturenggong, for example, expanded his kingdom of Gelgel  to the islands to the East and even made forays into Java."

 abm_hindu_reformation: "Hindu Reformation"
 abm_hindu_reformation_desc: "The half-hearted and disorganised approach to religion adopted by the failed nations that surround us has no place on Bali. Heeding the wise words of Dang Hyang Nirartha the worship of Shiva shall take supreme dominance over all other forms of religious life. New temples shall be constructed and the priesthood reformed to create a renewed and modern Hindu faith."

 abm_rivals_to_slaves: "Rivals to Slaves"
 abm_rivals_to_slaves_desc: "Why kill our enemies when they still have worth as slaves? Allowing our captured enemies to serve instead of die not only reflects the mercy of Bali's rulers, but also frees up new sources of manpower in the local population."

 abm_bli_ideas_ambition: "Balinese Ambition"
 abm_bli_ideas_ambition_desc: "Balinese Ambition"

 abm_bei_ideas_tradition_1: "Bruneian Traditions I"
 abm_bei_ideas_tradition_1_desc: "Bruneian Traditions I"

 abm_bei_ideas_tradition_2: "Bruneian Traditions II"
 abm_bei_ideas_tradition_2_desc: "Bruneian Traditions II"

 abm_bei_galleys: "Galley Fleet"
 abm_bei_galleys_desc: "The Bruneian fleet has always hold a core position in our national power. We need to think big, but start small. Paying close attention to our galleys should grant us some control over the seas."

 abm_bei_sea_nomads: "Sea Nomads"
 abm_bei_sea_nomads_desc: "The seafaring people of Orang Laut and Sama-Bajau live in houseboats in the near surroundings of our nation. If we can convince them to pay homage to Brunei, our maritime power may be increased and new sailors could be recruited."

 abm_bei_diplomacy: "Bruneian Diplomacy"
 abm_bei_diplomacy_desc: "If we want to establish a new thalassocracy in Nusantara, we certainly need some allies. Our diplomats have been present in nearby courts for quite some time now and Bruneian statesmanship has a strong reputation."

 abm_bei_vassals: "Hegemon of Borneo"
 abm_bei_vassals_desc: "A single island, a single nation. Brunei needs to reach the Kapuas River delta and extend our power over the whole island of Borneo. If we succeed in doing so, other Malay sultanates will have to address us as their leader."

 abm_bei_naval_prowess: "Naval Prowess"
 abm_bei_naval_prowess_desc: "Our alliances with regional sea nomads have given us a great naval armada. Bruneian ships can now be heard and seen in all Nusantara."

 abm_bei_trade: "Merchant Alliances"
 abm_bei_trade_desc: "Our merchants can be found as far as Ligor and Siam, but now it is time to look for even more advantageous partnerships. Europeans may have some interest in the region's spice trade, and the Portuguese seem to have the best merchants."

 abm_bei_ideas_ambition: "Bruneian Ambition"
 abm_bei_ideas_ambition_desc: "Bruneian Ambition"

 abm_kut_ideas_tradition_1: "Bornean Traditions I"
 abm_kut_ideas_tradition_1_desc: "Bornean Traditions I"

 abm_kut_ideas_tradition_2: "Bornean Traditions II"
 abm_kut_ideas_tradition_2_desc: "Bornean Traditions II"

 abm_kut_earliest_indic_state: "Earliest Indic State"
 abm_kut_earliest_indic_state_desc: "Like most states among these islands we have ancient ties to the Indian subcontinent. Our kingdom is said to be one of the oldest existing Indic kingdoms that once sprung up all over these islands. Cherishing these Brahmanical traditions we are still at home in all the major ports of India and the travelers and Merchants of the subcontinent are always welcome among us."

 abm_kut_muslim_trading_communities: "Muslim Trading Communities"
 abm_kut_muslim_trading_communities_desc: "The Islamic faith has spread like a wildfire in our region, both through conversions along the coasts and the arrival of traders from afar. In order to prosper in this area we must welcome these newcomers and avoid alienating both those who convert and those who don't."

 abm_kut_riches_of_borneo: "Riches of Borneo"
 abm_kut_riches_of_borneo_desc: "For centuries traders have come from China and India seeking the richest of these forests, Ivory, Teak, Pearls, Jade and Medicinal woods can all be found in abundance here. We must monitor this trade closely so that we may control it and tax it wisely."

 abm_kut_anti_piracy_measures: "Anti-Piracy Measures"
 abm_kut_anti_piracy_measures_desc: "Pirates grow more and more bold in their raids and some have even begun to raid up into the deltas where our most valuable trade ports are situated. We must take act decisively against this threat by strengthening our fortifications, moving some of our wealth even further inland and patrolling our coastlines."

 abm_kut_encourage_immigration: "Encourage Immigration"
 abm_kut_encourage_immigration_desc: "This archipelago has seen its share of wars and sharp political changes over the years and with the arrival of European ships and colonists in this region this has only increased. Together with the great ease with which one can move between these islands there is a steady migration of people from one island to the next. Our state has always prospered from letting foreigners in, let us welcome those who wish to settle here and assign places for them to live."

 abm_kut_consolidation_of_kutai: "Consolidation of Borneo"
 abm_kut_consolidation_of_kutai_desc: "While we have come to be the dominant state of the Borneo coastline there are a number of other realms where our people live in various principalities and kingdoms. Let us unite the Bornean people into one Kingdom with strong central rules for all to follow."

 abm_kut_subdue_the_inlands: "Subdue the Inlands"
 abm_kut_subdue_the_inlands_desc: "Many parts of the forests and mountains of the inland are beyond our control, with various tribal constellations and micro-states professing vassalage when it suits them. Let us extend our authority over these people and formalize our relationship once and for all."

 abm_kut_ideas_ambition: "Bornean Ambition"
 abm_kut_ideas_ambition_desc: "Bornean Ambition"

 abm_sulawesi_ideas_tradition_1: "Sulawesi Traditions I"
 abm_sulawesi_ideas_tradition_1_desc: "Sulawesi Traditions I"

 abm_sulawesi_ideas_tradition_2: "Sulawesi Traditions II"
 abm_sulawesi_ideas_tradition_2_desc: "Sulawesi Traditions II"

 abm_sulawesi_intra_asian_trade: "Intra-Asian Trade Network"
 abm_sulawesi_intra_asian_trade_desc: "Though our island is yet little more than a stop on the way for traders from richer and more influential lands we benefit highly from the busy trafic of trading vessels that criss-cross these islands. Chinese, Indian or Javanese traders all frequent our ports and the more attractive we make them the more our importance in this network grows."

 abm_sulawesi_bajau: "The Bajau"
 abm_sulawesi_bajau_desc: "All of the islands of South East Asia are frequented by the Bajau, though none remember their origin by now. Known by their own as Sama, the Bajau lead their entire lives on their boats and live from trading and raiding the various ports of the islands that surround us. Let us encourage these natural sailors to come to our ports to sell their goods and replenish their stockpiles so that we may grow rich from their journeys and learn their secrets."

 abm_sulawesi_prau: "The Prau"
 abm_sulawesi_prau_desc: "A Prau is a kind of vessel local to this part of the world and the most famous of them originate in our lands. While varying in size and form these ships allow us to quickly move large quantities of goods and people along our coasts and between the islands of the Archipelago."

 abm_sulawesi_unification: "Unification of Sulawesi"
 abm_sulawesi_unification_desc: "Within our lands a great number of petty rulers hold sway and though they all acknowledge us as their 'elder brother' and superior among equals the continuation of the pretence that power can be shared is causing greater strain than it is worth. Let us unify these lands fully and reap the rewards of direct control of the agricultural as well as maritime parts of the island."

 abm_sulawesi_learning_from_outsiders: "Encourage Diffusion of Ideas"
 abm_sulawesi_learning_from_outsiders_desc: "In order to make the most of our situation we must strive to learn from our neighbors. There are ideas and concepts all over South East Asia that we would do well to study and adapt to our own society. Let us send our most gifted men abroad to study the ways of the Chinese, the Europeans, and the people of the other islands. Let us also interview any foreigner frequenting our ports for new ideas. If what we learn is found useful we must create similar concepts suited to the needs of our own people."

 abm_sulawesi_entrepot: "Entrepot of Trade"
 abm_sulawesi_entrepot_desc: "Outside powers would control the trade of these islands and force us all to use their ports exclusively. They aim to make the most out of every single item sold and their influence is threatening to stifle the ancien trade network of our region. Let us open our own ports to traders of all nationalities, competing with the outsiders by offering much lower prices."

 abm_sulawesi_assymetrical_warfare: "Asymmetrical Resistance"
 abm_sulawesi_assymetrical_warfare_desc: "This archipelago is ideal for raids and pirates and the mountains and forests of the inland offers equally good opportunities to make life bitter for a foreign invader. As natives of this region we can make better use of these facts than most and we should do so to counter the hostile incursions of foreign powers."

 abm_sulawesi_ideas_ambition: "Sulawesi Ambition"
 abm_sulawesi_ideas_ambition_desc: "Sulawesi Ambition"

 abm_moluccan_ideas_tradition_1: "Moluccan Traditions I"
 abm_moluccan_ideas_tradition_1_desc: "Moluccan Traditions I"

 abm_moluccan_ideas_tradition_2: "Moluccan Traditions II"
 abm_moluccan_ideas_tradition_2_desc: "Moluccan Traditions II"

 abm_moluccan_spice_islands: "The Spice Islands"
 abm_moluccan_spice_islands_desc: "For thousands of years the cloves, nutmeg, sandalwood and other spices from our islands have reached the finer tables in Europe, China, India and Persia. This long journey has many stops but it starts here, among our islands and the incredibly productive sources of spices that they are."

 abm_moluccan_cultural_heritage: "Shared Cultural Heritage"
 abm_moluccan_cultural_heritage_desc: "While the diversity is great among the Spice Islands there are certain myths and traditions that are known among the people of all of these islands. These tales help us identify true rulers and give our growing realm legitimacy."

 abm_moluccan_agents_of_trade: "Agents of Trade"
 abm_moluccan_agents_of_trade_desc: "Throughout these islands, in the many bays, ports and river mouths there are goods and tribute to be collected. Let us send forth a number of permanent trade agents to look after our interests in the various parts of the archipelago and to maintain our monopoly on the valuable goods we then export to the rest of the world."

 abm_moluccan_four_kingdoms: "Four Kingdoms"
 abm_moluccan_four_kingdoms_desc: "There were once four kingdoms in the islands of Maluku and if not all of them remain they continue to play an important role both in the royal ceremonies of our people and as a common legend to gather around in times of hardship."

 abm_moluccan_dominance_over_the_outer_islands: "Dominance over the Outer Islands"
 abm_moluccan_dominance_over_the_outer_islands_desc: "At a glance we would lack the population and lands to stand up to other states. What we do have, however, is a network of loyal ports and islands extending far into the archipelago that surrounds us. All these islands will support us and allows us to control their production of spices. In order to make full use of this influence, however, we must extend and enforce this network and centralize the power of our central islands."

 abm_moluccan_ally_papuan_raiders: "Alliance with the Papuans"
 abm_moluccan_ally_papuan_raiders_desc: "Throughout the centuries the Papuans have raided the islands and ships of this region. With the growing European presence in the area, however, we must put such things behind us and band together against hostile outside forces."

 abm_moluccan_pragmatic_diplomacy: "Pragmatic Diplomacy"
 abm_moluccan_pragmatic_diplomacy_desc: "While it is true that the Europeans seem untrustworthy they are equally treacherous to each other. Let us seek to ally these newcomers when it suits us and discard them when their help is no longer required."

 abm_moluccan_ideas_ambition: "Moluccan Ambition"
 abm_moluccan_ideas_ambition_desc: "Moluccan Ambition"

 abm_luzon_ideas_tradition_1: "Luzon Traditions I"
 abm_luzon_ideas_tradition_1_desc: "Luzon Traditions I"

 abm_luzon_ideas_tradition_2: "Luzon Traditions II"
 abm_luzon_ideas_tradition_2_desc: "Luzon Traditions II"

 abm_luzon_barangay: "Barangay State"
 abm_luzon_barangay_desc: "Spread out in small port cities and over numerous islands our state is dependent on the sea for its very existence. Our society is built to support long range trade, and everything, from the organization of agriculture to the laws and traditions reflect this fact."

 abm_luzon_conquest_of_paradise: "Conquest of Paradise"
 abm_luzon_conquest_of_paradise_desc: "Our archipelago is a paradise to some but it is not without its danger. Rainforests and tropical diseases can deter invaders and sometimes the best defense is our islands themselves. In the face of sure defeat we have traditionally employed scorched earth tactics and let the land fight the invaders for us"

 abm_luzon_sino_philippine_trade: "Sino-Philippine Trade"
 abm_luzon_sino_philippine_trade_desc: "Luzon and especially our position in the Pasig river delta, has allowed us to develop thriving ports for the import of Chinese goods into the entire archipelago. Chinese goods arrive regularly in Tondo where they can then be redistributed to the many ports and islands of the Philippines."

 abm_luzon_tagalog_syncretism: "Tagalog Syncretism"
 abm_luzon_tagalog_syncretism_desc: "While we have never stopped worshiping the gods of our ancestors we have also never seen a reason to reject foreign faiths. Among our people we honor the Gods of the Brahmanic faiths, side by side with the god of the Mohammedans and Buddhists."

 abm_luzon_sailors: "Luzon Sailors"
 abm_luzon_sailors_desc: "Not all sailors serve on our own ships, some seek employment among the many warring states of Southeast Asia. Luzon Sailors can be found on warships from Brunei to Aceh.The experience these men earn abroad is something we can than make good use of in our own maritime endeavours. Let us encourage all our young men to seek their fortunes abroad so that they may later return experienced and hardened."

 abm_luzon_a_safe_haven: "A Safe Haven"
 abm_luzon_a_safe_haven_desc: "Our kingdom is close enough to enjoy a stream of Chinese, Japanese and Southeast Asian goods yet too far away to be within their reach. This makes us a desirable destination for many who for whichever reason wish to abandon their homeland. Let us invite these people to our land so that we can benefit from their skills and expertise."

 abm_luzon_expand_the_sugar_production: "Expand the Sugar Production"
 abm_luzon_expand_the_sugar_production_desc: "One of the most sought after crops in these lands is the sugar that our ancestors have grown for centuries. In a more interconnected world this cash crop could bring us even greater wealth. Expanding the production of Sugar, through land reclamation as well as at the expense of other crops will allow our economy to grow to new heights."

 abm_luzon_ideas_ambition: "Luzon Ambition"
 abm_luzon_ideas_ambition_desc: "Luzon Ambition"

 abm_mas_ideas_tradition_1: "Madyas Traditions I"
 abm_mas_ideas_tradition_1_desc: "Madyas Traditions I"

 abm_mas_ideas_tradition_2: "Madyas Traditions II"
 abm_mas_ideas_tradition_2_desc: "Madyas Traditions II"

 abm_mas_hinalliwood: "Hinilawod"
 abm_mas_hinalliwood_desc: "Since time immemorial our people has kept the 29 000 verse-epic of Hinilawod alive. It tells the story of the great adventurers and gods of our people and teaches generation upon generation the value of family, honor, dignity and bravery. This way our legacy is carried onwards even as we integrate the customs and stories of foreign peoples into our own."

 abm_mas_legacy_of_panai: "Legacy of Panai"
 abm_mas_legacy_of_panai_desc: "In the age of Srivijaya our people ruled the constituent kingdom of Panai on faraway Sumatra. For centuries they fought to keep the Srivijayan waters free of hostile ships and pirates. Eventually, as the empire fell to foreign invaders, our ancestors refused to bend their heads to these new rulers and instead migrated to the islands we now occupy. The traditions of our people still make us excellent sailors and fiercely independent warriors."

 abm_mas_riches_of_the_visayas: "Riches of the Visayas"
 abm_mas_riches_of_the_visayas_desc: "The Visayan islands are famously fertile. Even if not all of them are home to great cities, the rice and meat produced here feeds settlements as far away as Manila and Tondo. Such resources are a great strength for a growing empire such as ours. By providing support and protection from maritime raiders we can support the growth of all our domains."

 abm_mas_masters_of_maritime_warfare: "Masters of Maritime Warfare"
 abm_mas_masters_of_maritime_warfare_desc: "Our strong maritime legacy has made our state feared on the open seas. In order to keep our trade safe from those that would steal our wealth we must be put constant pressure on foreign fleets, be they Muslims, Chinese, or from one of the many Indianized kingdoms. Some would call this piracy, but it is their fault for not properly protecting their own."

 abm_mas_articles_of_the_confederation: "Articles of the Confederation"
 abm_mas_articles_of_the_confederation_desc: "Our state, the Madyas, is a confederation of 3 sovereign territories ruled by the Datu Paiburong council with the role of commander in chief chosen through election among them. This way we always have a leader for our common defense and we can keep the political center relevant to the politics of our people."

 abm_mas_kinaduatan: "Kinadatuan"
 abm_mas_kinaduatan_desc: "Throughout the ages our society has maintained the divinely sanctioned Datu families in power. In their blood runs the mission and talent for righteous and successful rulership. In tradition lies much power. If we are to thrive we must preserve the rights of the Kinadatuan while adapting these social structures to the world and a developing empire."

 abm_mas_expand_the_shipbuilding_sector: "Expand the Shipbuilding Sector"
 abm_mas_expand_the_shipbuilding_sector_desc: "For trade, fishing and warfare, ships have been an integral part of the Madja-as people for as long as these islands have been settled. The knowledge and experience we have in shipbuilding is unparalleled among our neighbors and as we modernize our navies we should build upon these traditions. Let us pick prominent shipbuilders to study the shipbuilding in the many ports we dock and integrate the best they have to offer in our own projects."

 abm_mas_ideas_ambition: "Madyas Ambition"
 abm_mas_ideas_ambition_desc: "Madyas Ambition"

