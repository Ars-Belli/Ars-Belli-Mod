l_english:
 abm_swahili_ideas_tradition_1: "Swahili Traditions I"
 abm_swahili_ideas_tradition_1_desc: "Swahili Traditions I"

 abm_swahili_ideas_tradition_2: "Swahili Traditions II"
 abm_swahili_ideas_tradition_2_desc: "Swahili Traditions II"

 abm_swa_indian_ocean_trade: "Indian Ocean Trade"
 abm_swa_indian_ocean_trade_desc: "In our city-states on the Swahili coast we can trade with people from Arabia, Hindustan, and even distant China, and then sell their exotic wares deep inland into the heart of Africa, placing us in a very lucrative position."

 abm_monsoon_season: "Monsoon Season"
 abm_monsoon_season_desc: "Thanks to the monsoon cycle, sometimes it is very easy for ships to go east in the ocean and other times, westward travel is expedited, allowing for a steady, predictable flow of trade that is as reliable as the weather. Our captains still have to pilot the vessels in those storms, of course."

 abm_great_mosque_of_kilwa: "Great Mosque of Kilwa"
 abm_great_mosque_of_kilwa_desc: "The Swahili culture is a mélange of Arab and Bantu traditions, language, and values, and when we embraced Islam, we built something unique in Africa or Arabia. The great mosque was carved from coral and inspires awe and wonder in travelers from all corners of the world."

 abm_indian_ocean_melting_pot: "Indian Ocean Melting Pot"
 abm_indian_ocean_melting_pot_desc: "Swahili city states are always exciting affairs. You never know if you'll find an Omani seaman, a Gujarati captain, a Malay spice trader, or even a brave merchant from the mysterious Island of the Moon, Madagascar. Some sailors come with tales of exciting new ideas put into effect in their lands, and we can try their experiments for ourselves."

 abm_recruit_the_unbelievers: "Recruit the Unbelievers"
 abm_recruit_the_unbelievers_desc: "Sadly, the people of the interior have not yet heard the word that there is no God but God, but even unbelievers have faith in the power of the gold coin. The riches of our land may attract them to serve under our banner... perhaps someday it will even inspire them to live under our Prophet."

 abm_ivory_trade: "Ivory Trade"
 abm_ivory_trade_desc: "The Europeans are new guests in our market and their fondness for ivory is truly remarkable. It must be a rare commodity back where they come from. The elephants are plentiful and are unlikely to ever run out, so we will keep harvesting their tusks for our clients' insatiable hunger for ivory."

 abm_familiar_presence_abroad: "Familiar Presence Abroad"
 abm_familiar_presence_abroad_desc: "Is there a port in the Indian Ocean where you can't hear Swahili spoken somewhere in the shipyards? It's doubtful: our merchants have sailed every corner of the ocean. As a result, people expect to see Swahili in their societies and our ambassadors have an easier time establishing themselves."

 abm_swahili_ideas_ambition: "Swahili Ambition"
 abm_swahili_ideas_ambition_desc: "Swahili Ambition"

 abm_nubian_ideas_tradition_1: "Nubian Traditions I"
 abm_nubian_ideas_tradition_1_desc: "Nubian Traditions I"

 abm_nubian_ideas_tradition_2: "Nubian Traditions II"
 abm_nubian_ideas_tradition_2_desc: "Nubian Traditions II"

 abm_nubian_nile: "The Nile"
 abm_nubian_nile_desc: "Like Egypt downstream, we are a land dependent on the Nile and its tributaries. Our agriculture makes the greatest use of the fertile fields flooded by the rivers flowing through our lands."

 abm_nubian_heritage: "Nubian Heritage"
 abm_nubian_heritage_desc: "From the ruins of the Ancient Nubian kingdoms to the still living legal and religious traditions of the Medieval Nubian kingdoms our people are rooted in an a rich heritage from an ancient civilization. As we go forward let us not squander the gains of the past but instead make good use of the legal and social traditions of our ancestors."

 abm_nubian_sahara: "Warriors of the Sahara Desert"
 abm_nubian_sahara_desc: "From ancient times, we have been known as a nation of fierce warriors. Many have come south from Egypt or out of the mountains of Ethiopia thinking to conquer us, but few have had any sort of success."

 abm_nubian_long_distance_trade: "Encourage Long-Distance Trade"
 abm_nubian_long_distance_trade_desc: "Some would call our country isolated yet traders from far-away countries have always sought and found our cities. From the Romans of ancient times to the Italians, Arabs and Turks of today. Let us encourage the long-distance trade in all directions."

 abm_nubian_religious_struggles: "Nubian Religious Unity"
 abm_nubian_religious_struggles_desc: "Nubia is home to Christians and Muslims as well as Animists and other traditional religions. Unlike in some parts of the world these faiths have not gotten along well. This region has just been through a very tumultuous time where conversions and migrations have distorted the old religious balance, perhaps forever. Now that the situation seems to have stabilized it is time to spread the word of our state religion and promote a common unified religious culture among our people once and for all."

 abm_nubian_desert_cavalry: "Desert Cavalry"
 abm_nubian_desert_cavalry_desc: "The best way to control the great expanses of the desert is by being mobile. We must train and maintain an efficient Cavalry in order to defend ourselves and expand in these lands."

 abm_nubian_fortified_strongholds: "Fortified Strongholds"
 abm_nubian_fortified_strongholds_desc: "While not all of our lands are desert they are surrounded by it and to some extent divided by it. Let us create a chain of fortifications to bind our lands together and defend the Trans-Saharan trade routes as well as the cataracts of the Nile themselves from robbers as well as rebels and foreign invaders."

 abm_nubian_ideas_ambition: "Nubian Ambition"
 abm_nubian_ideas_ambition_desc: "Nubian Ambition"

 abm_med_ideas_tradition_1: "Medri Bahri Traditions I"
 abm_med_ideas_tradition_1_desc: "Medri Bahri Traditions I"

 abm_med_ideas_tradition_2: "Medri Bahri Traditions II"
 abm_med_ideas_tradition_2_desc: "Medri Bahri Traditions II"

 abm_med_kings_of_the_sea: "Kings of the Sea"
 abm_med_kings_of_the_sea_desc: "The ruler of our state is known as the 'Bahr Negasi' or the King of the Sea and the contact with the Red Sea and its flow of trade and people has always been a defining feature of our history."

 abm_med_ancient_christian_traditions: "Christian Legacy"
 abm_med_ancient_christian_traditions_desc: "In 328 AD the first bishop of Axum was named by the Pope of Alexandria. Much has transpired since that day but we still hold on to our Christian faith and look to Alexandria and Ethiopia for religious guidance. Let us safeguard the Christian traditions of our ancestors and integrate the monastic orders in our society."

 abm_med_diplomatic_flexibility: "Diplomatic Flexibility"
 abm_med_diplomatic_flexibility_desc: "Our traditional powerbase is not as large as those of some of our neighbors. It is imperative that we do not tie our country diplomatically to any single one of our neighbors. Instead we need to be prepared to make deals with whoever necessary to protect ourselves from Christian and Muslim foes alike."

 abm_med_strengthen_central_rule: "Strengthen Central Rule"
 abm_med_strengthen_central_rule_desc: "When the state falters local influential elders, the Shimagile, are always ready to step in and assume responsibility for the day-to-day running of their provinces. As we move to centralize our rule, however, perhaps it is time to let these elders either assume positions in our administration or take a step back to be replaced by government appointed officials."

 abm_med_independent_traditions: "Independent Traditions"
 abm_med_independent_traditions_desc: "Over the centuries we have from time to time had to accept foreign overlords due to diplomatic circumstances beyond our control. Once our society has recovered, however, we have never hesitated to throw out any foreign officials and raise our own banners in rebellion. Whether fighting the Ethiopians to the south or the Muslim Empires to the north we must be ready to defend every last piece of our land."

 abm_med_strengthen_red_sea_trade: "Promote the Red Sea Trade"
 abm_med_strengthen_red_sea_trade_desc: "The spice transit trade is not what it once was and while the products of Africa and Arabia themselves still attract far-away merchants our fortunes seem to have declined with the decrease of the Red Sea Spice route. We must build on our strengths and instead of yearning for what once was it is time we reorient our trade policies to fully focus on the stream of goods from Ethiopia and the Sudan."

 abm_med_princely_ambitions: "Princely Ambition"
 abm_med_princely_ambitions_desc: "The age of princes is upon us and it is time we realize our full potential as a power in this region. Let us expand our state at the expense of our neighbors. We must not let ancient traditions or allegiances hinder us for if we don't grab what land and power we can someone else will."

 abm_med_ideas_ambition: "Medri Bahri Ambition"
 abm_med_ideas_ambition_desc: "Medri Bahri Ambition"

 abm_jol_ideas_tradition_1: "Jolof Traditions I"
 abm_jol_ideas_tradition_1_desc: "Jolof Traditions I"

 abm_jol_ideas_tradition_2: "Jolof Traditions II"
 abm_jol_ideas_tradition_2_desc: "Jolof Traditions II"

 abm_jol_legacy_of_ndiadiane_ndiaye: "Legacy of Ndiadiane Ndiaye"
 abm_jol_legacy_of_ndiadiane_ndiaye_desc: "In the beginning, there were six kingdoms that competed against each other. They were small and weak, until a Ndiadiane Ndiaye appeared and united us all under a single banner. The original kingdoms still existed, but worked together under the lead of the Bur."

 abm_jol_tribute_of_the_five_kingdoms: "The Tribute of the Five Kingdoms"
 abm_jol_tribute_of_the_five_kingdoms_desc: "Since the times of Ndiadiane Ndiaye, the Bur has been the King of Jolof, and the Kingdoms of Baol, Cayor Saloum, Sine and Waalo paid tribute to him as a recognition of his position as leader of them all. We will expand this system to any other nation that kneels before us."

 abm_jol_adherents_of_islam: "Adherents of Islam"
 abm_jol_adherents_of_islam_desc: "A big part of our people are non-believers, but the bridles of the country are held by devout men, God-Fearing Muslims. It is because of having Allah by our side that our fight is just and fair."

 abm_jol_ambassadors_abroad: "Ambassadors Abroad"
 abm_jol_ambassadors_abroad_desc: "Due to the constant visit of traders from abroad to our shores, we have learned about how big the world is. Our people, naturally curious, have developed this spirit of adventure and many willing travelers have arisen, giving us an abundant stock of possible ambassadors to choose from."

 abm_jol_qadi_tribunals: "Qadi Tribunals"
 abm_jol_qadi_tribunals_desc: "There is no fairer law than the law of God, but only men can ensure that other men follow the doctrines of Islam as they should. For that task we have selected the finest Qadi, or magistrates, to lead our people through the correct path of faith and devotion as the Shariah teaches."

 abm_jol_wolof_griots: "Wolof Griots"
 abm_jol_wolof_griots_desc: "Our history is rich in tales, stories, songs and poems, and it is the job of the famous Wolof griots to collect and preserve them. Our rulers have extensively used these griots to amuse our people and let them know about our greatness, so they can give us back the love we have for them."

 abm_jol_paying_the_waref: "Paying the Waref"
 abm_jol_paying_the_waref_desc: "In our realm, most people do not own the land they cultivate. In order to crop that land, the farmers in the villages across the country pay a rent or waref to the landowners. Only by keeping this well established system can we ensure the prosperity of our nation."

 abm_jol_ideas_ambition: "Jolof Ambition"
 abm_jol_ideas_ambition_desc: "Jolof Ambition"

 abm_ash_ideas_tradition_1: "Ashanti Traditions I"
 abm_ash_ideas_tradition_1_desc: "Ashanti Traditions I"

 abm_ash_ideas_tradition_2: "Ashanti Traditions II"
 abm_ash_ideas_tradition_2_desc: "Ashanti Traditions II"

 abm_ash_idea_1: "Elder Council"
 abm_ash_idea_1_desc: "The ruler of our land should be the final authority, but he should not have unlimited power. Ultimately, his fealty is to the state and, should he fail the state, the council of elders should have the power to check him."

 abm_ash_idea_2: "The Slave Forts"
 abm_ash_idea_2_desc: "Foreigners have come to our land looking to trade for slaves, ivory and gold. We should give them these things in return for obtaining the goods and technologies that only they can produce."

 abm_ash_idea_3: "The Akan Coalition"
 abm_ash_idea_3_desc: "We should draw upon the support of neighboring Akan cities and states to assist our own troops in warfare against our enemies. In this way we can expand our power."

 abm_ash_idea_4: "The Golden Stool"
 abm_ash_idea_4_desc: "The Golden Stool holds the soul of our nation, brought down from the heaven by the priest and advisor of the first Asantehene. He who sits in it, rules. "

 abm_ash_idea_5: "Centralized Coalition"
 abm_ash_idea_5_desc: "Now that we have formed a coalition of our neighbors, we must unite and centralize this coalition, focusing authority upon the person of the king of Ashante. In that way, we can bring hundreds of thousands of men into battle. "

 abm_ash_idea_6: "Osei Kwadwo's Reforms"
 abm_ash_idea_6_desc: "We must establish a true national administration, in the service of the king, to ensure that our realm is well-governed, and we draw the greatest strength from each of the villages under our rule."

 abm_ash_idea_7: "National Army"
 abm_ash_idea_7_desc: "We are one people, and we have one army. By bringing troops from across the empire and conquered people into the military, we ensure better their integration within Ashante society, and increase their acceptance o our rule."

 abm_ash_ideas_ambition: "Ashanti Ambition"
 abm_ash_ideas_ambition_desc: "Ashanti Ambition"

 abm_oyo_ideas_tradition_1: "Oyo Traditions I"
 abm_oyo_ideas_tradition_1_desc: "Oyo Traditions I"

 abm_oyo_ideas_tradition_2: "Oyo Traditions II"
 abm_oyo_ideas_tradition_2_desc: "Oyo Traditions II"

 abm_oyo_yoruba_origin_story: "Yoruba Origin Story"
 abm_oyo_yoruba_origin_story_desc: "The origin story of Oyo is one of legends and myths. According to our traditional origin stories, the world was formed by the son of Olorun, who spread earth around in water, which later formed our world - and Oyo."

 abm_oyo_oduduwa_mythos: "Oduduwa Mythos"
 abm_oyo_oduduwa_mythos_desc: "Our traditions tell of a great hero, who is a great Yoruba ancestor and the first king of Oyo: Oduduwa. According to our oral stories he was the first man to walk on this world, while other traditions suggest that he escaped from Mecca and founded our kingdom. Regardless of what the truth might be, his cultural legacy is our heritage."

 abm_oyo_ile_ife_protector: "The City of 401 Deities"
 abm_oyo_ile_ife_protector_desc: "Ile Ife is the great City of 401 Deities. It is our duty to spread its religious influence and protect it from the heathens."

 abm_oyo_balnce_of_power: "Balance of Power"
 abm_oyo_balnce_of_power_desc: "The Alaafin, the ruler of Oyo, is kept in check by the Oyo Mesi. Should the Alaafin ever go too far with the power abuse so has the Oyo Mesi the right and duty to force the ruler to abdicate - most of the time through a ritual suicide."

 abm_oyo_the_oyo_cavalry: "The Oyo Cavalry"
 abm_oyo_the_oyo_cavalry_desc: "Our military is built on the strong backs of our cavalry. We should ensure that we have permanent access to them to reinforce our army."

 abm_oyo_emporium_of_the_south: "Emporium of the South"
 abm_oyo_emporium_of_the_south_desc: "The Muslims control the trade of the North in West Africa, but they have barely any coasts to work with. We on the other hand have it! We are the emporium of the south and are the connection of trade between Europe and Africa."

 abm_oyo_feudal_unity: "Feudal Unity"
 abm_oyo_feudal_unity_desc: "Our state is very decentralized through the use of tributary states and vassals. Through a combination of granting autonomy of the provinces while at the same time gaining the recognition of the imperial authority we can ensure stability and unity for our realm."

 abm_oyo_ideas_ambition: "Oyo Ambition"
 abm_oyo_ideas_ambition_desc: "Oyo Ambition"

 abm_ben_ideas_tradition_1: "Beninese Traditions I"
 abm_ben_ideas_tradition_1_desc: "Beninese Traditions I"

 abm_ben_ideas_tradition_2: "Beninese Traditions II"
 abm_ben_ideas_tradition_2_desc: "Beninese Traditions II"

 abm_ben_curb_the_uzama: "Curb the Uzama"
 abm_ben_curb_the_uzama_desc: "During his reign, King Ewuare the Great has reformed the government of Benin, revoking the right of local chiefs, or Uzama, to appoint a king of their choice and replacing it with a system of primogeniture, or inheritance by the eldest son."

 abm_ben_isiatua: "Isiatua"
 abm_ben_isiatua_desc: "The wars waged by Benin revolve primarily around sieges. The strategy of destroying or cutting off the enemy's food and water supplies to force a surrender is a critical part of Benin warfare."

 abm_ben_appointment_of_the_onotueyevbo: "Appointment of the Onotueyevbo"
 abm_ben_appointment_of_the_onotueyevbo_desc: "The Onotueyevbo are representatives of the king who act as judicial channels between the king and the villages. They are also in charge of collecting tribute."

 abm_ben_the_walls_of_benin: "The Walls of Benin"
 abm_ben_the_walls_of_benin_desc: "Benin boasts of great fortifications, with the walls of Benin City the second largest in the world, and the network of ramparts surrounding the estates outside the city the most extensive earthwork in the world."

 abm_ben_guilds: "Benin Guilds"
 abm_ben_guilds_desc: "An organized system of guilds form part of the economic backbone of the Kingdom of Benin. These guilds produce tools and weapons required by the state, or crafts and sculptures for trading."

 abm_ben_adoption_of_benin_customs: "Adoption of Benin Customs"
 abm_ben_adoption_of_benin_customs_desc: "As Benin is shifting from a policy of military expansion to one of consolidation, many of the conquered or subjugated states are adopting Benin titles and social structures, integrating them into our state."

 abm_ben_regulation_of_trade: "Regulation of Trade"
 abm_ben_regulation_of_trade_desc: "In Benin, only representatives of the king are allowed to trade with the Europeans. This has forced all trade with Europe to go through royal channels, allowing the state to keep a bigger cut of the profits."

 abm_ben_ideas_ambition: "Beninese Ambition"
 abm_ben_ideas_ambition_desc: "Beninese Ambition"

 abm_dah_ideas_tradition_1: "Dahomey Traditions I"
 abm_dah_ideas_tradition_1_desc: "Dahomey Traditions I"

 abm_dah_ideas_tradition_2: "Dahomey Traditions II"
 abm_dah_ideas_tradition_2_desc: "Dahomey Traditions II"

 abm_dah_ideas_ambition: "Dahomey Ambition"
 abm_dah_ideas_ambition_desc: "Dahomey Ambition"

 abm_west_african_ideas_tradition_1: "West African Traditions I"
 abm_west_african_ideas_tradition_1_desc: "West African Traditions I"

 abm_west_african_ideas_tradition_2: "West African Traditions II"
 abm_west_african_ideas_tradition_2_desc: "West African Traditions II"

 abm_west_african_idea_1: "Griot Tradition"
 abm_west_african_idea_1_desc: "The storytellers, praise-singers, poets and musicians of our people, the griots are teachers and advisors. We should heed them, and ensure that their knowledge and ways are passed down to new generations of griots."

 abm_west_african_idea_2: "Salt Caravans"
 abm_west_african_idea_2_desc: "Every year, great salt caravans travel across the land from the desert mine. The precious bread of white powder they bring us enable the preservation of food."

 abm_west_african_idea_3: "Kola Nuts"
 abm_west_african_idea_3_desc: "The drink of the kola tree is of essential value in our ancient customs. We should ensure we never want for a supply of them."

 abm_west_african_idea_4: "Ancestors and Crescent"
 abm_west_african_idea_4_desc: "From the north, strangers preaching foreign and merchants worshipers of those faith have come. To the south, followers of the ancient ways of our people still remain. We must strive to establish balance between these groups, and ensure that both find themselves represented in the ways of our state."

 abm_west_african_idea_5: "Royal Stables"
 abm_west_african_idea_5_desc: "It is unacceptable for a ruler to rule without possessing great steeds as a mark of his powers. We should ensure to always have access to a supply of horses!"

 abm_west_african_idea_6: "The Great River"
 abm_west_african_idea_6_desc: "Great rivers like the Niger and Volta define much of the African continent, greatly speeding up transportation and travel. We should adopt these great rivers as means of transportation."

 abm_west_african_idea_7: "Maintain Minor Kings"
 abm_west_african_idea_7_desc: "While we are of course the true great kings, there can be other kings, who should rule under us. Let them rule their own people and their own villages, whom they know best, in our name."

 abm_west_african_ideas_ambition: "West African Ambition"
 abm_west_african_ideas_ambition_desc: "West African Ambition"

 abm_air_ideas_tradition_1: "Air Traditions I"
 abm_air_ideas_tradition_1_desc: "Air Traditions I"

 abm_air_ideas_tradition_2: "Air Traditions II"
 abm_air_ideas_tradition_2_desc: "Air Traditions II"

 abm_taghlamt: "The Taghlamt"
 abm_taghlamt_desc: "From the salt deposits of the desert to the great cities of Hausaland and the grazing lands of the Air, the great caravans of ten thousand camels go, bearing much wealth. Our realm grows richer for it."

 abm_cross_of_agades: "Cross of Agades"
 abm_cross_of_agades_desc: "When a child come of age, he should receive from his father a silver cross, marking the four cardinal directions, to symbolize his freedom to go wherever he pleases."

 abm_legacy_of_tin_hinan: "Legacy of Tin-Hinan"
 abm_legacy_of_tin_hinan_desc: "The history of our people begins with the great Queen Tin-Hinan, who led us south from the Tafilalt. The traditions she began must endure under the rule of our Amenokal."

 abm_blue_people: "The Blue People"
 abm_blue_people_desc: "The indigo dyes of our veil stain our faces. Among our people, this blue shading has come to be seen as a sign of the wearer's prestige and affluence."

 abm_inadan_castes: "Inadan Castes"
 abm_inadan_castes_desc: "By keeping in the upper echelon of our societies castes of blacksmith and other highly skilled artisans, we ensure that the arts and crafts of our people will always be valued."

 abm_nomadic_traditions: "Nomadic Traditions"
 abm_nomadic_traditions_desc: "The people of Air have long been nomads. We have wandered the sunfire-scorched earth of the desert, from waterhole to waterhole. Even now, as everything changes and we build a city for our people, we must not forget our roots."

 abm_ineslemen_teachings: "Ineslemen Teachings"
 abm_ineslemen_teachings_desc: "A caste among our people have dedicated themselves to instructing our people in the ways of better adherence to Islam. Their growing influence has helped strengthen the faith of our people."

 abm_air_ideas_ambition: "Air Ambition"
 abm_air_ideas_ambition_desc: "Air Ambition"

 abm_mossi_ideas_tradition_1: "Mossi Traditions I"
 abm_mossi_ideas_tradition_1_desc: "Mossi Traditions I"

 abm_mossi_ideas_tradition_2: "Mossi Traditions II"
 abm_mossi_ideas_tradition_2_desc: "Mossi Traditions II"

 abm_riale_and_yennenga: "Rialé and Yennenga"
 abm_riale_and_yennenga_desc: "The tale of our founding harkens back to the Mamprussi princess Yennenga and the Mande hunters Rialé. We cherish and maintain their legacy, for it is through them that we have come to rule."

 abm_mossi_cavalry_raids: "Cavalry Raids"
 abm_mossi_cavalry_raids_desc: "From the time of our ancestors, horsemen have been the tool of our conquests. Their thunder hooves across the grasslands of the Sahel spread fear in our enemies, and has allowed us many victories."

 abm_nyonnyonse_vassals: "Nyonnyonse Vassals"
 abm_nyonnyonse_vassals_desc: "As we conquer new land, we encounter new people whose destiny it is to be ruled by us. We should integrate them as an important part of our society, a caste of powerful vassals entrusted with protecting and caring for the land."

 abm_nakomse: "The Nakomse"
 abm_nakomse_desc: "All power flows from the Emperor, and only his relatives should hold it. The nobility should be selected to serve in his name, from among those relatives he can trust."

 abm_land_of_the_ancestors: "Land of the Ancestors"
 abm_land_of_the_ancestors_desc: "Land is not mere property or dust; it is our connection to the great men who have gone before us. From the better lands beyond, they watch over us, and we must never let the connection be severed."

 abm_honoring_the_masks: "Honoring the Masks"
 abm_honoring_the_masks_desc: "Our masks hold power. They oversee funerals and ceremonies, to ensure that those whom we seek to honor are properly honored."

 abm_friday_court: "The Friday Court"
 abm_friday_court_desc: "The ruler has a duty to his people. He is not free to absent himself from their presence, not even to avenge insult against him or recover stolen symbols of his rule; for his chief duty is to hold court and listen to the pleas of his subjects."

 abm_mossi_ideas_ambition: "Mossi Ambition"
 abm_mossi_ideas_ambition_desc: "Mossi Ambition"

 abm_kbo_ideas_tradition_1: "Kanem Bornuan Traditions I"
 abm_kbo_ideas_tradition_1_desc: "Kanem Bornuan Traditions I"

 abm_kbo_ideas_tradition_2: "Kanem Bornuan Traditions II"
 abm_kbo_ideas_tradition_2_desc: "Kanem Bornuan Traditions II"

 abm_land_of_ngazargamu: "Land of Ngazargamu"
 abm_land_of_ngazargamu_desc: "Ngazargamu was the fortified capital of the Kanem Bornu Empire. It was in this area the core of the leaders lived."

 abm_sayfawad_dynasty: "Sayfawa Dynasty"
 abm_sayfawad_dynasty_desc: "The Sayfawa dynasty was the one that ruled the lands of Kanem Bornu. They lasted almost 500 years, holding together a great nation."

 abm_alumas_reforms: "Aluma's Reforms"
 abm_alumas_reforms_desc: "A strong realm demand administrative reforms. By instituting a Court of Appeal made of renowned scholars of Islam, relying on loyal and well-educated slaves to advise the ruler, and attracting talented individuals from foreign realm, our administration can grow."

 abm_house_of_kanem: "House of Kanem"
 abm_house_of_kanem_desc: "To inspire pilgrims from our land to carry out their religious duty we should fund a hostel in Mecca, where they would find lodging at the end of their journey."

 abm_duties_on_sahara_trade: "Duties on Sahara Trade"
 abm_duties_on_sahara_trade_desc: "Every year great caravans of salt leave our homelands on journeys across the desert. By imposing tariffs and duties on this trade, we can generate increased revenues."

 abm_kbo_ideas_ambition: "Kanem Bornuan Ambition"
 abm_kbo_ideas_ambition_desc: "Kanem Bornuan Ambition"

 abm_hausa_ideas_tradition_1: "Hausan Traditions I"
 abm_hausa_ideas_tradition_1_desc: "Hausan Traditions I"

 abm_hausa_ideas_tradition_2: "Hausan Traditions II"
 abm_hausa_ideas_tradition_2_desc: "Hausan Traditions II"

 abm_heirs_of_bayajida: "Heirs of Bayajida"
 abm_heirs_of_bayajida_desc: "The great warrior-prince Bayajida journeyed from far-off land to Hausaland, where he married queen Daura. The descendants of their union form the great royal lineage of the major cities of Hausaland, and they remember the ties that bind them."

 abm_regnal_chronicles: "Regnal Chronicles"
 abm_regnal_chronicles_desc: "We should record the history of our kings and their deeds in great chronicles, that they may be passed down across the generations and always remembered."

 abm_sarakunan_babba: "Sarakunan Babba"
 abm_sarakunan_babba_desc: "Though our cities are divided, they are all part a complex network where each has a role to play. For Kano and Rano, that role, which benefits all Hausaland, is that of the 'Kings of Indigo'. Their production of this most valuable of dye benefits all of Hausaland."

 abm_sarakunan_kasuwa: "Sarakunan Kasuwa"
 abm_sarakunan_kasuwa_desc: "The goods of all Hausaland flows to the vast market towns of Daura and Katsina, the 'Kings of the Market'. All Hausaland is welcome to trade in their markets, and the constant flows of good bring wealth to many among the Hausa."

 abm_sarkin_yaki: "Sarkin Yaki"
 abm_sarkin_yaki_desc: "As we face the ever-present threat of our enemies, we should always remember the vigil of Gobir, the King of War. They stand guard against invaders from the desert, protecting all the Hausa cities from threats in that direction."

 abm_sarkin_bayi: "Sarkin Bayi"
 abm_sarkin_bayi_desc: "The constant needs of our people for more labor require a flow of slaves. It falls to Zazzau, the King of Slaves, to maintain a steady stream of slaves to all the great cities of Hausaland, ensuring we never want for the people to create and build."

 abm_borno_refugees: "Borno Refugees"
 abm_borno_refugees_desc: "The troubled times in the lands to the east have brought many refugees to our lands. From them, we can learn much of the new knowledge of realms beyond our borders, for the greater glory of our land."

 abm_hausa_ideas_ambition: "Hausan Ambition"
 abm_hausa_ideas_ambition_desc: "Hausan Ambition"

 abm_horn_of_african_ideas_tradition_1: "Horn of African Traditions I"
 abm_horn_of_african_ideas_tradition_1_desc: "Horn of African Traditions I"

 abm_horn_of_african_ideas_tradition_2: "Horn of African Traditions II"
 abm_horn_of_african_ideas_tradition_2_desc: "Horn of African Traditions II"

 abm_horn_of_african_aksumite_legacy: "Aksumite Legacy"
 abm_horn_of_african_aksumite_legacy_desc: "The Horn of Africa was once home of the famous Aksumite Empire. Over time its influence dwindled, and in the end it got replaced by Ethiopia. Still, its legacy lives within our culture up to this day."

 abm_horn_of_african_punt_legend: "The Land of Punt Legend"
 abm_horn_of_african_punt_legend_desc: "Although someone might consider the Land of Punt to be a myth, it does not change the fact that we are its successor state. Just as the Land of Punt so shall we transport our goods to the furthest places of this world."

 abm_horn_of_african_highland_cultivation: "Highland Cultivation"
 abm_horn_of_african_highland_cultivation_desc: "Regions near the Arabian peninsula are rarely known for their fertile soil or their temperate climate. Yet here we live, in the great highlands of the Horn of Africa - neighboring the desert peninsula. Our people adapted their way of life and cultivate this mountainous region."

 abm_horn_of_african_oromon_warriors: "Oromo Warriors"
 abm_horn_of_african_oromon_warriors_desc: "The Oromo lived in the Horn of Africa much longer than one might expect. Most people remember them for their immigration into the heart land of the Horn. What is less known is their fierceness and strength in combat."

 abm_horn_of_african_religious_melting_pot: "Religious People"
 abm_horn_of_african_religious_melting_pot_desc: "The Horn of Africa houses several different religions very close to each other. Even though the states lead religious wars against each other, it is to nobody's surprise that our people interact with the heathens in a more peaceful manner, and even adapt elements of foreign religions into their own."

 abm_horn_of_african_cushitic_language: "Cushitic Language"
 abm_horn_of_african_cushitic_language_desc: "The Cushitic languages are widely spoken in the Horn and the different states in the region are more than happy to use this language for diplomacy."

 abm_horn_of_african_religious_defensive_nature: "Defensive Nature"
 abm_horn_of_african_religious_defensive_nature_desc: "Our people are well tempered. We are of a sincere defensive nature and the terrain of our home region supports this mindset."

 abm_horn_of_african_ideas_ambition: "Horn of African Ambition"
 abm_horn_of_african_ideas_ambition_desc: "Horn of African Ambition"

 abm_somali_ideas_tradition_1: "Somali Traditions I"
 abm_somali_ideas_tradition_1_desc: "Somali Traditions I"

 abm_somali_ideas_tradition_2: "Somali Traditions II"
 abm_somali_ideas_tradition_2_desc: "Somali Traditions II"

 abm_somali_maritime_heritage: "Maritime Heritage"
 abm_somali_maritime_heritage_desc: "Since time immemorial Somali ships have traveled to faraway markets, from the Arab Peninsula, the Swahili Coast and Egypt to India, Persia or even further. Along the coasts of Africa a great number of Somali seafaring cities have thrived and still thrive today continuing this heritage."

 abm_somali_qalqads: "Qalqads"
 abm_somali_qalqads_desc: "The best way to be safe in a world as dangerous as this is to build a wall. A number of sensibly placed forts throughout our realm will help both defend our ports against western pirates and our settlements against the waves of migrating pastoralists of the inland."

 abm_somali_clans: "Somali Clans"
 abm_somali_clans_desc: "While the loyalty of all our subjects to the state is undoubtedly great there is a bond that goes beyond the borders that some would draw on maps. We can always rely on our clansmen to support us as they rely on us to support them. Whether they reside inside our borders or not they are an extra resource to draw upon in times of need."

 abm_somali_offensive_warfare: "Offensive Warfare"
 abm_somali_offensive_warfare_desc: "Islam is far from a young religion in this region, yet it is not as firmly entrenched as in some other areas of the world either. Strong Christian kingdoms have from time to time come to threathen our state in the past and with the arrival of Western Christian ships along the coasts of East Africa it seems some precautionary measures might be needed. Let us look to the wider Muslim world for its expertise and equipment. Let our armies be as frightening as those of the Ottoman Empire."

 abm_somali_indian_ocean_trade: "Indian Ocean Trade"
 abm_somali_indian_ocean_trade_desc: "The Indian Ocean is in many ways one big economic sphere. Demand for slaves in the Indian Deccan or our abundant frankincense in Yemen dictate the conditions of our economy. Let us wisely consider our policies in regards to this trade so that we may grow fat from it rather than risk the merchants looking to the ports of our neighbors."

 abm_somali_corsairs_of_the_red_sea: "Corsairs of the Red Sea"
 abm_somali_corsairs_of_the_red_sea_desc: "We are not the only ones to take an interest in the wealth of the Indian Ocean and the Red Sea. Be they western Pirates or Arab Corsairs they're all out to profit from the trade which we live of. We must meet this challenge and encourage our own Corsairs to take the fight to the enemy."

 abm_somali_perso_arab_influx: "Arab and Persian Influx"
 abm_somali_perso_arab_influx_desc: "Some have come to regard our lands as a refuge when their homelands descend into increasingly chaotic conditions. Let us emphasize this trend and try to attract the valuable talents of the wider Muslim world to our borders where they can be put to good use."

 abm_somali_ideas_ambition: "Somali Ambition"
 abm_somali_ideas_ambition_desc: "Somali Ambition"

 abm_ada_ideas_tradition_1: "Adalite Traditions I"
 abm_ada_ideas_tradition_1_desc: "Adalite Traditions I"

 abm_ada_ideas_tradition_2: "Adalite Traditions II"
 abm_ada_ideas_tradition_2_desc: "Adalite Traditions II"

 abm_ada_our_infinite_struggle: "Our Infinite Struggle"
 abm_ada_our_infinite_struggle_desc: "For centuries, Muslims and Christians have clashed in the Horn of Africa for the supremacy over the opposing side. As the natural leaders of the Muslims, we have to be the spearhead that will bring our faith to the victory over the heathens."

 abm_ada_a_monarchial_imamate: "A Monarchical Imamate"
 abm_ada_a_monarchial_imamate_desc: "Separation of state and faith is non-existent in our tradition, but both work together as one. Our leader is both our ruler and our highest imam, as faith is inseparable from rulership as rulership is from faith. Only a devout man can bring us prosperity."

 abm_ada_zeila_and_harar: "Zeila and Harar"
 abm_ada_zeila_and_harar_desc: "One by the sea and another in the mountains, both Zeila and Harar represent the biggest sources of wealth and culture of our country. Their strength as trade and education hubs enriches not only our coffers, but also our spirit and brings us closer to God."

 abm_ada_mujahiduir_cavalry: "Mujahidun Cavalry"
 abm_ada_mujahiduir_cavalry_desc: "For generations, our people have bred the best horses in the region that will make us win the Jihad against the christians. This cavalry is called the Mujahiduir and they are the finest and bravest examples of horses and horsemen."

 abm_ada_unite_the_clans: "Unite the Clans"
 abm_ada_unite_the_clans_desc: "As Somalians, our traditional setup has been divided into Clans, and those Clans into subclans. This division leads to competition and infighting and only our foes benefit from it. The time to unite as one and end our differences has come."

 abm_ada_yahu_yahu: "Yahu Yahu"
 abm_ada_yahu_yahu_desc: "When we fight the Christians we shout Yahu Yahu to fill our hearts with courage and that of the enemy with fear. The soul of the coward cannot resist it, and since they do not have Allah by their side, they always flee showing their nature."

 abm_ada_embrace_the_cannons: "Embrace the Cannons"
 abm_ada_embrace_the_cannons_desc: "Our realm was the first to adopt cannons as a common tool in the battlegrounds of the Horn of Africa and that has given us a big advantage over our foes. We should not leave this edge to be wasted and use it against our enemies."

 abm_ada_ideas_ambition: "Adalite Ambition"
 abm_ada_ideas_ambition_desc: "Adalite Ambition"

 abm_mdi_ideas_tradition_1: "Mogadishan Traditions I"
 abm_mdi_ideas_tradition_1_desc: "Mogadishan Traditions I"

 abm_mdi_ideas_tradition_2: "Mogadishan Traditions II"
 abm_mdi_ideas_tradition_2_desc: "Mogadishan Traditions II"

 abm_mdi_indian_ocean_trade: "Indian Ocean Trade"
 abm_mdi_indian_ocean_trade_desc: "The Indian Ocean trade takes our merchants as far as Arabia, Hindustan, Malaya, and even China. Let us keep supporting our merchants so we can increase our profit from this lucrative trade."

 abm_somali_sailors: "Somali sailors"
 abm_somali_sailors_desc: "Our sailors are aware of the region's monsoons, and use them to link themselves with the port cities of the Indian Ocean and the Red Sea. They also developed an understandable way of defining the islands of the Indian Ocean in their navigational reach. They would name archipelagos or groups of islands after the most important island there from the Somali point of view."

 abm_mdi_east_african_gold_trade: "East African Gold Trade"
 abm_mdi_east_african_gold_trade_desc: "Historically Somali merchants from Mogadishu established a colony in Mozambique to extract gold from the mines in Sofala and controlled the East African gold trade for several centuries."

 abm_city_of_mogadishu: "City of Mogadishu"
 abm_city_of_mogadishu_desc: "Ibn Battuta was extremely impressed during his visit in the 14th century by the splendor of Mogadishu. Vasco Da Gama, who passed by Mogadishu in the 15th century, noted that it was a large city with houses of four or five stories high and big palaces in its center and many mosques with cylindrical minarets."

 abm_mogadishan_currency: "Mogadishan Currency"
 abm_mogadishan_currency_desc: "In order to facilitate regional trade, we should start minting our own coins, a move which will have the effect of centralizing our commercial hegemony."

 abm_horn_of_africa: "Horn of Africa"
 abm_horn_of_africa_desc: "From India and Arabia, trading sea vessels come to lay anchor at our beautiful city, as the first natural harbor in the Horn of Africa to trade and take supplies on their journey to East Africa."

 abm_toob_benadir: "Toob Benadir"
 abm_toob_benadir_desc: "Historically Mogadishu was the center of a thriving textile industry known as toob benadir, specialized for the markets in Egypt."

 abm_mdi_ideas_ambition: "Mogadishan Ambition"
 abm_mdi_ideas_ambition_desc: "Mogadishan Ambition"

 abm_aju_ideas_tradition_1: "Ajuuraan Traditions I"
 abm_aju_ideas_tradition_1_desc: "Ajuuraan Traditions I"

 abm_aju_ideas_tradition_2: "Ajuuraan Traditions II"
 abm_aju_ideas_tradition_2_desc: "Ajuuraan Traditions II"

 abm_aju_maritime_enterprise: "Maritime Enterprise"
 abm_aju_maritime_enterprise_desc: "Since ancient times our ancestors were an important link in the Horn of Africa connecting the commerce of the region with the rest of the world. Our sailors and merchants were the main suppliers of spices and various luxury goods. We should keep supporting this profitable trade network and maintain maritime contacts with Arabia, Hindustan, Persia, Egypt, and as far away as China."

 abm_istunka_tournament: "Istunka Tournament"
 abm_istunka_tournament_desc: "Historically the Istunka was an annually held tournament developed in the Ajuuraan State, and was centralized in the 19th century under the Sultanate of Geledi. The event consists of several teams engaging each other in mock combat."

 abm_gareen_imams: "Gareen Imams"
 abm_gareen_imams_desc: "While the House of Gareen was the ruling hereditary dynasty of the Ajuuraan State, they claimed supremacy and religious legitimacy over other groups in the Horn of Africa."

 abm_aju_muslim_migrations: "Muslim Migrations"
 abm_aju_muslim_migrations_desc: "Muslims from Hindustan, Al-Andalus, Arabia and Persia come and settle in our coastal cities. Some seek refugee because of the instability in their regions, others come to conduct business or for religious reasons. Due to their strong tradition in learning, they will enrich our lands and we will employ them as advisers and commanders."

 abm_aju_hydraulic_empire: "Hydraulic Empire"
 abm_aju_hydraulic_empire_desc: "By monopolizing the water resources of the Jubba and Shebelle Rivers we have the control of taxation and agriculture in this region firmly in hand."

 abm_aju_expelling_the_infidel: "Expelling the Infidel"
 abm_aju_expelling_the_infidel_desc: "We have received news that the cities of our Swahili brethren to the South were sacked and plundered by the Portuguese infidels. These pesky westerners won't stop until they subjugate the rest of East Africa. We should prepare ourselves and show fierce resistance!"

 abm_aju_received_assistance: "Ottoman Assistance"
 abm_aju_received_assistance_desc: "Our traditional weapons such as the sword, spear, and bow are not sufficient any more in our struggle against the Portuguese. By keeping good relations with our Turkish brethren we could receive assistance in the form of firearms and cannons which will be much more effective in dealing with these infidels."

 abm_aju_ideas_ambition: "Ajuuraan Ambition"
 abm_aju_ideas_ambition_desc: "Ajuuraan Ambition"

 abm_fulani_jihad_ideas_tradition_1: "Fulani Traditions I"
 abm_fulani_jihad_ideas_tradition_1_desc: "Fulani Traditions I"

 abm_fulani_jihad_ideas_tradition_2: "Fulani Traditions II"
 abm_fulani_jihad_ideas_tradition_2_desc: "Fulani Traditions II"

 abm_wandering_scholars: "Wandering Scholars"
 abm_wandering_scholars_desc: "Communities of wise men of Islam and marabout live among our lands, offering teachings in the way of the Faith to all who will listen, spreading the one true faith among our people."

 abm_unrighteous_kings: "Unrighteous Kings"
 abm_unrighteous_kings_desc: "If the king is a Muslim, his land is a land of Muslims. If the king is an unbeliever, then his land is the land of unbelievers, without question. We should never allow ourselves to be ruined by unbelievers."

 abm_imams_and_emirs: "Imams and Emirs"
 abm_imams_and_emirs_desc: "Only faithful warriors who have strived to advance the cause of Islam, and learned scholars, are fit to rule in our society. They are examples for all to follow."

 abm_caliph_in_africa: "The Caliph in Africa"
 abm_caliph_in_africa_desc: "The faithful must be led, and those who claim in far away land to be the caliph have failed in their duty. Let us have a caliph in our lands, and let all faithful look to him for guidance."

 abm_zambezi_ideas_tradition_1: "Zambezi Traditions I"
 abm_zambezi_ideas_tradition_1_desc: "Zambezi Traditions I"

 abm_zambezi_ideas_tradition_2: "Zambezi Traditions II"
 abm_zambezi_ideas_tradition_2_desc: "Zambezi Traditions II"

 abm_zambezi_warrior_culture: "Warrior Culture"
 abm_zambezi_warrior_culture_desc: "Our society cherishes skilled warriors above all else. While we have often acknowledged foreign overlords we have always earned our right to autonomy by spearheading the expansion of their realm. But great warriors can be found in many places. Rather than compete with surrounding tribes let us open our arms to skilled warriors wherever we find them. This way we will not have to fear fierce opponents such as the cannibalistic Zimba as they will rather be fighting for us than against us."

 abm_zambezi_maravi_influences: "Maravi Influences"
 abm_zambezi_maravi_influences_desc: "The Maravi Kalonga state has brought many new innovations to this region and we have often found ourselves in their shadow, politically as well as technologically. Adopting the most useful Maravi ideas would allow our state to grow and develop."

 abm_zambezi_control_the_zambezi_trade: "Control of the Zambezi Trade"
 abm_zambezi_control_the_zambezi_trade_desc: "The Zambezi River is the artery of all trade in this region. On this river Ivory is brought from the north and west to the oceanic trade ports in the east. All local powers have a natural interest in controlling this trade but few have as natural an access to the river as we do. Let us do our utmost to shut any other states out from the Zambezi trade and force them to use us as middle men for any trade between the seaside cities and the African uplands."

 abm_zambezi_strengthen_the_chieftaincies: "Strengthen the Chieftaincies"
 abm_zambezi_strengthen_the_chieftaincies_desc: "Traditionally the lowest and perhaps most influential level of authority in our country has been the councils of village elders. This has perhaps worked well to preserve the old ways in local societies but if our state is to grow we need to empower the local chieftains instead, creating a class of people able to act in a quicker and more dynamic way while also being responsible directly to our ruler."

 abm_zambezi_centralizing_the_mbona_cult: "Centralizing the Mbona cult"
 abm_zambezi_centralizing_the_mbona_cult_desc: "Water is essential to the growth of anything that lives. The Shrine of the spirit of the rainmaker Mbona is perhaps the most important spiritual center in our lands. Here the great spirit speaks to the living through his successive wives. Let us promote the cult of Mbona and ensure that the power of appointment of new spouses for the spirit lies with our ruler."

 abm_zambezi_wealth_of_the_shire_valley: "Wealth of the Shire Valley"
 abm_zambezi_wealth_of_the_shire_valley_desc: "The Shire river valley is the source of much of our people's wealth. Here the precious Machila cloth is produced and from this region we can export salt and iron. These commodities can be put to good use to tie less fortunate petty rulers closer to us. Once they rely on us for these vital products we can start to draw them closer into our circle of underlings."

 abm_zambezi_loyal_local_representatives: "Loyal Representatives"
 abm_zambezi_loyal_local_representatives_desc: "The lands we conquer must be governed. While it may be necessary to preserve the authority of local rulers initially we need to ensure that we rely on people we can trust. Whenever we are able to do so we ought to promote local representatives from our own junior lineages rather than local dynasties."

 abm_zambezi_ideas_ambition: "Zambezi Ambition"
 abm_zambezi_ideas_ambition_desc: "Zambezi Ambition"
