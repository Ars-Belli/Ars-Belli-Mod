l_english:

 # ---------------------------------------------------------------------------
 # Urban Capacity - the limit itself
 # main_menu/common/modifier_type_definitions/abm_urbanisation.txt
 # ---------------------------------------------------------------------------
 MODIFIER_TYPE_NAME_abm_urbanisation_limit: "Urban Capacity"
 MODIFIER_TYPE_DESC_abm_urbanisation_limit: "How much urban settlement our administration can hold together, counted in town points. Founding a [town_or_city|e] or upgrading one is blocked once we have no room left, and every point held beyond it costs 5% Tax Efficiency. Grows with the extent and population of the realm, and with research."
 MODIFIER_TYPE_NAME_abm_urbanisation_used: "Urban Capacity Used"
 MODIFIER_TYPE_DESC_abm_urbanisation_used: "Town points we are already spending. A town costs 1, a city 2 and a megalopolis 4."

 # in_game/common/auto_modifiers/abm_country.txt
 AUTO_MODIFIER_NAME_abm_urbanisation_locations_impact: "1 Urban Capacity every 20 locations"
 AUTO_MODIFIER_DESC_abm_urbanisation_locations_impact: "A wider realm has more places worth building a town in, and more revenue to administer them with."
 AUTO_MODIFIER_NAME_abm_urbanisation_population_impact: "1 Urban Capacity every 400k people"
 AUTO_MODIFIER_DESC_abm_urbanisation_population_impact: "More subjects means more craftsmen, traders and taxpayers to fill new towns, and more hands to govern them with."
 AUTO_MODIFIER_NAME_abm_over_urbanisation_limit: "Over Urban Capacity"
 AUTO_MODIFIER_DESC_abm_over_urbanisation_limit: "Our towns and cities have outgrown what our administration can keep in order. Every town point held beyond our Urban Capacity costs 5% Tax Efficiency, until research, a larger realm or a reduced settlement brings us back under."

 # ---------------------------------------------------------------------------
 # Conditions on founding and upgrading
 # in_game/common/location_ranks/00_default.txt
 # ---------------------------------------------------------------------------
 abm_urbanisation_town_tt: "Founding a town costs 1 Urban Capacity point, and we have [GetPlayer.GetModifierValue('abm_urbanisation_used')] of [GetPlayer.GetModifierValue('abm_urbanisation_limit')] in use"
 abm_urbanisation_city_tt: "Raising a town to a city costs 1 more Urban Capacity point, and we have [GetPlayer.GetModifierValue('abm_urbanisation_used')] of [GetPlayer.GetModifierValue('abm_urbanisation_limit')] in use"
 abm_urbanisation_megalopolis_tt: "Raising a city to a megalopolis costs 2 more Urban Capacity points, and we have [GetPlayer.GetModifierValue('abm_urbanisation_used')] of [GetPlayer.GetModifierValue('abm_urbanisation_limit')] in use"

 # ---------------------------------------------------------------------------
 # Advances - in_game/common/advances/abm_urbanisation_advances.txt
 # ---------------------------------------------------------------------------
 abm_urbanisation_1_advance: "Market Charters"
 abm_urbanisation_1_advance_desc: "The right to hold a market is written down and sealed, and with it the customs, tolls and courts that let a settlement govern its own trade. Chartered places can be founded on purpose rather than merely grown into."
 abm_urbanisation_2_advance: "Communal Liberties"
 abm_urbanisation_2_advance_desc: "Burghers swear to one another rather than only to a lord. The sworn commune elects its own council, keeps its own accounts and answers for its own peace, which is far less of our administration spent on each new town."
 abm_urbanisation_3_advance: "Municipal Corporations"
 abm_urbanisation_3_advance_desc: "A town becomes a legal person in its own right: it may own property, sue, borrow and outlive every burgher in it. Chartering another one is now a matter of paperwork rather than of building a household to run it."
 abm_urbanisation_4_advance: "Urban Ordinances"
 abm_urbanisation_4_advance_desc: "Paving, drainage, night watch, fire regulation and the policing of markets are set down as standing law instead of being argued out anew in every settlement. Crowded places stop strangling themselves."
 abm_urbanisation_5_advance: "Royal Town Planning"
 abm_urbanisation_5_advance_desc: "Surveyors lay out streets, squares and water before the first house goes up, and the crown's intendants inspect what is built. Towns founded to a plan need a fraction of the attention that towns founded by accident demand."
 abm_urbanisation_6_advance: "Municipal Reform"
 abm_urbanisation_6_advance_desc: "Uniform corporations, elected councils and audited accounts replace the tangle of ancient charters. A single statute now governs every borough in the realm, and the realm can afford a great many more of them."

 # ---------------------------------------------------------------------------
 # Top-right readout - in_game/gui/panels/right_panel/right_panel.gui,
 # coloured by in_game/common/customizable_localization/abm_urbanisation_custom_loc.txt
 # ---------------------------------------------------------------------------
 ABM_URBAN_CAPACITY_NORMAL: "Urban: [GetPlayer.MakeScope.ScriptValue('abm_urbanisation_used_points')|0] / [GetPlayer.MakeScope.ScriptValue('abm_urbanisation_limit_points')|0]"
 ABM_URBAN_CAPACITY_FULL: "#Y Urban: [GetPlayer.MakeScope.ScriptValue('abm_urbanisation_used_points')|0] / [GetPlayer.MakeScope.ScriptValue('abm_urbanisation_limit_points')|0]#!"
 ABM_URBAN_CAPACITY_OVER: "#R Urban: [GetPlayer.MakeScope.ScriptValue('abm_urbanisation_used_points')|0] / [GetPlayer.MakeScope.ScriptValue('abm_urbanisation_limit_points')|0]#!"
 ABM_URBAN_CAPACITY_TOOLTIP: "#H Urban Capacity#!\nHow much urban settlement our administration can hold together, counted in town points. A town costs #H 1#!, a city #H 2#! and a megalopolis #H 4#!.\n\nIn use: #H [GetPlayer.MakeScope.ScriptValue('abm_urbanisation_used_points')|0]#!\nCapacity: [GetPlayer.GetModifierValue('abm_urbanisation_limit')]\nFree: #H [GetPlayer.MakeScope.ScriptValue('abm_urbanisation_free_points')|0]#!\n\nCapacity comes from a flat base, the extent and population of the realm, and research; hover the number above for the exact breakdown. With no room left we cannot found a [town_or_city|e] or raise one to the next rank. Conquest can still carry us past the limit, and every point over it costs #R 5%#! Tax Efficiency.\n\nClick to open the modifier ledger."

 # ---------------------------------------------------------------------------
 # Over-limit popup and its tier-panel toggle
 # in_game/events/abm_urbanisation_events.txt, in_game/gui/panels/right_panel/right_panel.gui
 # ---------------------------------------------------------------------------
 abm_urbanisation.1.title: "Urban Capacity Exceeded"
 abm_urbanisation.1.desc: "Our towns and cities have outgrown what our administration can keep in order. We hold #R [GetPlayer.MakeScope.ScriptValue('abm_urbanisation_used_points')|0]#! town points against an Urban Capacity of #H [GetPlayer.MakeScope.ScriptValue('abm_urbanisation_limit_points')|0]#!, and every point over costs #R 5%#! Tax Efficiency. No [town_or_city|e] can be founded or raised to a higher rank until we are back under.\n\nThis warning repeats every month while we are over the limit. It can be switched off from the Tier List panel."
 abm_urbanisation.1.a: "Acknowledge"
 ABM_URBAN_ALERT_TOGGLE_ON: "Urban Capacity Popup: #G ON#!"
 ABM_URBAN_ALERT_TOGGLE_OFF: "Urban Capacity Popup: #R OFF#!"
 ABM_URBAN_ALERT_TOGGLE_TOOLTIP: "Switch the monthly popup warning on or off for while we hold more town points than our Urban Capacity. The Tax Efficiency penalty applies either way."
