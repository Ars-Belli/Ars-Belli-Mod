l_english:

 # ---------------------------------------------------------------------------
 # Urban Capacity - the limit itself
 # main_menu/common/modifier_type_definitions/abm_urbanisation.txt
 # ---------------------------------------------------------------------------
 MODIFIER_TYPE_NAME_abm_urbanisation_limit: "Urban Capacity"
 MODIFIER_TYPE_DESC_abm_urbanisation_limit: "How much urban settlement our administration can hold together, counted in town points. Founding a [town_or_city|e] or upgrading one is blocked once we have no room left. Grows with the size of the realm and with research."
 MODIFIER_TYPE_NAME_abm_urbanisation_used: "Urban Capacity Used"
 MODIFIER_TYPE_DESC_abm_urbanisation_used: "Town points we are already spending. A town costs 1, a city 2 and a megalopolis 4."

 # in_game/common/auto_modifiers/abm_country.txt
 AUTO_MODIFIER_NAME_abm_urbanisation_locations_impact: "Extent of the Realm"
 AUTO_MODIFIER_DESC_abm_urbanisation_locations_impact: "A wider realm has more places worth building a town in, and more revenue to administer them with."

 # ---------------------------------------------------------------------------
 # Conditions on founding and upgrading
 # in_game/common/location_ranks/00_default.txt
 # ---------------------------------------------------------------------------
 abm_urbanisation_town_tt: "Founding a town costs 1 Urban Capacity point, and we have [GetPlayer.GetModifierValue('abm_urbanisation_used')] of [GetPlayer.GetModifierValue('abm_urbanisation_limit')] in use"
 abm_urbanisation_city_tt: "Raising a town to a city costs 1 more Urban Capacity point, and we have [GetPlayer.GetModifierValue('abm_urbanisation_used')] of [GetPlayer.GetModifierValue('abm_urbanisation_limit')] in use"
 abm_urbanisation_megalopolis_tt: "Raising a city to a megalopolis costs 2 more Urban Capacity points, and we have [GetPlayer.GetModifierValue('abm_urbanisation_used')] of [GetPlayer.GetModifierValue('abm_urbanisation_limit')] in use"

 # ---------------------------------------------------------------------------
 # Advances - in_game/common/advances/abm_urbanisation_advances.txt
 # ---------------------------------------------------------------------------
 abm_urbanisation_1_advance: "Market Charters"
 abm_urbanisation_1_advance_desc: "The right to hold a market is written down and sealed, and with it the customs, tolls and courts that let a settlement govern its own trade. Chartered places can be founded on purpose rather than merely grown into."
 abm_urbanisation_2_advance: "Communal Liberties"
 abm_urbanisation_2_advance_desc: "Burghers swear to one another rather than only to a lord. The sworn commune elects its own council, keeps its own accounts and answers for its own peace, which is far less of our administration spent on each new town."
 abm_urbanisation_3_advance: "Municipal Corporations"
 abm_urbanisation_3_advance_desc: "A town becomes a legal person in its own right: it may own property, sue, borrow and outlive every burgher in it. Chartering another one is now a matter of paperwork rather than of building a household to run it."
 abm_urbanisation_4_advance: "Urban Ordinances"
 abm_urbanisation_4_advance_desc: "Paving, drainage, night watch, fire regulation and the policing of markets are set down as standing law instead of being argued out anew in every settlement. Crowded places stop strangling themselves."
 abm_urbanisation_5_advance: "Royal Town Planning"
 abm_urbanisation_5_advance_desc: "Surveyors lay out streets, squares and water before the first house goes up, and the crown's intendants inspect what is built. Towns founded to a plan need a fraction of the attention that towns founded by accident demand."
 abm_urbanisation_6_advance: "Municipal Reform"
 abm_urbanisation_6_advance_desc: "Uniform corporations, elected councils and audited accounts replace the tangle of ancient charters. A single statute now governs every borough in the realm, and the realm can afford a great many more of them."
