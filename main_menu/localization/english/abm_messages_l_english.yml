 ACTION_abm_forgive_half_antagonism_PERFORMED_ON_US_TITLE: "Grievances Forgiven"
 ACTION_abm_forgive_half_antagonism_PERFORMED_ON_US_EFFECTS: "[SCOPE.sCountry('actor').GetName] has set aside half of the grievances they hold against us."
 ACTION_abm_forgive_half_antagonism_PERFORMED_ON_US_LOG: "[SCOPE.sCountry('actor').GetName] forgave half of their antagonism towards us"
