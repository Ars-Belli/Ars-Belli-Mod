 WE_PERFORM_abm_forgive_half_antagonism_ACTION_LOG: "We forgave half of our antagonism towards [SCOPE.sCountry('recipient').GetNameWithNoTooltip]"
 WE_PERFORM_abm_forgive_half_antagonism_ACTION_BTN1: "OK"
 WE_PERFORM_abm_forgive_half_antagonism_ACTION_BTN2: "OK"
 WE_PERFORM_abm_forgive_half_antagonism_ACTION_BTN3: "$common_string_go_to$"
 WE_PERFORM_abm_forgive_half_antagonism_ACTION_MAP: ""
