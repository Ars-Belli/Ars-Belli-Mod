l_english:
 # Message types for Ars Belli country interactions.
 # Modeled on vanilla messages_l_english.yml (WE_PERFORM_<action>_ACTION_* / ACTION_<action>_PERFORMED_ON_US_*).

 # --- Enforce Peace ---
 WE_PERFORM_abm_enforce_peace_ACTION_SETUP: "When we demand a [white_peace|e] in a [war|e]."
 WE_PERFORM_abm_enforce_peace_ACTION_HEADER: "$MESSENGER$"
 WE_PERFORM_abm_enforce_peace_ACTION_TITLE: "Peace Enforced"
 WE_PERFORM_abm_enforce_peace_ACTION_EFFECTS: "Our demand for a [white_peace|e] has been put to the warring parties."
 WE_PERFORM_abm_enforce_peace_ACTION_LOG: "We demanded a white peace in a war"
 WE_PERFORM_abm_enforce_peace_ACTION_BTN1: "OK"
 WE_PERFORM_abm_enforce_peace_ACTION_BTN2: "OK"
 WE_PERFORM_abm_enforce_peace_ACTION_BTN3: "$common_string_go_to$"
 WE_PERFORM_abm_enforce_peace_ACTION_MAP: ""
 ACTION_abm_enforce_peace_PERFORMED_ON_US_SETUP: "When a country demands a [white_peace|e] in our [war|e]."
 ACTION_abm_enforce_peace_PERFORMED_ON_US_HEADER: "$MESSENGER$"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_TITLE: "Peace Enforced on Us"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_EFFECTS: "[SCOPE.sCountry('actor').GetName] has demanded that our [war|e] be brought to a [white_peace|e]."
 ACTION_abm_enforce_peace_PERFORMED_ON_US_LOG: "[SCOPE.sCountry('actor').GetName] demanded a white peace in our war"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_BTN1: "OK"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_BTN2: "OK"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_BTN3: "$common_string_go_to$"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_MAP: ""

 # --- Send Economic Support ---
 WE_PERFORM_abm_send_economic_support_ACTION_SETUP: "When we begin sending $abm_economic_support_relation$."
 WE_PERFORM_abm_send_economic_support_ACTION_HEADER: "$MESSENGER$"
 WE_PERFORM_abm_send_economic_support_ACTION_TITLE: "Economic Support Sent"
 WE_PERFORM_abm_send_economic_support_ACTION_EFFECTS: "We have agreed to send [SCOPE.sCountry('recipient').GetName] a monthly sum of [gold_i]."
 WE_PERFORM_abm_send_economic_support_ACTION_LOG: "We began sending economic support to [SCOPE.sCountry('recipient').GetNameWithNoTooltip]"
 WE_PERFORM_abm_send_economic_support_ACTION_BTN1: "OK"
 WE_PERFORM_abm_send_economic_support_ACTION_BTN2: "OK"
 WE_PERFORM_abm_send_economic_support_ACTION_BTN3: "$common_string_go_to$"
 WE_PERFORM_abm_send_economic_support_ACTION_MAP: ""
 ACTION_abm_send_economic_support_PERFORMED_ON_US_SETUP: "When a country begins sending us $abm_economic_support_relation$."
 ACTION_abm_send_economic_support_PERFORMED_ON_US_HEADER: "$MESSENGER$"
 ACTION_abm_send_economic_support_PERFORMED_ON_US_TITLE: "Economic Support Received"
 ACTION_abm_send_economic_support_PERFORMED_ON_US_EFFECTS: "[SCOPE.sCountry('actor').GetName] has agreed to send us a monthly sum of [gold_i]."
 ACTION_abm_send_economic_support_PERFORMED_ON_US_LOG: "[SCOPE.sCountry('actor').GetName] began sending us economic support"
 ACTION_abm_send_economic_support_PERFORMED_ON_US_BTN1: "OK"
 ACTION_abm_send_economic_support_PERFORMED_ON_US_BTN2: "OK"
 ACTION_abm_send_economic_support_PERFORMED_ON_US_BTN3: "$common_string_go_to$"
 ACTION_abm_send_economic_support_PERFORMED_ON_US_MAP: ""

 # --- Forgive Half Antagonism ---
 WE_PERFORM_abm_forgive_half_antagonism_ACTION_SETUP: "When we forgive half of our [antagonism|e]."
 WE_PERFORM_abm_forgive_half_antagonism_ACTION_HEADER: "$MESSENGER$"
 WE_PERFORM_abm_forgive_half_antagonism_ACTION_TITLE: "Half Our Grievances Forgiven"
