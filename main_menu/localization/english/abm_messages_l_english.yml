 ACTION_abm_forgive_half_antagonism_PERFORMED_ON_US_BTN2: "OK"
 ACTION_abm_forgive_half_antagonism_PERFORMED_ON_US_BTN3: "$common_string_go_to$"
 ACTION_abm_forgive_half_antagonism_PERFORMED_ON_US_MAP: ""

