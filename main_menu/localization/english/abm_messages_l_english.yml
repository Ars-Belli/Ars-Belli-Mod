l_english:
 # Message types for Ars Belli country interactions.
 # Modeled on vanilla messages_l_english.yml (WE_PERFORM_<action>_ACTION_* / ACTION_<action>_PERFORMED_ON_US_*).

 # --- Enforce Peace ---
 WE_PERFORM_abm_enforce_peace_ACTION_SETUP: "When we demand a [white_peace|e] in a [war|e]."
 WE_PERFORM_abm_enforce_peace_ACTION_HEADER: "$MESSENGER$"
 WE_PERFORM_abm_enforce_peace_ACTION_TITLE: "Peace Enforced"
 WE_PERFORM_abm_enforce_peace_ACTION_EFFECTS: "Our demand for a [white_peace|e] has been put to the warring parties."
 WE_PERFORM_abm_enforce_peace_ACTION_LOG: "We demanded a white peace in a war"
 WE_PERFORM_abm_enforce_peace_ACTION_BTN1: "OK"
 WE_PERFORM_abm_enforce_peace_ACTION_BTN2: "OK"
 WE_PERFORM_abm_enforce_peace_ACTION_BTN3: "$common_string_go_to$"
 WE_PERFORM_abm_enforce_peace_ACTION_MAP: ""
 ACTION_abm_enforce_peace_PERFORMED_ON_US_SETUP: "When a country demands a [white_peace|e] in our [war|e]."
 ACTION_abm_enforce_peace_PERFORMED_ON_US_HEADER: "$MESSENGER$"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_TITLE: "Peace Enforced on Us"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_EFFECTS: "[SCOPE.sCountry('actor').GetName] has demanded that our [war|e] be brought to a [white_peace|e]."
 ACTION_abm_enforce_peace_PERFORMED_ON_US_LOG: "[SCOPE.sCountry('actor').GetName] demanded a white peace in our war"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_BTN1: "OK"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_BTN2: "OK"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_BTN3: "$common_string_go_to$"
 ACTION_abm_enforce_peace_PERFORMED_ON_US_MAP: ""

