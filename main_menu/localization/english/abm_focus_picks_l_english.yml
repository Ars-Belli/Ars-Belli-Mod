 abm_drill_sergeants: "Drill Sergeants"
 abm_drill_sergeants_desc: "Veteran sergeants and boatswains put every company and crew through its paces daily, turning raw recruits into seasoned men in half the time and keeping veterans sharp."
 abm_strict_discipline: "Strict Discipline"
 abm_strict_discipline_desc: "Harsh drill and harsher punishment keep our ranks steady and in order when the shot starts flying."
 abm_hardened_ranks: "Hardened Ranks"
 abm_hardened_ranks_desc: "Soldiers who know how to take cover and crews who know how to fight their ship lose fewer men to every volley and broadside."
 abm_trained_march: "Trained March"
 abm_trained_march_desc: "Regulated marching pace and rest halts keep our columns in good order and good spirits on the road."
 abm_elite_companies: "Elite Companies"
 abm_elite_companies_desc: "Picked horsemen and our finest great ships are given the best of everything. They fight like no others, and they cost like no others."

