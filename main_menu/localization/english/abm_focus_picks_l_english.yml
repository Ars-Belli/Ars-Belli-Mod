 abm_rapid_reinforcement: "Rapid Reinforcement"
 abm_rapid_reinforcement_desc: "Reserve companies are moved up to the line as soon as the front ranks falter, and every spare man is put into the fight."
 abm_deep_reserves: "Deep Reserves"
 abm_deep_reserves_desc: "Depots of trained replacements and dockyard stores stand ready behind every army and squadron, so losses are made good cheaply."

 # age_3_discovery - Military - Leadership
 abm_focus_picks.leadership: "Leadership Focus"
 abm_focus_picks.leadership.tt: "Generals, admirals and the officers who serve under them."
 abm_focus_picks.leadership.unlocks_tt: "Unlocks the #Y Leadership#! [advances|e]: $formalized_officer_corps$, $quality_education$, $administrative_leadership$, $abm_military_academies$, $abm_peacetime_commissions$, $abm_aides_de_camp$"
 abm_focus_panel.leadership.advances: "• [ShowAdvanceName('formalized_officer_corps')]\n• [ShowAdvanceName('quality_education')]\n• [ShowAdvanceName('administrative_leadership')]\n• [ShowAdvanceName('abm_military_academies')]\n• [ShowAdvanceName('abm_peacetime_commissions')]\n• [ShowAdvanceName('abm_aides_de_camp')]"
 abm_military_academies: "Military Academies"
 abm_military_academies_desc: "Officers are schooled in war on land and at sea before they ever hold a command."
 abm_peacetime_commissions: "Peacetime Commissions"
 abm_peacetime_commissions_desc: "Officers keep their posts between wars, so hard-won experience is not lost the moment peace is signed."
 abm_aides_de_camp: "Aides-de-Camp"
 abm_aides_de_camp_desc: "Gallopers carry the commander's orders across the field, so units arriving late still reach the place they are needed."

 # age_4_reformation - Military - Offense
 abm_focus_picks.offense: "Offense Focus"
 abm_focus_picks.offense.tt: "Sieges, assaults and artillery, with fleets to blockade the coast."
 abm_focus_picks.offense.unlocks_tt: "Unlocks the #Y Offense#! [advances|e]: $expanded_supply_trains$, $abm_night_assaults$, $engineer_corps$, $abm_standardized_barrels$, $superior_firepower$, $abm_siege_artillery$"
 abm_focus_panel.offense.advances: "• [ShowAdvanceName('expanded_supply_trains')]\n• [ShowAdvanceName('abm_night_assaults')]\n• [ShowAdvanceName('engineer_corps')]\n• [ShowAdvanceName('abm_standardized_barrels')]\n• [ShowAdvanceName('superior_firepower')]\n• [ShowAdvanceName('abm_siege_artillery')]"
 abm_night_assaults: "Night Assaults"
 abm_night_assaults_desc: "Storming parties go over the walls under cover of darkness, when the defenders least expect it."
 abm_standardized_barrels: "Standardized Barrels"
 abm_standardized_barrels_desc: "Fixed calibres and bore sizes let our foundries cast guns quickly and interchangeably."
 abm_siege_artillery: "Siege Artillery"
 abm_siege_artillery_desc: "Heavy guns built for one purpose: bringing down walls."

 # age_4_reformation - Military - Defense
 abm_focus_picks.defense: "Defense Focus"
 abm_focus_picks.defense.tt: "Forts and garrisons, and fleets that fight best off their own coasts."
 abm_focus_picks.defense.unlocks_tt: "Unlocks the #Y Defense#! [advances|e]: $defensive_army$, $garrison_conscription$, $defensive_mentality$, $abm_earthworks$, $fort_logistics$, $abm_fortified_cities_focus$"
 abm_focus_panel.defense.advances: "• [ShowAdvanceName('defensive_army')]\n• [ShowAdvanceName('garrison_conscription')]\n• [ShowAdvanceName('defensive_mentality')]\n• [ShowAdvanceName('abm_earthworks')]\n• [ShowAdvanceName('fort_logistics')]\n• [ShowAdvanceName('abm_fortified_cities_focus')]"
 abm_earthworks: "Earthworks"
 abm_earthworks_desc: "Packed earth and timber ramparts can be thrown up quickly and cheaply, and they shrug off cannon fire better than stone."
 abm_fortified_cities_focus: "Fortified Cities"
 abm_fortified_cities_focus_desc: "Every town of note is ringed by modern bastions."

 # age_4_reformation - Military - Balanced
 abm_focus_picks.balanced: "Balanced Focus"
 abm_focus_picks.balanced.tt: "A little of everything: sieges and forts, army and fleet, and the staying power to see a war through."
 abm_focus_picks.balanced.unlocks_tt: "Unlocks the #Y Balanced#! [advances|e]: $abm_military_engineers$, $abm_garrison_artillery$, $abm_coastal_squadrons$, $abm_seasoned_campaigners$, $abm_ready_reserves$, $abm_steady_resolve$"
 abm_focus_panel.balanced.advances: "• [ShowAdvanceName('abm_military_engineers')]\n• [ShowAdvanceName('abm_garrison_artillery')]\n• [ShowAdvanceName('abm_coastal_squadrons')]\n• [ShowAdvanceName('abm_seasoned_campaigners')]\n• [ShowAdvanceName('abm_ready_reserves')]\n• [ShowAdvanceName('abm_steady_resolve')]"
 abm_military_engineers: "Military Engineers"
 abm_military_engineers_desc: "The same engineers who dig our trenches before an enemy fortress also lay out the bastions of our own."
 abm_garrison_artillery: "Garrison Artillery"
 abm_garrison_artillery_desc: "Gunners trained on the walls of our forts take the field with the army when it marches."
 abm_coastal_squadrons: "Coastal Squadrons"
 abm_coastal_squadrons_desc: "Squadrons that guard our own shores in peace can close an enemy's ports in war."
 abm_seasoned_campaigners: "Seasoned Campaigners"
 abm_seasoned_campaigners_desc: "Soldiers and sailors who have seen many campaigns know how to keep themselves fed, dry and healthy."
 abm_ready_reserves: "Ready Reserves"
 abm_ready_reserves_desc: "Replacements for the regiments and stores for the fleet are kept in hand, so losses are made good without delay."
 abm_steady_resolve: "Steady Resolve"
 abm_steady_resolve_desc: "Our people will bear a long war before they demand peace at any price."

 # age_5_absolutism - Military - Maneuver
 abm_focus_picks.maneuver: "Maneuver Focus"
 abm_focus_picks.maneuver.tt: "Faster armies and fleets, on and off the battlefield."
 abm_focus_picks.maneuver.unlocks_tt: "Unlocks the #Y Maneuver#! [advances|e]: $improved_manuever$, $abm_forced_march$, $land_morale_movement_cost_rev_choice_mil$, $abm_bold_maneuvers$, $abm_limbers$, $offensive_army$"
 abm_focus_panel.maneuver.advances: "• [ShowAdvanceName('improved_manuever')]\n• [ShowAdvanceName('abm_forced_march')]\n• [ShowAdvanceName('land_morale_movement_cost_rev_choice_mil')]\n• [ShowAdvanceName('abm_bold_maneuvers')]\n• [ShowAdvanceName('abm_limbers')]\n• [ShowAdvanceName('offensive_army')]"
 abm_forced_march: "Forced March"
 abm_forced_march_desc: "Our armies are trained to cover great distances at speed when the campaign demands it, and our squadrons crowd on sail to match them."
 abm_bold_maneuvers: "Bold Maneuvers"
 abm_bold_maneuvers_desc: "Our generals do not wait for roads or harbours; they march across country, land on open beaches and appear where the enemy least expects them."
 abm_limbers: "Limbers"
 abm_limbers_desc: "Two-wheeled carriages let our guns be hitched to horses and keep pace with the rest of the army."

 # age_5_absolutism - Military - Logistics
 abm_focus_picks.logistics: "Logistics Focus"
 abm_focus_picks.logistics.tt: "Attrition, supply, range and support units, for armies and fleets."
 abm_focus_picks.logistics.unlocks_tt: "Unlocks the #Y Logistics#! [advances|e]: $abm_enduring_hardships$, $improved_foraging$, $abm_prepared_camps$, $improved_logistics$, $abm_logistics_corps$, $abm_trained_reserves$"
 abm_focus_panel.logistics.advances: "• [ShowAdvanceName('abm_enduring_hardships')]\n• [ShowAdvanceName('improved_foraging')]\n• [ShowAdvanceName('abm_prepared_camps')]\n• [ShowAdvanceName('improved_logistics')]\n• [ShowAdvanceName('abm_logistics_corps')]\n• [ShowAdvanceName('abm_trained_reserves')]"
 abm_enduring_hardships: "Enduring Hardships"
 abm_enduring_hardships_desc: "Hunger and disease no longer break the spirit of our soldiers as easily as they once did."
 abm_prepared_camps: "Prepared Camps"
 abm_prepared_camps_desc: "Camp sites along our lines of march are surveyed and stocked in advance."
 abm_logistics_corps: "Logistics Corps"
 abm_logistics_corps_desc: "Wagoners, sappers, sutlers and transport crews are organised into proper units that can defend themselves when caught out."
 abm_trained_reserves: "Trained Reserves"
 abm_trained_reserves_desc: "Replacements arrive at the front already trained and equipped, and our ships carry the stores to repair themselves at sea."

 # age_5_absolutism - Military - Firepower
 abm_focus_picks.firepower: "Firepower Focus"
 abm_focus_picks.firepower.tt: "Damage done: infantry volleys, naval broadsides and guns."
 abm_focus_picks.firepower.unlocks_tt: "Unlocks the #Y Firepower#! [advances|e]: $abm_volley_fire$, $abm_line_of_battle$, $abm_horse_artillery$, $abm_paper_cartridges$, $abm_frigates$, $abm_prize_crews$"
 abm_focus_panel.firepower.advances: "• [ShowAdvanceName('abm_volley_fire')]\n• [ShowAdvanceName('abm_line_of_battle')]\n• [ShowAdvanceName('abm_horse_artillery')]\n• [ShowAdvanceName('abm_paper_cartridges')]\n• [ShowAdvanceName('abm_frigates')]\n• [ShowAdvanceName('abm_prize_crews')]"
 abm_volley_fire: "Volley Fire"
 abm_volley_fire_desc: "Ranks that fire together on command, on the battlefield and on the gun deck, hit far harder than men who fire at will."
 abm_line_of_battle: "Line of Battle"
 abm_line_of_battle_desc: "Infantry drawn up in line and ships of the line in column bring every musket and every gun to bear at once."
 abm_horse_artillery: "Horse Artillery"
 abm_horse_artillery_desc: "Light guns drawn by teams of horses can unlimber wherever the fighting is hottest."
 abm_paper_cartridges: "Paper Cartridges"
 abm_paper_cartridges_desc: "Measured charges wrapped in paper let our men and gun crews load faster than the enemy."
 abm_frigates: "Frigates"
 abm_frigates_desc: "Fast, well-armed cruisers that can fight their own battles as well as scout for the fleet."
 abm_prize_crews: "Prize Crews"
 abm_prize_crews_desc: "Every ship carries men ready to board and sail home a beaten enemy."

 # age_6_revolutions - Military - Voluntary Service
 abm_focus_picks.voluntary_service: "Voluntary Service Focus"
 abm_focus_picks.voluntary_service.tt: "Fewer but better troops and crews."
 abm_focus_picks.voluntary_service.unlocks_tt: "Unlocks the #Y Voluntary Service#! [advances|e]: $discipline_drills$, $abm_thorough_training$, $regimental_system$, $abm_skirmish_line$, $bayonet_leaders$, $abm_mission_command$"
 abm_focus_panel.voluntary_service.advances: "• [ShowAdvanceName('discipline_drills')]\n• [ShowAdvanceName('abm_thorough_training')]\n• [ShowAdvanceName('regimental_system')]\n• [ShowAdvanceName('abm_skirmish_line')]\n• [ShowAdvanceName('bayonet_leaders')]\n• [ShowAdvanceName('abm_mission_command')]"
 abm_thorough_training: "Thorough Training"
 abm_thorough_training_desc: "No recruit takes the field before he has mastered his drill; it takes longer, but it shows."
 abm_skirmish_line: "Skirmish Line"
 abm_skirmish_line_desc: "Light troops screen the main body, picking off officers and disrupting the enemy advance."
 abm_mission_command: "Mission Command"
 abm_mission_command_desc: "Our officers are told what to achieve, not how; trusted to act on their own judgement, they seize the moment without waiting for orders."

 # age_6_revolutions - Military - Conscription
 abm_focus_picks.conscription: "Conscription Focus"
 abm_focus_picks.conscription.tt: "Mass armies and fleets from a large population."
 abm_focus_picks.conscription.unlocks_tt: "Unlocks the #Y Conscription#! [advances|e]: $mass_army$, $national_conscripts$, $nationalistic_enthusiasm$, $the_young_can_serve$, $massed_battery$, $private_to_marshal$"
 abm_focus_panel.conscription.advances: "• [ShowAdvanceName('mass_army')]\n• [ShowAdvanceName('national_conscripts')]\n• [ShowAdvanceName('nationalistic_enthusiasm')]\n• [ShowAdvanceName('the_young_can_serve')]\n• [ShowAdvanceName('massed_battery')]\n• [ShowAdvanceName('private_to_marshal')]"

 # age_6_revolutions - Military - Insurrection
 abm_focus_picks.insurrection: "Insurrection Focus"
 abm_focus_picks.insurrection.tt: "Defensive war for small countries fighting for survival."
 abm_focus_picks.insurrection.unlocks_tt: "Unlocks the #Y Insurrection#! [advances|e]: $abm_guerillas$, $morale_recovery_rev_dip_choice$, $abm_peoples_war$, $abm_last_stand$, $abm_national_resistance$, $abm_foreign_fighters$"
 abm_focus_panel.insurrection.advances: "• [ShowAdvanceName('abm_guerillas')]\n• [ShowAdvanceName('morale_recovery_rev_dip_choice')]\n• [ShowAdvanceName('abm_peoples_war')]\n• [ShowAdvanceName('abm_last_stand')]\n• [ShowAdvanceName('abm_national_resistance')]\n• [ShowAdvanceName('abm_foreign_fighters')]"
 abm_guerillas: "Guerillas"
 abm_guerillas_desc: "Every hill and forest hides a band of partisans, and no occupier sleeps soundly in our land."
 abm_peoples_war: "People's War"
 abm_peoples_war_desc: "The whole nation takes up arms; invaders find the land stripped bare and every village hostile."
 abm_last_stand: "Last Stand"
 abm_last_stand_desc: "Our garrisons will hold to the last man, and our ships will fight for every mile of our own coast."
 abm_national_resistance: "National Resistance"
 abm_national_resistance_desc: "Defeat only hardens the resolve of our people and deepens their sense of who they are."
 abm_foreign_fighters: "Foreign Fighters"
 abm_foreign_fighters_desc: "Volunteers from across the world flock to our cause."
