 abm_volley_fire: "Volley Fire"
 abm_volley_fire_desc: "Ranks that fire together on command, on the battlefield and on the gun deck, hit far harder than men who fire at will."
 abm_line_of_battle: "Line of Battle"
 abm_line_of_battle_desc: "Infantry drawn up in line and ships of the line in column bring every musket and every gun to bear at once."
 abm_horse_artillery: "Horse Artillery"
 abm_horse_artillery_desc: "Light guns drawn by teams of horses can unlimber wherever the fighting is hottest."
 abm_paper_cartridges: "Paper Cartridges"
 abm_paper_cartridges_desc: "Measured charges wrapped in paper let our men and gun crews load faster than the enemy."
 abm_frigates: "Frigates"
 abm_frigates_desc: "Fast, well-armed cruisers that can fight their own battles as well as scout for the fleet."
 abm_prize_crews: "Prize Crews"
 abm_prize_crews_desc: "Every ship carries men ready to board and sail home a beaten enemy."

