 abm_permanent_companies: "Permanent Companies"
 abm_permanent_companies_desc: "Companies of paid soldiers and crews are kept under arms between wars, quartered in our armories and ports and ready to march or sail."
 abm_royal_arsenals: "Royal Arsenals"
 abm_royal_arsenals_desc: "State arsenals turn out arms, armour and hulls to a common pattern, year in, year out."
 abm_drilled_regulars: "Drilled Regulars"
 abm_drilled_regulars_desc: "Soldiers and sailors who serve all year round have time to learn their trade between campaigns."
 abm_household_troops: "Household Troops"
 abm_household_troops_desc: "The crown's own guards and flagships set the standard of courage for everyone else."
 abm_regular_pay: "Regular Pay"
 abm_regular_pay_desc: "Wages paid on time and in full keep our regulars and crews from melting away, and cost less than raising them anew."

 # age_3_discovery - Military - Quality
 abm_focus_picks.quality: "Quality Focus"
 abm_focus_picks.quality.tt: "Better-drilled troops and crews that take less damage. Elite heavy units cost more to keep."
 abm_focus_picks.quality.unlocks_tt: "Unlocks the #Y Quality#! [advances|e]: $military_drill$, $abm_drill_sergeants$, $abm_strict_discipline$, $abm_hardened_ranks$, $abm_trained_march$, $abm_elite_companies$"
