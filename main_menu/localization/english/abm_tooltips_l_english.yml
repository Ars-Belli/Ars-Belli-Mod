l_english:

# --- from abm_scripted_tooltips_l_english.yml ---
# Ars Belli: tooltips that the scripts reference but that were never localised.
# Each was reported by the engine as `Unknown loc key <key>` at runtime.
#
#  gra_shadhili_order_unlocked_via_event_tt
#     in_game/common/generic_actions/battle_for_the_strait.txt (allow of
#     gra_patronize_shadhili_order, wraps `has_variable = gra_shadhili_invited`)
#  variable_nav_appanage_rights_granted_tt
#     in_game/common/subject_types/appanage.txt (visible, wraps
#     `has_variable = nav_appanage_rights_granted` for NAV)
#  variable_gag_left_hre_guelph_victory_tt
#     in_game/common/international_organizations/hre.txt (can_join_trigger, wraps
#     NOT = { has_variable = gag_left_hre_guelph_victory } - written positive, the
#     engine renders it negated)

 gra_shadhili_order_unlocked_via_event_tt: "We must have invited the Shadhili order to [GetCountry('GRA').GetName]"
 variable_nav_appanage_rights_granted_tt: "Navarre has been granted appanage rights"
 variable_gag_left_hre_guelph_victory_tt: "We left the [hre|e] after the Guelphs prevailed"

# --- from abm_work_of_art_l_english.yml ---
 # Acceptance-tooltip lines for the two factors Ars Belli adds to sell_work_of_art.
 # The ABM_ prefix keeps them clear of any key vanilla might add later.
 ABM_ART_PRICE_VS_INCOME: "Price against their income"
 ABM_MEDIOCRE_ART: "Unremarkable [art_quality|e]"
