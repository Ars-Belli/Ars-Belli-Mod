l_english:

 abm_wls_ideas_tradition_1: "Welsh Tradition I"
 abm_wls_ideas_tradition_1_desc: "Welsh Tradition I"
 abm_wls_ideas_tradition_2: "Welsh Tradition II"
 abm_wls_ideas_tradition_2_desc: "Welsh Tradition II"
 abm_cynulliad: "Cynulliad"
 abm_cynulliad_desc: "Owain Glyndwr called the first Parliament, or Cynulliad, at Machynlleth in 1404. There, he declared his vision of an independent Welsh state with a parliament and separate Welsh church."
 abm_bardic_literature: "Bardic Literature"
 abm_bardic_literature_desc: "By reviving our ancient poetic traditions, we can stand to last the test of time. The best wars are not won often with the sword, but with poetry and prose as well. A revival in the bardic traditions would also allow us to revive the eisteddfod, a grand gathering to which were invited poets and musicians from all over the country. The winner of the yearly eisteddfod is granted a seat in the lord's council. Our poets have kept alive the Welsh spirit and their songs shall inspire us."
 abm_cyfraith_hywel: "Cyfraith Hywel"
 abm_cyfraith_hywel_desc: "There are calls to revive the traditional Welsh law of Hywel the Good and the old cantrefi system for governing Wales, each of which was divided into several commotes. These were of particular importance in the administration of the law. Each cantref had its own court, which was an assembly of the uchelwyr, nobles, the main landowners of the cantref."
 abm_unbennaeth_prydain: "Unbennaeth Prydain"
 abm_unbennaeth_prydain_desc: "'The Monarchy of Britain' was an Old Welsh poem that served as a national anthem for the many medieval Welsh kingdoms. Although the specific composition is now lost, it presumably recounted the exploits of the former kings of the Britons. Reviving a new form of this composition would stoke national pride."
 abm_economic_revival: "Economic Revival"
 abm_economic_revival_desc: "Wales had several problems in becoming an economic power. It was restricted by its peripheral location, predominantly upland topography, poor communications and sparse population. By encouraging the development of trading and ports, as well as mining rich mineral deposits, we can spur new advances not only in economy, but technology as well."
 abm_prifysgolion_cymru: "Prifysgolion Cymru"
 abm_prifysgolion_cymru_desc: "Owain Glyndwr planned to establish two universities in Wales, one in the north and one in the south. By encouraging the academic arts, we can hope that our great nation will be a center of learning."
 abm_welsh_church: "Welsh Church"
 abm_welsh_church_desc: "The Welsh church was independent from the other churches, with its own ecclesiastical structure. We are a Christian people well before the Romans left the shores of Britain and abandoned us. Our land is the land of many Christian saints and with a strong legacy of Celtic Christendom."
 abm_wls_ideas_ambition: "Welsh Ambition"
 abm_wls_ideas_ambition_desc: "Welsh Ambition"

 abm_crn_ideas_tradition_1: "Cornish Tradition I"
 abm_crn_ideas_tradition_1_desc: "Cornish Tradition I"
 abm_crn_ideas_tradition_2: "Cornish Tradition II"
 abm_crn_ideas_tradition_2_desc: "Cornish Tradition II"
 abm_crn_stannary_parliaments: "Stannary Parliaments"
 abm_crn_stannary_parliaments_desc: "The tin miners of Cornwall have long upheld their special legal rights. These include tax exemption and exclusive prospecting rights, but most importantly the right to be tried only before a Stannary Court with a jury composed of their fellow miners. A Stannary Parliament oversees and revises these rights, keeping the mining population productive and content."
 abm_crn_cornish_rebels: "Cornish Rebels"
 abm_crn_cornish_rebels_desc: "The Cornish people are quick to rise up against oppression and misrule. Hostile armies entering their lands receive an unfriendly welcome."
 abm_crn_prayer_book_traditionaliism: "Prayer Book Traditionalism"
 abm_crn_prayer_book_traditionaliism_desc: "Farmers, miners, and landlords alike are extremely reluctant to accept changes to religious prayer books. Many complain that prayer books written in English exclude a significant part of the population who speak only Cornish, though others point out they could not read the old Latin prayers either. Regardless, a traditionalist attitude to religion pervades Cornish society and binds it together."
 abm_crn_pirates_of_penzance: "Pirates of Penzance"
 abm_crn_pirates_of_penzance_desc: "Oh, better far to live and die\nUnder the brave black flag I fly,\nThan play a sanctimonious part,\nWith a pirate head and a pirate heart."
 abm_crn_royalist_army: "Cornish Royalist Army"
 abm_crn_royalist_army_desc: "Ever staunch monarchists, the Cornish people are quick to rally to the defense of the crown against republican revolutionaries. Despite Cornwall’s relatively low population, it can raise a surprisingly large levy of determined soldiers willing to fight for King and country."
 abm_crn_gear_rout: "The Gear Rout"
 abm_crn_gear_rout_desc: "Even should we lose the war, enough of us will likely flee the field that they will live to fight again another day."
 abm_crn_arthurian_romanticism: "Arthurian Romanticism"
 abm_crn_arthurian_romanticism_desc: "A recent revival of interest in Celtic culture has created an interest in Arthurian legend. Tintagel Castle is said to be the place of King Arthur's conception, and acts as a focal point of a renewed Celtic identity in Cornwall."
 abm_crn_ideas_ambition: "Cornish Ambition"
 abm_crn_ideas_ambition_desc: "Cornish Ambition"
 abm_koi_ideas_tradition_1: "Manx Tradition I"
 abm_koi_ideas_tradition_1_desc: "Manx Tradition I"
 abm_koi_ideas_tradition_2: "Manx Tradition II"
 abm_koi_ideas_tradition_2_desc: "Manx Tradition II"
 abm_mann_stanleys: "The Stanleys"
 abm_mann_stanleys_desc: "The Stanley dynasty has ushered in an era of peace and prosperity for the Manx people. Their skill at diplomacy ensures the safety of the island from both political and military threats to our sovereignty."
 abm_mann_kings: "Kings of Mann"
 abm_mann_kings_desc: "Despite its size, Mann is recognized as a de jure Kingdom. But what is a Kingdom without land? We must acquire more."
 abm_mann_tynwald: "Tynwald High Court"
 abm_mann_tynwald_desc: "The Tynwald is the Manx high court. The House of Keys, led by the most powerful families of Mann, act as a national jury that give advice on legal matters. As the state expands however, its administrative needs multiply. The Tynwald must become a permanent institution, akin to a parliament with the power to write new laws."
 abm_mann_and_the_isles: "Mann and the Isles"
 abm_mann_and_the_isles_desc: "In centuries past Mann was the heart of a great realm that spanned across the Irish Sea. It is time to revive the tradition of shipbuilding so that we can restore this empire."
 abm_mann_act_of_settlement: "The Act of Settlement"
 abm_mann_act_of_settlement_desc: "It is time to finally settle the status of peasant landholding on Mann. The Act will guarantee the basic rights of citizens and become a basis for the future development of our constitution."
 abm_mann_burn_the_heretic: "Burn the Heretic"
 abm_mann_burn_the_heretic_desc: "Witchcraft and heresy are ever-present dangers to the faithful. Suffer not the witch and the heretic to live."
 abm_mann_act_of_revestment: "The Act of Revestment"
 abm_mann_act_of_revestment_desc: "There are too many petty nobles holding minor titles and withholding rents from their land. The Act Of Revestment will revoke these titles so that the monarch can rule more directly."
 abm_koi_ideas_ambition: "Manx Ambition"
 abm_koi_ideas_ambition_desc: "Manx Ambition"

 abm_nol_ideas_tradition_1: "Northumbrian Tradition I"
 abm_nol_ideas_tradition_1_desc: "Northumbrian Tradition I"
 abm_nol_ideas_tradition_2: "Northumbrian Tradition II"
 abm_nol_ideas_tradition_2_desc: "Northumbrian Tradition II"
 abm_nol_secure_percy_rule: "Secure Percy Rule"
 abm_nol_secure_percy_rule_desc: "This land has been ruled by the Percy family for centuries, and they have become synonymous with it. The Percies will remain a backbone of this independent kingdom and be a powerful force for the Northumbrian monarchy."
 abm_nol_memory_of_hegemony: "The Memory of Northumbrian Hegemony"
 abm_nol_memory_of_hegemony_desc: "Before the creation of England, Northumbria was an independent kingdom which, in the 7th century, achieved overlordship of England's north. It is up to us to do justice to our ancestors and restore their hegemony."
 abm_nol_cradle_of_british_christianity: "Cradle of British Christianity"
 abm_nol_cradle_of_british_christianity_desc: "Although not the first place in Britain to be converted to Christianity, the kingdom of Northumbria was where it most firmly took root. Saints made their homes here, and the monastery at Lindisfarne was a major early Christian centre. Let us cultivate this heritage as a centre for the true believers of the British Isles."
 abm_nol_land_of_castles: "A Land of Castles"
 abm_nol_land_of_castles_desc: "Northumberland has the greatest concentration of castles anywhere in the British Isles. Refortified and updated, they will protect us from our enemies."
 abm_nol_lindisfarne_gospels: "Lindisfarne Gospels"
 abm_nol_lindisfarne_gospels_desc: "As well as being a religious centre, the monastery at Lindisfarne was renowned for its production of high-quality manuscripts like the Lindisfarne Gospels. Let this legacy inspire us to further cultural achievements in the future!"
 abm_nol_literary_and_philosophical_society: "The Literary and Philosophical Society"
 abm_nol_literary_and_philosophical_society_desc: "Beside our strong religious roots, Northumberland is also starting to see a rise in innovation. The Literary and Philosophical Society is a centre for this, and we hope that it will provide us with many innovations in the future."
 abm_nol_coals_to_newcastle: "Taking Coals to Newcastle"
 abm_nol_coals_to_newcastle_desc: "As the industrial era dawns, it has become clear that Northumberland is home to large coal deposits. More efficient mining practices and the development of the great port at Newcastle will allow us to exploit this to the full."
 abm_nol_ideas_ambition: "Northumbrian Ambition"
 abm_nol_ideas_ambition_desc: "Northumbrian Ambition"
