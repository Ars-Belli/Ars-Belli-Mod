 abm_wls_ideas_tradition_1: "Welsh Tradition I"
 abm_wls_ideas_tradition_1_desc: "Welsh Tradition I"
 abm_wls_ideas_tradition_2: "Welsh Tradition II"
 abm_wls_ideas_tradition_2_desc: "Welsh Tradition II"
 abm_cynulliad: "Cynulliad"
 abm_cynulliad_desc: "Owain Glyndwr called the first Parliament, or Cynulliad, at Machynlleth in 1404. There, he declared his vision of an independent Welsh state with a parliament and separate Welsh church."
 abm_bardic_literature: "Bardic Literature"
 abm_bardic_literature_desc: "By reviving our ancient poetic traditions, we can stand to last the test of time. The best wars are not won often with the sword, but with poetry and prose as well. A revival in the bardic traditions would also allow us to revive the eisteddfod, a grand gathering to which were invited poets and musicians from all over the country. The winner of the yearly eisteddfod is granted a seat in the lord's council. Our poets have kept alive the Welsh spirit and their songs shall inspire us."
 abm_cyfraith_hywel: "Cyfraith Hywel"
 abm_cyfraith_hywel_desc: "There are calls to revive the traditional Welsh law of Hywel the Good and the old cantrefi system for governing Wales, each of which was divided into several commotes. These were of particular importance in the administration of the law. Each cantref had its own court, which was an assembly of the uchelwyr, nobles, the main landowners of the cantref."
 abm_unbennaeth_prydain: "Unbennaeth Prydain"
 abm_unbennaeth_prydain_desc: "'The Monarchy of Britain' was an Old Welsh poem that served as a national anthem for the many medieval Welsh kingdoms. Although the specific composition is now lost, it presumably recounted the exploits of the former kings of the Britons. Reviving a new form of this composition would stoke national pride."
 abm_economic_revival: "Economic Revival"
 abm_economic_revival_desc: "Wales had several problems in becoming an economic power. It was restricted by its peripheral location, predominantly upland topography, poor communications and sparse population. By encouraging the development of trading and ports, as well as mining rich mineral deposits, we can spur new advances not only in economy, but technology as well."
 abm_prifysgolion_cymru: "Prifysgolion Cymru"
 abm_prifysgolion_cymru_desc: "Owain Glyndwr planned to establish two universities in Wales, one in the north and one in the south. By encouraging the academic arts, we can hope that our great nation will be a center of learning."
 abm_welsh_church: "Welsh Church"
 abm_welsh_church_desc: "The Welsh church was independent from the other churches, with its own ecclesiastical structure. We are a Christian people well before the Romans left the shores of Britain and abandoned us. Our land is the land of many Christian saints and with a strong legacy of Celtic Christendom."
 abm_wls_ideas_ambition: "Welsh Ambition"
 abm_wls_ideas_ambition_desc: "Welsh Ambition"
