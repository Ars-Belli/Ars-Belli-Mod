l_english:

 abm_lot_ideas_tradition_1: "Lotharingian Tradition I"
 abm_lot_ideas_tradition_1_desc: "Lotharingian Tradition I"
 abm_lot_ideas_tradition_2: "Lotharingian Tradition II"
 abm_lot_ideas_tradition_2_desc: "Lotharingian Tradition II"
 abm_lot_legacy_of_the_carolingians: "Legacy of the Carolingians"
 abm_lot_legacy_of_the_carolingians_desc: "As the new claimants to the Lotharingian crown, we draw our legitimacy by appealing to the legacy of Charlemagne and Lothair. Under our patronage, the exploits of our ancestors have once again become common knowledge, both among our own people and throughout the courts of Europe."
 abm_lot_glory_of_charlemagne: "Glory of Charlemagne"
 abm_lot_glory_of_charlemagne_desc: "The glorious exploits of Lotharingia's leaders from Charlemagne and Lothair to Philip the Good is written into the memory of our people - and our soldiers. Under our leadership, they will suffer any hardship in our quest to recreate the glories of our past."
 abm_lot_dutch_cities: "Wealth of the Low Countries"
 abm_lot_dutch_cities_desc: "The cities of the Netherlands have accumulated tremendous wealth from trade. As their benevolent masters, we must encourage their growth and help them build a trading empire that we can tap for our own advantage."
 abm_lot_carolingian_renaissance_ii: "New Carolingian Renaissance"
 abm_lot_carolingian_renaissance_ii_desc: "Centuries ago, the unity that the Carolingian Empire provided and the educational reforms of its leaders brought about a revival of knowledge that had been lost in the preceding Dark Ages. By emulating their policies, we too can encourage the spread of new ideas and technologies that will benefit our nation."
 abm_lot_court_of_europe: "The Court of Europe"
 abm_lot_court_of_europe_desc: "Our court is among the most illustrious of all Europe. Truly, the wisest, bravest and fairest do flock to join our fine establishment."
 abm_lot_land_of_abbeys: "Land of Bishops"
 abm_lot_land_of_abbeys_desc: "In our expansion to reconstitute Lotharingia, we absorbed many bishoprics into our empire. Although their power is much reduced now that they are no longer self-governing polities, they maintain significant influence over church matters. By ensuring that they remain loyal to us, we can maintain a significant voice in clerical affairs."
 abm_lot_european_empire: "Europa Universalis Imperii"
 abm_lot_european_empire_desc: "Charlemagne briefly united much of Europe under his sway. Our destiny is to complete what he started and restore the unity last seen in the days of Rome to Europe."
 abm_lot_ideas_ambition: "Lotharingian Ambition"
 abm_lot_ideas_ambition_desc: "Lotharingian Ambition"
 abm_wes_ideas_tradition_1: "Westphalian Tradition I"
 abm_wes_ideas_tradition_1_desc: "Westphalian Tradition I"
 abm_wes_ideas_tradition_2: "Westphalian Tradition II"
 abm_wes_ideas_tradition_2_desc: "Westphalian Tradition II"
 abm_wes_jewish_rights: "Jewish Rights"
 abm_wes_jewish_rights_desc: "By granting the Jews working within our administration certain rights, we can harness their knowledge and embrace their progressive ideas."
 abm_wes_westphalian_decentralisation: "Westphalian Decentralization"
 abm_wes_westphalian_decentralisation_desc: "The Westphalians are not used to the concept of belonging to a larger state - at most, the precedent for the Westphalian state is the Lower Rhenish-Westphalian Imperial Circle. Although this makes it harder to inspire our people's loyalty, a decentralized administration in which our local communities govern themselves does carry some benefits."
 abm_wes_increased_conscription: "Universal Conscription"
 abm_wes_increased_conscription_desc: "Westphalia's armies have never been of great significance to the course of international affairs. By introducing universal conscription, we can build a standing army large enough to change this and make Westphalia a force to reckon with in Germany."
 abm_wes_administrative_assimilation_of_rheinlanders: "Assimilation of the Rhenish People"
 abm_wes_administrative_assimilation_of_rheinlanders_desc: "While their dialects and way of life may divide them from us, the cities of the Rhine have long had a connection to us through the Lower Rhenish-Westphalian Imperial Circle. We must make our state into a home for both our people and assimilate the Rhenish into our administration."
 abm_wes_taxation: "Tax Reforms"
 abm_wes_taxation_desc: "No one likes heavy taxation. Nonetheless, we need the funds to pay our armies and other projects worthy of a modern state. By reforming our lands' traditional taxation arrangements into a fair system that provides us with sufficient funds, we will be able to boost our income without causing any undue upset."
 abm_wes_enlightenment: "Religious Toleration"
 abm_wes_enlightenment_desc: "Our lands are home to many beliefs. While some would insist all others to be wrong and seek the removal of all those they consider heretics, we shall take a more enlightened path. Let all believe as they wish, so long as they agree to serve us!"
 abm_wes_cities_of_the_rhineland: "Cities of the Rhineland"
 abm_wes_cities_of_the_rhineland_desc: "By integrating the Rhineland into our nation, we are able to benefit from the trade that flows through the Rhenish cities - and the commercial acumen of their traders."
 abm_wes_ideas_ambition: "Westphalian Ambition"
 abm_wes_ideas_ambition_desc: "Westphalian Ambition"
 abm_german_ideas_tradition_1: "German Tradition I"
 abm_german_ideas_tradition_1_desc: "German Tradition I"
 abm_german_ideas_tradition_2: "German Tradition II"
 abm_german_ideas_tradition_2_desc: "German Tradition II"
 abm_zunft: "Zunft"
 abm_zunft_desc: "Guilds specific to every sort of craft are founded to insure the quality of products and to train young artisans."
 abm_fruhlings_und_herbstmesse: "Frühlings- und Herbstmesse"
 abm_fruhlings_und_herbstmesse_desc: "Some cities are given the special right to open fairs in every spring and autumn. These seasonal markets are quite attractive for foreign traders."
 abm_reichskreis: "Reichskreis"
 abm_reichskreis_desc: "German lands are grouped into regional circles. Their functions are keeping local peace with common forces, collecting the imperial taxes and coordinating opinions for the Imperial Diet and the Imperial Chamber Court."
 abm_polizeiordnung: "Polizeiordnung"
 abm_polizeiordnung_desc: "German lords and cities enact laws concerning the daily life of their folks to secure the local peace and public morality."
 abm_cuius_regio_eius_religio: "Cuius Regio, Eius Religio"
 abm_cuius_regio_eius_religio_desc: "Both Catholic and Protestant German lords have an exclusive right to control religious matters in their demesnes according to the principle 'Whose realm, his religion'."
 abm_thurn_und_taxis: "Thurn und Taxis"
 abm_thurn_und_taxis_desc: "The House of Thurn und Taxis pioneered the German postal service, a complex network of the communication which covers various European regions and all of Germany."
 abm_residenzstadt: "Residenzstadt"
 abm_residenzstadt_desc: "German Dukes make their residences in cities, and govern the land from there. In this way, the cities become not only administrative and economic centers, but also many cultural buildings are constructed by their monarchs."
 abm_german_ideas_ambition: "German Ambition"
 abm_german_ideas_ambition_desc: "German Ambition"
 abm_hlr_ideas_tradition_1: "Holy Roman Tradition I"
 abm_hlr_ideas_tradition_1_desc: "Holy Roman Tradition I"
 abm_hlr_ideas_tradition_2: "Holy Roman Tradition II"
 abm_hlr_ideas_tradition_2_desc: "Holy Roman Tradition II"
 abm_hlr_imperial_throne: "The Imperial Throne"
 abm_hlr_imperial_throne_desc: "Charlemagne was crowned "Emperor of the Romans" by Pope Leo in AD 800, beginning the line of emperors to which we too belong. Over the years, many a man of valor and wisdom has sat on the imperial throne."
 abm_hlr_kaiserliche_armee: "Kaiserliche Armee"
 abm_hlr_kaiserliche_armee_desc: "The Empire has had its own army since the Imperial Diet of 1422 in Nuremberg. Now that we are unified in practice as well as in name, we shall expand the army into a strong and well-trained force loyal only to the banner of the Emperor."
 abm_hlr_imperial_diplomacy: "Imperial Diplomacy"
 abm_hlr_imperial_diplomacy_desc: "The expertise of our diplomatic corps is unparalleled. As the Holy Roman Emperors, we have had subjects come and go for centuries, allowing our diplomats to build up a considerable knowledge base that has been passed down for generations."
 abm_hlr_centralised_empire: "Centralized Empire"
 abm_hlr_centralised_empire_desc: "With the empire unified we have we have become more centralized. This has lessened the power of local rulers, allowing us to channel more of its wealth into our own coffers."
 abm_hlr_roman_heritage: "Roman Heritage"
 abm_hlr_roman_heritage_desc: "As the Holy Roman Empire, we lay claim to a legacy that dates back to Augustus, the first Emperor of Rome. Now that we have unified our realm into a single, centralized state, it is time to strive to restore Rome's ancient glories and reunite the lands it once owned."
 abm_hlr_adopting_the_goosestep: "Adopting the Goosestep"
 abm_hlr_adopting_the_goosestep_desc: "Officers from Brandenburg have risen to positions of influence in our army. We have are progressively adopting many of their military traditions in our quest to establish an army that is second to none."
 abm_hlr_onwards_and_upwards: "Onwards and Upwards"
 abm_hlr_onwards_and_upwards_desc: "Our imperial administration, forged through centuries of negotiations between the Emperor and his Princes, is now a versatile, well-oiled machine capable of integrating large and diverse territories into our realm. Now we can finally claim our destiny and emerge as a force capable of uniting all of Europe."
 abm_hlr_ideas_ambition: "Holy Roman Ambition"
 abm_hlr_ideas_ambition_desc: "Holy Roman Ambition"
 abm_swabian_ideas_tradition_1: "Swabian City-State Tradition I"
 abm_swabian_ideas_tradition_1_desc: "Swabian City-State Tradition I"
 abm_swabian_ideas_tradition_2: "Swabian City-State Tradition II"
 abm_swabian_ideas_tradition_2_desc: "Swabian City-State Tradition II"
 abm_swabian_mercenaries: "Swabian Mercenaries"
 abm_swabian_mercenaries_desc: "Though Swiss Mercenaries are famed throughout Europe, we Swabians provide the swiss with some stiff competition, with our own mercenaries being famed for their discipline and effectiveness on the battlefield. "
 abm_swabian_river_iller: "By the River Iller"
 abm_swabian_river_iller_desc: "We are separated from the Bavarians by the River Iller, and with the expansion of the Bavarian dukes to our East, the river will prove useful not only in feeding our crops and keeping Swabia fertile, but also as a defensive position in any conflict we find ourselves in against the Bavarians."
 abm_swabian_bavarian_resistance: "Bavarian Resistance"
 abm_swabian_bavarian_resistance_desc: "Much like any region in the Empire, the Swabian states find themselves in as much conflict with each-other as any external threat. With our neighbors to the East consolidating into a centralized Kingdom and with growing Habsburg influence in the region, we must set our petty squabbles aside and work to maintain the independence of all Swabian states."
 abm_swabian_decapole: "Decapole"
 abm_swabian_decapole_desc: "The Decapole was an alliance formed by the Imperial states on the French border, of which many are Swabian. Though we usually depend on the Empire to support our independence, the internal politics of the Empire is always in turmoil, and it is only by forming alliances like the Decapole that we may truly resist foreign influence."
 abm_swabian_reclaiming_the_duchy: "Reclaiming the Duchy"
 abm_swabian_reclaiming_the_duchy_desc: "The Duchy of Swabia was dissolved over a century ago, but the dream of reuniting the nation is strong amongst all of the successor states. Our attempts to reconsolidate thus far have been quashed by the Emperor, but he cannot keep us suppressed forever!"
 abm_swabian_thorn_of_the_empire: "The Thorn of the Empire"
 abm_swabian_thorn_of_the_empire_desc: "Throughout our history, the Emperor has sought to do little else but bring us to heel, but Swabia is no Habsburg lapdog. We will continue to be a thorn in the Emperor's side, until we have removed all traces of Habsburg influence from Swabia!"
 abm_swabian_habsburg_league: "The Habsburg League"
 abm_swabian_habsburg_league_desc: "Inspired by the Swiss leagues to our south, the Emperor organized the many Swabian city-states into a free and independent league with a Habsburg Prince as its leader. Unlike the Swiss Cantons which organize their government around mutual protection and a shared desire for independence and freedom, the Swabian League is a much more aggressive and militaristic union designed to contest the Swiss. Though many Swabians support the idea of joining the Swiss League, we must maintain the illusion that the Swabian League will do just as well to keep our independence."
 abm_swabian_ideas_ambition: "Swabian City-State Ambition"
 abm_swabian_ideas_ambition_desc: "Swabian City-State Ambition"
 abm_hes_ideas_tradition_1: "Hessian Tradition I"
 abm_hes_ideas_tradition_1_desc: "Hessian Tradition I"
 abm_hes_ideas_tradition_2: "Hessian Tradition II"
 abm_hes_ideas_tradition_2_desc: "Hessian Tradition II"
 abm_break_the_hessian_estates: "Break the Power of the Estates"
 abm_break_the_hessian_estates_desc: "A strong ruler cannot allow the Estates to hinder his power. We must break the power of the Estates once and for all so that we can undertake whatever goals we see fit."
 abm_marburg_university: "Marburg University"
 abm_marburg_university_desc: "Education is important and many German universities will only receive the well to do or those of the Catholic faith. Let us found a new university that aims to be free of these restraints for the betterment of our subjects."
 abm_welcome_reformers: "Welcome the Reformers"
 abm_welcome_reformers_desc: "All over Europe and the German lands Reformers are debating and reinventing the Christian faith. Let us welcome these learned men so that they can debate freely under our protection."
 abm_let_in_religious_emigrants: "Receive Religious Immigrants"
 abm_let_in_religious_emigrants_desc: "Many countries all over Europe have been getting rid of some of their finest talents just because they belong to one of the various new Christian faiths. Let us profit from their mistake and receive any such men looking for a new home."
 abm_modernization_of_the_hessian_army: "Modernization of the Hessian Army"
 abm_modernization_of_the_hessian_army_desc: "The armies of Europe are always evolving and a state in Germany will have to stay up to date or face its end. Let us modernize our armies and adopt the finest ideas regarding training, equipment and tactics that we can find."
 abm_hessian_mercenaries_idea: "Hessian Mercenaries"
 abm_hessian_mercenaries_idea_desc: "A modern army is expensive and training, however, rigorous is no substitute for real experience. Let us allow other states to rent entire units of our forces so that they may receive real combat experience even in times of peace but above all so that we may easier pay for their equipment and food."
 abm_hessian_economic_reforms: "Economic Reforms"
 abm_hessian_economic_reforms_desc: "The world is changing and within our borders are many with ideas on how to improve our economy. Let us give them the freedom to undertake their bold new schemes so that our country may have the finest Manufactories and Iron Mills."
 abm_hes_ideas_ambition: "Hessian Ambition"
 abm_hes_ideas_ambition_desc: "Hessian Ambition"
 abm_fkn_ideas_tradition_1: "Franconian Tradition I"
 abm_fkn_ideas_tradition_1_desc: "Franconian Tradition I"
 abm_fkn_ideas_tradition_2: "Franconian Tradition II"
 abm_fkn_ideas_tradition_2_desc: "Franconian Tradition II"
 abm_fkn_duchy_restored: "The Duchy Restored"
 abm_fkn_duchy_restored_desc: "After a lapse of several centuries, we have restored the Duchy of Franconia under us. There are none who can now doubt our status as one of the foremost powers of Germany."
 abm_fkn_main_trading: "Trading on the Main"
 abm_fkn_main_trading_desc: "The trade route from Vienna to Nuremberg and onwards down the Main to Wurzburg and Frankfurt is among the busiest in Germany. The merchants that travel it provide the life blood of our cities, where our people drive a hard bargain to make a living from commerce."
 abm_fkn_rugged_land_of_fortresses: "A Rugged Land of Fortresses"
 abm_fkn_rugged_land_of_fortresses_desc: "The hinterlands of Franconia are a hilly, rural terrain that is easily defendable - especially since many fortresses, not least the impressive Plassenburg in Kulmbach, have been built to defend key locations. Any would-be attackers will have their work cut out taking territory from us!"
 abm_fkn_free_knights_of_franconia: "Free Imperial Knights of Franconia"
 abm_fkn_free_knights_of_franconia_desc: "There are a large number of Free Imperial Knights who call Franconia their home. We can draw upon them to lead our cavalry into battle!"
 abm_franconian_wine: "Franconian Wine"
 abm_franconian_wine_desc: "Our wine is one of the best in the Empire, we should support our vintners by providing them with enough land to work."
 abm_fkn_baroque: "A Baroque Duchy"
 abm_fkn_baroque_desc: "Our neighbors on all sides compete to build the most impressive palaces, commission the most beautiful artwork and be home to the most prestigious universities. We must be no different. With the resources of all of Franconia at our disposal, we shall ensure that our court is unequalled in Germany."
 abm_fkn_franconian_bourgeoisie: "Franconian Bourgeoisie"
 abm_fkn_franconian_bourgeoisie_desc: "Our land has produced many artists, philosophers, composers and inventors. With our sizeable intelligentsia to draw upon, we will never be short of well-informed advisors and specialists for our projects, and the wealth of our land will surely grow rapidly."
 abm_fkn_ideas_ambition: "Franconian Ambition"
 abm_fkn_ideas_ambition_desc: "Franconian Ambition"
 abm_wur_ideas_tradition_1: "Württemberger Tradition I"
 abm_wur_ideas_tradition_1_desc: "Württemberger Tradition I"
 abm_wur_ideas_tradition_2: "Württemberger Tradition II"
 abm_wur_ideas_tradition_2_desc: "Württemberger Tradition II"
 abm_wur_estates_of_wurtemberg: "Estates of Württemberg"
 abm_wur_estates_of_wurtemberg_desc: "We have decided to allow the notables of our realm to meet in a bicameral assembly known as the Estates of Württemberg. Although it will somewhat lessen the ruler's absolute power, it will conversely allow for the better governance of the realm."
 abm_wur_swabian_league: "Swabian League"
 abm_wur_swabian_league_desc: "Although the Duchy of Swabia has long since passed into history, its name still remains a powerful force for unity in the region. The various principalities, free cities, ecclesiastical lands, and other petty states in the region have banded together in a league for mutual defense. As one of the greater states in Swabia, let us assume the role of the natural leader of this league in times of war."
 abm_wur_poor_conrad: "Armer Konrad"
 abm_wur_poor_conrad_desc: "We are hardly the only state in Germany to be plagued by peasant rebellions from time to time. While revolting peasants are quickly crushed and their concerns ignored, those of the petty nobility and of the burghers are not so easily dismissed. Perhaps we should expand the rights of the people to a sufficient amount in order to keep them happy and less prone to unpleasant rebellions."
 abm_wur_swabian_circle: "Swabian Circle"
 abm_wur_swabian_circle_desc: "The Imperial Circles are to oversee matters of defense, taxation, and other administrative tasks in the empire. Württemberg is a natural state to be one of the directors of the 'Swabian' circle, which means that during times of war, we are able to call upon and lead the troops of the region."
 abm_wur_grosse_kirchenordnung: "Grosse Kirchenordnung"
 abm_wur_grosse_kirchenordnung_desc: "It is time to better organize the church in our state. With this "Grosse Kirchenordnung", we will not only make the church more efficient, but bind it more closely to our state."
 abm_wur_ludwigsburg: "Ludwigsburg"
 abm_wur_ludwigsburg_desc: "It is time for our nation to build a grand palace to exhibit the greatness of Württemberg to the world."
 abm_wur_reichsdeputationshauptschluss: "Reichsdeputationshauptschluss"
 abm_wur_reichsdeputationshauptschluss_desc: "The hundreds of petty states which make up the Empire are a bureaucratic nightmare, as well as making the maps so untidy. The Emperor and the Imperial Diet are planning to do away with these tiny states, merging them into the larger states - like us, for example. Let us take advantage of this by claiming as much as we can!"
 abm_wur_ideas_ambition: "Württemberger Ambition"
 abm_wur_ideas_ambition_desc: "Württemberger Ambition"
 abm_tri_ideas_tradition_1: "Trierian Tradition I"
 abm_tri_ideas_tradition_1_desc: "Trierian Tradition I"
 abm_tri_ideas_tradition_2: "Trierian Tradition II"
 abm_tri_ideas_tradition_2_desc: "Trierian Tradition II"
 abm_tri_crusader_past: "Crusader Past"
 abm_tri_crusader_past_desc: "Centuries ago, many brave men left our country as crusaders to take part in the Crusades. Their deeds are deeply ingrained in the memory of our bishopric. Our coat of arms - Saint George’s Cross - was chosen to honor these crusaders. Let all our soldiers remember our crusading past and be exhorted to show that the fire of times gone by is still in them."
 abm_tri_university_of_trier: "University of Trier"
 abm_tri_university_of_trier_desc: "The Pope has granted us leave to establish a university in our city, where we can train future priests and administrators for our bishopric. Let us do so and furthermore promote the study of law and medicine, so that we can become a true center of learning and draw students from far and wide."
 abm_tri_archchancellor_of_gaul: "Archicancellarius per Galliam"
 abm_tri_archchancellor_of_gaul_desc: "As the Archchancellor of Arles, Burgundy and all of France, it is our right and our duty to bring these lost lands back in to the empire. Under our banner shall the Empire in France be restored!"
 abm_tri_landesburgen: "Landesburgen"
 abm_tri_landesburgen_desc: "We have several castles called "Landesburgen" spread across our secular territory. They serve a vital role in our administration, acting as seats for our officials, toll collection posts and strong positions around which to rally our defense against our foes."
 abm_tri_seamless_robe_of_jesus: "The Seamless Robe of Jesus"
 abm_tri_seamless_robe_of_jesus_desc: "Helena, mother of the Roman Emperor Constantine the Great, is said to have sent the Holy Robe of Jesus to Trier (then known as Augusta Treverorum) after she discovered it in Jerusalem. It has since been held in a reliquary in Trier’s cathedral, but we sometimes put it on display for the faithful, drawing large numbers of pilgrim to our city for the occasion."
 abm_tri_prum_abbey: "Prüm Abbey"
 abm_tri_prum_abbey_desc: "Prüm was the favourite monastery of the Carolingians, receiving many privileges and large estates from King Pepin the Short after his marriage to Bertrada the Younger, granddaughter of the founder of the abbey. Over the years, it became not only a beautiful abbey, but also a center of ecclesiastic learning. However, it has declined considerably since those days, and is unable to survive on its own. We shall take over administration of the abbey and restore it to its former glory!"
 abm_tri_domkapitel: "Influence of the Domkapitel"
 abm_tri_domkapitel_desc: "The Domkapitel or Cathedral Chapter has great influence over the Archbishopric, choosing new Archbishops, deciding when the Archbishop may summon the estates, and ruling in his stead in the case of his absence. Through their vigilance, they will see to it that Trier is always well administered, whether the Archbishop is present or not."
 abm_tri_ideas_ambition: "Trierian Ambition"
 abm_tri_ideas_ambition_desc: "Trierian Ambition"
 abm_lux_ideas_tradition_1: "Luxembourg Tradition I"
 abm_lux_ideas_tradition_1_desc: "Luxembourg Tradition I"
 abm_lux_ideas_tradition_2: "Luxembourg Tradition II"
 abm_lux_ideas_tradition_2_desc: "Luxembourg Tradition II"
 abm_lux_imperial_legacy: "Imperial Legacy"
 abm_lux_imperial_legacy_desc: "Not long ago, the House of Luxembourg routinely supplied the Holy Roman Empire with its emperors. The fact our tiny nation often acceded to the rulership of such a vast empire gives us fame far beyond a land our size would normally enjoy."
 abm_lux_ardennes: "The Ardennes"
 abm_lux_ardennes_desc: "The rough and hilly terrain of our nation makes it difficult to invade; indeed, many armies simply choose to go around in order to avoid attempting to traverse the region, and the losses that would entail."
 abm_lux_moselle_trade: "The Moselle Trade"
 abm_lux_moselle_trade_desc: "The Moselle River flows along our eastern border. Let us steer the local trade along it so as to better control the commerce of the region."
 abm_lux_fortress: "The Fortress of Luxembourg"
 abm_lux_fortress_desc: "The great castle in the center of our capital city is acknowledged to be one of the finest fortifications in the world. Few armies would even contemplate besieging such a forbidding fortification. As we expand our influence over other areas let us make sure that we construct fortifications as imposing as the one that guards or home."
 abm_lux_spanish_road: "The Spanish Road"
 abm_lux_spanish_road_desc: "The great military route known as the Spanish Road runs through our lands. Let us make good use of this circumstance in our own military endeavor to reinforce our armies more efficiently!"
 abm_lux_grand_duchy_of_luxembourg: "The Grand Duchy of Luxembourg"
 abm_lux_grand_duchy_of_luxembourg_desc: "Our great state has a long and prestigeous history and is by now one of the most well regarded in either the French of German regions. Even in the incredible event that we would come under foreign ruler our title would be one of their most prestigious. Let us properly underline this by proclaiming the original duchy of Luxembourg as a Grand Duchy, by now one of many great titles born by our rulers."
 abm_lux_rivals_rivals_everywhere: "Rivals On All Sides"
 abm_lux_rivals_rivals_everywhere_desc: "Our location between France, the Low Countries, and the German states means that we should maintain a very active diplomacy. We must keep good relations with all of them, yet still watch them closely."
 abm_lux_ideas_ambition: "Luxembourg Ambition"
 abm_lux_ideas_ambition_desc: "Luxembourg Ambition"
 abm_han_ideas_tradition_1: "Hanoverian Tradition I"
 abm_han_ideas_tradition_1_desc: "Hanoverian Tradition I"
 abm_han_ideas_tradition_2: "Hanoverian Tradition II"
 abm_han_ideas_tradition_2_desc: "Hanoverian Tradition II"
 abm_han_niedersachsicher_reichskreis: "Niedersächsicher Reichskreis"
 abm_han_niedersachsicher_reichskreis_desc: "The Lower Saxon Circle administrates and coordinates the states in our part of the Holy Roman Empire. By working within it we can unite the princes against outside threats, while we also strengthen our own grip over the rich Lower Saxon lands."
 abm_han_weser_renaissance: "Weser Renaissance"
 abm_han_weser_renaissance_desc: "Our region is wealthy and many have money to spend on great buildings and works of art. Along the entire river Weser we are seeing beautiful castles built in the new architecture of our era. We must embrace the Weser renaissance and create great buildings to overshadow those of our lessers."
 abm_han_shutzenfest: "Schützenfest"
 abm_han_shutzenfest_desc: "Hanover has great need of talented men to protect and expand our domains. Let us hold annual fairs to identify the most skilled marksmen in our lands. This way we can ensure both the income of our local merchants and a good supply of recruits at once."
 abm_han_herrenhausen_gardens: "Herrenhausen Gardens"
 abm_han_herrenhausen_gardens_desc: "A great state like ours deserves a great capital. The gardens of the Herrenhausen castle, in Hanover, are already famous. Let us expand and build them up to be a truly unique wonder of our great capital, one that will attract curious travellers from near and far."
 abm_han_strengthen_the_meiertum: "Strengthen the Meiertum"
 abm_han_strengthen_the_meiertum_desc: "Hanover has always had a strong class of wealthy farmers to keep the nobility in check. The Hanoverian ‘Meiers’ have over time come to extend their rights to control the land to the brink of making them hereditary. Let us take this final step and profit from allowing the Meiers to thrive."
 abm_han_hanoverian_chancery: "Hanoverian Chancery"
 abm_han_hanoverian_chancery_desc: "Our international ties have led to us having a constant presence in foreign capitals. We should create a permanent institution to handle our embassies in the capitals of other states to improve both the ability and efficiency of our diplomats."
 abm_han_kings_legion: "King’s Legion"
 abm_han_kings_legion_desc: "In the past our armies have suffered scathing defeats at the hands of both Prussian and French soldiers. We must build a new and stronger army, determined to restore the glory of Hanover and to learn from past mistakes."
 abm_han_ideas_ambition: "Hanoverian Ambition"
 abm_han_ideas_ambition_desc: "Hanoverian Ambition"
 abm_pom_ideas_tradition_1: "Pomeranian Tradition I"
 abm_pom_ideas_tradition_1_desc: "Pomeranian Tradition I"
 abm_pom_ideas_tradition_2: "Pomeranian Tradition II"
 abm_pom_ideas_tradition_2_desc: "Pomeranian Tradition II"
 abm_pom_idea_1: "Legacy of Pirates"
 abm_pom_idea_1_desc: "Being a busy network of lucrative trade, the Baltic Sea, and thus the Northern German coast has always been a very good place for piracy. So much so that even rulers of these small countries often participated, more or less openly. There is nothing like stealing lots of gold from one of your rivals."
 abm_pom_idea_2: "Pomeranian Merchants"
 abm_pom_idea_2_desc: "The Pomeranians have a long tradition of sailing across the Baltic Sea in search of safe havens for their ships and merchandise. Many foreigners have heard of us - from Novgorod to Constantinople."
 abm_pom_idea_3: "Northern Ports"
 abm_pom_idea_3_desc: "Pomeranian ports are situated at an excellent strategic location, which gives us a natural advantage when expanding our influence over the trade within the Baltic Sea."
 abm_pom_idea_4: "Religious Freedom"
 abm_pom_idea_4_desc: "Being mostly interested in trade and distant business opportunities we have no time or desire to get into petty religious squabbles with our fellow Christians."
 abm_pom_idea_5: "Mercenary Contracts"
 abm_pom_idea_5_desc: "Our numerous trading contacts have allowed us to establish excellent relations with a multitude of foreigners. Our good name and reputation will allow us to hire their mercenaries at better rates than usual."
 abm_pom_idea_6: "Dominate the Baltic"
 abm_pom_idea_6_desc: "As Pomeranian power and influence grows, so does our grip over the Baltic Sea. Soon it will be Mare Nostrum, little more than Pomeranian pond. A highway for our trade."
 abm_pom_idea_7: "German Navy"
 abm_pom_idea_7_desc: "We shall attempt to construct the largest navy in all of Germany!"
 abm_pom_ideas_ambition: "Pomeranian Ambition"
 abm_pom_ideas_ambition_desc: "Pomeranian Ambition"
 abm_bra_ideas_tradition_1: "Brandenburg Tradition I"
 abm_bra_ideas_tradition_1_desc: "Brandenburg Tradition I"
 abm_bra_ideas_tradition_2: "Brandenburg Tradition II"
 abm_bra_ideas_tradition_2_desc: "Brandenburg Tradition II"
 abm_northern_march: "Northern March"
 abm_northern_march_desc: "In the early days of the Empire, the Brandenburg area was settled and governed by Slavic tribes, until the Emperor created the Northern March to subjugate and civilize the area. This Northern March eventually evolved into Brandenburg; one of the most prosperous regions in the Empire. It is only due to the fortitude of our soldiers that we were able to tame and secure this land of savages."
 abm_kammergericht: "Found the Kammergericht"
 abm_kammergericht_desc: "In order to regularize control of the Mark of Brandenburg the early Hohenzollerns would replace local common law with Roman law. They would further regulate justice by moving the Supreme Court from the court of the Elector (who was prone to moving around) to fixed and central location. This simultaneously improved justice and curbed the power of local magnates."
 abm_divided_estates: "Divide the Estates"
 abm_divided_estates_desc: "United, the three estates form an effective block on royal power. We need to systematically play the nobility off against the other estates to consolidate our control."
 abm_bra_pomeranian_wars: "Pomeranian Wars"
 abm_bra_pomeranian_wars_desc: "Throughout the entire medieval era, the Margraves of Brandenburg and the Dukes of Pomerania found themselves in constant war for control of the region. Ultimately, the Brandenburgers were victorious when the Treaty of Stettin was signed, partitioning the region between Brandenburg and the Kingdom of Sweden."
 abm_seat_of_the_old_emperors: "Seat of the Old Emperors"
 abm_seat_of_the_old_emperors_desc: "Before Habsburg rule, the empire was truly diverse in the families it elected, and Brandenburg was often a great prize handed out to talented princes of these royal lines. Brandenburg represents the old ways, and perhaps we may one day use our position to restore the ideals of the Holy Roman Empire."
 abm_iron_tooth: "Iron Tooth"
 abm_iron_tooth_desc: "In his thirty years as Elector of Brandenburg, Frederick II earned the nickname "Iron Tooth" for both his iron will in the face of rebellious nobles and towns, but also for his fortitude in the Pomeranian Wars. His rule left a mark on our nation, a mark which instills a sense of pride and loyalty in even the lowliest peasant in Brandenburg."
 abm_margrave_council: "Geheimer Rat für die Kurmark"
 abm_margrave_council_desc: "The power of the Margrave is greatly threatened by the ever-increasing power of our Estates. The Estates are of great benefit to our nation, but the very real threat they represent to our base of power necessitates the creation of a new council, one which reduces the very real power that the estates hold over our nation into more of an advisory position for the Margrave. This way, we may continue to exploit the benefits of our Estates while needing to worry little about their needs."
 abm_bra_ideas_ambition: "Brandenburg Ambition"
 abm_bra_ideas_ambition_desc: "Brandenburg Ambition"
 abm_lor_ideas_tradition_1: "Lorraine Tradition I"
 abm_lor_ideas_tradition_1_desc: "Lorraine Tradition I"
 abm_lor_ideas_tradition_2: "Lorraine Tradition II"
 abm_lor_ideas_tradition_2_desc: "Lorraine Tradition II"
 abm_lor_vosges: "The Vosges"
 abm_lor_vosges_desc: "Attacking Lorraine means traversing the mountainous wilderness of the Vosges, an area that any army would find very difficult to traverse. Let us plan our defenses accordingly and aim to always make the most of the local environment."
 abm_lor_mines_of_lorraine: "Mines of Lorraine"
 abm_lor_mines_of_lorraine_desc: "Our land is blessed with numerous deposits of iron ore, making us a center of production of weapons and other metalwork. We must encourage this metal industry to thrive and aim to become the foremost producer of arms in our region."
 abm_lor_lotharingia: "Lotharingia"
 abm_lor_lotharingia_desc: "Our country is the direct continuation of the Kingdom of Middle Francia, known as Lotharingia after its ruler Lothair, grandson of Charlemagne. His kingdom stretched from the North Sea to Italy, separating what would become France and Germany. With such a vast legacy, it is easy for us to find long-lost claims to territories we don't currently rule."
 abm_lor_between_great_powers: "Flexible Diplomacy"
 abm_lor_between_great_powers_desc: "Our country lies on the very edge of the Holy Roman Empire, with a covetous France just to the west. The lands ruled by Burgundy hem us in to the north and the south, and they desire to unite their lands by annexing ours. In order to maintain our independence, we must be deft at diplomacy, lest one or the other takes control of us, or we are ground between the millstones."
 abm_lor_two_languages: "Two Languages, One Land"
 abm_lor_two_languages_desc: "We are a nation divided by language; many of our people speak French, while a large number speak German. In order to put up a unified front to the world, we must work together as one, despite our linguistic differences."
 abm_lor_three_bishoprics: "Trois-Évêchés"
 abm_lor_three_bishoprics_desc: "Scattered among our territories are the Three Bishoprics of Metz, Toul, and Verdun. These states are not easily annexed as their independence is guaranteed by a number of old and prestigious treaties. Instead we ought to focus our efforts at cooperating closely with the church and its worldly princes for the betterment of us all."
 abm_lor_place_stanislas: "Place Stanislas"
 abm_lor_place_stanislas_desc: "Let us refurbish our capital to be a shining example of modern urban planning, a great project worthy of our ambitious state. In order to tie together the old and the new we must create a great monumental square, a place where every visitor can marvel at our greatness."
 abm_lor_ideas_ambition: "Lorraine Ambition"
 abm_lor_ideas_ambition_desc: "Lorraine Ambition"
 abm_hsa_ideas_tradition_1: "Tradition of The Hansa I"
 abm_hsa_ideas_tradition_1_desc: "Tradition of The Hansa I"
 abm_hsa_ideas_tradition_2: "Tradition of The Hansa II"
 abm_hsa_ideas_tradition_2_desc: "Tradition of The Hansa II"
 abm_end_of_victual_brothers: "The End of the Victual Brothers"
 abm_end_of_victual_brothers_desc: "We have shattered the forces of the Victual Brothers and pursued and hunted down the remnants. We must now ensure that such a force of pirates never threatens us again. We will do what it takes to protect our trade."
 abm_strong_league_obligations: "Strong League Obligations"
 abm_strong_league_obligations_desc: "The League has always worked on a very decentralized structure. This was both its strength and weakness. Let us tighten up the obligations of league members in their areas of specialization, so that we are more efficient in trade."
 abm_hsa_shipbuilding: "Improved Shipbuilding"
 abm_hsa_shipbuilding_desc: "For a long time most ships in the Baltic were built by Hanseatic Towns, but new times have brought new competitors who are building cheaper, but naturally inferior, ships. We need to improve our shipyards to maintain our position as the Baltic's foremost trading power."
 abm_reformed_hanstag: "Reformed Hanstag"
 abm_reformed_hanstag_desc: "Until now, the Hanstag has worked on a system where we only passed rules if nobody objected. This worked well when we were the only trading power in the Baltic. We need to switch over to a system where a simple majority is enough. This should improve decision making while still maintaining the support of the cities."
 abm_hanseatic_levy_system: "Hanseatic Levy System"
 abm_hanseatic_levy_system_desc: "Each city within the league is expected to provide levies in the case of warfare. This ad hoc system makes military campaigning difficult because cities aren't willing to supply sufficient forces. We need to reform the system so cities supply a larger share of manpower to the league."
 abm_regularised_contribution: "Regularized Contributions"
 abm_regularised_contribution_desc: "League finances are currently very much done on an ad hoc basis. Towns contribute either money or in kind towards league projects. This is simply not good enough for us to survive in the current climate. Although the towns are free to collect the contribution in their own manner it is vital that each town makes a regular contribution."
 abm_the_hansa_bank: "The Hansa Bank"
 abm_the_hansa_bank_desc: "Using the new system of contribution, we can underwrite a bank for members to use. Backed by the resources of the league, a letter of credit from the bank will be as good as cash. This, as well as other financial instruments, will give our merchants an edge over other countries."
 abm_hsa_ideas_ambition: "Ambition of The Hansa"
 abm_hsa_ideas_ambition_desc: "Ambition of The Hansa"
 abm_mun_ideas_tradition_1: "Münster Tradition I"
 abm_mun_ideas_tradition_1_desc: "Münster Tradition I"
 abm_mun_ideas_tradition_2: "Münster Tradition II"
 abm_mun_ideas_tradition_2_desc: "Münster Tradition II"
 abm_mun_great_procession: "Great Procession"
 abm_mun_great_procession_desc: "Each year since the great plague of 1382 that killed almost 8000 inhabitants and the great fire of 1383 we hold a great procession. It shows our repentance for our sins and our devotion to God."
 abm_mun_erbmanner: "Erbmänner"
 abm_mun_erbmanner_desc: "The 'Erbmänner' of Münster are the nobility of our great city. They are the only ones who own passive electoral rights and if we elect a bishop out of these men, we can sure of the loyalty of all noble families in our bishopric."
 abm_mun_founding_of_monestaries: "Founding of Monasteries"
 abm_mun_founding_of_monestaries_desc: "In these days of reformation we have to defend Catholicism in the bishopric by inviting Jesuits, and encouraging the founding of monasteries for the old orders. Some of these monasteries will train excellent missionaries for our purposes."
 abm_mun_cities_of_peace: "Cities of Peace"
 abm_mun_cities_of_peace_desc: "The Peace of Westphalia was signed in Münster and Osnabrück. The treaties ended the Thirty Years' War in the Holy Roman Empire and fully established the independence of the Dutch Republic.\nBy promoting our cities as an ideal place for diplomatic negotiations we are sure to gain high renown across all of Europe."
 abm_mun_soldiers: "Soldiers from the Imperial Armies"
 abm_mun_soldiers_desc: "It is our duty to maintain a strong army in order to prevail against our Protestant neighbors. The soldiers of the Imperial Army are perfect for our goals. They are well-trained and battle tested soldiers ready to defend our great bishopric against heretical nations."
 abm_mun_bommen_berend: "Bommen Berend"
 abm_mun_bommen_berend_desc: "Due to the intense bombardment of besieged cities using mortars, prince-bishop Christoph Bernhard von Galen, has gained the nick name 'Bommen Berend'. Let us make this choice of arms the guideline of our generals henceforth."
 abm_mun_support_of_schools: "Support the Schools"
 abm_mun_support_of_schools_desc: "The education of our people is the backbone of our state. The schools in our realm are some of the oldest in all of Europe. Let us build new schools and hire many teachers to provide affordable education for our people."
 abm_mun_ideas_ambition: "Münster Ambition"
 abm_mun_ideas_ambition_desc: "Münster Ambition"
 abm_theocracy_ideas_tradition_1: "Divine Tradition I"
 abm_theocracy_ideas_tradition_1_desc: "Divine Tradition I"
 abm_theocracy_ideas_tradition_2: "Divine Tradition II"
 abm_theocracy_ideas_tradition_2_desc: "Divine Tradition II"
 abm_holy_order: "Holy Order"
 abm_holy_order_desc: "Only the purest of faith can be become a foot soldier in the army of Christ. To be pure in mind, spirit, and body requires not just a man who is heaven bound but also a superior warrior. These soldiers will form the nucleus of an army that will stand against anyone who dares to attack us."
 abm_church_administration: "Church Administration"
 abm_church_administration_desc: "The clergy are a very rare breed of animal in these benighted days, being almost universally literate. This makes clergymen not only capable of reading the scriptures, but very effective administrators."
 abm_true_defender_of_the_faith: "True Defender of the Faith"
 abm_true_defender_of_the_faith_desc: "Our castles are our churches and we must defend them to the last. We will stand on the walls as brothers, in the name of our Lord Jesus Christ, and let no man falter."
 abm_no_witches: "Let No Man Tolerate the Witch"
 abm_no_witches_desc: "Witches and Warlocks abound. The vile influence of their covens is everywhere. It is every citizen's final duty to assist the Supreme Sacred Congregation and the Universal Inquisition in their quest to root out this heinous practice."
 abm_onward_christian_soldiers: "Onward Christian Soldiers"
 abm_onward_christian_soldiers_desc: "Let it be the duty of every Christian Soldier, not to march off for war, but to stay at home and defend the fortress of Christ."
 abm_turn_the_other_cheek: "Turn the Other Cheek"
 abm_turn_the_other_cheek_desc: "When the enemy comes, do not aid him for he is your enemy. Do not assist him, for he is your foe. Do not offer him shelter, for he is your doom. Let none provide help for the enemy, and instead turn the other cheek, as Jesus would have done."
 abm_render_unto_ceasar: "Render unto Caesar"
 abm_render_unto_ceasar_desc: "Then he saith onto them, 'Render therefore unto Caesar the things which are Caesar's.'"
 abm_theocracy_ideas_ambition: "Divine Ambition"
 abm_theocracy_ideas_ambition_desc: "Divine Ambition"
 abm_swi_ideas_tradition_1: "Swiss Tradition I"
 abm_swi_ideas_tradition_1_desc: "Swiss Tradition I"
 abm_swi_ideas_tradition_2: "Swiss Tradition II"
 abm_swi_ideas_tradition_2_desc: "Swiss Tradition II"
 abm_swiss_mercenaries: "Swiss Mercenaries"
 abm_swiss_mercenaries_desc: "How many kings have had cause to shout 'Summon the Switzers' whenever there has been an assassination attempt? From the Swiss Guard who protect His Holiness in Rome to the Swiss mercenaries serving as auxiliaries and bodyguards in most of the courts of Christendom, Swiss mercenaries have proven legendary in their ability. Perhaps our native sons will give us a discount for working in our courts?"
 abm_swiss_tolerance: "Swiss Tolerance"
 abm_swiss_tolerance_desc: "The Reformation threatens to tear our land apart. Some provinces join the Protestant movement, others Reform, and still others remain Catholic. Our land is ravaged by violence and confusion. Why must we kill each other over transubstantiation and predestination when we could turn our mountain home into a realm united once more?"
 abm_the_swiss_confederation: "The Swiss Confederation"
 abm_the_swiss_confederation_desc: "In 1291 the cantons of Schwyz, Uri, and Unterwalden banded together to escape from the Habsburg inheritance, and since then, they and the other cantons have been resolute in resisting foreign incursions on our autonomy within the Empire. Nonetheless, we still aren't a proper country but an alliance or confederation of cantons with a coordinated military policy to protect our privileges. This decentralized model helps to keep our realm responsive and stable."
 abm_alpine_defensiveness: "Alpine Defensiveness"
 abm_alpine_defensiveness_desc: "Throughout the late 13th and 14th centuries, we have been constantly repelling Habsburg (and, often, by extension, Imperial) incursions into our lands. Our mighty soldiers have played a major role in that, but the hardy, difficult terrain of our mountainous home has made invasion equally difficult."
 abm_oasis_of_peace_and_prosperity: "Oasis of Peace and Prosperity"
 abm_oasis_of_peace_and_prosperity_desc: "Even as the most gruesome of wars rages, there's usually little call to bring Switzerland in: after all, both sides need their Swiss mercenaries, and neither wants to be cut off. Perhaps if peace is prosperity, we should focus more on peace."
 abm_haven_for_refugees: "Haven for Refugees"
 abm_haven_for_refugees_desc: "Other countries shed political malcontents and authors with texts critical of their governments banned abroad. Some of these figures are quite interesting, and what harm would it do us to let them criticize their homelands from the safety of their new Alpine refuge? We will establish a tradition of Switzerland as the land where exiles can speak their mind freely."
 abm_clockwork: "Clockwork"
 abm_clockwork_desc: "Some fools think that clockwork is for clocks alone. When one witnesses the power of rotating gears ticking away, it's obvious that clockwork can do just about anything one wants it to do: maybe the Creator of the Universe himself wound up existence like a clock and let the gears spin on their own, ticking away the centuries. Be that as it may, Swiss clockmakers are the greatest masters of the art of clockwork in existence, barring God Himself of course."
 abm_swi_ideas_ambition: "Swiss Ambition"
 abm_swi_ideas_ambition_desc: "Swiss Ambition"
 abm_boh_ideas_tradition_1: "Bohemian Tradition I"
 abm_boh_ideas_tradition_1_desc: "Bohemian Tradition I"
 abm_boh_ideas_tradition_2: "Bohemian Tradition II"
 abm_boh_ideas_tradition_2_desc: "Bohemian Tradition II"
 abm_compacta_of_prague: "Compacta of Prague"
 abm_compacta_of_prague_desc: "The Hussite wars are over and it is time to unite the nation. Let all be forgiven so the Czech people can live in peace."
 abm_boh_elective_monarchy: "Elective Monarchy"
 abm_boh_elective_monarchy_desc: "For too long the fractious nobility of Bohemia have been a huge impediment to royal authority. From now on we will ensure that every new monarch has the full support of the nobles prior to his or her coronation. That should avoid any problems."
 abm_wagenburg: "Wagenburg"
 abm_wagenburg_desc: "During the Hussite wars our armies relied on wagon forts, which would allow us to win battles we should have lost. Although we may not always use wagons, using infantry sharp shooters from defensive position will become the tactic of choice for our ever invincible Czech armies."
 abm_letter_of_majesty: "Letter of Majesty"
 abm_letter_of_majesty_desc: "The Hussite wars have left a legacy of dangerous divisions on ecclesiastical matters in the Czech lands. If Bohemia is to prosper we must end this divisive conflict and bring order to our lands. We will promulgate a letter of majesty in our realms granting the freedom of conscience to all."
 abm_hussite_legacy: "Hussite Legacy"
 abm_hussite_legacy_desc: "While the Church in Rome gets increasingly reactionary in the face of theological challenges we in Bohemia are much more relaxed about this. This leads us to be more relaxed towards new ideas."
 abm_kutnohorian_deal: "The Kutnohorian Deal"
 abm_kutnohorian_deal_desc: "The nobility will always remain sensitive regarding their prerogatives, so we need to guarantee that their privileges are guaranteed forever."
 abm_czech_nationalism: "Czech Nationalism"
 abm_czech_nationalism_desc: "The Czech people have survived everything the world has thrown at them, we have shown our resilience."
 abm_boh_ideas_ambition: "Bohemian Ambition"
 abm_boh_ideas_ambition_desc: "Bohemian Ambition"
 abm_mva_ideas_tradition_1: "Moravian Tradition I"
 abm_mva_ideas_tradition_1_desc: "Moravian Tradition I"
 abm_mva_ideas_tradition_2: "Moravian Tradition II"
 abm_mva_ideas_tradition_2_desc: "Moravian Tradition II"
 abm_mva_margraviate: "Margraviate of Moravia"
 abm_mva_margraviate_desc: "The Margraviate of Moravia and the privileges of the Moravian diet date back to the 12th century. This title gives us great influence in the region as kings or even emperors have competed for the good will of the Moravian estates for centuries."
 abm_mva_religious_refuge: "Religious Sanctuary"
 abm_mva_religious_refuge_desc: "When the lands of the Bohemian crown got overrun by the Hussite heresy we opened our arms to the Catholic refugees and we should strive to shelter anyone haunted by such religious persecution."
 abm_mva_cities_of_moravia: "Cities of Moravia"
 abm_mva_cities_of_moravia_desc: "Moravia is a rich land on the crossroads between Bohemia and Austria. This has allowed our burghers to thrive and both Brno and Olomouc have become influential trading centers in their own right. We must do what we can to make the most of this strategic position, and to strengthen the interests of our burghers and artisans."
 abm_mva_land_of_vinyards: "Land of Vineyards"
 abm_mva_land_of_vinyards_desc: "For over a thousand years the hills of Moravia have been used to produce our famous wines. We must continue to protect our vineyards and to promote Moravian wine to our neighbors."
 abm_mva_german_quarters: "German Quarters"
 abm_mva_german_quarters_desc: "Our proximity to the German regions has led to a long history of close cooperation and integration with the German political and economic sphere. There is hardly any major Moravian city that does not have a German quarter."
 abm_mva_jesuit_university: "Jesuit University"
 abm_mva_jesuit_university_desc: "The Jesuits do admirable work for the counter-reformation and are in many ways at the forefront of education and the crafting of theological arguments. Let us invite the Jesuits to start seminars and create universities within our lands."
 abm_mva_legacy_of_great_moravia: "Legacy of Great Moravia"
 abm_mva_legacy_of_great_moravia_desc: "Centuries ago, long before the current powers that now dominate Europe, this region was all subdued by Great Moravia. We must cherish this legacy and build a new empire for the Moravian people."
 abm_mva_ideas_ambition: "Moravian Ambition"
 abm_mva_ideas_ambition_desc: "Moravian Ambition"
 abm_sil_ideas_tradition_1: "Silesian Tradition I"
 abm_sil_ideas_tradition_1_desc: "Silesian Tradition I"
 abm_sil_ideas_tradition_2: "Silesian Tradition II"
 abm_sil_ideas_tradition_2_desc: "Silesian Tradition II"
 abm_under_the_infuence: "Under the Influence"
 abm_under_the_infuence_desc: "Under constant Bohemian, German, and Polish influence, we have learned how to use diplomacy to the best of our ability."
 abm_silesian_duchies: "Silesian Duchies"
 abm_silesian_duchies_desc: "Ever since the feudal fragmentation of Poland, Silesia was divided between numerous duchies. The decentralization eased administration over these areas."
 abm_german_settlers: "German Settlers"
 abm_german_settlers_desc: "Starting from the 12th century, we have seen a steady influx of German settlers. They bring German town laws and knowledge of various crafts helping to further develop our land."
 abm_raubritter: "Raubritter"
 abm_raubritter_desc: "Robber barons (Raubritter) roamed the trade routes and hindered commerce by imposing unauthorized tolls or tariffs. Control of them helps our trade influence in the area."
 abm_via_regia: "Via Regia"
 abm_via_regia_desc: "Via Regia was an important and well maintained trade route which crossed the Holy Roman Empire. Most inland trade in central Europe flowed through it."
 abm_hanseatic_ties: "Hanseatic Ties"
 abm_hanseatic_ties_desc: "With Breslau becoming a member of Hanseatic League we gain more control of central European trade."
 abm_black_gold: "Black Gold"
 abm_black_gold_desc: "Silesia is rich in natural resources, particularly coal. By constructing mines we can increase our income greatly."
 abm_sil_ideas_ambition: "Silesian Ambition"
 abm_sil_ideas_ambition_desc: "Silesian Ambition"
 abm_shl_ideas_tradition_1: "Holstein Tradition I"
 abm_shl_ideas_tradition_1_desc: "Holstein Tradition I"
 abm_shl_ideas_tradition_2: "Holstein Tradition II"
 abm_shl_ideas_tradition_2_desc: "Holstein Tradition II"
 abm_limes_saxoniae: "Limes Saxoniae"
 abm_limes_saxoniae_desc: "Throughout the centuries Holstein has been a border region and from the time of the Danevirke or the Saxon Dyke to today it has been in the interest of anyone in control of this area to fortify it."
 abm_between_a_kingdom_and_the_empire: "Between a Kingdom and the Empire"
 abm_between_a_kingdom_and_the_empire_desc: "Situated right at the border of the Holy Roman Empire and the Kingdom of Denmark our state is part Danish, part German. This dual identity has served our country well through the ages and means that should our independence be threatened we always have someone to turn to."
 abm_holsteins: "'Ewich Tosamende Ungedelt'"
 abm_holsteins_desc: "While the treaty of Ribe stipulates that these lands must remain undivided we have a long tradition of solving inheritance disputes by partitioning our lands in Holstein. This practice ensures the stability and longevity of our state and we would not be wise to change it."
 abm_kieler_umschlag: "Kieler Umschlag"
 abm_kieler_umschlag_desc: "Since 1431 the Kieler Umschlag, a Free Market Fair, has attracted merchants and traders from all over the rich cities of northern Germany and the Baltic Sea to our lands."
 abm_reunifications_of_holstein: "Reunification of the Holsteiner Lands"
 abm_reunifications_of_holstein_desc: "Many parts of our nation are divided between a variety of land holders. Let us consolidate the lands of Holstein and create a stronger and more unified state."
 abm_trade_of_two_seas: "The Trade of Two Seas"
 abm_trade_of_two_seas_desc: "For hundreds of years Slesvig and Holstein have been the center of attention for traders from all over the Baltic and North Seas as they control the shortest overland route between the two seas. Let us encourage this trade as an alternative to the Kattegat-Skagerrak route."
 abm_danish_protest_pigs: "Danish Protest Pigs"
 abm_danish_protest_pigs_desc: "The balance between Danish and German culture in our state is fragile and should we ever come to under the rule of someone who would suppress one of these identities we will resist. Even if it means resorting to passive aggression, such as using our expertise in animal husbandry to create a pig that is patterned like the beloved Dannebrog."
 abm_shl_ideas_ambition: "Holstein Ambition"
 abm_shl_ideas_ambition_desc: "Holstein Ambition"
 abm_fri_ideas_tradition_1: "Frisian Tradition I"
 abm_fri_ideas_tradition_1_desc: "Frisian Tradition I"
 abm_fri_ideas_tradition_2: "Frisian Tradition II"
 abm_fri_ideas_tradition_2_desc: "Frisian Tradition II"
 abm_fri_coastal_industry: "Coastal Industry"
 abm_fri_coastal_industry_desc: "As trade begins to blossom in the North Sea, so too does our importance in the area. Our people's natural skill at sea-faring will prove most useful in the coming years."
 abm_fri_upstalsboom_league: "The Upstalsboom League"
 abm_fri_upstalsboom_league_desc: "The Frisian dream of true Republicanism has had many setbacks. Since the 12th Century, we have striven against feudalism; perhaps now it is the time to constitutionalize our ideals."
 abm_fri_dutch_courage: "Dutch Courage"
 abm_fri_dutch_courage_desc: "Foreign soldiers often remark on the bravery of our troops. Whether their bravery is caused by rations of gin as the foreigners believe, or by our superlative training regimen, it is not clear."
 abm_fri_zuiderzee_settlements: "The Zuider Embankments"
 abm_fri_zuiderzee_settlements_desc: "Horrific floods have plagued the coast of Frisia from time immemorial. Our engineers have done such a remarkable job on shoring up the vast embankments and dykes that hold back the sea, that we believe they may be among the finest in the world."
 abm_fri_flooding_polders: "Flooding the Polders"
 abm_fri_flooding_polders_desc: "The landscape of Frisia has been dotted with artificially-irrigated enclosed fields called Polders, for centuries. It was only recently that we realised their superb potential for combating invasion. By opening the floodgates, we can render our territory all but impenetrable."
 abm_fri_mennonism: "Difference of Opinion"
 abm_fri_mennonism_desc: "As debate in Europe becomes ever more heated regarding the Divine, we strive to promote our legacy of tolerance, understanding, and friendship."
 abm_fri_brothers_arms: "Brothers in Arms"
 abm_fri_brothers_arms_desc: "The Low Countries have been besieged, set upon, and conquered time and again over the course of history. It is becoming fast apparent that we must reach out to our brethren and stand firm in our mutual resolve to keep our property, ours."
 abm_fri_ideas_ambition: "Frisian Ambition"
 abm_fri_ideas_ambition_desc: "Frisian Ambition"
 abm_wbg_ideas_tradition_1: "Wurzburgian Tradition I"
 abm_wbg_ideas_tradition_1_desc: "Wurzburgian Tradition I"
 abm_wbg_ideas_tradition_2: "Wurzburgian Tradition II"
 abm_wbg_ideas_tradition_2_desc: "Wurzburgian Tradition II"
 abm_wbg_legacy_of_imperial_diets: "Legacy of the Imperial Diets"
 abm_wbg_legacy_of_imperial_diets_desc: "In times past the bishop of Wurzburg hosted many Imperial Diets in his city and served as a facilitator between the Emperor and his subjects. We should revive this tradition and search out those who would listen to our counsel."
 abm_wbg_duke_in_franconia: "Duke in Franconia"
 abm_wbg_duke_in_franconia_desc: "Emperor Barbarossa gave the bishop of Wurzburg the ducal title. While he didn't give him any power over the Franconian lands, we can use this title to lift the bishop above all others."
 abm_wbg_franconian_circle: "Franconian Circle"
 abm_wbg_franconian_circle_desc: "The Franconian circle is home to many fierce knights, if we offer them a place in our armies our cavalry will be unbeatable!"
 abm_wbg_independent_counts: "Independent Counts"
 abm_wbg_independent_counts_desc: "We share our lands with several counts who are independent. Since we have no power over them we should work with them to find a compromise and prevent conflicts between us."
 abm_wbg_cassation_of_monasteries: "Cassation of Monasteries"
 abm_wbg_cassation_of_monasteries_desc: "There are many monasteries in our lands that stand almost empty, if we close them down and take their lands we will gain a valuable source of income."
 abm_wbg_franconian_wine: "Franconian Wine"
 abm_wbg_franconian_wine_desc: "Our wine is one of the best in the Empire, we should support our vintners by providing them with enough land to work."
 abm_wbg_baroque_artists: "Baroque Artists"
 abm_wbg_baroque_artists_desc: "We are building a magnificent residence in Wurzburg, let us hire the best architects and artists to make it greater than any other palace built for bishop in the Holy Roman Empire."
 abm_wbg_ideas_ambition: "Wurzburgian Ambition"
 abm_wbg_ideas_ambition_desc: "Wurzburgian Ambition"
