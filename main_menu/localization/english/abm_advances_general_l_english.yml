# ============================================================
# General (all-nation) Advances Localization
# Combined Arms bonus for a European original capital, ages 2 and 3
# ============================================================

 abm_combined_arms_renaissance: "Combined Arms Drill"
 abm_combined_arms_renaissance_desc: "The captains of our age have learned that horse, foot and shot are worth more together than apart. Drill the regiments to cover one another, and the line becomes greater than the sum of its parts."

 abm_combined_arms_discovery: "Combined Arms Doctrine"
 abm_combined_arms_discovery_desc: "What began as battlefield improvisation is now written into our ordinances. Every arm has its place in the order of battle, and every commander is taught to use the others as his own."
