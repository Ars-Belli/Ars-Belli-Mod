 flavor_ssg.1.entry: "$flavor_ssg.1.title$"
 flavor_ssg.1.title: "The Claim of the Hanyang Jo"
 flavor_ssg.1.desc: "For generations the Jo house has governed Ssangseong in the Yuan name. Yet the blood of Goryeo still runs through the northern households, and Jo Rim's councillors whisper that a hereditary office won by surrender can be remade into a royal claim. Such a declaration would promise restoration, but it would also alarm every neighbour and divide those who prosper under the present order."
 flavor_ssg.1.a: "Proclaim a Northern Goryeo kingdom."
 flavor_ssg.1.a.entry: "$flavor_ssg.1.a$"
 flavor_ssg.1.b: "Our authority rests upon the old settlement."
 flavor_ssg.1.b.entry: "$flavor_ssg.1.b$"
 ssg_jo_restoration_undecided_tt: "The Hanyang Jo court has not yet decided whether to claim Goryeo"

 flavor_ssg.10.title: "The Granaries Reopened"
 flavor_ssg.10.desc: "The repaired storehouses can now receive grain from the valleys. Crown officials ask for direct control, while local merchants offer carts, credit, and wider exchange in return for charters."
 flavor_ssg.10.a: "Keep the reserves beneath the royal seal."
 flavor_ssg.10.b: "Charter the frontier markets."
 flavor_ssg.11.title: "Roads Through the Valleys"
 flavor_ssg.11.desc: "Stone bridges, marked passes, courier inns, and guarded depots now connect Hwaju to the inner valleys. Orders and grain travel where seasonal tracks once failed."
 flavor_ssg.11.a: "The mountains no longer divide the realm."
 flavor_ssg.11.infrastructure_tt: "Every owned location in Hwaju Province gains Control and Prosperity"
 flavor_ssg.12.title: "Workshops of the Northern Court"
 flavor_ssg.12.desc: "Water channels drive mills, smiths share gauges and patterns, and crown inspectors record which designs endure. The project has strengthened the realm without conjuring wealth from empty ground."
 flavor_ssg.12.a: "Put tested craft into steady practice."

 flavor_ssg.20.title: "The Frontier Muster Rolls"
 flavor_ssg.20.desc: "The new rolls reveal how many households can supply men, horses, bows, and provisions. The court must choose between a smaller force bound personally to the Jo house and broader obligations laid upon the villages."
 flavor_ssg.20.a: "Bind household retainers to the throne."
 flavor_ssg.20.b: "Order the villages into levy districts."
 flavor_ssg.21.title: "A Chain of Fire"
 flavor_ssg.21.desc: "Beacon towers overlook the passes, while nearby forts hold grain, arrows, and spare tack. A warning can now cross the frontier faster than a raiding column."
 flavor_ssg.21.a: "Keep every beacon supplied."
 flavor_ssg.22.title: "The Royal Arsenal"
 flavor_ssg.22.desc: "Standard stores serve the frontier host, and watched coastal stations report unfamiliar sails. The kingdom has gained endurance and readiness, not an army beyond its means."
 flavor_ssg.22.a: "Let readiness guard what numbers cannot."

 flavor_ssg.30.title: "Books Beyond the Border"
 flavor_ssg.30.desc: "Agents have located administrative manuals, medical texts, casting notes, and military recipes in foreign hands. Some may be copied by bribing clerks; others can be understood only by bringing skilled artisans to court."
 flavor_ssg.30.a: "Pay clerks to copy what their masters guard."
 flavor_ssg.30.b: "Hire artisans who know the work."
 flavor_ssg.31.title: "The Trial Workshops"
 flavor_ssg.31.desc: "Court artisans now record weights, failures, and successful trials rather than preserving recipes by memory alone. Their work remains slow, but useful knowledge is no longer lost with each master."
 flavor_ssg.31.a: "Record the failures beside the successes."
 flavor_ssg.32.title: "The Court Academy"
 flavor_ssg.32.desc: "The academy joins scribes, physicians, founders, and powder makers under royal patronage. Its guarded experiments may aid sieges and mining, though rumours of smoke and thunder have already unsettled neighbouring courts."
 flavor_ssg.32.a: "Knowledge must be guarded as carefully as powder."

 flavor_ssg.40.title: "The Gate in the Wall"
 flavor_ssg.40.desc: "A restoration court cannot ignore the world beyond its passes, but neither can it expose every weakness. Councillors argue for a sealed frontier under strict watch; merchants and envoys urge a narrow, measured opening."
 flavor_ssg.40.a: "Close the gates, but keep watch beyond them."
 flavor_ssg.40.b: "Open selected roads under royal license."
 flavor_ssg.41.title: "The Privy Routes"
 flavor_ssg.41.desc: "Trusted merchants, monks, interpreters, and couriers now carry sealed instructions along routes that formal envoys cannot use. News arrives quietly, and messages leave with fewer witnesses."
 flavor_ssg.41.a: "A quiet road may serve better than a grand embassy."
 flavor_ssg.42.title: "The Restoration Proclaimed Abroad"
 flavor_ssg.42.desc: "Border clans have heard the Jo genealogy recited, foreign courts have received guarded letters, and the rival court has been named an obstacle to reunion. The claim now carries diplomatic weight—and consequences."
 flavor_ssg.42.a: "Let every court know our purpose."

 flavor_ssg.110.title: "Spoilage in the Lower Stores"
 flavor_ssg.110.desc: "The first full inspection of the restored granaries has uncovered damp grain and false measures hidden beneath sound sacks. The officials demand a public accounting, while merchants offer coin for anything that can still be salvaged."
 flavor_ssg.110.a: "Burn the spoiled grain and publish the true accounts."
 flavor_ssg.110.b: "Sell what can be salvaged before panic spreads."
 flavor_ssg.111.title: "A Crossing Lost to the Rains"
 flavor_ssg.111.desc: "Seasonal floods have carried away a new crossing and stranded carts on both banks. The surveyors ask for stone piers and another month of hired labour; local headmen insist that a cheaper timber bridge will keep the route moving."
 flavor_ssg.111.a: "Rebuild the crossing in stone."
 flavor_ssg.111.b: "Use timber and keep to the timetable."
 flavor_ssg.112.title: "Patterns That Do Not Fit"
 flavor_ssg.112.desc: "The gauges issued by the court suit the smithies near Hwaju but waste iron in the smaller valley workshops. Inspectors demand one royal standard, while local masters argue that measured variation will produce more useful tools."
 flavor_ssg.112.a: "Test and record a common standard."
 flavor_ssg.112.b: "Permit local patterns under royal license."

 flavor_ssg.120.title: "Names Missing from the Rolls"
 flavor_ssg.120.desc: "The muster census has found households omitted by friendly clerks and villages claiming exemptions that no seal confirms. A strict audit would strengthen the crown's authority; a broader levy could put more men in the field immediately."
 flavor_ssg.120.a: "Audit every roll beneath the royal seal."
 flavor_ssg.120.b: "Accept service now and settle the claims later."
 flavor_ssg.121.title: "The Night of Unanswered Fires"
 flavor_ssg.121.desc: "During a full-chain test, two hilltop beacons failed to answer before dawn. Their wardens blame wet fuel and empty storehouses, but officers warn that an enemy would need no better excuse."
 flavor_ssg.121.a: "Repeat the drill until every tower answers."
 flavor_ssg.121.b: "The warning reached Hwaju; declare the chain ready."
 flavor_ssg.122.title: "Iron for Coast or Pass"
 flavor_ssg.122.desc: "The first standardized castings are ready, but the arsenals cannot supply every request at once. Frontier captains want fittings and points for the mountain forts; harbour wardens ask for anchors, bolts, and weapons for the patrol craft."
 flavor_ssg.122.a: "Supply the mountain arsenals first."
 flavor_ssg.122.b: "Send the next castings to the harbours."

 flavor_ssg.130.title: "A Manuscript in Two Hands"
 flavor_ssg.130.desc: "Two copies of the same foreign treatise have reached the court, yet their measures and diagrams disagree. A respected clerk offers access to the original for a high fee; younger scholars argue that the cheaper copy can be corrected through experiment."
 flavor_ssg.130.a: "Pay to verify the text against the original."
 flavor_ssg.130.b: "Trust our scholars to repair the cheaper copy."
 flavor_ssg.131.title: "Smoke Above the Trial Yard"
 flavor_ssg.131.desc: "A powder vessel burst during a measured trial, scorching the shed and injuring two assistants. The surviving notes explain part of the failure, but impatient founders insist that an immediate repetition will settle the matter."
 flavor_ssg.131.a: "Record the failure and proceed cautiously."
 flavor_ssg.131.b: "Repeat the trial while every detail is fresh."
 flavor_ssg.132.title: "The Door of the Royal Archive"
 flavor_ssg.132.desc: "As the academy takes shape, court scholars demand that the archive remain closed to common craftsmen. The workshop masters reply that books without practiced hands will produce elegant records and little else."
 flavor_ssg.132.a: "Reserve the archive for sworn court scholars."
 flavor_ssg.132.b: "Admit proven artisans despite noble objections."

 flavor_ssg.140.title: "Petitioners at the Frontier Gate"
 flavor_ssg.140.desc: "Merchants, monks, and clan envoys have gathered as word of the frontier review spreads. Closing the gate would demonstrate order; hearing selected petitions might reveal opportunities that strict isolation would miss."
 flavor_ssg.140.a: "Keep the gate narrow and the procedure orderly."
 flavor_ssg.140.b: "Hear the merchants and clan envoys."
 flavor_ssg.141.title: "A Courier Has Vanished"
 flavor_ssg.141.desc: "A trusted courier has failed to return from the southern routes. The privy merchants urge the court to change every sign and safe house at considerable expense; cautious councillors advise disavowing the missing man and preserving the network."
 flavor_ssg.141.a: "Change the signs, routes, and safe houses."
 flavor_ssg.141.b: "Disavow him and preserve the wider network."
 flavor_ssg.142.title: "The Genealogy Disputed"
 flavor_ssg.142.desc: "A Goryeo partisan has circulated a genealogy dismissing the Jo royal claim as the invention of frontier officials. Court archivists can answer line by line, but younger retainers demand a bolder proclamation that leaves no room for doubt."
 flavor_ssg.142.a: "Answer with records, witnesses, and restraint."
 flavor_ssg.142.b: "Publish the bolder royal proclamation."

 flavor_ssg.200.title: "Pestilence Beyond the Passes"
 flavor_ssg.200.entry: "$flavor_ssg.200.title$"
 flavor_ssg.200.desc: "Couriers report that a killing sickness is moving along the roads of the western khanates. The court cannot know which caravan or refugee column will carry it east, but the mountain gates, granaries, and licensed roads give the Jo realm a chance to prepare before death reaches Hwaju."
 flavor_ssg.200.a: "Seal the passes and ration the royal stores."
 flavor_ssg.200.b: "Keep guarded roads open for remedies and news."
 flavor_ssg.201.title: "The Registers of Road and Hearth"
 flavor_ssg.201.desc: "A year of precautions has exposed the weakness of proclamations issued from Hwaju. Village headmen know every footpath and household but demand broad authority; the monasteries can distribute grain and simple remedies, though their protection will be less strict."
 flavor_ssg.201.a: "Let the village cordons answer beneath the royal seal."
 flavor_ssg.201.b: "Entrust the monasteries with relief stores."
 flavor_ssg.202.title: "Death at the Mountain Gates"
 flavor_ssg.202.entry: "$flavor_ssg.202.title$"
 flavor_ssg.202.desc: "Despite the cordons, black swellings and sudden fevers have appeared within the Jo realm. The royal stores can sustain a general campaign of isolation and relief, or the court can concentrate its guards and physicians around Hwaju while the outer valleys endure what they must."
 flavor_ssg.202.a: "Open the granaries and fight for every valley."
 flavor_ssg.202.a.tt: "Reduces Black Death presence in every affected owned location by 15% if the Royal Granaries project is complete, or by 5% otherwise"
 flavor_ssg.202.b: "Preserve Hwaju and the royal house first."
 flavor_ssg.203.title: "The Realm After the Pestilence"
 flavor_ssg.203.entry: "$flavor_ssg.203.title$"
 flavor_ssg.203.desc: "The roads have reopened and the last emergency registers have reached the court. Some lists record guarded villages and full granaries; others name abandoned fields and households that no longer answer. The restoration must now turn survival into authority."
 flavor_ssg.203.a: "The mountains held; record the deliverance."
 flavor_ssg.203.b: "Restore the empty villages and exhausted stores."

 flavor_ssg.50.title: "Goryeo Reunited"
 flavor_ssg.50.desc: "The rival court is gone and the peninsula is almost wholly under Jo rule. Banners bearing the name of Goryeo rise again, but conquest has left broken registers, divided loyalties, and hungry garrisons. Reunion is a beginning, not a reward without cost."
 flavor_ssg.50.a: "One Goryeo, beneath the Hanyang Jo."
 flavor_ssg.50.integration_tt: "Every owned location in Korea loses Control while the reunited administration is established"

 STATIC_MODIFIER_NAME_ssg_contested_royal_claim: "Contested Royal Claim"
 STATIC_MODIFIER_DESC_ssg_contested_royal_claim: "The Jo restoration is disputed at home and watched with hostility abroad."
 STATIC_MODIFIER_NAME_ssg_national_project_underway: "National Project Underway"
 STATIC_MODIFIER_DESC_ssg_national_project_underway: "Court officials, transport, and revenues are committed until the project completion event. Its progress ring and expiry date show the remaining time."
 STATIC_MODIFIER_NAME_ssg_crown_granaries: "Royal Granary Administration"
 STATIC_MODIFIER_DESC_ssg_crown_granaries: "Crown officials maintain reserves and regular grain accounts."
 STATIC_MODIFIER_NAME_ssg_chartered_frontier_markets: "Chartered Frontier Markets"
 STATIC_MODIFIER_DESC_ssg_chartered_frontier_markets: "Licensed merchants connect the valleys while lending the court useful credibility."
 STATIC_MODIFIER_NAME_ssg_economy_roads: "Mountain Road Network"
 STATIC_MODIFIER_DESC_ssg_economy_roads: "Roads, bridges, inns, and depots bind the northern holdings more closely together."
 STATIC_MODIFIER_NAME_ssg_economy_complete: "Northern Workshop System"
 STATIC_MODIFIER_DESC_ssg_economy_complete: "Recorded patterns and supervised workshops spread tested tools and methods."
 STATIC_MODIFIER_NAME_ssg_household_retainers: "Jo Household Retainers"
 STATIC_MODIFIER_DESC_ssg_household_retainers: "A compact body of well-equipped retainers owes personal service to the ruling house."
 STATIC_MODIFIER_NAME_ssg_village_levies: "Village Levy Districts"
 STATIC_MODIFIER_DESC_ssg_village_levies: "Village obligations provide a broader, if less specialized, military reserve."
 STATIC_MODIFIER_NAME_ssg_military_beacons: "Frontier Beacon Chain"
 STATIC_MODIFIER_DESC_ssg_military_beacons: "Supplied beacons and guarded passes speed the response to invasion."
 STATIC_MODIFIER_NAME_ssg_military_complete: "Royal Arsenal and Coastal Watch"
 STATIC_MODIFIER_DESC_ssg_military_complete: "Standard stores and patrol stations reduce the burden of campaigning across the frontier."
 STATIC_MODIFIER_NAME_ssg_bribed_manuscript_clerks: "Clandestine Manuscript Copies"
 STATIC_MODIFIER_DESC_ssg_bribed_manuscript_clerks: "Paid clerks supply useful writings at a cost to the court's reputation."
 STATIC_MODIFIER_NAME_ssg_foreign_artisans: "Foreign Court Artisans"
 STATIC_MODIFIER_DESC_ssg_foreign_artisans: "Skilled newcomers turn written recipes into working practice."
 STATIC_MODIFIER_NAME_ssg_research_workshops: "Experimental Workshops"
 STATIC_MODIFIER_DESC_ssg_research_workshops: "Measured trials and written failures allow practical knowledge to accumulate."
 STATIC_MODIFIER_NAME_ssg_research_complete: "Northern Court Academy"
 STATIC_MODIFIER_DESC_ssg_research_complete: "Royal patronage sustains scholars and artisans across several useful disciplines."
 STATIC_MODIFIER_NAME_ssg_powder_alarm: "Rumours of the Powder Workshops"
 STATIC_MODIFIER_DESC_ssg_powder_alarm: "Smoke, accidents, and guarded shipments make neighbouring courts fear what the academy is attempting."
 STATIC_MODIFIER_NAME_ssg_controlled_isolation: "Controlled Isolation"
 STATIC_MODIFIER_DESC_ssg_controlled_isolation: "Strict gates lower unwanted entanglements but leave the court diplomatically distant."
 STATIC_MODIFIER_NAME_ssg_measured_opening: "Measured Opening"
 STATIC_MODIFIER_DESC_ssg_measured_opening: "Licensed roads improve diplomacy while exposing the kingdom to greater scrutiny."
 STATIC_MODIFIER_NAME_ssg_privy_courier_network: "Privy Courier Network"
 STATIC_MODIFIER_DESC_ssg_privy_courier_network: "Discreet messengers give the court warning and influence beyond its formal reach."
 STATIC_MODIFIER_NAME_ssg_diplomacy_complete: "Restoration Diplomacy"
 STATIC_MODIFIER_DESC_ssg_diplomacy_complete: "Claims, couriers, and border alliances support the long work of binding Korea together."
 STATIC_MODIFIER_NAME_ssg_mountain_cordons: "Mountain Cordons"
 STATIC_MODIFIER_DESC_ssg_mountain_cordons: "Closed passes and guarded side paths greatly hinder contagion, but sever trade and anger the communities under watch."
 STATIC_MODIFIER_NAME_ssg_guarded_caravan_stations: "Guarded Caravan Stations"
 STATIC_MODIFIER_DESC_ssg_guarded_caravan_stations: "Licensed traffic is inspected and separated at frontier stations, slowing both disease and commerce."
 STATIC_MODIFIER_NAME_ssg_granary_quarantine_reserves: "Quarantine Grain Reserves"
 STATIC_MODIFIER_DESC_ssg_granary_quarantine_reserves: "Royal grain is diverted from ordinary distribution to sustain isolated settlements and cordon guards."
 STATIC_MODIFIER_NAME_ssg_court_remedy_network: "Court Remedy Network"
 STATIC_MODIFIER_DESC_ssg_court_remedy_network: "Scholars and artisans have been diverted from ordinary research to collect remedies and practical reports."
 STATIC_MODIFIER_NAME_ssg_village_cordon_network: "Village Cordon Network"
 STATIC_MODIFIER_DESC_ssg_village_cordon_network: "Local headmen enforce household registers and road closures at the cost of direct royal control."
 STATIC_MODIFIER_NAME_ssg_temple_relief_network: "Temple Relief Network"
 STATIC_MODIFIER_DESC_ssg_temple_relief_network: "Monasteries distribute grain, shelter, and simple remedies through communities that trust them."
 STATIC_MODIFIER_NAME_ssg_sheltered_royal_court: "Sheltered Royal Court"
 STATIC_MODIFIER_DESC_ssg_sheltered_royal_court: "Guards and physicians protect Hwaju's ruling household while the outer valleys bear a greater burden."
 STATIC_MODIFIER_NAME_ssg_post_plague_restoration: "Restoring the Empty Villages"
