l_english:

 abm_colonial_representation_law: "Colonial Representation Law"
 abm_colonial_representation_law_desc: "Grant our colonial subjects representation, giving them a say in government and binding them more closely to the mother country. Unlocks the Colonial Representation policy."

 abm_ala_ideas_tradition_1: "Alaskan Traditions I"
 abm_ala_ideas_tradition_1_desc: "Alaskan Traditions I"
 abm_ala_ideas_tradition_2: "Alaskan Traditions II"
 abm_ala_ideas_tradition_2_desc: "Alaskan Traditions II"
 abm_ala_endurance: "Aleutian Endurance"
 abm_ala_endurance_desc: "The Aleut people live in Alaska’s far north and have been in this harsh cold land for millennia and have survived these harsh conditions through ingenious fishing and heating methods. By emulating the survival tactics of the native Alaskan peoples, we too may make the most out of our cold unforgiving home."
 abm_ala_hard_push_east: "The Hard Push East"
 abm_ala_hard_push_east_desc: "Unlike many European settlements in America’s far west, Alaska was approached from the East by sea. Though many would have dismissed Alaska as useless arctic wastes, our overlord wisely took note of the beauty and opportunity our unlikely home presented and soon adapted to our somewhat difficult lifestyle."
 abm_ala_secretary_icebox: "The Secretary's Icebox"
 abm_ala_secretary_icebox_desc: "Even though Alaskan lands were purchased at a ridiculously low price, costing a mere 2 cents per acre, the purchase of Alaska was ridiculed as being the “Secretary’s Icebox”, mocking the ministers who purchased our lands. What those short-sighted fools failed to recognise was the hidden value of Alaska and its resources, and even now, we are underestimated by our rivals."
 abm_ala_bear_hunting: "Bear Hunting"
 abm_ala_bear_hunting_desc: "It gets awfully cold and boring up here in the far northern reaches of Alaska. One activity both commoners and the ruling class alike enjoy is the activity of strolling out into the wilderness with a rifle and blasting hell into some unsuspecting animals! This activity has indirectly made our people expert marksmen, an incredibly useful skill in times of war!"
 abm_ala_diversity: "Alaskan Religious Diversity"
 abm_ala_diversity_desc: "Our colony has been subject to several overlords and has attracted settlers from all across the pacific and the heartland of the Americas. As such, from Anchorage to Juneau, our people pray to God each in their own unique way and we would do well to continue to allow our people the religious freedom that has shaped Alaska into a religious free haven."
 abm_ala_navy: "Alaskan Navy"
 abm_ala_navy_desc: "Anchorage, Navy Town, and many other cities along the coasts of Alaska celebrate our maritime traditions. From the sea we hunt the fish and whales vital for our continued survival and growth, and along the shoreline the Alaskan coast-guard protects our people from Pacific invaders. All across the country, our people heed the call of the sea and flock to our ports to serve the Alaskan navy."
 abm_ala_beauty: "The Beauty of Alaska"
 abm_ala_beauty_desc: "Our home is famous for its breathtaking landscapes both along the arctic coastline and deep in the uninhabited mountain range. Most people would avoid visiting anywhere frigid and unforgiving, but Alaska is unique in its natural beauty and appeal to settlers and tourists alike."
 abm_ala_ideas_ambition: "Alaskan Ambition"
 abm_ala_ideas_ambition_desc: "Alaskan Ambition"
 abm_brz_ideas_tradition_1: "Brazilian Traditions I"
 abm_brz_ideas_tradition_1_desc: "Brazilian Traditions I"
 abm_brz_ideas_tradition_2: "Brazilian Traditions II"
 abm_brz_ideas_tradition_2_desc: "Brazilian Traditions II"
 abm_governorate_general: "Governorate General"
 abm_governorate_general_desc: "The arrival of governor generals greatly improved the administration of our nation and their policies still provide an example of how to get the most tax out of our populace."
 abm_research_of_nassau: "Research of John of Nassau"
 abm_research_of_nassau_desc: "John of Nassau, a governor of one of the colonies established in Brazil, brought in the finest botanists and scientists of Europe to help further our knowledge by studying our flora and fauna."
 abm_mines_of_minas_gerais: "Mines of Minas Gerais"
 abm_mines_of_minas_gerais_desc: "The gold of the mines of Minas Gerais are enough to challenge that of Sheba, and over time our administrators have come to understand how to cope with the inflated prices that come with this gift."
 abm_halting_foreign_incursions: "Halting Foreign Incursions"
 abm_halting_foreign_incursions_desc: "Many foreign nations have attempted to establish colonies of their own on our fair shores. Our brave soldiers have gained much experience in driving them off and stand ready to do so once more should it be necessary."
 abm_entradas_and_bandeiras: "Entradas and Bandeiras"
 abm_entradas_and_bandeiras_desc: "Our intrepid explorers have gone to great lengths in exploring the depths of the continent. Their charts and maps will allow us to more properly expand our influence to our rightful borders."
 abm_inconfidencia_mineira: "Inconfidencia Mineira"
 abm_inconfidencia_mineira_desc: "The members of the foiled Inconfidencia Mineira uprising are remember fondly by all as national heroes and can be pointed to as guiding examples in difficult times."
 abm_old_seat_of_the_empire: "Seat of the Empire"
 abm_old_seat_of_the_empire_desc: "When our former colonial masters were exiled from their homeland, they chose our nation as their seat. With the great palaces that were constructed comes greater legitimacy and the right to forge our own empire."
 abm_brz_ideas_ambition: "Brazilian Ambition"
 abm_brz_ideas_ambition_desc: "Brazilian Ambition"
 abm_can_ideas_tradition_1: "Canadians Traditions I"
 abm_can_ideas_tradition_1_desc: "Canadians Traditions I"
 abm_can_ideas_tradition_2: "Canadians Traditions II"
 abm_can_ideas_tradition_2_desc: "Canadians Traditions II"
 abm_singing_lumberjacks: "Singing Lumberjacks"
 abm_singing_lumberjacks_desc: "Our lumberjacks have many traditions. One is their legendary songs, which allow them to work more efficiently and thus produce more lumber for export. The lumber they produce also allows our government to procure more timber at a lower price, allowing our navy to be larger and less expensive."
 abm_the_hudson_bay_company: "The Hudson Bay Company"
 abm_the_hudson_bay_company_desc: "The Hudson Bay Company is perhaps the most important aspect of our history. Our roots lie in a mercantile tradition and we should continue to support this by encouraging people to become merchants."
 abm_settling_the_interior: "Settling the Interior"
 abm_settling_the_interior_desc: "While we have populated the coast and the region around rivers and lakes for some time, there are still vast lands to the west waiting to be settled by our people. We must ensure that it is our people who make the lands which await their own."
 abm_the_maritimes: "The Maritimes"
 abm_the_maritimes_desc: "The seas off our eastern coast are known for their legendary storms and brutal conditions. This hardens our young sailors and produces a tradition of naval military excellence."
 abm_the_quebec_act: "The Quebec Act"
 abm_the_quebec_act_desc: "The Quebec Act granted great religious freedoms to the Roman Catholics brought into our nation by the Conquest. We are a model of religious tolerance in our New World."
 abm_legacy_of_the_empire: "Legacy of the Empire"
 abm_legacy_of_the_empire_desc: "Though we are now free, our ties with our former mother country and her dependencies are still strong. This gives our merchants an edge in bringing the wealth of the New World to our coffers."
 abm_the_forests_of_canada: "The Forests of Canada"
 abm_the_forests_of_canada_desc: "The vast virgin forests found in our nation allow our government to procure the lumber needed to build ships for a lower price than other states. We can build more ships at lower prices."
 abm_can_ideas_ambition: "Canadian Ambition"
 abm_can_ideas_ambition_desc: "Canadian Ambition"
 abm_csc_ideas_tradition_1: "Cascadian Traditions I"
 abm_csc_ideas_tradition_1_desc: "Cascadian Traditions I"
 abm_csc_ideas_tradition_2: "Cascadian Traditions II"
 abm_csc_ideas_tradition_2_desc: "Cascadian Traditions II"
 abm_csc_melting_pot: "Cascadian Melting Pot"
 abm_csc_melting_pot_desc: "The location of Cascadia along the West coast of the Americas has made the region the ideal immigration target for settlers from both Asia and Europe. Its geographical accessibility to Asia and the presence of opportunistic Europeans has made Cascadia a unique melting pot between the East and the West."
 abm_csc_chinook_jargon: "Chinook Jargon"
 abm_csc_chinook_jargon_desc: "Unlike many other ruthless colonisers, we Cascadians understand the value to be found in trading and cooperating with our native people, even if a little exploitation here and there is necessary to securing a good deal. By developing a language in part informed by our former overlord and in part by the native people, we may communicate easily with both parties to secure a brighter future for Cascadia."
 abm_csc_forts_of_hudson_bay: "The Forts of Hudson Bay"
 abm_csc_forts_of_hudson_bay_desc: "The Hudson Bay Company, responsible for colonising America’s north were faced with many opportunities for expanding their defensive efforts to Cascadia. Our mountainous home allowed for many outposts to be built along our southern border to defend against rival colonists and native raiders. As such, our people are born and ready to serve in the defence of their country as its loyal defenders."
 abm_csc_settling_boundaries: "Settling the Boundaries"
 abm_csc_settling_boundaries_desc: "For years, colonisers to our North and South disputed whom may own which lands along the Columbia River and the Rocky Mountains, hosting skirmishes and scuffles over the territory. Spaniards, Americans, and Brits all claimed the territory at some point, but now we stand as an independent state united as one, and thus none shall dare challenge our unity and independence again."
 abm_csc_nookta_sound: "Nookta Sound Trading"
 abm_csc_nookta_sound_desc: "The earliest colonial settlement of Cascadia took place when an ambitious explorer purchased a section of land from a native chieftain and from there established a trading post there to trade between natives and colonists alike. From there, more trading posts, forts, and eventually villages popped up along the shores of Cascadia until the region was rife with towns and colonies of equal size and grandeur to those in the East."
 abm_csc_the_hudson_bay_company: "The Hudson Bay Company"
 abm_csc_the_hudson_bay_company_desc: "The Hudson Bay Company is perhaps the most important aspect of our history. Our roots lie in a mercantile tradition and we should continue to support this by encouraging people to become merchants."
 abm_csc_oregon_trail: "The Oregon Trail"
 abm_csc_oregon_trail_desc: "Our home exists far to the West of the American continent, and settlers wishing to make a new life for themselves in Cascadia had to endure desert, mountains, rivers, and the ruthless conditions of the untamed lands of America. As such, only the hardiest of settlers survived to reach Cascadia, although they may have lost some of their company to dysentery…"
 abm_csc_ideas_ambition: "Cascadian Ambition"
 abm_csc_ideas_ambition_desc: "Cascadian Ambition"
 abm_mex_ideas_tradition_1: "Mexican Traditions I"
 abm_mex_ideas_tradition_1_desc: "Mexican Traditions I"
 abm_mex_ideas_tradition_2: "Mexican Traditions II"
 abm_mex_ideas_tradition_2_desc: "Mexican Traditions II"
 abm_rebuilding_mexico: "Rebuilding Mexico"
 abm_rebuilding_mexico_desc: "Cortez saw to it that the temples to the pagan gods of the Aztecs were destroyed during the conquest of these lands. It falls on us to convert the ruins of temples into house of worship for God. The building materials being already present will surely make the job cheaper."
 abm_the_republic_of_indians: "The Republic of Indians"
 abm_the_republic_of_indians_desc: "The Republic of Indians was the product of a systematic study of native cultures and languages. We realize that we will gain more from tolerating the cultural diversity of this land than imposing European traditions on the populace."
 abm_peace_by_purchase: "Peace by Purchase"
 abm_peace_by_purchase_desc: "The wild and untamed desert lands to the north are home to fiercely independent and militarily skilled clans. We can expend great effort, time and wealth trying to crush them with our mighty armies, but would it not be wiser to simply buy their cooperation and assimilate them peacefully?"
 abm_casa_de_las_campanas: "Casa de las Campanas"
 abm_casa_de_las_campanas_desc: "Mexico is a land of firsts. The Casa de las Campanas was the first printing press in the New World, allowing us to spread novel ideas more easily."
 abm_repartimiento: "Repartimiento"
 abm_repartimiento_desc: "Modeled on the corvée of France, the repartimiento is a scheme where we receive labor from the peasant population of Mexico. As it is part of their duty, we are able to pay them little to nothing for their work during this time period, which boosts our profits from production."
 abm_heroes_of_the_revolution: "Heroes of the Revolution"
 abm_heroes_of_the_revolution_desc: "During our struggle for independence, our generals acquitted themselves finely on the field of battle. The shock tactics used by them in our struggle for liberty have been studied by our generals, who are now more adept in this field of warfare."
 abm_grito_de_delores: "Grito de Dolores"
 abm_grito_de_delores_desc: "My children, will you free yourselves? Will you recover the lands stolen three hundred years ago from your forefathers by the hated Spaniards? We must act at once... Will you defend your religion and your rights as true patriots? Long live Our Lady of Guadalupe! Death to bad government! Death to the gachupines!"
 abm_mex_ideas_ambition: "Mexican Ambition"
 abm_mex_ideas_ambition_desc: "Mexican Ambition"
 abm_que_ideas_tradition_1: "Québécois Traditions I"
 abm_que_ideas_tradition_1_desc: "Québécois Traditions I"
 abm_que_ideas_tradition_2: "Québécois Traditions II"
 abm_que_ideas_tradition_2_desc: "Québécois Traditions II"
 abm_coureurs_des_bois: "Coureurs des Bois"
 abm_coureurs_des_bois_desc: "Coureurs des bois are legendary here and abroad for their ability to travel vast distances into the heartland of the continent and deal with the natives to obtain more furs. While they do compete with the official voyageurs, they allow more of our land's precious furs to reach the market and be sold."
 abm_the_seigneurial_system: "The Seigneurial System"
 abm_the_seigneurial_system_desc: "Our nation's land system has been dominated by seigneurs since the earliest settlement here by our forefathers. Running a feudal-like system, they have become ingrained in our nation's policies and allow us to extract more taxes from the people. "
 abm_relations_with_natives: "Relations with the First Nations People"
 abm_relations_with_natives_desc: "Our sons have married their daughters and as such, we have become one with many of the native tribes. We must now maintain these relationships, this has driven each of our diplomats to do the work of many men."
 abm_fortifications_of_quebec: "Fortifications of Quebec"
 abm_fortifications_of_quebec_desc: "The river valleys are vital to our state both as means of transportation and as they are the homes of our farming communities. We must fortify these valleys in order to protect our people."
 abm_college_of_quebec: "The College of Quebec"
 abm_college_of_quebec_desc: "The college in Quebec was the first to be established in the New World outside of Mexico. The tradition of learning safeguarded here allow our nation to be at the forefront of technological progress. "
 abm_commissions_for_noble_sons: "Commissions for Noble Sons"
 abm_commissions_for_noble_sons_desc: "The Holy Orders of the church are not interested in taking the younger sons of the nobility, thus they are often drawn to a military career. This is fine, since it ensures that we always have generals ready to and capable of leading our armies. "
 abm_jesuit_missions: "Jesuit Missions"
 abm_jesuit_missions_desc: "The various religious orders, but the Jesuits especially have made it their job to bring the true faith to the heathens around us. We view it as our duty, being a nation of the faithful, to ensure that they have every opportunity to carry out their work successfully."
 abm_que_ideas_ambition: "Québécois Ambition"
 abm_que_ideas_ambition_desc: "Québécois Ambition"
 abm_sna_ideas_tradition_1: "Sonoran Traditions I"
 abm_sna_ideas_tradition_1_desc: "Sonoran Traditions I"
 abm_sna_ideas_tradition_2: "Sonoran Traditions II"
 abm_sna_ideas_tradition_2_desc: "Sonoran Traditions II"
 abm_sna_mercenary_republic: "Republic of Mercenaries"
 abm_sna_mercenary_republic_desc: "Unlike other American republics who fought for their independence against colonial powers, our state was established by the sheer strength and daring nature of our mercenaries. The region of Sonora and Baja California were seized by a mere 45 men and their commander, and despite the crushing odds, won out against the much larger republics of the region. There can be no doubt that the sheer quality of the Sonoran mercenaries will be the envy of all America."
 abm_sna_sale_of_script: "The Sale of Sonoran Script"
 abm_sna_sale_of_script_desc: "In order to fund the mercenary expedition to Sonora, we required investment and resources. Though many would doubt our cause, there were those who were wise enough to invest in the purchase of legal documents not yet redeemable in the Sonora region until the establishment of our state. By continuing to sell the promise of future lands to our investors, we may both expand our state and make a tidy profit while doing so."
 abm_sna_good_use_of_gold: "Gold, Gold, Gold!"
 abm_sna_good_use_of_gold_desc: "With the heavy reliance on gold in our region, we have learned to make good use of it and not cause the rampant issues we have seen across the seas. With our sensible and conservative use of our gold deposits, we shall keep the resource valuable without bloating our economy."
 abm_sna_cowboy_country: "Cowboy Country"
 abm_sna_cowboy_country_desc: "The men of our nation are used to the harsh conditions and sparse resources of the American West, and have become more than accustomed to the ways of war out here. Our nation was built by bandits and mercenaries and are feared throughout the West and beyond."
 abm_sna_take_what_is_yours: "Taking What’s Ours"
 abm_sna_take_what_is_yours_desc: "There are those who call Sonora a rogue state and would call our President a “Pirate”, and they would say these things as if they were an insult. What these individuals shackled by the laws of their land fail to understand is that true freedom consists of taking what is yours and apologising for nothing. Our bandits already raid the western roads, but with treasure fleets passing by our shores each day, it becomes clear that we could learn something from the privateers in the east..."
 abm_sna_uniting_the_outlaws: "Uniting the Outlaws"
 abm_sna_uniting_the_outlaws_desc: "All across the West, there are cowboys, bandidos, and desperados; bold men who live free. We are unafraid of the law and willing to do whatever it takes to get by in this cruel unforgiving world. With men like this at the helm of our nation, we have created a home for the homeless and we will become the men our mothers warned us about."
 abm_sna_taking_the_fight_south: "Taking the Fight South"
 abm_sna_taking_the_fight_south_desc: "Though our nation exists in the rugged West of Mexico, we cannot sustain ourselves on contracts found out here alone. We must take our fight from North to South, from the bogs of Louisiana to the jungles of Nicaragua. Our brave generals will lead our countrymen from contract to contract, while making sure to take as much territory for ourselves as we can manage."
 abm_sna_ideas_ambition: "Sonoran Ambition"
 abm_sna_ideas_ambition_desc: "Sonoran Ambition"
 abm_tex_ideas_tradition_1: "Texan Traditions I"
 abm_tex_ideas_tradition_1_desc: "Texan Traditions I"
 abm_tex_ideas_tradition_2: "Texan Traditions II"
 abm_tex_ideas_tradition_2_desc: "Texan Traditions II"
 abm_lone_star_state: "Lone Star State"
 abm_lone_star_state_desc: "Texas stands as an independent nation, priding itself on self-sufficiency and individualism."
 abm_tex_revolution: "Texan Revolution"
 abm_tex_revolution_desc: "We have fought hard for our independence, and we are prepared to fight to the death against any who would threaten our liberty."
 abm_cotton_plantations: "Cotton Plantations"
 abm_cotton_plantations_desc: "The fertile fields of Texas provide excellent land for cotton plantations; settlers, slaves, immigrants, and farmers come from far and wide to work the new lands. If we take advantage of this, we can export this valuable crop worldwide in no time."
 abm_vaqueros: "Vaqueros"
 abm_vaqueros_desc: "The Vaqueros are the mounted pastoral farmers of the Americas, and it is a lifestyle that has a special place in our culture. These 'cowboys' are hardy workmen, adapted to the lay of the land and skilled in horse riding. They take great pride in their skill in cattle and horse wrangling."
 abm_tex_native_frontiers: "Frontier Nation"
 abm_tex_native_frontiers_desc: "As a state on the frontier, we are confronted with dangerous Native American adversaries. If we are to keep our people safe, it is important to maintain an effective and mobile fighting force."
 abm_tejanos: "Tejanos"
 abm_tejanos_desc: "As a former province of Mexico, Texas has never fully abandoned its roots; Texas-Mexicans, or Tejanos, are very much integral to our state's vibrant culture, contributing no shortage of foods, music, language, and traditions."
 abm_adelsverin: "Adelsverein"
 abm_adelsverin_desc: "In the wake of unrest and revolutions in Europe, Germans flee to the new world en masse seeking stability and safety. The Mainzer Adelsverein will promote the establishment of German communities settling in Texas, as well as their integration into our nation."
 abm_tex_ideas_ambition: "Texan Ambition"
 abm_tex_ideas_ambition_desc: "Texan Ambition"
 abm_vrm_ideas_tradition_1: "Vermont Traditions I"
 abm_vrm_ideas_tradition_1_desc: "Vermont Traditions I"
 abm_vrm_ideas_tradition_2: "Vermont Traditions II"
 abm_vrm_ideas_tradition_2_desc: "Vermont Traditions II"
 abm_vrm_home_of_the_revolution: "Home of the American Revolution"
 abm_vrm_home_of_the_revolution_desc: "All across the Americas, there is a burning desire for freedom and democracy, and we must never forget that it was here in the North East that these ideas burned brightest. We sank colonial ships, burned state property, and we were willing to fight and die for the future of our people and our newborn state."
 abm_vrm_tea_party: "The Boston Tea Party"
 abm_vrm_tea_party_desc: "We must never forget that at one point in history, the idea of an independent colonial state in America was something to be laughed at, but we soon made the laughter stop. Who could have imagined that the simple act of dumping our former overlord’s precious tea into the waters of Boston Harbor would have acted as such a catalyst for the spirit of independence across our nation? Now, the torch of freedom burns bright and this act of protest will be remembered as a glorious event in the birth of our nation."
 abm_vrm_american_frontier: "American Frontier"
 abm_vrm_american_frontier_desc: "The American frontier is a vast and unknown land. We need to establish ourselves as the leaders of the new world and embrace those that come across our paths."
 abm_vrm_cheese_wheels: "Cheese Wheels"
 abm_vrm_cheese_wheels_desc: "The local farmers have started mass producing cheese wheels for the long journeys across the lands and seas. This has become a wanted product wherever we take it and we only produce the best."
 abm_vrm_vermont_constitution: "The Vermont Constitution"
 abm_vrm_vermont_constitution_desc: "When we declared our independence from our overlord, it became immediately clear to the governors of Vermont that slavery was an affront to the values of freedom that brought our nation into existence. The Vermont Constitution was the first written document in American history to outlaw the immoral practice of slavery, and continuing to uphold the values found in our constitution, we shall create a fairer and brighter future for all people in our nation."
 abm_vrm_liberty_is_life: "Live Free or Die"
 abm_vrm_liberty_is_life_desc: "Our subjects have done nothing but be loyal to use as we have guaranteed their safety. As they grow, their sentiment for freedom does so, but we have ways of keeping them in line. Those who refuse to live their life embracing the values of freedom and liberty must not live their life at all."
 abm_vrm_what_we_do_best: "What We Do Best"
 abm_vrm_what_we_do_best_desc: "Our traders know what is best before anyone else. We have the finest silks, the finest spices and the finest dyes. Because we invest wisely in lands where it is prevalent and send it home to our people."
 abm_vrm_ideas_ambition: "Vermont Ambition"
 abm_vrm_ideas_ambition_desc: "Vermont Ambition"
 abm_usa_ideas_tradition_1: "American Traditions I"
 abm_usa_ideas_tradition_1_desc: "American Traditions I"
 abm_usa_ideas_tradition_2: "American Traditions II"
 abm_usa_ideas_tradition_2_desc: "American Traditions II"
 abm_freedom_of_religion: "Freedom of Religion"
 abm_freedom_of_religion_desc: "Congress shall make no law respecting an establishment of religion, or prohibiting the free exercise thereof..."
 abm_usa_bill_of_rights: "Bill of Rights"
 abm_usa_bill_of_rights_desc: "...or abridging the freedom of speech, or of the press; or the right of the people peaceably to assemble, and to petition the Government for a redress of grievances."
 abm_manifest_destiny: "Manifest Destiny"
 abm_manifest_destiny_desc: "It is the birthright of this American nation to reach from from sea to shining sea."
 abm_lessons_of_valley_forge: "Lessons of Valley Forge"
 abm_lessons_of_valley_forge_desc: "In the darkest times, a nation's resolve is tested and forged in the fires of adversity."
 abm_workshop_of_the_world: "Workshop of the World"
 abm_workshop_of_the_world_desc: "Free craftsmen are productive craftsmen, so no craftsmen are as productive as ours."
 abm_shining_city_on_a_hill: "Shining City on a Hill"
 abm_shining_city_on_a_hill_desc: "Naturally, our fledgling Republic is viewed as an inspiration to the entire human race, which is as it should be."
 abm_empire_of_liberty: "Empire of Liberty"
 abm_empire_of_liberty_desc: "The people in our lands are subject to freedoms not rivaled elsewhere."
 abm_usa_ideas_ambition: "American Ambition"
 abm_usa_ideas_ambition_desc: "American Ambition"
 abm_wsi_ideas_tradition_1: "West Indies Traditions I"
 abm_wsi_ideas_tradition_1_desc: "West Indies Traditions I"
 abm_wsi_ideas_tradition_2: "West Indies Traditions II"
 abm_wsi_ideas_tradition_2_desc: "West Indies Traditions II"
 abm_wsi_plantation_economy: "Plantation Economy"
 abm_wsi_plantation_economy_desc: "The economy of the West Indies is built on the plantations. The plantation workers are hard working, and hold great ingenuity and a passion for life unlike any others. It’s this combination of hard work in the open air and a vigor for work and play that defines the honourable Caribbean worker."
 abm_wsi_blue_mountain_coffee: "Blue Mountain Coffee"
 abm_wsi_blue_mountain_coffee_desc: "The Blue Mountain region is considered the best coffee region in the Caribbean and is enjoyed by great thinkers worldwide! The spread of the coffee gave birth to new ideas as the locals and their colonial overlords began to have deep intricate discussions about the nature of the world while sipping at the greatest coffee in the world."
 abm_wsi_sugar_revolution: "The Sugar Revolution"
 abm_wsi_sugar_revolution_desc: "The need for sugar across the globe has meant more money in the coffers of the locals as they work hard to meet the endless demand for that sweet cane."
 abm_wsi_american_trade_hub: "The American Trade Hub"
 abm_wsi_american_trade_hub_desc: "The trade from the Caribbean has pushed out across the east coast of the Americas, Africa and Europe. The reach of the merchants is greater than we could have anticipated, and in this regard the Caribbean truly is the birthplace of a globalised economy."
 abm_wsi_miskoto_zambos: "Miskito-Zambos"
 abm_wsi_miskoto_zambos_desc: "The Miskito-Zambos are a cultural blend of the many people who built our great nation; Africans, Europeans, and the Native people who came before all others. The population boom that has come from this has aided our diverse multiculturalism and has led to a population boom that could be utilised into territorial expansion."
 abm_wsi_interconnected_relations: "Interconnected Relations"
 abm_wsi_interconnected_relations_desc: "The relations our merchants and diplomats have built have established us as a great and reliable trade partner. We have countless partners and allies in our pocket and we must exploit this if we are to become one of the great powers of this colonial world."
 abm_wsi_colonial_legacy: "Colonial Legacy"
 abm_wsi_colonial_legacy_desc: "The Caribbean was fiercely fought for between an endless list of colonial powers and would-be conquerors. Privateers at the heart of the golden age of piracy and ambitious governors alike exploited our home for all it was worth and built a wealth across our nation that still fuels our economy to this day. As the true birthplace of colonialism and colonial politics, we have a unique expertise that will elevate us to a power on the global stage."
 abm_wsi_ideas_ambition: "West Indies Ambition"
 abm_wsi_ideas_ambition_desc: "West Indies Ambition"
 abm_aus_ideas_tradition_1: "Australian Traditions I"
 abm_aus_ideas_tradition_1_desc: "Australian Traditions I"
 abm_aus_ideas_tradition_2: "Australian Traditions II"
 abm_aus_ideas_tradition_2_desc: "Australian Traditions II"
 abm_aus_outback_stations: "Outback Stations"
 abm_aus_outback_stations_desc: "The Outback is a harsh and unforgiving wilderness devoid of necessary amenities for life such as rivers and rainfall. However, we have adopted a method of farming akin to American ranching, where the landowner is granted Crown lands on which to raise his cattle and horses. This method of ranching is adaptable to all conditions, and has made regions of the country that would usually be useless into productive vital components of the state."
 abm_aus_land_down_under: "The Land Down Under"
 abm_aus_land_down_under_desc: "Oceania was the last continent to be discovered by the Europeans, and Australia is by far the largest singular landmass on the Oceanic continent. The creatures found in Australia were at one point considered so fantastical and otherworldly that many Europeans simply did not believe they could exist until they saw them with their own eyes. The unfamiliar nature of our wildlife and geography makes Australia deadly for invading armies. We were once foreigners to this land as well, but we have adapted to the harsh conditions of the outback and our soldiers can easily adapt to any foreign soil."
 abm_aus_eureka_rebellion: "The Eureka Rebellion"
 abm_aus_eureka_rebellion_desc: "We were sent over to Australia by our former overlord as prisoners, unwanted minorities, and political insurgents from the homeland to work the gold mines in this alien land. Our overlord was foolish enough to believe that sending men who had reason to hate the state would not instigate a rebellion, but the gold miners did inevitably raise their flag in rebellion against the crown. Our overlord demanded that we surrender most of the riches accumulated from mining our gold, but we were having none of that nonsense! It was this rebellion that birthed the Eureka Flag, and although this rebellion failed, we now finally stand as an independent nation, and nobody will take Australian gold but Australians!"
 abm_aus_sandpaper_and_cheating: "The Diggers"
 abm_aus_sandpaper_and_cheating_desc: "The Australian Diggers are riflemen and marines deployed to fight on foreign soil for our glorious Empire. The term "digger" is slang for miner due to the fact that most Digger soldiers are miners when not on active duty. The informal term is symbolic of the Australian concept of “being mates”; equals, comrades, and friends."
 abm_aus_royal_navy: "Royal Australian Navy"
 abm_aus_royal_navy_desc: "The Australian Royal Navy is split into six divisions based on the different provinces of the Australian colony. Now that we are free from colonial rule, we are free to unite the six provinces into one and we will make Australia into a fierce uncontested force in the Pacific."
 abm_aus_bushrangers: "Integration of the Bushrangers"
 abm_aus_bushrangers_desc: "A sizeable number of settlers sent from the mainland to live in Australia were convicts and undesirables forced into exile, and the particularly cunning amongst these thieves and cutthroats would become Bushrangers. These were hardened men who used the unforgiving Australian bush as a base for their robbing operations. They were particularly rich and powerful during the Australian Gold Rush, but now that we have won our freedom for our colonial oppressors, these men are convicts to no-one, and we would do well to utilise their ambushing tactics on our enemies!"
 abm_aus_waltzing_matilda: "Waltzing Matilda"
 abm_aus_waltzing_matilda_desc: "Once a jolly swagman camped by a billabong\nUnder the shade of a coolibah tree,\nAnd he sang as he watched and waited till his Billy boiled,\n"You'll come a-waltzing Matilda, with me."\n\nThis traditional Australian folk song symbolises the values held by our people. It tells the story of an escaped convict stealing a sheep and dying in his fight against the law. For we in Australia, it is not the glory of victory, but the honour of the struggle that defines who we are!"
 abm_aus_ideas_ambition: "Australian Ambition"
 abm_aus_ideas_ambition_desc: "Australian Ambition"
 abm_nzl_ideas_tradition_1: "Kiwi Traditions I"
 abm_nzl_ideas_tradition_1_desc: "Kiwi Traditions I"
 abm_nzl_ideas_tradition_2: "Kiwi Traditions II"
 abm_nzl_ideas_tradition_2_desc: "Kiwi Traditions II"
 abm_nzl_maori_seats: "Maori Seats"
 abm_nzl_maori_seats_desc: "In Zealandia, we Kiwis are not alone in our occupation of our island home. Our lands are also home to the native people known as the Maori. Historically, these people have been greatly mistreated in the endless tide of colonialism and although we may never heal the scars that our ruthless conquest has left in its wake, allowing the Maori their own representation within the government may begin the slow healing process between our people."
 abm_nzl_otago_gold: "The Otago Gold Rush"
 abm_nzl_otago_gold_desc: "Zealandia is rife with food and resources, and our home is ideal for miners and shepherds alike. With cattle breeding in abundancy and our hills exploding with gold, copper, and tin, Zealandia shall be a land far richer and more prosperous for its small size."
 abm_nzl_piopiotahi: "Piopiotahi"
 abm_nzl_piopiotahi_desc: "Milford Sound or ‘Piopiotahi’ as the Maori call it is a spectacular range of coast and mountain lush with life and greenery in the South Island. It has stood as a testament to the fertility of this land and for years it was a shared common ground amongst Maori of all Iwi."
 abm_nzl_haka: "The Kiwi Haka"
 abm_nzl_haka_desc: "The Maori people have practiced the traditional war-chant known as the Haka for centuries before we arrived on their shores. As our cultures begin to grow more and more intertwined, many people from outside the Maori culture have begun practicing the Haka as a demonstration of patriotism before a battle or sports match. Far beyond our shores, foreigners tell stories of Maori and Kiwi alike bursting into a terrifying demonstration of fearlessness and masculinity before charging into battle."
 abm_nzl_company: "The New Zealand Company"
 abm_nzl_company_desc: "Prior to the New Zealand company promoting the idyllic life provided by Zealandia, colonisation of the island was slow and stagnant. But, with the guidance of the New Zealand Company, hordes of settlers from across the Old World came to Zealandia for a new and better life. By continuing to promote our nation as a beacon of the colonial dream, we may spread ourselves across the Pacific with hordes of new colonists seeking refuge and opportunity within our state!"
 abm_nzl_rejecting_australia: "Rejecting the Australia Constitution"
 abm_nzl_rejecting_australia_desc: "Our small nation was once offered the opportunity to join the colonists in Australia as their subject, but through democracy alone, the people made the right choice and maintained the independence of Zealandia for all time. By continuing to reject and resist any attempts to subjugate our people, we shall persevere."
 abm_nzl_pokarekare_ana: "Pokarekare Ana"
 abm_nzl_pokarekare_ana_desc: "Pokarekare ana, nga wai o Waiapu\nWhiti atu koe hine, marino ana e.\nE hine e, hoki mai ra\nKa mate ahau i te aroha e.\n\nThis song speaks of the long journey a soldier must take before returning to his wife and love. We must not waste young men’s lives in wasteful wars and devote ourselves to the continued peace and tranquillity in the Land of the Long White Cloud."
 abm_nzl_ideas_ambition: "Kiwi Ambition"
 abm_nzl_ideas_ambition_desc: "Kiwi Ambition"
