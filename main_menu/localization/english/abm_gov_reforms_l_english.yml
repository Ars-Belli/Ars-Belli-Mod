l_english:

 # Wu - Granary Circuit (WUU)
 abm_wuu_people_granary_circuit_reform: "Granary Circuit System"
 abm_wuu_people_granary_circuit_reform_desc: "A system of state-managed granaries ensuring food security and attracting labourers to our lands. Requires the Granary Circuit advance and is only available from the Age of Discovery onward."

 # Fang - Noble Admiralty (CFN)
 abm_cfn_noble_board_regime: "Noble Board Regime"
 abm_cfn_noble_board_regime_desc: "A regime where noble admirals dominate the state, leveraging maritime power for trade and privateering. Only available to Wu (Fang) with access to ports. Cannot be combined with Military Regime or Admiralty Regime reforms."

 # Pirate Republic
 abm_china_pirates: "Chinese Pirate Republic"
 abm_china_pirates_desc: "A lawless maritime state built on plunder and privateering. Restricted to nations of the Chinese culture group with their capital in East Asia. Locks the government type to Republic and uses Pirate Elective succession."

 # Meritocratic Republic
 abm_china_meritocratic_republic: "Chinese Meritocratic Republic"
 abm_china_meritocratic_republic_desc: "A republic governed by officials selected through merit rather than birthright, fostering trade and commerce. Restricted to nations of the Chinese culture group with their capital in East Asia. Government type must be Republic. Uses Oligarchic Elective succession."

 # Buddhist Holy Order
 abm_china_buddhist_order: "Buddhist Holy Order"
 abm_china_buddhist_order_desc: "A theocratic state where the Buddhist clergy commands the military, raising levies and training light infantry. Available from the Age of Traditions. Restricted to Buddhist nations whose original capital is in East Asia. Government type must be Theocracy. Uses Oligarchic Elective succession."

 # Ahimsa Code
 abm_china_ahimsa_code: "Ahimsa Code"
 abm_china_ahimsa_code_desc: "A pacifist code of non-violence that forbids declaring war in exchange for steady development and prosperity. Only available to Buddhist republics or theocracies whose original capital is in East Asia. May only be enacted by specific tags."
