l_english:

 abm_brb_ideas_tradition_1: "Brabant Tradition I"
 abm_brb_ideas_tradition_1_desc: "Brabant Tradition I"
 abm_brb_ideas_tradition_2: "Brabant Tradition II"
 abm_brb_ideas_tradition_2_desc: "Brabant Tradition II"
 abm_brb_charter_of_liberty: "Charter of Liberty"
 abm_brb_charter_of_liberty_desc: "In 1354 Duke John III of Brabant granted a Joyous Entry to the citizens of Brabant. The six specific freedoms detailed the exact powers that the church, the towns and nobles have."
 abm_brb_marsh_warfare: "Marsh Warfare"
 abm_brb_marsh_warfare_desc: "The terrain in the Low Countries is dominated by marshes and other unfavorable terrain. By training our generals to better adapt to the hostile terrain we can have more success in the battlefield."
 abm_brb_palace_coudenberg: "Palace of Coudenberg"
 abm_brb_palace_coudenberg_desc: "The old castle at Coudenberg has become obsolete. In its place we should construct a grand palace that will be the envy of the Low Countries. It will have vast wings, lavish decorations, and be fitted for even royal receptions."
 abm_brb_sugar_capital: "Sugar Capital of Europe"
 abm_brb_sugar_capital_desc: "Antwerp has become the sugar capital of Europe; importing most of the continent’s supply and containing one of the largest populations of able refiners to make and ship it."
 abm_brb_antwerp_banking: "Banks of Antwerp"
 abm_brb_antwerp_banking_desc: "Antwerp is home to the richest and most influential banks outside of Italy. We lend not only to merchants and nobles but to the governments of great states."
 abm_brb_religious_tolerance: "Tradition of Toleration"
 abm_brb_religious_tolerance_desc: "Religious tolerance is a tradition in the Duchy of Brabant. Crypto-Jews are welcome here, as are the many emerging sects of the Reformation."
 abm_brb_generality_lands: "Generality Lands"
 abm_brb_generality_lands_desc: "If Brabant is to be part of something greater, it must be administered directly by the state as Generality lands rather than being ruled by local nobles or burghers."
 abm_brb_ideas_ambition: "Brabant Ambition"
 abm_brb_ideas_ambition_desc: "Brabant Ambition"
 abm_fla_ideas_tradition_1: "Flemish Tradition I"
 abm_fla_ideas_tradition_1_desc: "Flemish Tradition I"
 abm_fla_ideas_tradition_2: "Flemish Tradition II"
 abm_fla_ideas_tradition_2_desc: "Flemish Tradition II"
 abm_fla_cloth: "Flemish Cloth"
 abm_fla_cloth_desc: "The Flemish cloth industry is the envy of the world. Merchants come from far away to sell their wool in Flanders, where we manufacture the best quality cloth."
 abm_fla_land_reclamation: "Land Reclamation"
 abm_fla_land_reclamation_desc: "The Low Countries are highly susceptible to flooding, but we now have the technology to reclaim this land from the ocean."
 abm_fla_beeldenstorm: "Beeldenstorm"
 abm_fla_beeldenstorm_desc: "New ideas inspire an iconoclastic fury among the people of Flanders. A 'statue storm' is underway, as reformers destroy heretical icons and imagery."
 abm_fla_painters: "Flemish Innovation"
 abm_fla_painters_desc: "Flanders has historically been at the forefront of technological and cultural advancements. We must continue to patronize inventors, artists, and writers to maintain our edge over other nations."
 abm_fla_ship_building: "North Sea Shipyards"
 abm_fla_ship_building_desc: "As Flanders has some of Europe's greatest port cities, it is only fitting that it should have some of Europe's greatest shipyards. Being able to use local craftsmen dramatically reduces the costs of acquiring new merchant fleets."
 abm_fla_university: "Flemish Academics"
 abm_fla_university_desc: "Flanders is home to many institutions of academic learning. Flemish scholars lead the way in the field of natural philosophy."
 abm_fla_noose_bearers: "Noose-Bearers"
 abm_fla_noose_bearers_desc: "We have suffered great humiliation under foreign overlords. Forced to publicly swear fealty with nooses around their necks, our brave patriots crossed their fingers and vowed never to allow Flanders to be humiliated again."
 abm_fla_ideas_ambition: "Flemish Ambition"
 abm_fla_ideas_ambition_desc: "Flemish Ambition"
 abm_ned_ideas_tradition_1: "Dutch Tradition I"
 abm_ned_ideas_tradition_1_desc: "Dutch Tradition I"
 abm_ned_ideas_tradition_2: "Dutch Tradition II"
 abm_ned_ideas_tradition_2_desc: "Dutch Tradition II"
 abm_amsterdam_wisselbank: "Found the Amsterdam Wisselbank"
 abm_amsterdam_wisselbank_desc: "The problem with metal coinage was that it was virtually impossible to make coins of equal weight at all mints. This makes moving wealth around, the life blood of trade, difficult. The Wisselbank traded metal money for Amsterdam paper money that had to be used in the city for bills over 600 guilders. This created a medium of exchange that everyone could be confident in the value of, facilitating exchange."
 abm_dutch_trading_spirit: "Dutch Trading Spirit"
 abm_dutch_trading_spirit_desc: "Seeking your fortune over the sea is as natural to a Dutchman as burning a witch is to a Spaniard. We have no shortage of hardy souls ready to seek their fortune in trade."
 abm_polders: "Polders"
 abm_polders_desc: "The low countries are highly susceptible to flooding and in the unsettled weather of the 11th - 14th centuries there were multiple floods leading to the creation of the Zuiderzee and also salting the soil of coastal areas. We now have the technology to reclaim land allowing more productive agriculture."
 abm_instructie_voor_de_admiraliteiten: "Instructie voor de Admiraliteiten"
 abm_instructie_voor_de_admiraliteiten_desc: "'This day begins a long list of naval victories, which will make our fatherland for ever illustrious'"
 abm_embrace_humanism: "Embrace Humanism"
 abm_embrace_humanism_desc: "Ever since the great philosopher Erasmus, the Low Countries have been the cradle of humanistic philosophy. It is time to embrace this as an integral part of the state."
 abm_army_sappers: "Army Sappers"
 abm_army_sappers_desc: "Back in the good old days siege works were dug by locals impressed into service, these people were not always keen to do this work. By making digging such trenches the job of the army we get better trenches, quicker."
 abm_platoon_fire: "Platoon Fire"
 abm_platoon_fire_desc: "Standard volley fire involved each rank delivering its volley in one go, with the goal of maximizing the firepower. The Dutch developed a different system of firing by platoon, the goal being that one part of the regiment will always be firing at the enemy. This prevented the enemy from recovering from the volleys."
 abm_ned_ideas_ambition: "Dutch Ambition"
 abm_ned_ideas_ambition_desc: "Dutch Ambition"
