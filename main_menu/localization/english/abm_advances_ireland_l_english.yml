l_english:

 abm_irish_ideas_tradition_1: "Irish Tradition I"
 abm_irish_ideas_tradition_1_desc: "Irish Tradition I"
 abm_irish_ideas_tradition_2: "Irish Tradition II"
 abm_irish_ideas_tradition_2_desc: "Irish Tradition II"
 abm_irish_endurance: "Irish Endurance"
 abm_irish_endurance_desc: "Decades of disease and famine have mostly pushed the English invaders from our lands. Meanwhile, the Irish people grow all the stronger from their harrowing experiences. Yes, there is no stronger man on God's green earth than an Irishman!"
 abm_the_clanns: "The Clanns"
 abm_the_clanns_desc: "The Clanns of Ireland make up a strong political body for land and family management. In smaller families, the family elected chieftain is in charge of maintaining the family and protecting their lands. Land and leadership is passed through the family electorate system of Tanistry. From the royal clanns the symbolic high king of Ireland is elected, creating a bond of union between the Irish families."
 abm_more_than_irish: "More Than Irish"
 abm_more_than_irish_desc: "Heartily did the Norman invaders embrace the Irish traditions; so much so that it was said they put on the airs of being 'More Than Irish'. The very nature of our culture is contagious, and for centuries yet will men embrace our way of life."
 abm_loyal_catholics: "Loyal Catholics"
 abm_loyal_catholics_desc: "While the English may toil and spin in the winds of the Reformation, the Irish people as a whole are determined to remain under the wing of their lord The Pope."
 abm_ire_abundant_harvests: "Abundant Harvests"
 abm_ire_abundant_harvests_desc: "Now that the greedy, neglectful English landlords have been driven out of Ireland, our farmers are finally able to manage their produce in peace. Blights and crop failures are addressed as matters of critical state importance rather than as peripheral concerns of an irrelevant colony."
 abm_unconquerable_ireland: "Unconquerable Ireland"
 abm_unconquerable_ireland_desc: "No English lord could contain the will of the Irish for long. Despite all efforts, rebellion after rebellion sprouted in an attempt to displace English rule. Insurgency after insurgency will spring up in their path, and Ireland shall never truly be theirs. And, as they sail from our lands, we shall further influence resistance against the protestant imperialists on our eastern flank."
 abm_ire_gallowglasses: "Nationalized Gallowglass Septs"
 abm_ire_gallowglasses_desc: "Formerly loose mercenary bands, the Gallowglasses are being consolidated into a national army. Their institutional experience is almost unrivalled, and their septs are the perfect foundations for regiments."
 abm_irish_ideas_ambition: "Irish Ambition"
 abm_irish_ideas_ambition_desc: "Irish Ambition"
 abm_uls_ideas_tradition_1: "Ulster Tradition I"
 abm_uls_ideas_tradition_1_desc: "Ulster Tradition I"
 abm_uls_ideas_tradition_2: "Ulster Tradition II"
 abm_uls_ideas_tradition_2_desc: "Ulster Tradition II"
 abm_uls_clan_connections: "Highland Connections"
 abm_uls_clan_connections_desc: "The nobility of Ulster have ties of marriage and ancestry with Clan Donald in the Scottish Highlands. The Donalds can always be relied upon to lend their expertise to Ulster."
 abm_uls_peerage: "Peerage of Ulster"
 abm_uls_peerage_desc: "Most of the lords of Ulster are at least nominally part of the Irish Peerage system, by which Irish landholders swear allegiance to the English Crown. While this means little in practice, we wear the titles proudly."
 abm_civilist_of_irishry: "Civilist of the Irishry"
 abm_civilist_of_irishry_desc: "The nobility of Ulster take great pains to appear respectable in the eyes of their English counterparts. This has won them a degree of respect in European courts."
 abm_rapparee: "Rapparees"
 abm_rapparee_desc: "The Rapparees are a newly formed band of guerrilla fighters with their origins in the Irish kerns. As irregular soldiers they are able to harass enemy forces as they march through our land."
 abm_catholic_ascendency: "Catholic Ascendency"
 abm_catholic_ascendency_desc: "The Reformation cannot be allowed to gain a foothold in Ireland. Non-Catholics should be barred from public offices and disadvantaged in any way that the state can manage to discourage heresy."
 abm_uls_defenders: "The Defenders"
 abm_uls_defenders_desc: "A secret society has formed in Ulster known as the Defenders. Their goal is to ensure the loyalty and solidarity of Catholics throughout Ireland, combatting persecution by Protestants."
 abm_uls_last_redoubt: "Last Redoubt of Ireland"
 abm_uls_last_redoubt_desc: "Much of Ireland lies at the mercy of the English armies. Ulster is one of the last bastions of Irish independence, and must be prepared to fight to the last man to preserve it."
 abm_uls_ideas_ambition: "Ulster Ambition"
 abm_uls_ideas_ambition_desc: "Ulster Ambition"
 abm_tyr_ideas_tradition_1: "Tyrone Tradition I"
 abm_tyr_ideas_tradition_1_desc: "Tyrone Tradition I"
 abm_tyr_ideas_tradition_2: "Tyrone Tradition II"
 abm_tyr_ideas_tradition_2_desc: "Tyrone Tradition II"
 abm_tyr_chief_of_irish_kings: "Chief of Irish Kings"
 abm_tyr_chief_of_irish_kings_desc: "The O’Neills established control over most of Ulster, becoming the most powerful of the Gaelic lords. One future monarch gave the head of the family a gift of livery, declaring him to be ‘the chief of the Irish kings.'"
 abm_tyr_o_neill_mor: "The O’Neill Mór"
 abm_tyr_o_neill_mor_desc: "The chosen leader of the O’Neill family receives the title of the O’Neill Mór. The title is not hereditary, but regardless of what branch of the family the O’Neill Mór came from, all owe him fealty."
 abm_tyr_tanistry: "Tanistry"
 abm_tyr_tanistry_desc: "While many Gaelic lords accepted the English practice of primogeniture, the people of Tyrone maintained the Brehon practice of tanistry. As a new ruler was elected by the free men of the clan, he could expect to be well supported in the face of any challengers."
 abm_tyr_arming_people: "Arming the People"
 abm_tyr_arming_people_desc: "While most Irish lords rely upon the services of a small number of Scottish mercenaries or Irish professionals, the rulers of Tyrone arm and train all of the men under their rule."
 abm_tyr_catholic_diplomacy: "Catholic Diplomacy"
 abm_tyr_catholic_diplomacy_desc: "As the spread of the Reformation increases tensions in Ireland, the lords of Tyrone seek the aid of Catholic rulers abroad."
 abm_tyr_ambush_warfare: "Ambush Warfare"
 abm_tyr_ambush_warfare_desc: "Their enemies outnumber them and have better weapons and training, but the men of Tyrone are masters of irregular warfare. They use the hills, forest and bogs of their homeland to their utmost advantage, harrying their enemies as they march and drawing them into traps. The English monarchs grow increasingly frustrated as their armies and treasure disappeared into the wilds of Ireland."
 abm_tyr_wild_geese: "The Wild Geese"
 abm_tyr_wild_geese_desc: "The constant conflicts between Tyrone and the English have resulted in a population of young men well trained in the arts of war. Some leave for the continent, where they find employment as mercenaries. Known as the Wild Geese, these regiments often find themselves fighting against the English yet again, but under another flag."
 abm_tyr_ideas_ambition: "Tyrone Ambition"
 abm_tyr_ideas_ambition_desc: "Tyrone Ambition"
 abm_cnn_ideas_tradition_1: "Clanricarde Tradition I"
 abm_cnn_ideas_tradition_1_desc: "Clanricarde Tradition I"
 abm_cnn_ideas_tradition_2: "Clanricarde Tradition II"
 abm_cnn_ideas_tradition_2_desc: "Clanricarde Tradition II"
 abm_cnn_14_tribes: "The Fourteen Tribes"
 abm_cnn_14_tribes_desc: "Galway city is dominated by 14 wealthy merchant families, known as the 14 tribes. Their constant competition and rivalries drive them to seek ever greater profits, and as a result Galway has become a thriving market port."
 abm_cnn_fire_and_sword: "By Fire and Sword"
 abm_cnn_fire_and_sword_desc: "The lands of Clanricarde are controlled by many different families and factions. The rulers of Clanricarde have learned that the best way to assert their authority is through force. Villages, towns and castles burn so that the ruling family can feel secure in their power."
 abm_cnn_sea_people: "People of the Sea"
 abm_cnn_sea_people_desc: "The lands of Connemara, on the western coasts of Connacht, are particularly poor for livestock or agriculture, but the people there have learned to make a living from the sea. Taking to the ocean in their currachs and hookers, they provide Clanricarde with a ready source of able seamen."
 abm_cnn_irish_hobby: "Irish Hobbies"
 abm_cnn_irish_hobby_desc: "The harsh and hilly ground of Connemara make good breeding grounds for the Irish Hobby, a breed of horse well suited for the type of skirmish warfare employed by the Gaels."
 abm_cnn_hell_or_connacht: "To Hell or to Connacht "
 abm_cnn_hell_or_connacht_desc: "The warriors of Clanricarde come from some of the least hospitable lands in Ireland. To engage in a siege, long from home, holds little fear for them, for they are used to wringing sustenance from more hostile territory."
 abm_cnn_catholicism: "Catholic Holdouts"
 abm_cnn_catholicism_desc: "No matter the lies told by the heretics of the Reformation, the people of Clanricarde will always remain loyal to His Holiness."
 abm_cnn_lord_presidency: "The Lord Presidency"
 abm_cnn_lord_presidency_desc: "The establishment of the position of Lord President of Connacht helped to bring order to the lands of Clanricarde. Whereas previously disputes between prominent families resulted in raids and feuding, now the Lord President acted as a neutral arbiter"
 abm_cnn_ideas_ambition: "Clanricarde Ambition"
 abm_cnn_ideas_ambition_desc: "Clanricarde Ambition"
 abm_lei_ideas_tradition_1: "Leinster Tradition I"
 abm_lei_ideas_tradition_1_desc: "Leinster Tradition I"
 abm_lei_ideas_tradition_2: "Leinster Tradition II"
 abm_lei_ideas_tradition_2_desc: "Leinster Tradition II"
 abm_legacy_of_palladius: "Legacy of Palladius"
 abm_legacy_of_palladius_desc: "Leinster was amongst first parts of Ireland to be Christianized. St Palladius arrived in Leinster in the early 5th century to serve as Ireland’s first bishop, preceding St Patrick. The province is dotted with monasteries and abbeys, some of which date back to ancient times."
 abm_lei_black_rent: "The Black Rent"
 abm_lei_black_rent_desc: "The Gaels of Leinster demand a tribute from the Anglo-Norman towns along the south coast and, occasionally, from the English settlers in the Pale. This tribute is known as the ‘cíos dubh,’ the black rent. Failure to pay simply means that the Gaels take the tribute by force, with the added burden of lives lost and houses and crops burnt."
 abm_lei_enemy_of_enemy: "The Subject of My Enemy is My Friend"
 abm_lei_enemy_of_enemy_desc: "The rulers of Leinster have always sought to foster ties with the disaffected subjects of their neighbors, so as to better secure their own position. A rebel abroad will always find a sympathetic ear - and perhaps arms, shelter, training and coin - in Leinster"
 abm_lei_strong_cunning: "He Who Is Not Strong Must Be Cunning"
 abm_lei_strong_cunning_desc: "Though their enemies are usually better equipped with guns and artillery, the warriors of Leinster are adept at using terrain to shield their advance and close to melee – or to cover their retreat as they run to fight another day."
 abm_lei_long_memories: "Long Memories"
 abm_lei_long_memories_desc: "The people of Leinster remember the many injustices perpetrated upon them by their enemies. This strengthens their resolve to fight on, to avenge the fallen and punish the guilty."
 abm_lei_geraldine_league: "The Geraldine League"
 abm_lei_geraldine_league_desc: "With the Reformation spreading like wildfire in Europe, Leinster must rise to the challenge. We shall form a League of nations willing to defend the true faith from any heretics that try to impose their faith on Ireland."
 abm_lei_military_academy: "Ballinacore Military Academy"
 abm_lei_military_academy_desc: "The O’Byrnes of Ballinacore have taken to training the men of Wicklow in the continental arts of war. They seek to augment their forces of cavalry and kern with pikemen and gunners, so that they might face their foes in open battle."
 abm_lei_ideas_ambition: "Leinster Ambition"
 abm_lei_ideas_ambition_desc: "Leinster Ambition"
 abm_mth_ideas_tradition_1: "Meath Tradition I"
 abm_mth_ideas_tradition_1_desc: "Meath Tradition I"
 abm_mth_ideas_tradition_2: "Meath Tradition II"
 abm_mth_ideas_tradition_2_desc: "Meath Tradition II"
 abm_innefectual_overlords: "Ineffectual Overlords"
 abm_innefectual_overlords_desc: "The English government in Dublin and their Irish Parliament puppets have been weakened as result of England's many conflicts in the Hundred Years' War and the War of the Roses. Their influence no longer holds any sway over the true lords of Ireland, and now is the time to strike out for our independence."
 abm_foreign_nationals: "Foreign Nationals"
 abm_foreign_nationals_desc: "In 1487, the Irish lord John de la Pole, Earl of Lincoln, invited a host from Burgundy to Dublin to support the crowning of Yorkist English pretender Lambert Simnel. Ireland would make for a fine base of resistant against the English mainland, and forever keep the would-be occupiers at bay. We may also one day gain powerful supporters, such as the Kingdom of Spain."
 abm_mth_parliament_of_ireland: "Parliament of Ireland"
 abm_mth_parliament_of_ireland_desc: "When the English were expelled from Dublin, they left behind an institution called the Parliament of Ireland. Meant as an instrument to subjugate us, we will instead use it to organise our efforts to resist a return of English rule."
 abm_mth_englishtown: "Englishtown"
 abm_mth_englishtown_desc: "Once known as Irishtown and a ghetto for native Irish in Dublin, we have turned the tables. The district is now relegated to the Englishmen who remain, there being forced to integrate into the new order."
 abm_mth_the_cess: "The Cess"
 abm_mth_the_cess_desc: "The Cess is a special tax for the purpose of maintaining the extraordinary garrisons required to keep our towns safe. The people resent the tax, but understand its necessity."
 abm_mth_trinity_college: "Trinity College"
 abm_mth_trinity_college_desc: "Ireland lacks an institution of higher learning. A Catholic university in Dublin would put Ireland on the academic map."
 abm_mth_siege_mentality: "Siege Mentality"
 abm_mth_siege_mentality_desc: "The people of Dublin and Meath have had to endure many sieges through the years. We understand how to survive them and how to resist them."
 abm_mth_ideas_ambition: "Meath Ambition"
 abm_mth_ideas_ambition_desc: "Meath Ambition"
 abm_dms_ideas_tradition_1: "Desmondian Tradition I"
 abm_dms_ideas_tradition_1_desc: "Desmondian Tradition I"
 abm_dms_ideas_tradition_2: "Desmondian Tradition II"
 abm_dms_ideas_tradition_2_desc: "Desmondian Tradition II"
 abm_dms_the_land_of_castles: "The Land of Castles"
 abm_dms_the_land_of_castles_desc: "Since the earliest days of kingdom of Desmond, our forefathers knew that the best way to master a land was to be ever present. And thus they constructed castles and manors and other great buildings that stand proud to this day. And thus we carry on that tradition to this day. A lesson well learned."
 abm_dms_cadet_lines: "Cadet Lines"
 abm_dms_cadet_lines_desc: "Family. Family never changes. Especially when it comes to nobility. But why should we fear our cadet family lines like the rest of Europe? Our own kin? No, instead of fear, schemes and plots, we shall make use of them, carve up the land, hand out titles, manors and castles, expand the royal family and create presence in every dark corner of our kingdom."
 abm_dms_gaelic_bastion: "Gaelic Bastion"
 abm_dms_gaelic_bastion_desc: "Many would-be invaders came to our lands seeking plunder and easily won glory. But all of them would break against the kingdom of Desmond. Tall and proud our people stand against all perils and despite all odds, such is our way. The strongest Gaelic Bastion."
 abm_dms_the_munster_ambition: "The Munster Ambition"
 abm_dms_the_munster_ambition_desc: "The old kingdom of Munster is long gone, its lands divided, and authority almost entirely diminished. But its legacy and glory still lives in the proud dynastic lines of Desmond, its true sons and heirs. No, we shall never forget, and one day we shall reclaim the lands of Munster."
 abm_dms_fierce_independence: "Fierce Independence"
 abm_dms_fierce_independence_desc: "Our forefathers stood up to invaders and conquerors countless times. Even in times of great suffering and loss, our kingdom endured against all storms, and survived to this day. Where many lords of Ireland bowed and banded together in order to survive, the proud sons and daughters of Desmond stood on their own. Independent and without masters until the bitter end."
 abm_dms_promote_the_clture_of_service: "Promote the Culture of Service"
 abm_dms_promote_the_clture_of_service_desc: "Life has never been easy in our land. You need to be tough merely to survive, and you need a heart of a warrior to succeed out there. Talents highly appreciated and often sought after among the warring nations of Europe. Instead of watching our sons fight between each other for often worthless stretches of land, encourage them to go out in the world and seek military service and a life of honor and glory."
 abm_dms_inner_perfection: "Inner Perfection"
 abm_dms_inner_perfection_desc: "For centuries the kingdoms of Europe have gone through wars and hardships forging themselves into powerful nations and colonial empires. Our greatest achievement? Not only surviving the most humble of origins, but thriving in the middle of all that, despite all odds. What else could a man really ask for?"
 abm_dms_ideas_ambition: "Desmondian Ambition"
 abm_dms_ideas_ambition_desc: "Desmondian Ambition"
 abm_sln_ideas_tradition_1: "Sligonian Tradition I"
 abm_sln_ideas_tradition_1_desc: "Sligonian Tradition I"
 abm_sln_ideas_tradition_2: "Sligonian Tradition II"
 abm_sln_ideas_tradition_2_desc: "Sligonian Tradition II"
 abm_sln_promote_the_trade: "Promote the Trade"
 abm_sln_promote_the_trade_desc: "Situated in the middle of a major Irish trade route, Sligo is in a perfect position to be a trade hub of the entire island. To that end we must establish trading contacts with our neighbors and let the trade flow."
 abm_sln_rebuild_the_castle_of_sligo: "Rebuild the Castle of Sligo"
 abm_sln_rebuild_the_castle_of_sligo_desc: "For centuries many invaders have come to our lands seeking control over the strategically important Castle of Sligo. So many times has this old fort been repaired and again destroyed, that today we are not even sure where the main ruins are, even though parts of it still stand. In any case, this old fort is a symbol to our people. If we can rebuild it, we can turn this powerful rebirth of a legend into a New Hope for them."
 abm_sln_galic_meets_norman: "Cultural Crossroads"
 abm_sln_galic_meets_norman_desc: "Sligo has been a point where various cultures met for ages. Some would come in peace, some as conquerors, but in the end they all left something behind them. It is up to us, their descendants, to embrace this legacy and build a future that celebrates our origins."
 abm_sln_a_different_way: "A Different Way"
 abm_sln_a_different_way_desc: "As we have watched our neighbors squabble and fight their petty wars over trivial matters for centuries, our people realized that moving the chess pieces out in the open, for the whole world to see, was not the only way. Using our contacts as well as trading influence, we could also not only move the chess pieces, but play a whole different game, one that only a few could see at all."
 abm_sln_study_the_norman_traditions: "Study the Norman Traditions"
 abm_sln_study_the_norman_traditions_desc: "The location of Sligo is both a blessing and a curse. Its position allows us to open up our land to the sea trade, but as our ancestors learned the hard way, it also invites all sorts of seaborne would-be conquerors to our walls. Thus to secure safety of our people we must adapt, study both land and sea techniques of our enemies and learn to apply them."
 abm_sln_sligo_rules_the_waves: "Sligo's Naval Ambition"
 abm_sln_sligo_rules_the_waves_desc: "Influence over Ireland and wealth rivaled by none of our neighbors are fine ambitions in life. They have served our ancestors well. But this is a new age. Rumors of new lands being discovered to the west reach us, and perhaps it is time for us to join the exclusive group of nations that are able to sail the seas and seek glory and riches in lands far away."
 abm_sln_pragmatism: "Pragmatism Over All"
 abm_sln_pragmatism_desc: "In our time we have achieved many glorious things: We built a bustling trading network. We sailed the seas near and far. We met new and interesting people. And we traded with them."
 abm_sln_ideas_ambition: "Sligonian Ambition"
 abm_sln_ideas_ambition_desc: "Sligonian Ambition"
 abm_kid_ideas_tradition_1: "Kildarean Tradition I"
 abm_kid_ideas_tradition_1_desc: "Kildarean Tradition I"
 abm_kid_ideas_tradition_2: "Kildarean Tradition II"
 abm_kid_ideas_tradition_2_desc: "Kildarean Tradition II"
 abm_kid_lords_of_ireland: "Lords Deputy"
 abm_kid_lords_of_ireland_desc: "Through strategic marriages and alliances with both Gaelic and Anglo-Irish families, the rulers of Kildare maintain a degree of influence throughout the island of Ireland unmatched by any of their rivals. Such is their power that successive English monarchs appointed them as their Lords Deputy over the island."
 abm_kid_ear_of_the_king: "Silver Tongues"
 abm_kid_ear_of_the_king_desc: "Despite repeatedly betraying the crown, the FitzGeralds of Kildare talk their way out of trouble, returning home with a pardon and a promotion."
 abm_kid_silken_finery: "Silken Thomas"
 abm_kid_silken_finery_desc: "When Thomas FitzGerald renounced his allegiance to the English king, he did so accompanied by his retinue of armoured gallowglasses, who were bedecked with silken fringes on their helmets. When Thomas wavered in his course of action, an Irish bard recited to him a poem, calling upon the Silken Lord to avenge his father’s death."
 abm_wizard_earl: "The Wizard Earl"
 abm_wizard_earl_desc: "The 11th Earl of Kildare spent many years abroad, studying and learning much of the world. When he returned home, he brought with him a keen interest in alchemy. Such was his knowledge that his neighbors referred to him as the wizard earl, for he was thought to have magical powers."
 abm_the_curragh: "Curragh Horsemanship"
 abm_the_curragh_desc: "The wide open plains of the Curragh have long been used as a gathering place for armed forces, but also make it a popular site for horse racing, and later, horse training."
 abm_kid_architects_of_nation: "A New Seat for the FitzGeralds"
 abm_kid_architects_of_nation_desc: "The ancestral seat of the FitzGeralds at Carton House is grand, but our fortunes have improved of late. We have drawn up plans for an even grander residence, that could serve not only as a family seat but also as the Earl's court."
 abm_kid_royal_irish_army: "Royal Irish Army"
 abm_kid_royal_irish_army_desc: "The forces sent by the King of England to subdue the Irish can easily be repurposed by the Peerage. By simply offering better pay the Earldom of Kildare could command a sizable force of English soldiers."
 abm_kid_ideas_ambition: "Kildarean Ambition"
 abm_kid_ideas_ambition_desc: "Kildarean Ambition"
 abm_ord_ideas_tradition_1: "Ormond Tradition I"
 abm_ord_ideas_tradition_1_desc: "Ormond Tradition I"
 abm_ord_ideas_tradition_2: "Ormond Tradition II"
 abm_ord_ideas_tradition_2_desc: "Ormond Tradition II"
 abm_ord_english_service: "English Service"
 abm_ord_english_service_desc: "The Earls of Ormond are known to fight abroad, involving themselves in the dynastic squabbles of the English. The experience gained on the battlefield serves them well when resolving disputes closer to home."
 abm_ord_courts_of_europe: "The Courts of Europe"
 abm_ord_courts_of_europe_desc: "Whereas most of the Anglo-Irish and Gaelic lords of Ireland do not stray far from their island, the lords of Ormond are well familiar with the courts of Europe, being friends to kings and serving as ambassadors on the continent."
 abm_ord_wool_earl: "The Wool Earl"
 abm_ord_wool_earl_desc: "The rulers of Ormond have extensive estates in England. Such is their wealth that the Earl of Ormonde is sometimes known as the Wool Earl, for the riches gained from that trade."
 abm_ord_locals_in_line: "Keeping the Locals in Line"
 abm_ord_locals_in_line_desc: "The Gaels are an unruly lot, prone to rebellion against their betters. They require a strong hand to keep them in line."
 abm_ord_irish_rivalries: "Irish Rivalries"
 abm_ord_irish_rivalries_desc: "Many are jealous of our success. We must be wary, as our enemies will take any opportunity to strike us down and are not limited to honourable means of doing so."
 abm_ord_subdue_irish: "Irish Siegecraft"
 abm_ord_subdue_irish_desc: "The armies of Ormond have great experience bringing down the keeps and fortresses of their Gaelic and Anglo-Irish neighbors."
 abm_ord_build_on_success: "Entrenchment of the Butler Dynasty"
 abm_ord_build_on_success_desc: "The Butler family is well established. Secure in our position, we can begin to build for the future, so that our descendants will look upon what we have built and remember us."
 abm_ord_ideas_ambition: "Ormond Ambitions"
 abm_ord_ideas_ambition_desc: "Ormond Ambitions"
 abm_try_ideas_tradition_1: "Tyrconnell Tradition I"
 abm_try_ideas_tradition_1_desc: "Tyrconnell Tradition I"
 abm_try_ideas_tradition_2: "Tyrconnell Tradition II"
 abm_try_ideas_tradition_2_desc: "Tyrconnell Tradition II"
 abm_try_fort_foreigners: "Fort of the Foreigners"
 abm_try_fort_foreigners_desc: "The O’Donnells built a castle on the ruins of a Viking fort and named it Donegal Castle. Described as the strongest fort in Ireland, it presented a formidable obstacle to any enemy threatening Tyrconnell."
 abm_try_fisher_king: "The Fisher King"
 abm_try_fisher_king_desc: "The head of the O’Donnell clan came to be known on the continent as the Fisher King, due to the export of fish in exchange for wine in the markets of La Rochelle."
 abm_try_religious_patrons: "Religious Patrons"
 abm_try_religious_patrons_desc: "The rulers of Tyrconnell are great supporters of the church, paying many religious benefices and supporting a Franciscan abbey."
 abm_try_patricks_purgatory: "St Patrick’s Purgatory"
 abm_try_patricks_purgatory_desc: "It is said that when St Patrick came to Lough Derg, God revealed to him a cave upon an island in the middle of the lake. This cave was the entrance to purgatory, and St Patrick took non-believers to the cave so that they might witness heaven and hell for themselves. Patrick’s Purgatory has become an important site of pilgrimage, drawing the faithful from across Europe."
 abm_try_lessons_knockavoe: "Lessons of Knockavoe"
 abm_try_lessons_knockavoe_desc: "The men of Tyrconnell are often heavily outnumbered by their rivals. To compensate, they master the element of surprise to defeat their enemies, attacking them as they make camp or even in night raids. Before their opponents have time to form ranks, the Tyrconnell host is be upon them."
 abm_try_land_of_exiles: "Land of Exiles"
 abm_try_land_of_exiles_desc: "The O’Donnells give sanctuary to many Gaelic nobles and priests who have lost their lands at the hands of foreign aggressors. Thus is the royal household of Tyrconnell well served by many notable physicians, clergymen and warriors of great skill and renown."
 abm_try_scottish_ties: "Scottish Ties"
 abm_try_scottish_ties_desc: "When infighting threatened to tear Tyrconnell apart, Calvagh O’Donnell sought assistance in Scotland, where he met with the Campbells. He returned with a force of Highlanders and some artillery, giving him the strength to secure his hold over the province. The O’Donnells can turn to their Scottish allies again in future to give them an edge in their struggles."
 abm_try_ideas_ambition: "Tyrconnell Ambition"
 abm_try_ideas_ambition_desc: "Tyrconnell Ambition"
 abm_mcm_ideas_tradition_1: "Munster Tradition I"
 abm_mcm_ideas_tradition_1_desc: "Munster Tradition I"
 abm_mcm_ideas_tradition_2: "Munster Tradition II"
 abm_mcm_ideas_tradition_2_desc: "Munster Tradition II"
 abm_mcm_basque_fishermen: "North Sea Fishermen"
 abm_mcm_basque_fishermen_desc: "Basque, Spanish and Portuguese fishermen come to take advantage of the extensive fishing grounds off our coasts. When they arrive in our ports they bring with them iron, wine and other commodities, and when the fishing is poor they fill their holds with hides and wool from our markets."
 abm_mcm_brave_and_faithful: "The Brave and Faithful"
 abm_mcm_brave_and_faithful_desc: "To the brave and faithful nothing is difficult. The family motto of the McCarthys has inspired the people of Munster throughout the ages, helping them to keep the faith throughout the brutal wars that have ravaged their homeland."
 abm_mcm_hill_raiders: "Hill Raiders"
 abm_mcm_hill_raiders_desc: "When faced with a superior enemy, the Gaels of Munster retreat into the hills. They then harry their enemy with a constant series of raids, targeting their supplies, burning down villages and destroying crops, until the enemy is forced to withdraw or starve."
 abm_mcm_spanish_ties: "Spanish Ties"
 abm_mcm_spanish_ties_desc: "The southern Irish have long shared close ties, both economic and political, with the people of Spain. As their mutual struggles against the English increase, these ties grow stronger. Many young Munster men serve in Spanish armies, learning the arts of war."
 abm_mcm_fairer_shores: "Fairer Shores"
 abm_mcm_fairer_shores_desc: "The lands of Munster are harsh, with poor soil and unpleasant winters. The chance to make a new life for themselves in the colonies appeals to many. There is never a shortage of volunteers happy to head across the Atlantic."
 abm_mcm_pirate_haven: "Pirate Haven"
 abm_mcm_pirate_haven_desc: "Based out of Crookhaven harbour, they prey on shipping from the New World heading to Dutch and English ports. The local authorities are happy to look the other way, as the pirates bring the wealth of the Americas to the southern Irish coast."
 abm_mcm_enemies_everywhere: "Enemies Within"
 abm_mcm_enemies_everywhere_desc: "The enemies of the MacCarthy clan scheme in every corner of the world, even within our own court. We must ensure the patriotism of our subjects through rigorous investigation."
 abm_mcm_ideas_ambition: "Munster Ambition"
 abm_mcm_ideas_ambition_desc: "Munster Ambition"
