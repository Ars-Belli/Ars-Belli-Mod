 abm_hanseatic_federation_decision.title: "The Hanseatic Merchant Federation"
 abm_hanseatic_federation_decision.desc: "Our towns live by the sea roads: the herring fleets of the Sound, the salt of Luneburg, the cloth of the Wendish fairs and the credit that made our burghers rich while kings squabbled over acres. Let the cities of the coast and the heaths behind them bind themselves into one federation, with a common treasury, a common fleet and a common seal — the Hanseatic Merchant Federation."
 abm_hanseatic_federation_decision.a: "The cities shall rule themselves."
