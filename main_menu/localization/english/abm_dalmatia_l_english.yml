l_english:
 abm_secure_dalmatia_decision.title: "The Dalmatian Possession"
 abm_secure_dalmatia_decision.desc: "From Zadar to Dubrovnik every harbour of the Dalmatian coast answers to our flag. The hinterland is poor and the islands poorer, but the coast is the sea road between the Gulf and the Levant: salt, timber for oars and galleys, and pilots who know every channel. Let Dalmatia be ruled as a possession rather than a frontier, and the whole shore becomes one estate of the state — $STATIC_MODIFIER_NAME_abm_secured_dalmatia$."
 abm_secure_dalmatia_decision.a: "The whole shore is ours."
