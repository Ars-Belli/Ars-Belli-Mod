l_english:

 # Italian unit unlock advances
 abm_venettian_stradioti: "Venetian Stradioti"
 abm_venettian_stradioti_desc: "Swift Balkan light cavalry in the service of the Serenissima. These mounted raiders excel in rough terrain — hills, mountains, marshlands, and coastal shores alike — outpacing and outflanking heavier foes."
 abm_late_venettian_stradioti: "Late Venetian Stradioti"
 abm_late_venettian_stradioti_desc: "Battle-hardened Stradiots whose reputation for speed and ferocity has grown with each campaign, masters of difficult terrain."
 abm_venettian_cappelletti: "Venetian Cappelletti"
 abm_venettian_cappelletti_desc: "Mounted skirmishers continuing the proud Stradiot tradition, armed with carbines and sabers."
 abm_venettian_cravates: "Venetian Cravates"
 abm_venettian_cravates_desc: "Elite light cavalry of the Venetian Republic, descended from Croatian horsemen in Venetian pay."
 abm_venettian_dragoons: "Venetian Dragoons"
 abm_venettian_dragoons_desc: "The finest light cavalry in Venetian service — mounted riflemen combining the speed of Stradiots with the firepower of modern dragoons."
 abm_late_genoese_crossbowmen: "Late Genoese Crossbowmen"
 abm_late_genoese_crossbowmen_desc: "Veteran Genoese crossbowmen adapting to the changing face of warfare, their shields and tactics refined by decades of mercenary service."
 abm_genoese_arquebusiers: "Genoese Arquebusiers"
 abm_genoese_arquebusiers_desc: "The Genoese embrace gunpowder while retaining their distinctive Pavise shields, bringing disciplined volley fire to the field."
 abm_genoese_musketeers: "Genoese Musketeers"
 abm_genoese_musketeers_desc: "Hardened by centuries of mercenary tradition, these Genoese musketeers combine firepower with the defensive expertise of their ancestors."
 abm_genoese_riflemen: "Genoese Riflemen"
 abm_genoese_riflemen_desc: "The pinnacle of Genoa's military tradition — elite riflemen carrying the legacy of the Pavise crossbowmen into the modern era."
 abm_italian_balestrieri_stradioti: "Italian Balestrieri & Stradioti"
 abm_italian_balestrieri_stradioti_desc: "Skilled Italian crossbowmen and light cavalry drawn from the peninsula's rich mercenary tradition, holding their ground in hills and mountains."
 abm_italian_late_balestrieri_stradioti: "Late Italian Balestrieri & Stradioti"
 abm_italian_late_balestrieri_stradioti_desc: "Seasoned Italian crossbowmen and light cavalry hardened by the peninsula's endless wars, lethal in broken ground and swift in difficult terrain."
 abm_italian_archibugieri_cappelletti: "Italian Archibugieri & Cappelletti"
 abm_italian_archibugieri_cappelletti_desc: "Italian infantry armed with arquebuses and mounted skirmishers carrying the Stradiot tradition forward, holding the line while striking at the enemy's flanks."

 # PAP — Papal States
 abm_pap_ideas_tradition_1: "Kingdom of God Traditions"
 abm_pap_ideas_tradition_1_desc: "The Pope is the spiritual leader of all Catholic nations, giving weight to his diplomatic overtures."
 abm_pap_ideas_tradition_2: "Kingdom of God Traditions"
 abm_pap_ideas_tradition_2_desc: "The Pope is the spiritual leader of all Catholic nations, ensuring the faithful remain united."
 abm_ecclesiastical_primacy: "Ecclesiastical Primacy"
 abm_ecclesiastical_primacy_desc: "The Pope has the sovereign authority to establish religious canon and law in the Catholic church. The State shares a special relationship with those who conform with the Catholic authority."
 abm_papal_investiture_and_tithes: "Kingdom of God Investiture and Tithes"
 abm_papal_investiture_and_tithes_desc: "Into Rome flow the riches of Christian Europe."
 abm_glory_of_rome: "Glory of Rome"
 abm_glory_of_rome_desc: "We control the great city and the ancient capital of the Romans. We are the preservers of their marvelous tradition."
 abm_donation_of_constantine: "Donation of Constantine"
 abm_donation_of_constantine_desc: "The Donation of Constantine demonstrates our authority to bestow the title of the Emperor of the Romans upon whomsoever we choose. It may also prove that we're rather good at forging documents."
 abm_centralize_the_states: "Centralize the States"
 abm_centralize_the_states_desc: "We will consolidate our power in Papal provinces by seizing it from the local princes."
 abm_vatican_museums: "The Vatican Museums"
 abm_vatican_museums_desc: "Years of collecting and donations have made Vatican City the home of many museums. We've accumulated one of the most impressive art collections in history."
 abm_holy_father: "The Holy Father"
 abm_holy_father_desc: "Being the Vicar of God to Roman Catholics gives us a certain amount of political leeway. The Papal Bull, documents carrying the Pope's official seal, carry the weight of the very word of God. With these rulers have been cursed and entire continents divided."
 abm_pap_ideas_ambition: "Kingdom of God Ambition"
 abm_pap_ideas_ambition_desc: "The Papal States will stop at nothing to assert their authority over Christendom."

 # ABLOM — Latin/Italian
 abm_latin_ideas_tradition_1: "Lombard Tradition I"
 abm_latin_ideas_tradition_1_desc: "The city states of Italy have a proud mercantile and martial tradition."
 abm_latin_ideas_tradition_2: "Lombard Tradition II"
 abm_latin_ideas_tradition_2_desc: "The city states of Italy are the heart of the Catholic faith."
 abm_latin_renaissance: "Lombard Renaissance"
 abm_latin_renaissance_desc: "Italy is the birthplace of the Renaissance, in these lands the knowledge of the ancient world have been explored and its ideals reborn. Our philosophers, artists, authors and universities remain at the forefront of European scholarship."
 abm_latin_condottieri: "Lombard Condottieri"
 abm_latin_condottieri_desc: "The many wars of the Lombard city states have attracted a host of military contractors or Condottieri from far and near. Should we ever desire to go to war finding mercenary bands willing to fight for us will not be hard."
 abm_latin_aristocracy: "Lombard Aristocracy"
 abm_latin_aristocracy_desc: "Every inch of Lombard soil has been hotly contested for generations. Over the centuries the many claims of various noble houses have been meticulously documented, forged and fought over. Any foreign invader would have a very hard time making credible claims to these lands, much less actually integrating them and controlling the various parties within them."
 abm_latin_tracee_italienne: "Trace Italienne"
 abm_latin_tracee_italienne_desc: "The arrival of the cannon has changed the battlefields and sieges of Italy forever and our old medieval fortifications are no longer quite up to the task. Lombard engineers have recently pioneered a new style of fortresses with thick earthen ramparts and ditches. Instead of maintaining our outdated walls we should build such fortifications as they are more suited to modern warfare."
 abm_latin_high_renaissance: "High Renaissance Art & Architecture"
 abm_latin_high_renaissance_desc: "All of Christendom watches with envy as the Lombard courts overflow with some of the finest architects, artists and poets of our age. We must take care to extend our patronage wide enough that none of this talent has to be wasted on the barbarian courts outside of the peninsula."
 abm_latin_diplomacy: "Lombard Diplomacy"
 abm_latin_diplomacy_desc: "The Lombard city states have a long history of diplomatic relations and traditions. We would be wise to make use of this to further our international ambitions. The reputation and experience of our ambassadors will allow us to greatly expand our influence outside our borders."
 abm_latin_commedia_del_arte: "Commedia dell'arte"
 abm_latin_commedia_del_arte_desc: "A new form of improvisation theatre have become common in the Lombard lands. Various theatre companies have are traveling and performing on temporary stages with common people and nobility alike as their spectators. By sponsoring some of the better companies and ensuring that they perform during carnivals and other festivities we would undoubtedly earn the gratitude of our subjects."
 abm_latin_ideas_ambition: "Lombard Ambition"
 abm_latin_ideas_ambition_desc: "Lombardy will once again be the cultural and political heart of Europe."

 # SPI — Sardinia-Piedmont
 abm_spi_ideas_tradition_1: "Sardinian-Piedmontese Traditions I"
 abm_spi_ideas_tradition_1_desc: "From our Alpine valleys to the island of Sardinia, the House of Savoy has long patronized learning and the arts, keeping our court at the forefront of European scholarship."
 abm_spi_ideas_tradition_2: "Sardinian-Piedmontese Traditions II"
 abm_spi_ideas_tradition_2_desc: "Surrounded by greater powers, we have learned that a well-placed word can achieve more than a drawn sword. Our diplomats are trained in the delicate art of winning friends and keeping them."

 abm_spi_flexibility: "Diplomatic Flexibility"
 abm_spi_flexibility_desc: "Wedged in between stronger powers and under constant threat of falling too far under their influence, we have been forced to practice nimble diplomacy - some would say shameless opportunism - in order to safeguard our independence and find some new opening to advance our state. Though distasteful in the eyes of traditionalists, opportunism has its upsides."

 abm_spi_defensive_prowess: "Defensive Prowess"
 abm_spi_defensive_prowess_desc: "From the French in Savoy and Piedmont to the Spanish in Sardinia, our lands have long been tempting targets for our neighbors' expansionist ideals. In protecting our sovereignty through the years, we have honed our fortification techniques and mastered the art of defending a fortress."

 abm_spi_shroud_of_turin: "Shroud of Turin"
 abm_spi_shroud_of_turin_desc: "Housed in the royal chapel of Turin, the Holy Shroud is among the most venerated relics in all Christendom. Pilgrims flock to gaze upon it, bringing prestige and piety to the House of Savoy."

 abm_spi_royal_sardinian_army: "Royal Sardinian Army"
 abm_spi_royal_sardinian_army_desc: "The golden age of mercenaries has passed, and our army shall keep with the times. By implementing reforms to professionalize it, we can establish a standing army capable of projecting our power abroad in Italy and Europe as a whole."

 abm_spi_centralized_state: "Centralized State"
 abm_spi_centralized_state_desc: "By imitating the means and methods of the great powers of Europe in our own territories, we can forge Sardinia-Piedmont into powerhouse capable of dominating Italy and standing our ground on the European stage."

 abm_spi_piedmontese_manufacturing: "Piedmontese Manufacturing"
 abm_spi_piedmontese_manufacturing_desc: "Situated on the key trade route between Venice and France, there are many markets on which to sell our produce. By adopting the latest methods pioneered elsewhere, we can increase our production and bring plentiful riches to our lands."

 abm_spi_risorgimento: "The Risorgimento"
 abm_spi_risorgimento_desc: "Italy has not been united since the fall of Rome, but the idea of a united Italy has never died. Now, as the dream enjoys a resurgence, we have emerged as one of the main standard bearers of the Italian people's hopes and dreams."

 abm_spi_ideas_ambition: "Sardinian-Piedmontese Ambition"
 abm_spi_ideas_ambition_desc: "Sardinia-Piedmont shall rise to unite Italy and stand among the great powers of Europe."
