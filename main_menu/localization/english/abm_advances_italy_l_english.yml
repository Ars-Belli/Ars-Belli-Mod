l_english:

 # Italian unit unlock advances
 abm_venettian_stradioti: "Venetian Stradioti"
 abm_venettian_stradioti_desc: "Swift Balkan light cavalry in the service of the Serenissima. These mounted raiders excel in rough terrain — hills, mountains, marshlands, and coastal shores alike — outpacing and outflanking heavier foes."
 abm_italian_balestrieri: "Italian Balestrieri"
 abm_italian_balestrieri_desc: "Skilled crossbowmen drawn from Italian cities, adept at holding their ground in hills and mountains."
 abm_italian_stradioti: "Italian Stradioti"
 abm_italian_stradioti_desc: "Light cavalry recruited from Italian territories, swift and capable in difficult terrain."

 # PAP — Papal States
 abm_pap_ideas_tradition_1: "Papal Traditions"
 abm_pap_ideas_tradition_1_desc: "The Pope is the spiritual leader of all Catholic nations, giving weight to his diplomatic overtures."
 abm_pap_ideas_tradition_2: "Kingdom of God Traditions"
 abm_pap_ideas_tradition_2_desc: "The Pope is the spiritual leader of all Catholic nations, ensuring the faithful remain united."
 abm_ecclesiastical_primacy: "Ecclesiastical Primacy"
 abm_ecclesiastical_primacy_desc: "The Pope has the sovereign authority to establish religious canon and law in the Catholic church. The State shares a special relationship with those who conform with the Catholic authority."
 abm_papal_investiture_and_tithes: "Kingdom of God Investiture and Tithes"
 abm_papal_investiture_and_tithes_desc: "Into Rome flow the riches of Christian Europe."
 abm_glory_of_rome: "Glory of Rome"
 abm_glory_of_rome_desc: "We control the great city and the ancient capital of the Romans. We are the preservers of their marvelous tradition."
 abm_donation_of_constantine: "Donation of Constantine"
 abm_donation_of_constantine_desc: "The Donation of Constantine demonstrates our authority to bestow the title of the Emperor of the Romans upon whomsoever we choose. It may also prove that we're rather good at forging documents."
 abm_centralize_the_states: "Centralize the States"
 abm_centralize_the_states_desc: "We will consolidate our power in Papal provinces by seizing it from the local princes."
 abm_vatican_museums: "The Vatican Museums"
 abm_vatican_museums_desc: "Years of collecting and donations have made Vatican City the home of many museums. We've accumulated one of the most impressive art collections in history."
 abm_holy_father: "The Holy Father"
 abm_holy_father_desc: "Being the Vicar of God to Roman Catholics gives us a certain amount of political leeway. The Papal Bull, documents carrying the Pope's official seal, carry the weight of the very word of God. With these rulers have been cursed and entire continents divided."
 abm_pap_ideas_ambition: "Kingdom of God Ambition"
 abm_pap_ideas_ambition_desc: "The Papal States will stop at nothing to assert their authority over Christendom."

 # ABLOM — Latin/Italian
 abm_latin_ideas_tradition_1: "Lombard Tradition I"
 abm_latin_ideas_tradition_1_desc: "The city states of Italy have a proud mercantile and martial tradition."
 abm_latin_ideas_tradition_2: "Lombard Tradition II"
 abm_latin_ideas_tradition_2_desc: "The city states of Italy are the heart of the Catholic faith."
 abm_latin_renaissance: "Lombard Renaissance"
 abm_latin_renaissance_desc: "Italy is the birthplace of the Renaissance, in these lands the knowledge of the ancient world have been explored and its ideals reborn. Our philosophers, artists, authors and universities remain at the forefront of European scholarship."
 abm_latin_condottieri: "Lombard Condottieri"
 abm_latin_condottieri_desc: "The many wars of the Lombard city states have attracted a host of military contractors or Condottieri from far and near. Should we ever desire to go to war finding mercenary bands willing to fight for us will not be hard."
 abm_latin_aristocracy: "Lombard Aristocracy"
 abm_latin_aristocracy_desc: "Every inch of Lombard soil has been hotly contested for generations. Over the centuries the many claims of various noble houses have been meticulously documented, forged and fought over. Any foreign invader would have a very hard time making credible claims to these lands, much less actually integrating them and controlling the various parties within them."
 abm_latin_tracee_italienne: "Trace Italienne"
 abm_latin_tracee_italienne_desc: "The arrival of the cannon has changed the battlefields and sieges of Italy forever and our old medieval fortifications are no longer quite up to the task. Lombard engineers have recently pioneered a new style of fortresses with thick earthen ramparts and ditches. Instead of maintaining our outdated walls we should build such fortifications as they are more suited to modern warfare."
 abm_latin_high_renaissance: "High Renaissance Art & Architecture"
 abm_latin_high_renaissance_desc: "All of Christendom watches with envy as the Lombard courts overflow with some of the finest architects, artists and poets of our age. We must take care to extend our patronage wide enough that none of this talent has to be wasted on the barbarian courts outside of the peninsula."
 abm_latin_diplomacy: "Lombard Diplomacy"
 abm_latin_diplomacy_desc: "The Lombard city states have a long history of diplomatic relations and traditions. We would be wise to make use of this to further our international ambitions. The reputation and experience of our ambassadors will allow us to greatly expand our influence outside our borders."
 abm_latin_commedia_del_arte: "Commedia dell'arte"
 abm_latin_commedia_del_arte_desc: "A new form of improvisation theatre have become common in the Lombard lands. Various theatre companies have are traveling and performing on temporary stages with common people and nobility alike as their spectators. By sponsoring some of the better companies and ensuring that they perform during carnivals and other festivities we would undoubtedly earn the gratitude of our subjects."
 abm_latin_ideas_ambition: "Lombard Ambition"
 abm_latin_ideas_ambition_desc: "Lombardy will once again be the cultural and political heart of Europe."
