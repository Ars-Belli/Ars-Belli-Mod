#  # Genoa — Genoese Crossbowmen
#  genoese_crossbowmen: "Genoese Crossbowmen"
#  genoese_crossbowmen_desc: "The Republic of Genoa has long fielded the finest crossbowmen in Europe. Their disciplined companies, armed with Pavise shields and trained in mountain warfare, are the backbone of Genoese military power and will serve the Republic from the Renaissance through to the age of gunpowder."

 # Venice — Venettian Stradiots
 abm_venettian_stradioti: "Venetian Stradiots"
 abm_venettian_stradioti_desc: "Drawing upon the light cavalry traditions of the Balkans and the Eastern Mediterranean, the Venetian Republic fields swift and deadly Stradioti mercenaries. These mounted raiders excel at reconnaissance, harassment, and pursuing broken foes, and their descendants will serve the Serenissima well into the age of gunpowder."

 # Sardinia-Piedmont — SPI Ideas
 abm_spi_ideas_tradition_1: "Sardinian-Piedmontese Traditions I"
 abm_spi_ideas_tradition_1_desc: "Sardinian-Piedmontese Traditions"
 abm_spi_ideas_tradition_2: "Sardinian-Piedmontese Traditions II"
 abm_spi_ideas_tradition_2_desc: "Sardinian-Piedmontese Traditions"
 abm_spi_flexibility: "Diplomatic Flexibility"
 abm_spi_flexibility_desc: "Wedged in between stronger powers and under constant threat of falling too far under their influence, we have been forced to practice nimble diplomacy — some would say shameless opportunism — in order to safeguard our independence and find some new opening to advance our state. Though distasteful in the eyes of traditionalists, opportunism has its upsides."
 abm_spi_defensive_prowess: "Defensive Prowess"
 abm_spi_defensive_prowess_desc: "From the French in Savoy and Piedmont to the Spanish in Sardinia, our lands have long been tempting targets for our neighbors' expansionist ideals. In protecting our sovereignty through the years, we have honed our fortification techniques and mastered the art of defending a fortress."
 abm_spi_shroud_of_turin: "The Shroud of Turin"
 abm_spi_shroud_of_turin_desc: "The Holy Shroud, housed in Turin, draws pilgrims from across Christendom and lends divine prestige to our rule. Its presence elevates our court above those of rival princes."
 abm_spi_royal_sardinian_army: "Royal Sardinian Army"
 abm_spi_royal_sardinian_army_desc: "The golden age of mercenaries has passed, and our army shall keep with the times. By implementing reforms to professionalize it, we can establish a standing army capable of projecting our power abroad in Italy and Europe as a whole."
 abm_spi_centralized_state: "Centralized State"
 abm_spi_centralized_state_desc: "By imitating the means and methods of the great powers of Europe in our own territories, we can forge Sardinia-Piedmont into a powerhouse capable of dominating Italy and standing our ground on the European stage."
 abm_spi_piedmontese_manufacturing: "Piedmontese Manufacturing"
 abm_spi_piedmontese_manufacturing_desc: "Situated on the key trade route between Venice and France, there are many markets on which to sell our produce. By adopting the latest methods pioneered elsewhere, we can increase our production and bring plentiful riches to our lands."
 abm_spi_risorgimento: "The Risorgimento"
 abm_spi_risorgimento_desc: "Italy has not been united since the fall of Rome, but the idea of a united Italy has never died. Now, as the dream enjoys a resurgence, we have emerged as one of the main standard bearers of the Italian people's hopes and dreams."
 abm_spi_ideas_ambition: "Sardinian-Piedmontese Ambition"
 abm_spi_ideas_ambition_desc: "Sardinian-Piedmontese Ambition"

 # Latin culture group — Generic Italian Ideas
 abm_latin_ideas_tradition_1: "Italian Traditions I"
 abm_latin_ideas_tradition_1_desc: "Italian Traditions"
 abm_latin_ideas_tradition_2: "Italian Traditions II"
 abm_latin_ideas_tradition_2_desc: "Italian Traditions"
 abm_latin_renaissance: "Italian Renaissance"
 abm_latin_renaissance_desc: "Italy is the birthplace of the Renaissance, in these lands the knowledge of the ancient world have been explored and its ideals reborn. Our philosophers, artists, authors and universities remain at the forefront of European scholarship."
 abm_latin_condottieri: "Italian Condottieri"
 abm_latin_condottieri_desc: "The many wars of the Italian city states have attracted a host of military contractors or Condottieri from far and near. Should we ever desire to go to war finding mercenary bands willing to fight for us will not be hard."
 abm_latin_aristocracy: "Italian Aristocracy"
 abm_latin_aristocracy_desc: "Every inch of Italian soil has been hotly contested for generations. Over the centuries the many claims of various noble houses have been meticulously documented, forged and fought over. Any foreign invader would have a very hard time making credible claims to these lands, much less actually integrating them and controlling the various parties within them."
 abm_latin_tracee_italienne: "Trace Italienne"
 abm_latin_tracee_italienne_desc: "The arrival of the cannon has changed the battlefields and sieges of Italy forever and our old medieval fortifications are no longer quite up to the task. Italian engineers have recently pioneered a new style of fortresses with thick earthen ramparts and ditches. Instead of maintaining our outdated walls we should build such fortifications as they are more suited to modern warfare."
 abm_latin_high_renaissance: "High Renaissance Art & Architecture"
 abm_latin_high_renaissance_desc: "All of Christendom watches with envy as the Italian courts overflow with some of the finest architects, artists and poets of our age. We must take care to extend our patronage wide enough that none of this talent has to be wasted on the barbarian courts outside of the peninsula."
 abm_latin_diplomacy: "Italian Diplomacy"
 abm_latin_diplomacy_desc: "The Italian city states have a long history of diplomatic relations and traditions. We would be wise to make use of this to further our international ambitions. The reputation and experience of our ambassadors will allow us to greatly expand our influence outside our borders."
 abm_latin_commedia_del_arte: "Commedia dell'Arte"
 abm_latin_commedia_del_arte_desc: "A new form of improvisation theatre have become common in the Italian lands. Various theatre companies have are traveling and performing on temporary stages with common people and nobility alike as their spectators. By sponsoring some of the better companies and ensuring that they perform during carnivals and other festivities we would undoubtedly earn the gratitude of our subjects."
 abm_latin_ideas_ambition: "Italian Ambition"
 abm_latin_ideas_ambition_desc: "Italian Ambition"
