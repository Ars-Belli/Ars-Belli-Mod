 abm_btu_butuan_trade_connections: "Butuan Trade Connections"
 abm_btu_butuan_trade_connections_desc: "While it is true that foreign merchants have sought our ports for centuries, we also have a thriving merchant community of our own. Butuan traders are common throughout the Malay archipelago and some journey as far as Persia and Japan. Even as we promote ourselves as an entrepot for foreign traders we must also support our own entrepreneurs and captains so that we never have to live at the mercy of the wars and politics in faraway lands."

