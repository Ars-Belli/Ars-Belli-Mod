# Greek culture group advances imported from EU4 greek_ideas
# ============================================================

 abm_greek_ideas_tradition_1: "Greek Tradition I"
 abm_greek_ideas_tradition_1_desc: "The Aegean has been a Greek sea since before memory. Our shipwrights know every timber and current of it, and the galleys they build cost us less than they cost any rival who must import both the wood and the skill."

 abm_greek_ideas_tradition_2: "Greek Tradition II"
 abm_greek_ideas_tradition_2_desc: "An island people lives by the oar. Our sailors are raised to it, fed by it, and their upkeep weighs less on the treasury than any foreign fleet of the same size ever could."

 abm_greek_orthodox_faith: "Greek Orthodox Faith"
 abm_greek_orthodox_faith_desc: "The Greek Church stands as the oldest and most prestigious of all the orthodox churches and for centuries it has been the spiritual heart of the Greek people. As long as the faith is defended, the nation endures."

 abm_greek_maritime_heritage: "Maritime Heritage"
 abm_greek_maritime_heritage_desc: "For millennia the Greek people have traversed the Mediterranean, and while foreign powers came and went, the sea remained ours. Our captains carry that inheritance into every engagement."

 abm_greek_klephtic_irregulars: "Klephtic Recruitment"
 abm_greek_klephtic_irregulars_desc: "The arduous years of foreign occupation, both under the Franks and the Turks, taught our people to fight from the mountains and the passes. These klephts are irregulars, but they know the land better than any drilled army."

 abm_greek_phanariotes: "Greek Diaspora"
 abm_greek_phanariotes_desc: "Educated and resourceful men are always in demand, and many of our countrymen have risen high in foreign courts and chancelleries. They serve us still, and they cost us little."

 abm_greek_strengthen_control_over_the_trade_routes: "Control the Mediterranean Trade"
 abm_greek_strengthen_control_over_the_trade_routes_desc: "From Rome to Venice and later the Ottoman Empire, many have sought to command the trade of the eastern Mediterranean. We sit astride those routes by right of geography and inheritance, and we mean to keep them."

 abm_greek_philhellenism: "Philhellenism"
 abm_greek_philhellenism_desc: "Greece was once the cradle of Western civilization and our ancestors are still revered throughout Europe. Every court that reads Homer is a court that will listen to us, and every scholar who admires Athens is an advocate we did not have to pay."

 abm_greek_enlightenment: "Greek Enlightenment"
 abm_greek_enlightenment_desc: "Our ancestors were great thinkers, statesmen and philosophers, and their ideas remain stronger than any army. By reviving learning among our people we need not look abroad for the knowledge that will carry us forward."

 abm_greek_ideas_ambition: "Greek Ambition"
 abm_greek_ideas_ambition_desc: "The Megali Idea: to gather every Greek into one state, and to restore the Roman inheritance that Constantinople still promises. Nothing less than that will satisfy the nation."
