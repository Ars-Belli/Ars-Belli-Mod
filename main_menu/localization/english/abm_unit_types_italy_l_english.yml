l_english:

#  # Genoa — Genoese Crossbowmen Line (Light Infantry)
#  a_genoese_crossbowmen: "Genoese Crossbowmen"
#  a_genoese_crossbowmen_desc: "The famed Pavise crossbowmen of the Republic of Genoa. These disciplined companies wield heavy crossbows from behind portable shields, excelling in rugged terrain but struggling in marshland."
 a_abm_late_genoese_crossbowmen: "Late Genoese Crossbowmen"
 a_abm_late_genoese_crossbowmen_desc: "Veteran Genoese crossbowmen adapting to the changing face of warfare, their shields and tactics refined by decades of mercenary service across Europe."
 a_abm_genoese_arquebusiers: "Genoese Arquebusiers"
 a_abm_genoese_arquebusiers_desc: "The Genoese embrace gunpowder while retaining their distinctive Pavise shields, bringing disciplined volley fire to the field with the same tenacity as their crossbow forebears."
 a_abm_genoese_musketeers: "Genoese Musketeers"
 a_abm_genoese_musketeers_desc: "Hardened by centuries of mercenary tradition, these Genoese musketeers combine firepower with the defensive expertise of their ancestors, masters of hill and mountain combat."
 a_abm_genoese_riflemen: "Genoese Riflemen"
 a_abm_genoese_riflemen_desc: "The pinnacle of Genoa's military tradition — elite riflemen carrying the legacy of the Pavise crossbowmen into the modern era, swift and deadly in rough terrain."

 # Italy — Balestrieri (Generic Italian Crossbowmen)
 a_abm_balestrieri: "Balestrieri"
 a_abm_balestrieri_desc: "Italian crossbowmen drawn from the rich mercenary traditions of the peninsula. While lacking the famed Pavise shields of their Genoese rivals, they are nonetheless reliable skirmishers well-suited to hilly terrain."
 a_abm_late_balestrieri: "Late Balestrieri"
 a_abm_late_balestrieri_desc: "Seasoned Italian crossbowmen whose experience in the constant wars of the peninsula has honed their skills to a fine edge. Lethal in broken ground but vulnerable in open marshland."

 # Venice — Venettian Stradioti (Light Cavalry)
 a_abm_venettian_stradioti: "Venetian Stradioti"
 a_abm_venettian_stradioti_desc: "Swift Balkan light cavalry in the service of the Serenissima. These mounted raiders excel in rough terrain — hills, mountains, marshlands, and coastal shores alike — outpacing and outflanking heavier foes."
 a_abm_late_venettian_stradioti: "Late Venetian Stradioti"
 a_abm_late_venettian_stradioti_desc: "Battle-hardened Stradioti whose reputation for speed and ferocity has grown with each campaign. Their mastery of difficult terrain makes them indispensable to the Venetian war machine."
 a_abm_venettian_cappelletti: "Venetian Cappelletti"
 a_abm_venettian_cappelletti_desc: "Mounted skirmishers continuing the proud Stradiot tradition. Armed with carbines and sabers, they harass enemy lines and exploit gaps with the same ruthless efficiency as their forebears."
 a_abm_venettian_cravates: "Venetian Cravates"
 a_abm_venettian_cravates_desc: "Elite light cavalry of the Venetian Republic, descended from Croatian horsemen in Venetian pay. Fast, fierce, and utterly at home in broken terrain."
 a_abm_venettian_dragoons: "Venetian Dragoons"
 a_abm_venettian_dragoons_desc: "The finest light cavalry in Venetian service — mounted riflemen who combine the speed of Stradioti with the firepower of modern dragoons, masters of every terrain from mountain passes to coastal plains."

 # Italy — Generic Italian Stradioti (Light Cavalry)
 a_abm_italian_stradioti: "Italian Stradioti"
 a_abm_italian_stradioti_desc: "Light cavalry mercenaries recruited from Balkan refugees and adventurers, now serving the warring states of Italy. Swift raiders and scouts, though lacking the elite training of their Venetian counterparts."
 a_abm_late_italian_stradioti: "Late Italian Stradioti"
 a_abm_late_italian_stradioti_desc: "Veteran Italian Stradioti hardened by endless campaigning. Their speed and familiarity with difficult ground make them valuable assets to any Italian prince."
 a_abm_italian_cappelletti: "Italian Cappelletti"
 a_abm_italian_cappelletti_desc: "Mounted skirmishers carrying the Stradiot tradition forward for the Italian states. Swift and elusive in rough terrain, they strike where the enemy is weakest."
