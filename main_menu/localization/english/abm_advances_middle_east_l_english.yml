#  abm_ldk_fortified_mountain_cities: "Fortified Mountain Cities"
#  abm_ldk_fortified_mountain_cities_desc: "Our country has seen enemies come and go. From the Great Tibetan Empire to the great Karkota Kingdom of Kashmir under Lalitaditya to the Islamic raiders that now haunt us. The mountains that are our home, however, are also our castles. Let us further fortify the natural defenses that we have and never fear an invader or raider again."
