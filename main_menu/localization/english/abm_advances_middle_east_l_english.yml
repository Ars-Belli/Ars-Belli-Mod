 abm_buk_ideas_tradition_1: "Bukharan Traditions I"
 abm_buk_ideas_tradition_1_desc: "Bukharan Traditions I"
 abm_buk_ideas_tradition_2: "Bukharan Traditions II"
 abm_buk_ideas_tradition_2_desc: "Bukharan Traditions II"
 abm_buk_jochid_patrimony: "Jochid Patrimony"
 abm_buk_jochid_patrimony_desc: "The Shaybanid rulers of Bukhara were all descended from Shayban, fifth son of Jochi, the eldest son of Genghis Khan himself. After the extinction of the lines of both Batu Khan and Orda Khan in the 13th century, the Shaybanid Khans declared themselves the sole legitimate heirs of all the Jochid lands, which have hence been occupied by the Timurid pretenders."
 abm_buk_naqshbandi_patronage: "Naqshbandi Patronage"
 abm_buk_naqshbandi_patronage_desc: "Bukhara was the birthplace of both Baha-ud-Din Naqshband Bukhari and the eponymous Naqshbandi Order of Sufis that he is credited as the founder of. Following his death, the rulers of Bukhara built an elaborate necropolis complex for Baha-ud-Din, who is seen as their spiritual patron, and continue to support a mosque and madrasa on the grounds. The Naqshbandi quickly grew to be one of the largest and most influential Sufi orders, becoming the dominant Sufi sect in Central Asia, China, and India, which makes the tomb of their founding saint a popular pilgrimage site."
 abm_buk_mahalla_schools: "Mahalla Schools"
 abm_buk_mahalla_schools_desc: "Similar to the Christian parish, a mahalla is an administrative division structured around a Mosque and the community it serves. The Shaybanid Khans of Bukhara used the already existing infrastructure of urban mahallas to establish public schools for educating the children of commoners. Those who show promise are further educated at madrasas in a full curriculum of Persian poetry and literature, music, arithmetic, logic, theology, fiqh, and science. Expanding literacy can only lead to an enormous growth in scholarly output."
 abm_buk_the_jews_of_bukhara: "The Jews of Bukhara"
 abm_buk_the_jews_of_bukhara_desc: "Home to a sizeable Persian-speaking Jewish population since at least the 5th century, Bukhara and Samarkand host a vibrant community of Jewish traders and artisans that have thrived in their position along the main branch of the Silk Road. They play an integral role in Bukhara and Samarkand's trade and commerce, loosening prohibitions on the Dhimmi and allowing them to build their own synagogues and trade without onerous restrictions would only serve to help us prosper."
 abm_buk_the_ark: "The Ark"
 abm_buk_the_ark_desc: "Part fortress, part palace, part town in its own right, the Ark of Bukhara is a massive citadel at the edge of the city. Legend holds that it was constructed by Siyavash, one of the legendary heroes of the Persian epic poem Shahnameh, the Book of Kings. Under its walls lay a foundation of stone twenty meters deep, the ruins of previous walls that failed to withstand the ardours of conquest. Within its walls there is a large complex of buildings, including a library that is the envy of all Persianate scholars, at one point hosting the likes of Rudaki, Ferdowsi, Avicenna, Farabi, and Khayyam."
 abm_buk_the_tower_of_death: "The Tower of Death"
 abm_buk_the_tower_of_death_desc: "The towering minaret of the Po-i-Kalyan mosque was spared from the same distruction the original mosque faced at the hands of Genghis Khan due to its impressive stature. While new mosques have been built around it, it has became known as the Tower of Death due to its use as an instrument of execution. While it is primarily used to issue the call to prayer, and occasionally as a watchtower for the nearby citadel, it also serves as a constant towering reminder of the Khan's unflinching justice."
 abm_buk_sahih_al_bukhari: "Sahih al-Bukhari"
 abm_buk_sahih_al_bukhari_desc: "Composed by the noted scholar and jurist Imam Muhammad al-Bukhari, it is thought to be among the most authoritative transcriptions of the Hadiths, the sayings and doings of the Prophet Muhammad and his companions which serve as the basis for Islamic law. The Imam and his works have been claimed by various madhabs, most vocally the Hanbalis, but he can only be truly claimed by Bukhara."
 abm_buk_ideas_ambition: "Bukharan Ambition"
 abm_buk_ideas_ambition_desc: "Bukharan Ambition"
 abm_kho_ideas_tradition_1: "Khorasani Traditions I"
 abm_kho_ideas_tradition_1_desc: "Khorasani Traditions I"
 abm_kho_ideas_tradition_2: "Khorasani Traditions II"
 abm_kho_ideas_tradition_2_desc: "Khorasani Traditions II"
 abm_kho_land_of_the_rising_sun: "Land of the Rising Sun"
 abm_kho_land_of_the_rising_sun_desc: "With large deserts, high mountains and large tribal communities, Khorasan might seem like an inhospitable place. Yet it is here, at the crossroads of Central Asia, Iran and India that many empires have chosen to base their capitals. Under Shah Rukh the region has prospered in relative stability, and from the markets of Herat to the shrines of Mashhad we have built a reputation as the home of both great scholars, and thriving cities."
 abm_kho_rein_in_the_turko_mongol_emirs: "Rein in the Turko-Mongol Emirs"
 abm_kho_rein_in_the_turko_mongol_emirs_desc: "The majority of our armies are still made up of the tribesmen that Timur brought with him to this region. By organizing these troops in a more centralized manner than his predecessor, Timur strengthened his military power but he also made these Turko-Mongol emirs very powerful men in their own right. Where he was able to command their loyalty through personal gratitude and marriages we need to win their support in more long term ways."
 abm_kho_princely_appanages: "Princely Appanages"
 abm_kho_princely_appanages_desc: "A realm as diverse and geographically divided as Khorasan can be hard to hold together. Often provincial governors will have to act quickly and with little chance to ask the center for instruction. It is essential that we have governors that we can trust both in terms of loyalty and ability.\nThe Timurid and Genghisid practice of putting the princes of the dynasty in such positions would likely serve us well. Every governor will be motivated to do the most of his position if he has hope to inherit the throne himself."
 abm_kho_dynastic_chronicles: "Dynastic Chronicles"
 abm_kho_dynastic_chronicles_desc: "Khorasan has a long history as a center of scholarly learning, and our hold over this land is new and untested. Let us fund the great scribes of the age, allowing them to compose the greatest chronicles of our age, firmly establishing our house as the leading dynasty of Eastern Persia."
 abm_kho_irrigation_network: "Irrigation Canals"
 abm_kho_irrigation_network_desc: "Agriculture comes at great cost in Khorasan, the land is dry and there are no major rivers to speak of. Our Persian administrators are suggesting that if our cities are to reach their full potential we will have to invest in a great number of irrigation works and canals. With enough water even the rarest fruits can be grown from Herat to Mashhad and we can build gardens to the envy of all of Asia."
 abm_kho_great_sheiks_of_khorasan: "Great Sheiks of Khorasan"
 abm_kho_great_sheiks_of_khorasan_desc: "These lands are home to many Sufi shrines, orders and their lineages. The great Sheiks often take an active part in the social and political life in our society, and their influence stretches far from our borders. Even the faraway rulers of India patronizes Khorasani Sheiks of the Chisti or Naqshbandi Sufis, and Great Sultans send letters hoping to lure our wise sages to their courts."
 abm_kho_protect_the_caravan_routes: "Protect the Caravan Routes"
 abm_kho_protect_the_caravan_routes_desc: "Between the Oxus, India and Iran, Khorasan is a region of great importance for long range commerce. The Silk Road passes through, connecting Samarkand with Iran and the Mediterranean, and is joined in Herat by the Grand Trunk Road from India.\nThis long journey is a perilous and arduous one for many merchants however. By vowing to protect all merchants passing through our lands, and constructing regular caravanserais along the trade routes, we can greatly limit the risks and likely attract even more wealth to our great cities"
 abm_kho_ideas_ambition: "Khorasani Ambition"
 abm_kho_ideas_ambition_desc: "Khorasani Ambition"
 abm_kaz_ideas_tradition_1: "Kazani Traditions I"
 abm_kaz_ideas_tradition_1_desc: "Kazani Traditions I"
 abm_kaz_ideas_tradition_2: "Kazani Traditions II"
 abm_kaz_ideas_tradition_2_desc: "Kazani Traditions II"
 abm_kaz_idea_1: "Steppe Tolerance"
 abm_kaz_idea_1_desc: "The steppe is so large, that we cannot hear the prayers of heathens."
 abm_kaz_idea_2: "Tribal Legacy"
 abm_kaz_idea_2_desc: "In the sea of grass concepts of legitimacy and justification of conquest become irrelevant. In the steppe bad news don't travel at all as nobody hears the screams of the vanquished."
 abm_kaz_idea_3: "Warrior Society"
 abm_kaz_idea_3_desc: "A man is man, and a woman is woman, only as long as they can ride and fight. In the steppe everyone is a warrior, because only the toughest survive. The steppe does not forgive."
 abm_kaz_idea_4: "Legacy of the Great Horde"
 abm_kaz_idea_4_desc: "Oral tradition is the basis of our society. A long time ago, our elders say, a young boy rose from nothing to become the Khan of Khans and conquered the whole world in the mere blink of a lifetime. The world still trembles from his name and it shall learn to fear the steppes once again."
 abm_kaz_idea_5: "Steppe Warfare"
 abm_kaz_idea_5_desc: "Since the dawn of time, when our forefathers knew nothing of the one God and his Prophet, steppe warfare revolved around one thing: unity of a horse and a man. In the steppe they become one, a single life, and a single fighting force. No army has ever managed to beat the steppe hit and run tactics, even the mighty Iskender fell before us."
 abm_kaz_idea_6: "Settle Down"
 abm_kaz_idea_6_desc: "Time has come to abandon our nomadic life style and settle down like the Westerners do. We shall build mighty walls that will never fall."
 abm_kaz_idea_7: "End Western Domination"
 abm_kaz_idea_7_desc: "For the very long time our tribes have traded with Russian and Western merchants, letting these foreigners take most profits. Now the time has come for us to claim our own presence in the great Western and Eastern centers of trade!"
 abm_kaz_ideas_ambition: "Kazani Ambition"
 abm_kaz_ideas_ambition_desc: "Kazani Ambition"
 abm_cri_ideas_tradition_1: "Crimean Traditions I"
 abm_cri_ideas_tradition_1_desc: "Crimean Traditions I"
 abm_cri_ideas_tradition_2: "Crimean Traditions II"
 abm_cri_ideas_tradition_2_desc: "Crimean Traditions II"
 abm_cri_genghisid_legacy: "Genghisid Legacy"
 abm_cri_genghisid_legacy_desc: "Our forefathers rode with Genghis Khan as he ravaged the known world. We have kept our military traditions alive and continued to be ruled by Khans who claim descent from the Genghisid line."
 abm_cri_slavers: "Slavers of the Steppe"
 abm_cri_slavers_desc: "There is a fortune to be made from the slave trade; unwitting Christians who fall into our grasp fetch a high price in Turkish, Arabian, and Persian markets."
 abm_cri_ruthenian_raids: "Lead Raids into Ruthenia"
 abm_cri_ruthenian_raids_desc: "We must continue to lead raids into the heart of Ruthenia. Though the region is more destitute than it was in the time of Genghis Khan, we are skilled at extracting plunder and tribute from the terrified villagers."
 abm_cri_free_cattle_grazing: "Free Cattle Grazing"
 abm_cri_free_cattle_grazing_desc: "We place no restrictions on pastoral farmers for the grazing of their great herds of horses and cattle. Herders are free to go about their business as they wish, able to traverse the steppe safely and trade freely."
 abm_cri_allow_nogai_protectorates: "Accept Nogai Protectorates"
 abm_cri_allow_nogai_protectorates_desc: "Several of the Nogai tribes to the west seek our protection. We should take them under our wing, guaranteeing the safety of their people in exchange for their military service."
 abm_cri_ideas_ambition: "Crimean Ambition"
 abm_cri_ideas_ambition_desc: "Crimean Ambition"
 abm_khi_ideas_tradition_1: "Khivan Traditions I"
 abm_khi_ideas_tradition_1_desc: "Khivan Traditions I"
 abm_khi_ideas_tradition_2: "Khivan Traditions II"
 abm_khi_ideas_tradition_2_desc: "Khivan Traditions II"
 abm_horde_legacy: "Horde Legacy"
 abm_horde_legacy_desc: "There is a long tradition on the steppes of fighting from the horseback. Children are put in the saddle before they can walk and the horse can almost seem to be a part of them. By preserving these ancient traditions we ensure that our armies are lead by men who understand the use of the Turkoman horse in combat."
 abm_deserts_of_khiva: "Deserts of Khiva"
 abm_deserts_of_khiva_desc: "According to the legends of our forefathers Khiva was founded by Shem the son of the prophet Noah as he dug a well in the middle of the desert. The people who drank the water of that well shouted 'Kheyvak', sweet water. Without this water either the extreme heat during the days or the extreme cold of the Khivan nights will claim the lives of anyone in this area."
 abm_oasis_of_merv: "Oasis of Merv"
 abm_oasis_of_merv_desc: "The oasis of Merv is strategically situated in the Karakum desert and for centuries it has formed an essential military headquarter and a stop along the Silk Road. We must strive to control and maintain this oasis well in order to make use of it as our forefathers have."
 abm_djuma_mosque: "Djuma Mosque"
 abm_djuma_mosque_desc: "The 'Friday Mosque' of Khiva has no equivalent in Central Asia with its flat ceiling and more than two hundred columns. These columns are decorated with the best patterns of Khwarezm carving taken away from the old capital at the bottom of the Amu Darya."
 abm_amu_darya: "Amu Darya"
 abm_amu_darya_desc: "You know you are getting closer to Khiva when you cross the legendary Amu Darya river. Located at the crossing of the Vakhsh and Panj rivers, this major river flows across the deserts of Khiva and into the Aral Sea. With the discovery of gold on its banks, the Amu Darya might attract unwanted expeditions to our lands."
 abm_ichan_qala: "Ichan Qal'a"
 abm_ichan_qala_desc: "Also known as the internal fortress of Khiva, the Ichan Qal'a was the last resting-place of caravans before crossing the desert to Persia. It has been built according to our ancient traditions of town building, a sublime example of the Muslim architecture of these lands."
 abm_great_powers_diplomacy: "Great Power Diplomacy"
 abm_great_powers_diplomacy_desc: "With each passing day the Russian bear to our North, the British lion to our East and the Persian cat to our South are reaching for our borders. To guarantee our independence from these great powers we need to finds allies and a way to play our enemies against each other."
 abm_khi_ideas_ambition: "Khivan Ambition"
 abm_khi_ideas_ambition_desc: "Khivan Ambition"
 abm_trs_ideas_tradition_1: "Transoxianian Traditions I"
 abm_trs_ideas_tradition_1_desc: "Transoxianian Traditions I"
 abm_trs_ideas_tradition_2: "Transoxianian Traditions II"
 abm_trs_ideas_tradition_2_desc: "Transoxianian Traditions II"
 abm_trs_mawarannahr: "Mawarannahr, the land Beyond the River"
 abm_trs_mawarannahr_desc: "Transoxiana, the land beyond the Amu Darya, or Oxus, has been known since the days of the great Iskandar of Macedon as the end of Persian culture. Our lands are where Iran ends and Turan starts, a realm of great cities, but also dominated by Turko-Mongol tribes.\nIn more recent times Transoxiana was the starting point for Timur Lenk's Empire and it remains the base for many of the clans that supported his bid for power. As Timur has shown we could do great things as long as we keep them united."
 abm_trs_threshold_of_paradise: "Threshold of Paradise"
 abm_trs_threshold_of_paradise_desc: "While he was far from the first conqueror to come to Transoxiana, Timur made the region the center of his Empire and he brought treasures, artists, builders and artisans from the entire world to his great capital in Samarkand. We must strive to uphold this legacy, and continue to embellish this foremost jewel among cities. From the courts in Castile to the palaces in Beijing everyone shall covet the gilded city on the Silk Road."
 abm_trs_adept_diplomacy: "Adept Diplomacy"
 abm_trs_adept_diplomacy_desc: "Through education and training our rulers acquire the virtues of great kingship, but there is no school that will teach how to survive in the political climate of Transoxiana. Ever since the days of Timur, young princes, uncles and cousins have plotted against one another for the right to rule this region. When one of our princes reach adulthood and manages to take on the reins of power, we can be sure that they are, if nothing else, quite adept at espionage and politics.\nIf our realm is to ever be free of this poisonous atmosphere we must put an end to such infighting, striving to outsmart the lesser scions of the family once and for all."
 abm_trs_turkoman_cannoneers: "Turkoman Cannoneers"
 abm_trs_turkoman_cannoneers_desc: "While it is going to be a long while from determining any battles in the open lands of Transoxiana, gunpowder promises to change warfare to its very foundation. Turkic cannoneers have already made a name for themselves in India and Iran. The time has come to make sure these talented men of war never leave our lands. Let us put the most skilled gunsmiths to work and create the greatest artillery arm in Central Asia."
 abm_trs_scientific_patronage: "Scientific Patronage"
 abm_trs_scientific_patronage_desc: "Our realm his home to some of the greatest minds of this era. Great thinkers, philosophers, writers, artists and astronomers. If we are to truly benefit from their brilliance, however, we must dare give them the tools to aim higher. Let us build great works and buildings in the name of science. We will provide astronomical observatories, libraries and all patronage aspiring minds might require.\n\n'Religions rise and fall, empires crumble into dust, but the works of science are for all time.'"
 abm_trs_entrepot_of_the_silk_road: "Entrepôt of the Silk Road"
 abm_trs_entrepot_of_the_silk_road_desc: "While many places benefit from being transit points for the Silk Road, we are are the center of one of its greatest Entrepôts. From east to west traders know of the reputation of Bukhara and Samarkand, and are willing to cross the deserts of the Tarim Basin and Iran or the great steppes to the north, to be able to sell their wares here, bringing home our silk, paper and whichever exotic goods they can find here to their homelands.\nOur wealth depends on keeping the peace. Without Timur, and Genghis Khan before him, many find this too dangerous to undertake. We must endeavor to protect all traders in our lands and negotiate right of passage for any long distance traders that seek our markets."
 abm_chagatai_literature: "Chagatai Literature"
 abm_chagatai_literature_desc: "The Chagatai language of the eastern steppes is far more worthy to be the carrier of the thoughts and ideas of our great lineage than Persian or Arabic ever could be. We must promote the use of our ancestral language and create a new Timurid literary tradition."
 abm_trs_ideas_ambition: "Transoxianian Ambition"
 abm_trs_ideas_ambition_desc: "Transoxianian Ambition"
 abm_kas_ideas_tradition_1: "Yarkandi Traditions I"
 abm_kas_ideas_tradition_1_desc: "Yarkandi Traditions I"
 abm_kas_ideas_tradition_2: "Yarkandi Traditions II"
 abm_kas_ideas_tradition_2_desc: "Yarkandi Traditions II"
 abm_kas_northern_silk_road: "Northern Silk Road"
 abm_kas_northern_silk_road_desc: "For as long as anyone can remember streams of goods have traveled through the Tarim Basin, from oasis city to oasis city, tying together the vast economic sphere of East Asia and China with that of Transoxiana and Persia. Silk, spices, cotton, carpets, tobacco and many other goods that pass our lands eventually reach the courts of Europe or the palaces of the Chinese emperors. We must keep these traders safe at all costs as we would be nothing without them, and their journey is both dangerous and arduous."
 abm_kas_altishahr: "Altishahr"
 abm_kas_altishahr_desc: "The Taklamakan may be inhospitable, but our cities thrive around the oasis along its border as well as by the Tarim river. Life may not be as easy up here as in the lowlands of India or China, but wheat, corn and cotton grow well enough. The names that describe our region, High Tartary, Altishahr, Kashgaria or Xinjiang evoke images of legendary beauty and good life among those that know them."
 abm_kas_tarikh_i_rashidi: "Tarikh-i-Rashidi"
 abm_kas_tarikh_i_rashidi_desc: "Our culture is urban yet our isolation in the far reaches of the world means that few have heard of our history or language. Let us endeavor to write down the history of our people and our cities so that the world may learn of life here in one of the more remote, yet centrally important corners of the world."
 abm_kas_empower_the_khojas: "Empower the Khojas"
 abm_kas_empower_the_khojas_desc: "Among the most revered members of our society are the Khojas, devout men descended from the Prophet or the first four Caliphs. Tales tell of Khojas inspiring the conversion of great Mongol lords and Lamas bending the knee to Islamic power. We have always made the most devote of our kind our rulers, and therefore the Khojas are already influential players in our state. Let us empower them further and see how far their abilities and pure faith can take us."
 abm_kas_holy_warriors: "Holy Warriors"
 abm_kas_holy_warriors_desc: "While we have always welcomed traders of all faiths and cultures, we must never forget that our military strength comes from the purity of our faith. Let us expand into our surrounding regions both to spread the true faith and to acquire regions that would make our homeland easier to defend."
 abm_kas_black_and_white_mountain: "Black Mountain and White Mountain"
 abm_kas_black_and_white_mountain_desc: "We must not let petty rivalries divide our state! For too long have our people been divided between the Aqtaglikh, people of the White Mountain, and the Qarataghlik, people of the Black Mountain. If we can unite Black and White, north and south, our country will stand strong once again."
 abm_kas_encourage_tarim_trade: "Encourage Tarim Trade"
 abm_kas_encourage_tarim_trade_desc: "For centuries, even millennia, traders have braved the perilous journey to reach our desert cities. Be it via the Taklamakan, the Apricot Road of Baltistan or the glaciers of Ladakh, they have all eventually arrived in Yarkand, Kashgar or any of our other great cities. Times change, however, and the steady stream of traders is waning, since with the opening of maritime routes from east to west many no longer feel the long land journey to be worth it. Let us act decisively to protect the overland trade by abolishing any direct taxes or fees."
 abm_kas_ideas_ambition: "Yarkandi Ambition"
 abm_kas_ideas_ambition_desc: "Yarkandi Ambition"
 abm_ilk_ideas_tradition_1: "Ilkhanid Traditions I"
 abm_ilk_ideas_tradition_1_desc: "Ilkhanid Traditions I"
 abm_ilk_ideas_tradition_2: "Ilkhanid Traditions II"
 abm_ilk_ideas_tradition_2_desc: "Ilkhanid Traditions II"
 abm_ilk_restored_ilkhanate: "Restored Ilkhanate"
 abm_ilk_restored_ilkhanate_desc: "The Ilkhanate was originally established to secure Mongol rule over Persia in 1256. Many who have sought to rule Persia since have sought legitimacy by claiming descent from Genghis Khan, but our nation is a true revival of the first Ilkhanate. None can question our right to rule."
 abm_ilk_favor_sufism: "Favor Sufism"
 abm_ilk_favor_sufism_desc: "When our ancestors converted to Islam, they preferred the mystical teachings of Sufi scholars to the sectarian politics of the conventional Ulema. We should invite such scholars to court and promote a tolerant policy towards all Muslims in our realm."
 abm_ilk_persian_language_at_court: "Persian Language at Court"
 abm_ilk_persian_language_at_court_desc: "Promoting a single language for use at court and within the state bureaucracy has clear advantages. Many of our elites have already adopted Persian as a second language, recognizing it as a prestigious and generally understood tongue throughout the Muslim world."
 abm_ilk_yam_networks: "The Yam"
 abm_ilk_yam_networks_desc: "Genghis Khan established a system of relay stations, supply networks, and intelligence gathering to be employed across the Mongol Empire to ease the burdens of governing an empire spanning thousands of miles across. We should restore the Yam so that our armies and envoys can travel efficiently through the realm."
 abm_ilk_mongol_peace: "Mongol Peace"
 abm_ilk_mongol_peace_desc: "Those who submit willingly to the Ilkhan can be sure that they will enjoy his protection. As word spreads of our benevolent and tolerant rule, resistance to our conquests will surely subside."
 abm_ilk_patronize_observatories: "Patronize Observatories"
 abm_ilk_patronize_observatories_desc: "The first incarnation of the Ilkhanate heavily patronized the study of the heavens, funding observatories and inviting renowned astronomers to court. We should emulate our forebears' love of the sciences by restoring the old observatories."
 abm_ilk_recruit_turkoman_gunners: "Recruit Turkoman Gunners"
 abm_ilk_recruit_turkoman_gunners_desc: "It would be foolish to ignore the services offered by the Turkoman soldiers who have begun to settle in our realm. Handheld firearms are the future of warfare, and these Turkomans have mastered that art."
 abm_ilk_ideas_ambition: "Ilkhanid Ambition"
 abm_ilk_ideas_ambition_desc: "Ilkhanid Ambition"
 abm_frs_ideas_tradition_1: "Farsi Traditions I"
 abm_frs_ideas_tradition_1_desc: "Farsi Traditions I"
 abm_frs_ideas_tradition_2: "Farsi Traditions II"
 abm_frs_ideas_tradition_2_desc: "Farsi Traditions II"
 abm_frs_land_of_the_persians: "Land of the Persians"
 abm_frs_land_of_the_persians_desc: "In many countries Persia and Persians, derived from Fars and Farsis, are the names used to refer to all of Iran. So important has our impact on the culture and economy of this region been. From the foothills of the Zagros mountains to the coasts of the Persian Gulf, the lands of Fars harbors some of the oldest and most famous cities of Iranians and Iranian culture."
 abm_frs_center_of_religion_and_philosophy: "Center of Religion and Philosophy"
 abm_frs_center_of_religion_and_philosophy_desc: "For centuries Fars and Shiraz has been a vibrant center of philosophy, theology and culture, attracting the great thinkers of its age from all over the Persianate and Islamic world. We must not squander this heritage, let us continue to patronize the arts, literature and theology so that we can continue to shine as the brightest jewel in Persia."
 abm_frs_diplomatic_prudence: "Diplomatic Prudence"
 abm_frs_diplomatic_prudence_desc: "Where other regions have been quick to support new rising conquerors, or quick to surrender with armies outside of their walls, Fars has often favored a more careful and balanced approach. The key to survival in a dangerous world is not to surrender as soon as we are threatened, but it is also not to go looking for a fight that we don’t yet know who will win. As new claimants to supremacy in Persia come and go we will carefully consider our options. Our people will be here long after any newcomers are gone, regardless of if they win or lose their petty conflicts."
 abm_frs_shirazi_wine: "Expand the Wine Production"
 abm_frs_shirazi_wine_desc: "Legend has it that it was in Persia wine was once discovered. A girl, having lost the favor of king Jamshid, drank the fermented grape juice in order to end her life. Instead she found the secret of wine and in little time it spread from the royal court.\nWine has been produced and consumed in Persia for millennia, but none can compete with those made from the excellent grapes cultivated on the terraced slopes of the Zagros mountains in Fars. The reputation of Shirazi wine has spread far beyond the borders and is greatly in demand even in India and Europe.\nWe must expand our irrigation system and do what we can to increase our wine production, while marketing our highly sought after goods on foreign markets."
 abm_frs_shirazi_school: "Shirazi School"
 abm_frs_shirazi_school_desc: "As a center of learning it is perhaps no wonder that the workshops of Fars have risen to fame for the great output of books and miniature paintings. Famous master painters and bookmakers have always settled in our cities and enjoyed our protection.\nThe Shirazi school can only blossom with lavish support to create more books, however, and that is something we must provide if we are not to be overshadowed by Indian or Azerbaijani bookbinders and painters."
 abm_frs_integrate_the_qashqai: "Integrate the Qashqai"
 abm_frs_integrate_the_qashqai_desc: "While Fars is home to many sedentary Persians, and great cities and industries, it is also populated by large groups of nomadic tribesmen. The Qashqai and other groups have often been at odds with the city dwellers, leading to expensive conflicts between the two that does not benefit the realm.\nWe must integrate the Qashqai and give them place in our cities while guaranteeing their rights to use land for grazing. In return we ask that our ruler will be consulted for the appointment of new Ilkhans, their traditional leaders."
 abm_frs_capital_for_an_empire: "A Capital for an Empire"
 abm_frs_capital_for_an_empire_desc: "With its close proximity to the gulf trade routes, its great importance to Persian culture and its relative safety from the enemies of our people, Fars is an ideal place from which to rule a Persian state. Let us take inspiration from the great Empires before us and create a capital worthy to this name. We must expand and renovate every part of the capital, building new canals for irrigation, public baths, bazaars, city walls, squares, palaces, mosques, madrassahs and gardens.\nAll who wish should be allowed space to settle here for this will be the greatest capital man has ever seen!"
 abm_frs_ideas_ambition: "Farsi Ambition"
 abm_frs_ideas_ambition_desc: "Farsi Ambition"
 abm_lri_ideas_tradition_1: "Lur Traditions I"
 abm_lri_ideas_tradition_1_desc: "Lur Traditions I"
 abm_lri_ideas_tradition_2: "Lur Traditions II"
 abm_lri_ideas_tradition_2_desc: "Lur Traditions II"
 abm_lri_kingdom_in_the_zagros_mountains: "Kingdom in the Zagros Mountains"
 abm_lri_kingdom_in_the_zagros_mountains_desc: "The Luri people of our state inhabit a region that many would find inhospitable. In fact the Zagros mountains have been seen as a barrier between Iran and Mesopotamia for centuries. This does not bother us as most of our people are used to a nomadic life however, moving their sheep across the slopes and passes as they please."
 abm_lri_jadda_ye_atabak: "Jadda-ye Atabak"
 abm_lri_jadda_ye_atabak_desc: "When the Kingdom of Malamir ruled this region they used their power to cut a great road out of the mountains, greatly improving the ease of which trade could be conducted across the Zagros while also getting their own cut for the upkeep.\nToday the Kingdom of Malamir is no longer, as Shah Rukh crushed it in the 1420’s, but the road remains. We must learn of the Atabaks and not let their road go to waste. By continuing to ensure its upkeep we ensure that we can provide a valuable service to our neighbors and that we will never go without money."
 abm_lri_haven_for_dissenters: "A Haven for Dissenters"
 abm_lri_haven_for_dissenters_desc: "The nomadic life of most of our subjects can be enticing to some. There are many groups, both nomadic and sedentary, for which there is no longer room in the vast plains of Mesopotamia or the valleys of Iran. People who have found themselves on the losing side of wars, who have been cleared away to make way for irrigation or who have been deemed to unruly to remain when central power was expanded.\nWe should open our arms to these people and allow them to settle as new tribes in our mountains. Nobody will be as determined to defend their new homes such as those who have lost everything"
 abm_lri_popular_religion: "Popular Religion"
 abm_lri_popular_religion_desc: "While we know all among our people are good Muslims it is not always clear that the learned sages of the plains would agree with that assessment. Few here speak or read Arabic and many live in relative isolation from the outside world. Between our veneration of local shrines, the emamzadas (descendants of the Imams) and the prevalence of syncretic sects such as Yarsanism, would like strike the most learned of the Ulema as quite unsettling. Yet this openness to variety is also a strength, for it is hard to imagine a people we would have trouble integrating in our society due to religious concerns."
 abm_lri_looms_of_the_lurs: "Looms of the Lurs"
 abm_lri_looms_of_the_lurs_desc: "Some would say that our cloth is not as sophisticated as the silken fabrics of the people of the plains, but the wool our sheep provides allows us to create both robust and beautiful textiles that there is a high demand for far beyond our own lands."
 abm_lri_rise_of_the_lurs: "Rise of the Lurs"
 abm_lri_rise_of_the_lurs_desc: "Life in the mountains is not always easy. Our people is hard and strong, having endured a lifetime in rough terrain, defending their herds against raiders and withstanding the attacks of foreign invaders when necessary. Over the centuries we have also acted as king-makers and helped various pretenders in the Persian realm.\nNow the time has come to rise for ourselves, to seize the lands around us and to form an army able to destroy those of the sedentary weaklings."
 abm_lri_foreign_trade: "Foreign Trade Ties"
 abm_lri_foreign_trade_desc: "Perhaps it is better to look far away for allies rather than in our immediate vicinity. We hold in our lands a number of resources that the European India-Companies desire, and many of their agents have already expressed an interest in further cooperation. Let us forge alliances with the European kingdoms and guarantee the safety of their merchants in exchange for their protection and patronization."
 abm_lri_ideas_ambition: "Lur Ambition"
 abm_lri_ideas_ambition_desc: "Lur Ambition"
 abm_qom_ideas_tradition_1: "Ajami Traditions I"
 abm_qom_ideas_tradition_1_desc: "Ajami Traditions I"
 abm_qom_ideas_tradition_2: "Ajami Traditions II"
 abm_qom_ideas_tradition_2_desc: "Ajami Traditions II"
 abm_qom_jibal: "Jibal"
 abm_qom_jibal_desc: "When the Arabs once came to Persia they dubbed our region Jibal, the mountains, as the many mountains of the Zagros and Alborz ranges is what defines it. On the western border of greater Iran the region is the gateway between the states of the Turkic Caucasus and Greater Iran.\nYet Jibal is not all mountains, for in the basins lie a number of Iran’s oldest and greatest cities and between these basins passes and roads connect the urban population of our Empire. As the empires before us, from the ancient Medes to the Timurids, we must fortify passes and patrol the roads as well as we can, as they are the lifeline of our state."
 abm_in_honor_of_ali: "In Honor of Ali"
 abm_in_honor_of_ali_desc: "Regardless of if they consider themselves Sunni or Shia, the great majority of our subjects honor the Imams, the family of Muhammad and even Ali. While this conviction is regarded as a weakness by some legal scholars it is something that unites our people, be they Sufi mystics, regular Sunnis, Alevis or Twelver Shias."
 abm_qom_legacy_of_the_ilkhans: "Legacy of the Ilkhans"
 abm_qom_legacy_of_the_ilkhans_desc: "For hundreds of years Iran and the Caucasus have been dominated by Turkic warriors. They have made up the military foundation of a number of states such as those of the Ilkhanate, Seljuks or more recently the Timurids. Ajam sits at the very center of the greater Turko-Persian region, and for this reason it was here that the Ilkhans once constructed their capital at Sultaniyya. Today the Ilkhans are long gone but their monuments and their traditions remain, in Sultaniyya their mausoleum still bear witness to the empire that once was.\nIf we want to dominate this region we must embrace the Ilkhanate ideals of kingship, and win the loyalty of the Turkic warriors that still dwell here."
 abm_qom_persian_language_and_court_culture: "Persian Language and Court Culture"
 abm_qom_persian_language_and_court_culture_desc: "High Persian culture remains a constant through the ages, no matter which conquerors come and go. Iran has fallen many times, but in the end it is Persian language and culture that spread to their homelands. From Anatolia to Samarkand, and even Bengal, it is the tongue of Hafiz and Rumi that will open doors to traders, politicians and scholars."
 abm_qom_tribes_of_iraq_e_ajam: "Tribes of Iraq-e Ajam"
 abm_qom_tribes_of_iraq_e_ajam_desc: "These lands have been dubbed Iraq-e Ajam, or Foreign Iraq, by outsiders and are dominated by Persian citydwellers and Turkic warriors brought by the Mongols, Seljuks and Timurids. On the outskirts of the great settlements, however, a great number of groups of nomads and semi-nomads traverse and populate the region, Arabs, Turkomans, Baluch, Kalaj and Bedouin. Some have been here for centuries, others arrived more recently, all of them have traditionally been left mostly to their own devices. We should make use of these groups in our defenses, as none knows the Persian countryside better than they do."
 abm_reform_the_diwan: "Reform the Diwan"
 abm_reform_the_diwan_desc: "We are fortunate to be served by loyal and well educated Persian administrators that have perfected the art of governance for generations. Sadly, however, a hereditary office is one that over time might stagnate and lack for innovation.\nBy reducing the number of inherited offices with each generation we can make sure that we reward not only loyalty, but also ability. Able administrators must rise to high positions regardless of which family they come from."
 abm_qom_shahanshah: "Shahanshah"
 abm_qom_shahanshah_desc: "To this day the legacy of the Persian Empire lives in the form of the kingly title Shah, used by Persianate rulers everywhere. We must unite the entire Iranian people under our ruler, Shahanshah, the King of Kings."
 abm_qom_ideas_ambition: "Ajami Ambition"
 abm_qom_ideas_ambition_desc: "Ajami Ambition"
 abm_sis_ideas_tradition_1: "Sistani Traditions I"
 abm_sis_ideas_tradition_1_desc: "Sistani Traditions I"
 abm_sis_ideas_tradition_2: "Sistani Traditions II"
 abm_sis_ideas_tradition_2_desc: "Sistani Traditions II"
 abm_sis_lake_hamun: "Lake Hamun"
 abm_sis_lake_hamun_desc: "From the high Hindu Kush, the rivers of Helmand, Khash Rud, Farah Rud and Harut Rud all converge on Lake Hamun and the Gud-i Zirah depression. This creates a special type of irrigated lowland that is different from the surrounding deserts and mountains. The lake, said to contain the seed of Zoroaster, has been imperative to the well being of our people over the centuries both as a center of irrigation and to drive our watermills."
 abm_sis_saffarid_legacy: "Saffarid Legacy"
 abm_sis_saffarid_legacy_desc: "For 200 years Sistan was the base for the Saffarid dynasty, overcoming the Tahirid governors of the Abbasid caliphate they were able to carve out an empire in Eastern Persia. While the Saffarid Empire did not last for long, the dynasty demonstrated the strength that the people of Sistan can possess. We should strive to emulate our Saffarid ancestors and remember that what looks like a distant province is actually the seeds of empire."
 abm_sis_subjugation_of_tribes: "Subjugation of the Tribes"
 abm_sis_subjugation_of_tribes_desc: "We control the forts and cities of Sistan but in the mountains, hills and deserts that surround our state there are many tribes that lead a life almost entirely independent of our rule. We must subdue the tribes of these areas both in order to safeguard the peace in the lowlands and to extend our control over the highlands."
 abm_sis_loyal_service: "Loyal Service"
 abm_sis_loyal_service_desc: "Sistan’s time as a great empire may have been short but for centuries we have provided armies and leaders for the wars of Ilkhans, Karts, and Timurids. We should proudly preserve this tradition of service in our ranks as we make good use of the experience earned in the war of foreign powers."
 abm_sis_overland_trade_routes: "Overland Trade Routes"
 abm_sis_overland_trade_routes_desc: "We control important points on the overland routes between Afghanistan, Khorasan and Iran. Lands that have historically often been considered unsafe by traders, with some daring to cross them despite the dangers that they pose. We should create a network of well guarded stopping points for caravans and do our utmost to protect any traders in our realm. In this way we can encourage the transit trade to grow and attract more wealth to our realm."
 abm_sis_chronicles_of_sistan: "Chronicles of Sistan"
 abm_sis_chronicles_of_sistan_desc: "Through the centuries the dynasties of Sistan have often found it wise to chronicle their own history as rulers of the province. This is a wise tradition that we should follow. Unlike them however we would do well to first compile all old histories of Sistan so that we might create a new great work over the history of this kingdom from ancient times until today."
 abm_sis_scholars_of_sistan: "Scholars of Sistan"
 abm_sis_scholars_of_sistan_desc: "Sistan was once a center of culture, religion and scholarship. We should once again aspire to these qualities. By inviting scholars, founding schools, mosques and charities we can restore the reputation of what once was, to the general benefit of our people and government."
 abm_sis_ideas_ambition: "Sistani Ambition"
 abm_sis_ideas_ambition_desc: "Sistani Ambition"
 abm_arl_ideas_tradition_1: "Ardabili Traditions I"
 abm_arl_ideas_tradition_1_desc: "Ardabili Traditions I"
 abm_arl_ideas_tradition_2: "Ardabili Traditions II"
 abm_arl_ideas_tradition_2_desc: "Ardabili Traditions II"
 abm_arl_safavid_order: "The Safavid Order"
 abm_arl_safavid_order_desc: "Ardabil is where Safi al-din Ardabili lived and worked. His shrine continues to be the political and military center of the Safaviyya or Safavid Order, a strong mystic order still led by his successors. The Safavids have a strong influence on all politics both in Ardabil and surrounding countries and as long as we work closely their religious fervor will allow us to defeat enemies many times our size."
 abm_arl_qizilbash: "The Qizilbash"
 abm_arl_qizilbash_desc: "Whether they profess to be Shiites or not mystical Islam and support of Ali is widespread among the Turkoman tribesmen of Iran, Anatolia and the Caucasus. The Safavids have quickly come to gain strong support among these groups and many are now flocking to their banners. Styling themselves 'Qizilbash' or 'Redheads', after their characteristic red hats, they could be the core of a new army, ready to fight and die for the head of the Safavids."
 abm_arl_shiite_leadership: "Leader of all Shiites"
 abm_arl_shiite_leadership_desc: "Millenarian sects have begun to spring up all around the Iranian lands but we know that our sheikhs are the only legitimate Shii rulers in the world. We must spread the word of the Sheikhs of Ardabil and force any Shiite masters in the territory under our control to accept that they are but deputies for our messianic authority."
 abm_arl_conversion_of_the_masses: "Conversion of the Masses"
 abm_arl_conversion_of_the_masses_desc: "For a long time this region has been an heterodox mix of religions, with honor of Ali and the Sunni Caliphs existing side by side. We must show those troubled the right way by clearly outlining what it is to worship properly, and acting to limit the Sunni influence of our enemies among at least the lower classes. Punishing those that do not comply if needed."
 abm_arl_religious_war: "Religious War"
 abm_arl_religious_war_desc: "The enemies of our state are many but we also have the support of Shias, Alevis and Sufi orders far beyond our borders. Let us work together with these elements so that no Sunni Empire can feel too safe before the armies of the faithful."
 abm_arl_amili_mujtahids: "Amili Mujtahids"
 abm_arl_amili_mujtahids_desc: "Shiites have always been a minority in the Muslim world and apart from the Fatimid caliphate, centuries ago, there has not been any major Shiite governments. This means that unlike the many Sunni dynasties that have ruled this region before us, we do not have a complete legal and institutional framework to stand on. In order for our growing state to thrive we must do our utmost to create our own, lasting, institutions for Shiite law and administration.\nLet us invite foreign Shia religious scholars, such as the Amilis from the Levant, to help us shape an enduring framework for our state."
 abm_arl_shahs_of_iran: "Shahs of Iran"
 abm_arl_shahs_of_iran_desc: "What started as a religious sect in Ardabil is now ready to claim overlordship over all Iranian lands. The time has come to take our rightful place among the great nations of this world, and the Persian Empires that came before us."
 abm_arl_ideas_ambition: "Ardabili Ambition"
 abm_arl_ideas_ambition_desc: "Ardabili Ambition"
 abm_caspian_ideas_tradition_1: "Caspian Traditions I"
 abm_caspian_ideas_tradition_1_desc: "Caspian Traditions I"
 abm_caspian_ideas_tradition_2: "Caspian Traditions II"
 abm_caspian_ideas_tradition_2_desc: "Caspian Traditions II"
 abm_caspian_riches_of_tabarestan: "The Riches of Tabarestan"
 abm_caspian_riches_of_tabarestan_desc: "Surrounded by mountains on all sides Tabarestan follow the entire Caspian coastline. It is a mild and wet area, ideal for rice cultivation, with some of the oldest cities in the Iranian region. In times of war and upheaval Tabarestan is also often left at peace due to its protected position, and therefore boasts a large population compared to its size. This relative peace and old settlements has also made all the countries of Tabarestan important stops on the Silk Road, allowing us to benefit from the wealthy Trans-Asiatic Trade networks."
 abm_caspian_time_of_turmoil: "A Time of Turmoil"
 abm_caspian_time_of_turmoil_desc: "All around us great kingdoms are collapsing. We have seen Timurid princes fight over the destroyed remnants of their ancestral legacy, while turkic tribesmen combat over the mountains of Azerbaijan. Millenarianism is gripping the people all over Persia and many are taking up arms against their old rulers. If we to survive in such a time of turmoil we must form a strong army of our own, manned by the local soldiers that for generations have seen foreign conquerors come and go. It is time we look not only to defend ourselves but to strike at those who will surely otherwise devour us."
 abm_caspian_silk: "Caspian Silk"
 abm_caspian_silk_desc: "The Caspian shoreline is a land of forests, wetlands and rice paddies, but most of all it is a land of silkworm plantations and mulberry plantations. As the home of its own type of mulberry tree and as the first region to cultivate silkworms in Iran, we now have a tradition of silk production going back almost a millennium. The silk produced in our cities is famous not only in Iran and Khorasan, it is well known in the cities of Italy, France and Germany, as they all seek to import as much of this rare commodity as they can lay their hands on. The only limit on how much their merchants purchase from us is how much we can produce. There are however ways we might still make the silk production business more efficient. Let us expand the silk production so that we may grow rich while our weavers fashion the world."
 abm_caspian_sea_trade: "Protect the Caspian Trade"
 abm_caspian_sea_trade_desc: "Increasing number of hostile ships are putting our oversea trade in the Caspian at risk. Whether foreign countries or pirates we can never tolerate that others pray on the trade that is the livelihood of our country. While a full navy might not be possible in the Caspian Sea we must be ready to construct a number of ships to patrol the great inland sea at any cost, even if it means bringing in shipbuilders from very distant countries."
 abm_caspian_unite_minor_states: "Unite the states of Tabarestan"
 abm_caspian_unite_minor_states_desc: "There are many countries that have made this region their home, even within our borders there is a number of local rulers of ancient dynasties that enjoy a high degree of autonomy. We cannot allow this to continue much longer, we must reduce the castles of such local princes and put people we can trust in charge of ruling the land."
 abm_caspian_safe_haven: "A Safe Haven"
 abm_caspian_safe_haven_desc: "This region has often been a safe haven for people of different cultures and religions. Sheikhs, warlords or merchants can all find a place here. Perhaps it is because of this that Tabarestan has acquired such a heterogenous population. Living among the small states of the Tabarestani coast there’s everything from Sunnis and Zoroastrians to Shia Nizaris, Zaidis and Jafaris. This is in many ways thanks to the protection of the mountains that surround us.\nThe best way to work for peace however, is to prepare for war. We must build strong fortresses to guard the passes that lead through the mountains that protect us, and keep strong garrisons at hand to protect the freedom we enjoy."
 abm_caspian_promote_foreign_trade: "Promote Foreign Trade"
 abm_caspian_promote_foreign_trade_desc: "As a stop on the silk road our country has long prospered from trade and traders from Armenia, India, Russia or other faraway places are a frequent sight in our cities. We would do well to further ease trading by constructing more caravanserai and inviting the many merchants that still pass through this region to settle and make a life for themselves in our cities."
 abm_caspian_ideas_ambition: "Caspian Ambition"
 abm_caspian_ideas_ambition_desc: "Caspian Ambition"
 abm_bal_ideas_tradition_1: "Baluch Traditions I"
 abm_bal_ideas_tradition_1_desc: "Baluch Traditions I"
 abm_bal_ideas_tradition_2: "Baluch Traditions II"
 abm_bal_ideas_tradition_2_desc: "Baluch Traditions II"
 abm_bal_natural_defences: "Natural Defenses"
 abm_bal_natural_defences_desc: "As every army since the days of Alexander has learned our lands can be quite hostile to outside invaders. Intermittent mountains with treacherous passes, deserts and hills await any enemy of ours and the population itself is used to use this terrain to its advantage to ambush and decimate any armed party intent to pass through these lands."
 abm_bal_hani_and_sheh_mureed: "Hani and Sheh Mureed"
 abm_bal_hani_and_sheh_mureed_desc: "We live in a time of opportunity and challenges. The impact of our decisions are such that ballads and legends are being written about the heroes and warriors of this age already. Let us act in accordance to the Baluchi code and give those that come after us an ideal to aspire to for generations to come. "
 abm_bal_khan_of_the_baloch: "Khan of the Baloch"
 abm_bal_khan_of_the_baloch_desc: "The Baloch are a proud yet divided people. Used to enjoy the freedom of independence we are perhaps held back by our lack of unity. Let us name our ruler Khan of all Baloch and unite behind a common cause. Our neighbors will never again be safe."
 abm_bal_reorganization_of_the_army: "Reorganization of the Army"
 abm_bal_reorganization_of_the_army_desc: "Tribal loyalties are strong in our lands and in many ways trying to supplant these by loyalty to our state can be a futile exercise. Instead of trying to create an army like that of our Indian or Persian neighbors let us work with the system we have. Each major tribe should be made accountable to create and maintain an army to our standards and to pay for the expeditions we order. In return we will strengthen their authority over the minor tribes under their control."
 abm_bal_control_of_the_overland_trade: "Control the Overland Trade"
 abm_bal_control_of_the_overland_trade_desc: "We control a region considered dangerous or even intraversible by many and raiders from our lands have for millennia prayed on the traders of surrounding regions. Yet it is possible to travel through Baluchistan and Makran from Kabul to Sindh and we know the passes and paths through the mountains and deserts. Let us open our routes to traders and tax them for our protection."
 abm_bal_chiefs_and_landlords: "Chiefs and Landlords"
 abm_bal_chiefs_and_landlords_desc: "Traditionally tribal chiefs, often elected from within their clans, control the lands and their produce in this region. It is time we create a more efficient system where we appoint a chief to act as landlord on our behalf. This way we know who is accountable and where his loyalties lie and we can control the produce to a much greater degree than today."
 abm_bal_baluch_leadership: "Baluchi Leadership"
 abm_bal_baluch_leadership_desc: "Our troops have gained a strong reputation fighting as mercenaries or allies in the armies of others in Persia or the subcontinent. Let us use their experience and their new contacts to bring forth a new breed of professional and competent officers."
 abm_bal_ideas_ambition: "Baluch Ambition"
 abm_bal_ideas_ambition_desc: "Baluch Ambition"
 abm_afg_ideas_tradition_1: "Afghan Traditions I"
 abm_afg_ideas_tradition_1_desc: "Afghan Traditions I"
 abm_afg_ideas_tradition_2: "Afghan Traditions II"
 abm_afg_ideas_tradition_2_desc: "Afghan Traditions II"
 abm_pashtunwali: "Pashtunwali"
 abm_pashtunwali_desc: "For centuries our people have followed the principles of Pashtunwali. This code of ethics requires any insult to be met with vengeance. We shall stop at nothing to achieve vengeance for our lost sons."
 abm_shadows_of_the_hindu_kush: "Shadows of the Hindu Kush"
 abm_shadows_of_the_hindu_kush_desc: "All Pashtuns were born in the shadows of the great mountain range known as the Hindu Kush, and the mountains shall be our fortress against any intruder."
 abm_tureh: "Tureh"
 abm_tureh_desc: "A central tenet of Pashtunwali. A warrior must be brave and face any threat against his family, land or honor. Thus we shall find no shortage of men willing to fight for their land."
 abm_afghan_diaspora: "Afghan Diaspora"
 abm_afghan_diaspora_desc: "Prior to the rise of the Mughals a lot of Afghans migrated to Northern India, where they managed to dominate the local aristocracy. Even when Afghanistan was under Safavid and Mughal control the country served as a recruiting ground for soldiers and advisors. This provided Afghanistan with significant influence in foreign courts."
 abm_durrani_imperialism: "Durrani Imperialism"
 abm_durrani_imperialism_desc: "Following Afghanistan's independence from Persia a lot of Afghan cavalry men returned home to serve their king known as the Durr-i-Durrani or pearl of pearls. Starting out as mere raiders these cavalry forces soon became the basis for the formation of the greatest empire ever ruled from Kabul."
 abm_institutionalized_loya_jirga: "Institutionalized Loya Jirga"
 abm_institutionalized_loya_jirga_desc: "The grand tribal council known as the Loya Jirga was traditionally assembled to address major events such as the coronation of a new king. The role of the Loya Jirga will now become institutionalized so no one can question our right to rule."
 abm_graveyard_of_empires: "Graveyard of Empires"
 abm_graveyard_of_empires_desc: "No outside force shall occupy our lands. Let these so called empires try their best, they will all be found wanting."
 abm_afg_ideas_ambition: "Afghan Ambition"
 abm_afg_ideas_ambition_desc: "Afghan Ambition"
 abm_msy_ideas_tradition_1: "Mushasha Traditions I"
 abm_msy_ideas_tradition_1_desc: "Mushasha Traditions I"
 abm_msy_ideas_tradition_2: "Mushasha Traditions II"
 abm_msy_ideas_tradition_2_desc: "Mushasha Traditions II"
 abm_msy_fervent_millenarianism: "Fervent Millenarianism"
 abm_msy_fervent_millenarianism_desc: "The Musha’sha’ know that Sayyid Muhammad bin Falah is the embodiment of the Mahdi and it is according to his will that we have carved out a state for the righteous in these lands. We are strengthened by our faith and the mystical exaltation that allow us to perform extraordinary acts, in the name of his radiant dynasty. The end is near and it is time the world learn to follow the teachings of the Musha’sha’!"
 abm_msy_messianic_legacy: "Messianic Legacy of Muhammad bin Falah"
 abm_msy_messianic_legacy_desc: "Spreading the word of Sayyid Muhammad and his descendants is more than a mission for the Musha’sha’, it is our duty. We must enlighten all those that we come to rule as well as spread the word to the oppressed subjects of our neighbors."
 abm_msy_swamp_warfare: "Swamp Warfare"
 abm_msy_swamp_warfare_desc: "The area around the Shatt al-Arab to the Persian gulf is a maze of rivers, swamps and islands that any invader will find very hard to control or even navigate. Using the landscape to our advantage has been the way of the Musa’sha’ warriors since the inception of our state and finding ways to make use of this experience as we expand will allow us to continue to defeat foes that would appear stronger than we are."
 abm_msy_arabistan: "Arabistan"
 abm_msy_arabistan_desc: "The Mushasha message have always rung through to the righteous but it has an especially strong influence among the arabic tribes of Iraq and northern Arabia. The support that we enjoy from these tribes is a strength that we should put to good use both to rule and expand our influence."
 abm_msy_house_united: "A House United"
 abm_msy_house_united_desc: "While our state has come a long way since its founding by Muhammad ibn Falah we are still carriers of his legacy, and his descendants are still of central importance to the Mushasha government. Over the years however his dynasty has grown and much time and energy is lost to intrigue, factionalism and plotting between the branches and their various supporters. Let us settle these differences once and for all and establish a clear succession for who is head of the family."
 abm_msy_outward_pragmatism: "Outward Pragmatism"
 abm_msy_outward_pragmatism_desc: "Having friends is a necessity in a hostile world. Our religious convictions make it unlikely that anyone will consider us anything else than heretics, something that can make it hard to find partners among our neighbors. We must therefore not be afraid of doing what we can to cultivate good relations with stronger states in our vicinity."
 abm_msy_sufis_shias_middle_east: "Sufis and Shias of the Middle East"
 abm_msy_sufis_shias_middle_east_desc: "There are many Shias in the lands of Iran and Iraq that have had to lead lives in secret for centuries. Waiting for the Mahdi to finally reveal himself and even among the ones who consider themselves Sunnis there are those, wise from years of sufi practices, who show a great interest in the new teachings of the Musha’sha’. Let us invite these men and women to our lands, some will undoubtedly bring our theology further while others can help us develop the lands that we now control."
 abm_msy_ideas_ambition: "Mushasha Ambition"
 abm_msy_ideas_ambition_desc: "Mushasha Ambition"
 abm_arb_ideas_tradition_1: "Arabian Traditions I"
 abm_arb_ideas_tradition_1_desc: "Arabian Traditions I"
 abm_arb_ideas_tradition_2: "Arabian Traditions II"
 abm_arb_ideas_tradition_2_desc: "Arabian Traditions II"
 abm_arb_arabian_pincers: "Arabian Horseman Tactics"
 abm_arb_arabian_pincers_desc: "During the rise of the Caliphate many of our battles were won thanks to our tactics with the horseman. Feign retreat and careful flanking are just few tactics at our disposal, further reinforced by our skilled riders."
 abm_arb_pact_of_umar: "The Pact of Umar"
 abm_arb_pact_of_umar_desc: "The pact of Umar has been signed between Caliph Umar and the Dhimmi of the realm. Having later gained a revered status in Islamic jurisprudence, it is treated as the baseline for the treatment of the dhimmi."
 abm_arb_engage_in_indian_ocean_trade: "Engage in Indian Ocean Trade"
 abm_arb_engage_in_indian_ocean_trade_desc: "Many Arabian merchants already actively participate in the Indian Ocean Trade. It is thanks to their ventures that Islam has peacefully spread to all corners of the Indian Ocean. Under our management, those commercial trips shall not cease to happen."
 abm_arb_conversion: "Spread the Word"
 abm_arb_conversion_desc: "The story and life of Muhammad and his revelations are still unknown to many throughout the world. Let us spread the word of his lifetime and salvation that awaits those who follow his word."
 abm_arb_jihad: "Jihad"
 abm_arb_jihad_desc: "The basic for our expansionist doctrine is Jihad - the Holy War directed at heathens. Islam must be expanded, even if it means shedding blood."
 abm_arb_new_caliphate_rising: "New Caliphate Rising"
 abm_arb_new_caliphate_rising_desc: "The chain of rightful Caliphates seems to have been broken with the subjugation of the Abbasids and the fact they have become puppets of the Mamluk Sultanate. Time to restore the line of Caliphates."
 abm_arb_mubarizun: "The Mubarizun"
 abm_arb_mubarizun_desc: "Mubarizun were the elite and most trained members of the Arabian army. Their purpose was to engage in fights against the champions of the foe."
 abm_arb_ideas_ambition: "Arabian Ambitions"
 abm_arb_ideas_ambition_desc: "Arabian Ambitions"
 abm_naj_ideas_tradition_1: "Najdi Traditions I"
 abm_naj_ideas_tradition_1_desc: "Najdi Traditions I"
 abm_naj_ideas_tradition_2: "Najdi Traditions II"
 abm_naj_ideas_tradition_2_desc: "Najdi Traditions II"
 abm_bedouin_poets: "Bedouin Poets"
 abm_bedouin_poets_desc: "The constant journey over dunes and hills under the beating, unrelenting sun can put a man in a poetic mood, where he reflects on battles fought, loves lost, and journeys taken long before and how the steps he takes have been taken by his ancestors centuries back. Their poems, redolent of past victories and lost glories, will encourage our men to fight ten times harder."
 abm_hanbali_school_ni: "Hanbali School"
 abm_hanbali_school_ni_desc: "Our ancestors have long held to the strictest school of Islamic jurisprudence founded by Ahmad ibn Hanbal in the 9th century, and its strict prohibitions against anything that remotely resembles idolatry and commitment to a rigorous code of Islamic conduct brings harmony to our society."
 abm_ships_of_the_desert: "Ships of the Desert"
 abm_ships_of_the_desert_desc: "A pious man knows the ninety-nine names of Allah, but only the camel knows the one hundredth, which is why they always look so smug. The camel, the mighty ship of the desert, has made our nomadic lifestyle possible for centuries by hauling goods across the trackless desert. If you can take the camel's stink and its smug grin, watch as it proves its worth many time over."
 abm_bedouin_raiders: "Bedouin Raiders"
 abm_bedouin_raiders_desc: "Since before the days of the Prophet, Bedouins have been experts at the art of the raid. An army may march on its stomach, but it won't march far when our raiders take the food right out of the army's mouth through rapid hit and run seizures of their supply lines. Pull back and let the raiders do their work and watch as the invader dies of thirst."
 abm_arabian_horsemanship: "Arabian Horsemanship"
 abm_arabian_horsemanship_desc: "The man who rides for pleasure or military occupation has no idea what true horsemanship is. The Bedouin rides to trade, to eat, to live. It should surprise no one that, in addition to the finest horses, Arabia produces the finest cavalrymen."
 abm_unite_the_tribes: "Unite the Tribes"
 abm_unite_the_tribes_desc: "Our loosely-organized way of handling our affairs has its upsides. Perhaps we could allow the tribes to continue providing for the upkeep of their own soldiers and horsemen while bringing them together in a more modern military pointed outwards rather than within?"
 abm_enforce_tawhid: "Enforce Tawhid"
 abm_enforce_tawhid_desc: "'If any of you worship Muhammad, you should know that Muhammad is dead. But those of you who worship Allah, let it be known that Allah is alive and cannot die.' The shrines to the Prophet and his Companions lay a mockery to the wise words of Abu Bakr. Those who worship at these shrines are guilty of shirk, of exalting Man to the level of praise only Allah is due. If we destroy these shrines, we will enforce true tawhid, or monotheism, throughout our land and purify this holy oasis of faith of the pollution of idolatry."
 abm_naj_ideas_ambition: "Najdi Ambition"
 abm_naj_ideas_ambition_desc: "Najdi Ambition"
 abm_arabian_ideas_tradition_1: "Arabian Traditions I"
 abm_arabian_ideas_tradition_1_desc: "Arabian Traditions I"
 abm_arabian_ideas_tradition_2: "Arabian Traditions II"
 abm_arabian_ideas_tradition_2_desc: "Arabian Traditions II"
 abm_arab_indian_ocean_trade: "Indian Ocean Trade"
 abm_arab_indian_ocean_trade_desc: "Our sailors have been to the Swahili coasts and as far as Hindustan and even the Malay lands. We can play a critical role in the flow of goods between these wealthy regions."
 abm_arabian_horses: "Arabian Horses"
 abm_arabian_horses_desc: "Every cavalryman has heard that the best horses are Arabian horses, and who has a larger supply of these beauties than we do? Put some of our top horses to stud and watch as we produce a steady supply of the greatest horses known to man."
 abm_land_of_the_prophet: "Land of the Prophet"
 abm_land_of_the_prophet_desc: "The people of our lands were the first to hear the words of the Prophet Muhammad, peace be upon him. Every day we can see clans and tribes descended from people who lived in his day and heard his words. Though Islam may spread far and wide to the ends of the Earth, never forget that it started in this holy oasis of faith."
 abm_spreading_the_prophets_word: "Spreading the Prophet's Word"
 abm_spreading_the_prophets_word_desc: "There is no god but Allah, Muhammad is His messenger. By now, all men should know these holy words, but a shocking amount still dwell in the pitiable state of ignorance of Islam. Our missionaries are ready to spread the words of the Prophet."
 abm_bedouin_traders: "Bedouin Traders"
 abm_bedouin_traders_desc: "There aren't many sharply-delineated man-made borders in Arabia, and even if there were, the Bedouin would ignore them. Though the Bedouin nomadic journeys through our lands and into others has risks, it also facilitates easy access to trade through the entire region, as Bedouin nomads know no import tariffs or trade embargoes."
 abm_arab_clan_loyalties: "Clan Loyalties"
 abm_arab_clan_loyalties_desc: "Our people are divided into many clans and tribes. If we can ensure that all the clan leaders serve our state we will have an valuable source of commanders and experienced Bedouin raiders that cannot be overestimated."
 abm_arabia: "Arabia"
 abm_arabia_desc: "Although Arabia has many different clans, tribes and countries, all share in the use of the Arabic language, it forms the unifying feature of all Arabs. Under a strong leadership we can unite all Arabian lands under a single flag and one ruler."
 abm_arabian_ideas_ambition: "Arabian Ambition"
 abm_arabian_ideas_ambition_desc: "Arabian Ambition"
 abm_alh_ideas_tradition_1: "Al-Haasa Traditions I"
 abm_alh_ideas_tradition_1_desc: "Al-Haasa Traditions I"
 abm_alh_ideas_tradition_2: "Al-Haasa Traditions II"
 abm_alh_ideas_tradition_2_desc: "Al-Haasa Traditions II"
 abm_alh_desert_warfare: "Desert Warfare"
 abm_alh_desert_warfare_desc: "Our people came from the desert, to rightfully take control over al-Haasa from the weak Jarwanids and the greedy Hormuzi merchants. Yet other desert tribes, such as the Dawasir, now desire what is ours. While it is important that we embrace the new maritime nature of our state we must never forget our Bedouin past, or other desert tribes could displace us just as quickly as we seized this prize from our predecessors."
 abm_alh_lord_of_the_eastern_bedouin: "Lord of the Bedouin of the East"
 abm_alh_lord_of_the_eastern_bedouin_desc: "We have come a long way since we took control of Al-Haasa and Hofuf. We must however never forget that this honor does not belong to us alone. As the lord of the East it is our duty to go on frequent pilgrimages to the holy cities, bringing the wealth that is under our control to the Sharifs so that all can see that the righteous are now in control over Al-Haasa"
 abm_alh_pearls_of_the_persian_gulf: "Pearls of the Persian Gulf"
 abm_alh_pearls_of_the_persian_gulf_desc: "The port cities under our control are the principal pearl fishing ports in the Arabian Ocean, and very likely the entire world. The wealth this brings us is what once attracted the captains of Hormuz to this coast and without it it is not certain of our state would exist at all. We must at all cost protect and patronize the Pearl fishing industries, as without it the steady stream of silver and silk from the east would die out in an instant."
 abm_alh_fortify_the_coastline: "Fortify the coastline"
 abm_alh_fortify_the_coastline_desc: "The trade cities of Eastern Arabia are where we earn our livelihood. The cities themselves however are vulnerable. Foreign ships might easily descend on the coastline and hold our traders hostage. This is how once the Hormuzi came to control our country and this is how Turks and Portuguese threaten to do so in the future.\nWe would do well to build strong stone fortifications in our principal ports, so that we can protect the wealth of our merchants."
 abm_alh_entrepot_of_india: "Entrepot of India"
 abm_alh_entrepot_of_india_desc: "While the Pearl fishing has made our ports famous the trade in horses is perhaps what brings the most ships from India to our shores. Arabian horses are in high demand across South Asia and Iran, and the ports of Haasa are the principal source for the maritime trade of this commodity. The desert tribes bring us a constant supply of fine war horses that we then send to the best battlefields of India."
 abm_alh_a_modern_navy: "A Modern Navy"
 abm_alh_a_modern_navy_desc: "An increasing number of Christian ships have been seen in the Persian gulf lately, threatening our ships and ports. In order to battle this new enemy however we will need to build a new and modern navy. Let us learn from those who have already fought the Christians on sea and invite Turkish shipbuilders and sailors to settle in our country."
 abm_alh_legacy_of_rahmah_ibn_jabir: "Legacy of Rahmah ibn Jabir"
 abm_alh_legacy_of_rahmah_ibn_jabir_desc: "For a country such as ours taking command of the sea-lanes is of vital importance. We must not hesitate form employing the sea-dogs and pirates as they have experience and skills far beyond most captains, and know our waters better than anyone."
 abm_alh_ideas_ambition: "Al-Haasa Ambition"
 abm_alh_ideas_ambition_desc: "Al-Haasa Ambition"
 abm_hed_ideas_tradition_1: "Hejazi Traditions I"
 abm_hed_ideas_tradition_1_desc: "Hejazi Traditions I"
 abm_hed_ideas_tradition_2: "Hejazi Traditions II"
 abm_hed_ideas_tradition_2_desc: "Hejazi Traditions II"
 abm_custodian_of_the_two_holy_cities: "Custodian of the Two Holy Cities"
 abm_custodian_of_the_two_holy_cities_desc: "Our people feel particularly connected to the holy places of Mecca and Medina, the cradle of Islam. Their place of origin affords them the feeling of being a chosen people and also provides them with special status in the eyes of many other Muslims."
 abm_hed_red_sea_trade: "Red Sea Trade"
 abm_hed_red_sea_trade_desc: "With the spice trade flowing up the Red Sea, we must ensure that we take part in this lucrative trade."
 abm_sharifs_of_mecca: "Sharifs"
 abm_sharifs_of_mecca_desc: "The holiest city of Islam is ruled by our Sharifs who are descendants through a long and honourable lineage. Historically, the Sharif was charged with protecting the cities and ensuring the safety of pilgrims performing the Hajj."
 abm_hed_desert_warfare: "Desert Warfare"
 abm_hed_desert_warfare_desc: "The inhospitable terrain of the Arabian desert has made our warriors stronger and able to wear down our enemy before moving in for the killing blow."
 abm_cradle_of_gold: "Cradle of Gold"
 abm_cradle_of_gold_desc: "The Mahd adh Dhahab, also known as the Cradle of Gold, is the gold mining area near our city of Medina. We must ensure that we make more use of this mine to the benefit our people."
 abm_hajj: "Hajj"
 abm_hajj_desc: "The Hajj pilgrimage is one of the five pillars of Islam, that must be carried out by every able-bodied Muslim who can afford to do so at least once in his or her lifetime. Pilgrims around the world will come to our lands to fulfill their religious duty."
 abm_successor_to_the_caliphate: "Successor to the Caliphate"
 abm_successor_to_the_caliphate_desc: "Hejaz was once at the centre of the Caliphate under the leadership of the first four caliphs: Abu Bakr as-Siddîq, Omar ibn Al-Khattâb, Uthmân ibn Affân and Alî ibn Abî Tâlib. We have once again grown powerful enough to proclaim the title of Caliph and our state as the successor to the Caliphate. God is Great!"
 abm_hed_ideas_ambition: "Hejazi Ambition"
 abm_hed_ideas_ambition_desc: "Hejazi Ambition"
 abm_ras_ideas_tradition_1: "Rassid Traditions I"
 abm_ras_ideas_tradition_1_desc: "Rassid Traditions I"
 abm_ras_ideas_tradition_2: "Rassid Traditions II"
 abm_ras_ideas_tradition_2_desc: "Rassid Traditions II"
 abm_ras_living_imam: "The Living Imam"
 abm_ras_living_imam_desc: "Where other Shias await a hidden Imam or hide among Sunnis, Sufis or other heresy, our people instead follow the Zaidi Imam. He is our leader in the worldly, as well as the spiritual realm, and he and his descendants will always guide us against infidel, heretic or any other enemy that might cross our path."
 abm_ras_yemeni_highlands: "Yemeni Highlands"
 abm_ras_yemeni_highlands_desc: "Yemen has always had a reputation as the most fertile and felicitous part of Arabia, and this is true. There are few places in this peninsula with as good farmland or as much rainfall as ours. The Yemeni highlands that we call home are especially temperate and welcoming in many ways, here we can grow both food and the famous coffee plants of our people."
 abm_coffea_arabica: "Coffea Arabica"
 abm_coffea_arabica_desc: "We hear that the Europeans cannot get enough of this ancient drink of ours. Coffeehouses are booming all over Europe and, though they have attempted to plant it elsewhere, the original coffee of Arabia will always be the best and most desirable."
 abm_ras_unite_rassid_state: "A Unified Rassid State"
 abm_ras_unite_rassid_state_desc: "For too long the scions of our dynasty have fought each other for leadership of our state. It is time we find a strong leader who can take the Rassid faithful and lead us to victory against foreign enemies and dissenting internal tribes alike."
 abm_ras_mountain_strongholds: "Mountain Strongholds"
 abm_ras_mountain_strongholds_desc: "In our defiance of the worldly rulers that seek to control our country we have often had to build strong defensive structures. The Yemeni highland have always had to be full of defensive installations, from great forts to small towers. This attitude of constant vigilance is one we must take with us as we expand into the lowlands and other areas. We must always be vigilant and ready to defend what is ours."
 abm_ras_salt_in_water: "Like Salt Dissolves in Water"
 abm_ras_salt_in_water_desc: "It has been said that a foreign commander once said that troops sent to Yemen would ‘melt away as salt dissolved in water’. While this is a testament to how hostile this land can be to an outside invader it is also a goal we must strive for. Let us unify our people and all work to defeat any outside invaders. United there is nothing we could not do!"
 abm_ras_secure_trade_monopolies: "Secure the Yemeni Trading Monopolies"
 abm_ras_secure_trade_monopolies_desc: "Just as we control the source of most of the world's coffee we are in a unique position to control the Red Sea trade, as well as the overland trade in Arabia. This source of wealth must be exploited."
 abm_ras_ideas_ambition: "Rassid Ambition"
 abm_ras_ideas_ambition_desc: "Rassid Ambition"
 abm_hdr_ideas_tradition_1: "Hadramhi Traditions I"
 abm_hdr_ideas_tradition_1_desc: "Hadramhi Traditions I"
 abm_hdr_ideas_tradition_2: "Hadramhi Traditions II"
 abm_hdr_ideas_tradition_2_desc: "Hadramhi Traditions II"
 abm_hdr_death_has_come: "Death Has Come"
 abm_hdr_death_has_come_desc: "Though the name is old and shrouded in legend many claim that the name Hadramut means that ‘Death has Come’. Given the hostile nature of this landscape this would at the very least be fitting. Mountains, deserts and extremely dry expanses make up the majority of Hadramut, and its people is used to defending what they have with any means. Had it not been for the more welcoming coastline it would be hard to imagine a harsher land, and one harder to subdue."
 abm_hdr_tribes_of_hadramut: "Tribes of Hadramut"
 abm_hdr_tribes_of_hadramut_desc: "The Hadramut Kathiri tribes are not united however and the land risks being fractured and weak the next time an outsider wishes to cross our borders. Let us bring in reinforcements from the deep deserts to help settle this tribal conflict once and for all. The Yafii tribe has already started migrating into the area and would make a good and loyal force."
 abm_hdr_hawtas: "Hawtas"
 abm_hdr_hawtas_desc: "Our history is one of constant warfare and hostility, but no society can endure without peace. It was for this reason that our ancestors began the custom of demarcating hawtas, areas entirely devoid of violence, respected by all tribes and authorities."
 abm_hdr_encouraging_the_incense_trade: "Encouraging the Incense Trade"
 abm_hdr_encouraging_the_incense_trade_desc: "While perhaps not as lucrative as in the past the production and export of Incense remains the primary form of income for our people. The ports of Shihr and Mukalla once served as the primary ports for the export of this commodity, not only from our lands but from the nearby Dhofar and Qishn. Let us expand our harbors and encourage the trade in incense so that we can once again aspire to be the primary exporter of Incense in the world."
 abm_hdr_sailors_of_the_indian_ocean: "Sailors of the Indian Ocean"
 abm_hdr_sailors_of_the_indian_ocean_desc: "Hadramhis are not only excellent warriors of the deserts but also have a long tradition of long range sailing. Some take to joining the crews of the many foreign ships that seek out our ports, while others build their own Dhows and set out to trade and settle far from home. The future of our state lies in this maritime trade and we must encourage local captains and sailors for the good of our nation."
 abm_hdr_hadramhi_diaspora: "Hadramhi Diaspora"
 abm_hdr_hadramhi_diaspora_desc: "With the exception of the coastline, Hadramut is a hot and dry land, with little rainfall and very poor possibilities for any form of agriculture. It is no wonder that the Hadramuti people for generations have sought their fortunes across the Arabian Sea. There are Hadramhi communities in India, Indonesia, the Hejaz and along the East African coastline. Many do return home eventually, bringing with the experience and skills acquired in faraway lands to our state."
 abm_hdr_distant_diplomacy: "Distant Diplomacy"
 abm_hdr_distant_diplomacy_desc: "There are many naval powers interested in friendly ports in the Arabian Sea even if they would rather not hold any land here. Let us seek alliances with the great powers of the east and west, countries with naval ambitions looking for a friendly state among the many maritime Sultanates of the east."
 abm_hdr_ideas_ambition: "Hadramhi Ambition"
 abm_hdr_ideas_ambition_desc: "Hadramhi Ambition"
 abm_mhr_ideas_tradition_1: "Mahri Traditions I"
 abm_mhr_ideas_tradition_1_desc: "Mahri Traditions I"
 abm_mhr_ideas_tradition_2: "Mahri Traditions II"
 abm_mhr_ideas_tradition_2_desc: "Mahri Traditions II"
 abm_mhr_lands_of_frankincense_and_the_khareef: "Lands of Frankincense & the Khareef"
 abm_mhr_lands_of_frankincense_and_the_khareef_desc: "While our lands might look poor and arid to some it has been blessed in two important ways. The first is that we produce much of the fabled frankincense and myrrh that is demanded by the many peoples of the world.\nThe second is the seasonal monsoon, or Khareef, with its characteristic mist. It ensures that the land is green and even lush for part of the year. Without this water our state could not exist as we know it."
 abm_mhr_mercenary_traditions: "Mercenary Traditions"
 abm_mhr_mercenary_traditions_desc: "The Mahra have been in this region for a long time. According to some we have been here longer than all other groups of southern Arabia. We have, however, often been a lesser partner of greater neighbors. Mahri soldiers have served in the armies of Yemen or Oman and our mercenaries are what made a name for us abroad rather than our own armies."
 abm_mhr_mahra_tribes: "The Mahra Tribes"
 abm_mhr_mahra_tribes_desc: "Our language is unlike many of the others spoken in this peninsula, many even make a difference between the Mahri and Arabs. Be that as it may our people descend from the sons of the great Mahra bin Haydan bin Qahtan bin Yarub. Since time immemorial our people have been divided in two groups. The Banu Sar control the coastal Mahra country while the Banu Shahawih control the inland.\nIf we are to prosper we must unite the inland and the tribes of the inland and the coastal tribes. For both groups are needed to both defend and expand our country."
 abm_mhr_pilots_of_the_arabian_sea: "Pilots of the Arabian Sea"
 abm_mhr_pilots_of_the_arabian_sea_desc: "We have sailed the waters of the Arabian Sea for hundreds of years and few captains know the waters as well as we do. There are Mahri communities from the Swahili cities of East Africa to the bustling suburbs of Cairo or Basra. Our maritime heritage has made our sailors highly sought after not only to man ships, but also as valuable pilots to guide ships of all nations through treacherous or unknown waters."
 abm_mhr_camels: "Mahra Camels"
 abm_mhr_camels_desc: "The Camels of Mahra are famous far beyond our own borders. They were valued by the Caliphs of old and ancient poets, such as Abu Tammam, have sung praise to their names. We have even been told that in faraway countries the very name Mahri or ‘Mehari’ have become synonymous with a riding camel.\nThe Mahri camels have served pilgrims, merchants and raiders well for centuries. As our state expands and modernizes we must continue to maintain the ancient breeding and keeping traditions that has allowed us to foster such versatile beasts of burden."
 abm_mhr_book_of_navigation: "Book of Navigation"
 abm_mhr_book_of_navigation_desc: "The skill and experience of our navigators is known from Zanzibar to Timor, but we cannot risk trade secrets dying with a single man. We should have our best navigators compile a new handbook for navigation. Up to date and with no secrets kept, for the benefit of future generations of seamen."
 abm_mhr_rein_in_the_chiefs: "Rein in the Chiefs"
 abm_mhr_rein_in_the_chiefs_desc: "Traditionally much of the power in our society has been in the hands of the ‘Mukaddams’, chiefs that control the various communities in the inland, while our Sultans have spent much of the year on the island of Socotra. This can sometimes lead to unnecessary bloodspill internally and even new conflicts arising with our neighbors.\nIt is time we step in to control the chiefs or, if need be, replace them with more loyal servants."
 abm_mhr_ideas_ambition: "Mahri Ambition"
 abm_mhr_ideas_ambition_desc: "Mahri Ambition"

 abm_bedouin_ideas_tradition_1: "Arabian Traditions I"
 abm_bedouin_ideas_tradition_1_desc: "Arabian Traditions I"
 abm_bedouin_ideas_tradition_2: "Arabian Traditions II"
 abm_bedouin_ideas_tradition_2_desc: "Arabian Traditions II"
 abm_bedouin_arab_indian_ocean_trade: "Indian Ocean Trade"
 abm_bedouin_arab_indian_ocean_trade_desc: "Our sailors have been to the Swahili coasts and as far as Hindustan and even the Malay lands. We can play a critical role in the flow of goods between these wealthy regions."
 abm_bedouin_arabian_horses: "Arabian Horses"
 abm_bedouin_arabian_horses_desc: "Every cavalryman has heard that the best horses are Arabian horses, and who has a larger supply of these beauties than we do? Put some of our top horses to stud and watch as we produce a steady supply of the greatest horses known to man."
 abm_bedouin_land_of_the_prophet: "Land of the Prophet"
 abm_bedouin_land_of_the_prophet_desc: "The people of our lands were the first to hear the words of the Prophet Muhammad, peace be upon him. Every day we can see clans and tribes descended from people who lived in his day and heard his words. Though Islam may spread far and wide to the ends of the Earth, never forget that it started in this holy oasis of faith."
 abm_bedouin_spreading_the_prophets_word: "Spreading the Prophet's Word"
 abm_bedouin_spreading_the_prophets_word_desc: "There is no god but Allah, Muhammad is His messenger. By now, all men should know these holy words, but a shocking amount still dwell in the pitiable state of ignorance of Islam. Our missionaries are ready to spread the words of the Prophet."
 abm_bedouin_bedouin_traders: "Bedouin Traders"
 abm_bedouin_bedouin_traders_desc: "There aren't many sharply-delineated man-made borders in Arabia, and even if there were, the Bedouin would ignore them. Though the Bedouin nomadic journeys through our lands and into others has risks, it also facilitates easy access to trade through the entire region, as Bedouin nomads know no import tariffs or trade embargoes."
 abm_bedouin_arab_clan_loyalties: "Clan Loyalties"
 abm_bedouin_arab_clan_loyalties_desc: "Our people are divided into many clans and tribes. If we can ensure that all the clan leaders serve our state we will have an valuable source of commanders and experienced Bedouin raiders that cannot be overestimated."
 abm_bedouin_arabia: "Arabia"
 abm_bedouin_arabia_desc: "Although Arabia has many different clans, tribes and countries, all share in the use of the Arabic language, it forms the unifying feature of all Arabs. Under a strong leadership we can unite all Arabian lands under a single flag and one ruler."
 abm_bedouin_arabian_ideas_ambition: "Arabian Ambition"
 abm_bedouin_arabian_ideas_ambition_desc: "Arabian Ambition"