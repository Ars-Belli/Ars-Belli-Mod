l_english:
 abm_oir_ideas_tradition_1: "Oirat Traditions I"
 abm_oir_ideas_tradition_1_desc: "Oirat Traditions I"
 abm_oir_ideas_tradition_2: "Oirat Traditions II"
 abm_oir_ideas_tradition_2_desc: "Oirat Traditions II"
 abm_fearsome_warriors_of_tumu: "Fearsome Warriors of Tumu"
 abm_fearsome_warriors_of_tumu_desc: "The Oirats are skillful and feared horsemen, capable of embarrassing far vaster infantry-based armies with their greater maneuverability. The sound of hoofbeats drumming across the plains shall strike fear into the hearts of our enemies!"
 abm_life_of_steppe_warrior: "The Life of a Steppe Warrior"
 abm_life_of_steppe_warrior_desc: "The Arid steppe is a foreboding and unforgiving place for the unprepared. We as a people are used to living in the harshest of environments and as such our people are sturdy and have a knack for survival. We will ensure that all of our soldiers share these experiences and are thus able to survive much better."
 abm_the_four_oirats: "The Four Oirats"
 abm_the_four_oirats_desc: "The Alliance of the Four Oirat Tribes binds the Western Mongols together. Made up of the Dzungars (or Choros), Torghut, Dörbet and Khoshut, it first emerged in 1399 and has held firm ever since, allowing a powerful Oirat state to emerge Central Asian Steppe."
 abm_todo_besheg_script: "Todo Besheg Script"
 abm_todo_besheg_script_desc: "The Todo Besheg or 'Clear' Script adapts the Mongolian script to ensure that all sounds in the spoken Oirat language can be distinguished in it, as well as making it easier to transcribe Sanskrit and Tibetic languages. It will be a considerable boon to us in our administration and in spreading knowledge acquired by our neighbors and foreign subjects."
 abm_oir_great_khans_legacy: "Legacy of the Great Khan"
 abm_oir_great_khans_legacy_desc: "There are many among our people who remember the exploits of our people under the leadership of the Great Khan. They would wish to emulate these and reclaim his legacy - but this time, the Khan should be an Oirat, not one of the Eastern Mongols."
 abm_defiance_of_the_dzungars: "Defiance of the Dzungars"
 abm_defiance_of_the_dzungars_desc: "The Dzungars or 'left hands' are the most fearsome tribe of the Oirats. Widely hated and feared by our enemies, they will fight to the last man, woman or child rather than surrender to a foreign ruler."
 abm_glory_of_conquest: "The Glory of Conquest"
 abm_glory_of_conquest_desc: "Let it be known that boy cannot be a man unless he has rode first with our invincible host, that he can take no wife until he has defiled another man's wife, that he is not worthy of a hut until he has burnt down someone else's. Let service in our armies be the only route to manhood."
 abm_oir_ideas_ambition: "Oirat Ambition"
 abm_oir_ideas_ambition_desc: "Oirat Ambition"
