l_english:
 abm_cossack_black_sea_raids: "Cossack Black Sea Raids"
 abm_cossack_black_sea_raids_desc: "Our Cossacks take to the seas in their swift chayka boats, raiding the coasts for plunder and captives. Grants the ability to hire privateers and raid for slaves, but only while we control a port."

 # Open plains privilege (steppe nations, kingdom rank or above)
 abm_cossack_open_plains_privilege: "Cossack Open Plains"
 abm_cossack_open_plains_privilege_desc: "The Host takes over the administration of the open plains: post stations and patrols make the steppe governable. Our flatland [locations|e] gain #G +10%#! [proximity|e] efficiency, the [proximity|e] cost through [roads|e] drops by #G 2#!, and the state is pushed #G 10#! points towards centralisation. Requires a kingdom or empire whose original capital lies in the steppes and a settled faith, and cannot be combined with the tribal version."
 abm_tribal_open_plains_privilege: "Tribal Open Plains"
 abm_tribal_open_plains_privilege_desc: "The tribal elders take over the administration of the open plains: their riders keep the roads and the grazing routes open. Our flatland [locations|e] gain #G +10%#! [proximity|e] efficiency, the [proximity|e] cost through [roads|e] drops by #G 2#!, and the state is pushed #G 10#! points towards centralisation. Requires a kingdom or empire whose original capital lies in the steppes and a settled faith, and cannot be combined with the cossack version."
 abm_open_plains_privilege_tt: "Flatland [locations|e]: #G +10%#! [proximity|e] efficiency. [roads|e]: #G -2#! [proximity|e] cost. One-time: #G +10#! centralisation."
 abm_tt_steppe_flatland_location: "Our flatland [locations|e] gain:"
