 abm_gal_ideas_tradition_1: "Galician Tradition I"
 abm_gal_ideas_tradition_1_desc: "Galician Tradition I"
 abm_gal_ideas_tradition_2: "Galician Tradition II"
 abm_gal_ideas_tradition_2_desc: "Galician Tradition II"
 abm_gal_way_of_st_james: "The Way of St. James"
 abm_gal_way_of_st_james_desc: "One of the largest paths of pilgrimage in Christendom leads to the Cathedral of Santiago de Compostela in Galicia. The shrine to the Apostle James draws foreigners from across the known world, but their gold all speaks the same language to our coffers."
 abm_gal_la_bella: "Galicia la Bella"
 abm_gal_la_bella_desc: "Unlike the dry scrublands to the south, Galicia's landscape is dominated by mountains and ceaseless rain. Galicians themselves are almost as inhospitable to invaders as the terrain, as many a foreigner came to realize. Let none dare step in our land!"
 abm_gal_rein_in_the_cities: "Rein in the Cities"
 abm_gal_rein_in_the_cities_desc: "The last centuries has been dominated by bloody conflict between the nobility and church on one side, and the urban burghers on the other. In the worst years, many cities have been independent in all but name from the Galician crown. By crushing these petty oligarchs, peace and order will return to the realm."
 abm_gal_shipyards: "Galician Shipyards"
 abm_gal_shipyards_desc: "The Atlantic is a harsh mistress, and only the sturdiest vessels may survive her harrowing embrace. Galician vessels have always been renowned for their sturdiness. With further patronage from the Crown, these dockyards can continue crafting formidable ships that can withstand waves and cannon alike. "
 abm_gal_santiago_y_cierra: "Santiago y Cierra!"
 abm_gal_santiago_y_cierra_desc: "'Santiago y Cierra!' (St. James and close!) was the rallying call of Spanish crusaders against the Moors during the Reconquista. It was in Galicia that the holy remains of St. James were found, so let it be known that the Apostle holds our people in especial esteem. Victory and glory await only the bold, and none are bolder than Galicians!"
 abm_gal_sailors_of_the_cantabrian_sea: "Sailors of the Cantabrian Sea"
 abm_gal_sailors_of_the_cantabrian_sea_desc: "It takes a brave sailor to set out in the treacherous waters of the Cantabrian Sea and Bay of Biscay. But not even some of the harshest weather in the known world has dampened Galicia's love of the ocean. After the harsh battering of countless storms, the Galician fleet knows no fear from mere shot and cutlass."
 abm_gal_irmandinos: "Irmandinos"
 abm_gal_irmandinos_desc: "The Galician peasant is equally legendary for his hardiness and rebellious temperament. By drafting the members of the bandit 'brotherhoods' into our army, we can gain a hardened core of ruthless and experienced soldiers. Our high-born classes are sick of having their manors burned down anyway. "
 abm_gal_ideas_ambition: "Galician Ambition"
 abm_gal_ideas_ambition_desc: "Galician Ambition"
 abm_asu_ideas_tradition_1: "Asturian Tradition I"
 abm_asu_ideas_tradition_1_desc: "Asturian Tradition I"
 abm_asu_ideas_tradition_2: "Asturian Tradition II"
 abm_asu_ideas_tradition_2_desc: "Asturian Tradition II"
 abm_asu_reconquista: "Reconquista"
 abm_asu_reconquista_desc: "The former Asturian lands have been divided between upstart Spanish kingdoms. They must all be brought back into the Asturian fold."
 abm_asu_camino_de_santiago: "Camino de Santiago"
 abm_asu_camino_de_santiago_desc: "We are the custodians of the holy pilgrimage route, the Way of Saint James. It is our duty to ensure that pious travellers can pass safely through our lands to reach the sacred site of Santiago."
 abm_asu_aristocracy: "Asturian Aristocracy"
 abm_asu_aristocracy_desc: "Asturian high society has ancient roots and deep pockets. We should ensure that they have an honored place in our nation."
 abm_asu_colonialism: "Voyage to the New World"
 abm_asu_colonialism_desc: "Asturian financiers are eager to begin investing in New World colonies. We should establish colonial ventures of our own to maximize the profit."
 abm_asu_millenarian_revival: "Millenarian Revival"
 abm_asu_millenarian_revival_desc: "These are dark times, and omens of the apocalypse are clear to see. This is a sign that we must renew our faith daily and dedicate ourselves to spreading the word of the Lord to the far reaches of the Earth."
 abm_asu_unify_the_provinces: "Unify the Provinces"
 abm_asu_unify_the_provinces_desc: "Administrative divisions within Asturias and Cantabria are woefully inefficient. The provinces must be consolidated into more centralized districts so aid in the administration of justice and the raising of levies."
 abm_asu_early_industrialism: "Early Industrialism"
 abm_asu_early_industrialism_desc: "We have discovered ample sources of coal in the hills of Asturias. We should take advantage of new advances in machinery and use our natural resources to boost our manufacturing industries."
 abm_asu_ideas_ambition: "Asturian Ambition"
 abm_asu_ideas_ambition_desc: "Asturian Ambition"
