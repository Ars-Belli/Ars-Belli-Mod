 # India — Valangai / Perundanattu Velaikkarar (South Indian bodyguard infantry)
 abm_dmb_valangai_velaikkarar: "Valangai Velaikkarar"
 abm_dmb_valangai_velaikkarar_desc: "The 'Right-hand' division of South Indian bodyguard infantry, drawn from coastal communities and trained to fight in rough terrain."
 abm_dmb_perundanattu_velaikkarar: "Perundanattu Velaikkarar"
 abm_dmb_perundanattu_velaikkarar_desc: "Provincial Velaikkarar — elite royal guards and specialist infantry serving South Indian rulers, recruited from coastal dock populations."
 abm_dmb_elite_perundanattu_velaikkarar: "Elite Perundanattu Velaikkarar"
 abm_dmb_elite_perundanattu_velaikkarar_desc: "Veteran provincial bodyguards hardened by generations of service, masters of close-quarters combat in dense terrain."

 # India — Hasshashun Infiltrators
 abm_a_india_hasshashun_infiltrators: "Hasshashun Infiltrators"
 abm_a_india_hasshashun_infiltrators_desc: "Swift and deadly infiltrators of the Hasshashun order, trained to strike from the shadows with devastating speed."
 abm_a_india_veteran_hasshashun_infiltrators: "Veteran Hasshashun Infiltrators"
 abm_a_india_veteran_hasshashun_infiltrators_desc: "Battle-hardened infiltrators of the Hasshashun order, their experience in covert operations makes them elusive and lethal."
 abm_a_india_elite_hasshashun_infiltrators: "Elite Hasshashun Infiltrators"
 abm_a_india_elite_hasshashun_infiltrators_desc: "The pinnacle of the Hasshashun order — shadow warriors whose reputation alone demoralizes enemies before the first blow is struck."
