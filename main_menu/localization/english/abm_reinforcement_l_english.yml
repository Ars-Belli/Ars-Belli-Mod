l_english:
 ABM_REINFORCEMENT_ON_TT: "#T Reinforce Armies#!\nOur regiments refill their men, paying gold and manpower for every man. Untick to stop reinforcing in all our armies."
 ABM_REINFORCEMENT_OFF_TT: "#T Reinforcement Stopped#!\nOur regiments do not refill and cost nothing to reinforce. Tick to start reinforcing again."
 STATIC_MODIFIER_NAME_abm_reinforcement_stopped: "Reinforcement Stopped"
 STATIC_MODIFIER_DESC_abm_reinforcement_stopped: "We have switched off reinforcement in the economy panel: our regiments do not refill."
