# --- Shirvan (SRV) ---
 abm_srv_ideas_tradition_1: "Shirvani Traditions I"
 abm_srv_ideas_tradition_1_desc: "Shirvani Traditions I"
 abm_srv_ideas_tradition_2: "Shirvani Traditions II"
 abm_srv_ideas_tradition_2_desc: "Shirvani Traditions II"

 abm_srv_khalwati_order: "The Khalwati Order"
 abm_srv_khalwati_order_desc: "The leader of the Sufi Khalwati lodge, Yahya al-Bakubi, has foreseen our ruler as his successor and successor to the guidance of the order. Being the representative of such an extensive brotherhood of Sufis will bring our ruler great legitimacy in the eyes of his subjects."

 abm_srv_fortresses_of_shirvan: "Fortresses of Shirvan"
 abm_srv_fortresses_of_shirvan_desc: "Shirvan has maintained its existence through the centuries by building and maintaining extensive fortifications. A great number of castles, watchtowers and fortresses dot our landscapes, making our kingdom a highly defensible target."

 abm_srv_tribesmen_of_the_caucasus: "Tribesmen of the Caucasus"
 abm_srv_tribesmen_of_the_caucasus_desc: "Our people have a long and proud tradition of raising fine horses and breeding expert riders. The tribesmen from the mountains of Caucasus are eagerly seeking to join our cause, bringing their expert cavalry with them."

 abm_srv_persianate_patronage: "Persianate Patronage"
 abm_srv_persianate_patronage_desc: "The Shirvan Shah's were for centuries under the cultural influence of the great Persian empires to their south. Persian poets, scholars and artists could find patronage at the court of Shirvan and in return provided prestige and highly sought after administrative knowledge."

 abm_srv_caspian_trade: "Caspian Trade"
 abm_srv_caspian_trade_desc: "Expensive goods from Italy, the Silk Road and the Indian Ocean all find their ways to the Caspian Sea. Shirvan is positioned perfectly to interject itself into this extensive trade network and act as the middle-hand between the different civilizations."

 abm_srv_shirvani_architecture: "Shirvani Architecture"
 abm_srv_shirvani_architecture_desc: "Since the reign of Ibrahim the first, the Shirvanshahs have been great patrons of architecture. Distinctive buildings of Shirvani style have both brought great beauty to our lands and proven to be records of our dynasty that will last for centuries."

 abm_srv_merchants_of_baku: "Merchants of Baku"
 abm_srv_merchants_of_baku_desc: "Cosmopolitan Baku is a city that has attracted the most entrepreneurial merchants from Persia, the Caucasus and India. By attracting as many merchants as possible to our capital city we can greatly increase our trade revenues."

 abm_srv_ideas_ambition: "Shirvani Ambition"
 abm_srv_ideas_ambition_desc: "Shirvani Ambition"

# --- Armenia (ARM) ---
 arm_legacy_of_hayk: "Legacy of Hayk"
 arm_legacy_of_hayk_desc: "Our people trace their lineage to Hayk Nahapet, the great-great-grandson of Noah, who defeated the tyrant Bel and established our nation. We carry forward this ancient legacy of independence and defiance against all who would subjugate us."

 arm_mount_ararat: "Mount Ararat"
 arm_mount_ararat_desc: "Mount Ararat stands as the eternal symbol of our homeland, where Noah's Ark came to rest. This sacred mountain watches over our people and reminds us of our divine covenant and our rightful place in these lands."

 arm_apostolic_church: "Apostolic Church"
 arm_apostolic_church_desc: "Armenia was the first nation to establish Christianity as its state religion. This treasure, the spiritual independence of our people, must be preserved at all costs, ensuring that our unique Apostolic faith remains the guiding light for all Armenians."

 arm_land_reclamation: "Land Reclamation"
 arm_land_reclamation_desc: "Armenia has been ravaged by war for centuries, leaving fertile valleys abandoned and cities depopulated. By investing in the reclamation of our ancestral lands, we can restore prosperity and bring our scattered people back to their homes."

 arm_melikdom_organization: "Melikdom Organization"
 arm_melikdom_organization_desc: "As one of the few bastions of Armenian autonomy, the melikdoms have preserved our traditions through centuries of foreign rule. By organizing these noble houses into a proper administration, we can finally establish an efficient system of taxation."

 arm_mountain_armies: "Mountain Armies"
 arm_mountain_armies_desc: "Our homeland's rugged terrain has shaped our warriors into masters of mountain warfare. The highland passes and fortified valleys of Armenia are our greatest allies against any invader who dares to march against us."

 arm_nakharar_titles: "Nakharar Titles"
 arm_nakharar_titles_desc: "Weakened by numerous invasions over the centuries, the Armenian nobility has been forced to adapt and compromise. By restoring the ancient titles and honors of the Nakharar houses, we can once again inspire our warriors to great feats of arms."

# --- Georgia (GEO) ---
 geo_legacy_of_saint_george: "Legacy of Saint George"
 geo_legacy_of_saint_george_desc: "Saint George is our eternal patron, his cross emblazoned upon our banners and his spirit guiding our warriors. The legacy of the dragon-slayer fills our people with courage and righteous fury against all who threaten our sacred homeland."

 geo_georgian_isolation: "Georgian Isolation"
 geo_georgian_isolation_desc: "Surrounded by powerful countries that follow different faiths, Georgia must learn to survive by maneuvering wisely. We will extend our hand in diplomacy even to those who might one day threaten us, for isolation in our region means certain death."

 geo_georgian_principalities: "Georgian Principalities"
 geo_georgian_principalities_desc: "Our kingdom has long been divided among powerful princely houses, each ruling their ancestral domains with fierce independence. By uniting these principalities under a common purpose, we can forge a Georgia stronger than any that came before."

 abm_geo_restoration_of_fortresses_and_churches: "Restoration of Fortresses and Churches"
 abm_geo_restoration_of_fortresses_and_churches_desc: "To restore the realm, we must restore both its spiritual and military foundations. Rebuilding our ancient fortresses will secure our borders, while restoring our churches will renew the faith of our people."

 geo_sadrosho_districts: "Sadrosho Districts"
 geo_sadrosho_districts_desc: "Sadrosho are special military-administrative districts that form the backbone of our realm's organization. By expanding and formalizing this system, we can ensure that every region contributes its fair share of men and resources."

 geo_georgian_unification: "Georgian Unification"
 geo_georgian_unification_desc: "The dream of a unified Georgia, encompassing all the lands of the Kartvelian peoples, has burned in our hearts for generations. Now is the time to make this dream a reality and forge a nation that will stand the test of time."

# --- Circassia (CIR) ---
 cir_mercenary_employment: "Mercenary Employment"
 cir_mercenary_employment_desc: "The warrior traditions of our people are renowned throughout the region. Circassian fighters have long served as mercenaries in foreign courts, bringing wealth and military expertise back to our homeland."

 cir_horsemen_of_the_steppe: "Horsemen of the Steppe"
 cir_horsemen_of_the_steppe_desc: "Across the great steppe our horsemen ride, masters of the saddle and the bow. The Circassian cavalry has been feared for generations, and by investing in our breeding and training programs, we can ensure this fear endures."

 cir_city_and_fortress: "City and Fortress"
 cir_city_and_fortress_desc: "Our settlements are both thriving cities and formidable fortresses, their walls rising from the mountainsides as a testament to our resilience. By strengthening our urban defenses, we make every Circassian town a bastion against invasion."

 abm_cir_grand_prince_of_circassia: "Grand Prince of Circassia"
 abm_cir_grand_prince_of_circassia_desc: "The many tribes and clans of Circassia require a strong hand to guide them. By consolidating authority under a single Grand Prince, we can present a united front to the world and command the respect our people deserve."

 cir_multireligious_society: "Religious Flexibility"
 cir_multireligious_society_desc: "Right at the crossroads of Christianity and Islam, Circassia has learned to accommodate multiple faiths within its borders. This tradition of tolerance allows us to deal fairly with all our neighbors and subjects."

# --- Samtskhe (SME) ---
 sme_atabegs_of_samtskhe: "Atabegs of Samtskhe"
 sme_atabegs_of_samtskhe_desc: "Samtskhe is in many ways a frontier principality, ruled by the Jaqeli family who hold the title of Atabeg. Our rulers have long balanced between the great powers surrounding us, and this tradition of pragmatic leadership serves us well."

 sme_proactive_diplomacy: "Proactive Diplomacy"
 sme_proactive_diplomacy_desc: "While a part of Georgia, Samtskhe has always maintained its own distinct diplomatic identity. Our survival depends on actively seeking allies and managing relationships with the great powers on all sides, never waiting passively for events to unfold."

 sme_fortresses_of_samtskhe: "Fortresses of Samtskhe"
 sme_fortresses_of_samtskhe_desc: "Our country is a mountainous borderland, crisscrossed by strategic passes and dotted with ancient strongholds. By maintaining and expanding our network of fortresses, we can make Samtskhe an unassailable fortress in its own right."

 sme_protect_trade_routes: "Protect the Trade Routes"
 sme_protect_trade_routes_desc: "Our position at the crossroads of empires places us astride some of the most valuable trade routes in the world. By guaranteeing the safety of merchants passing through our lands, we can reap enormous economic benefits while strengthening our diplomatic position."

# --- Generic Caucasus Ideas ---
 abm_caucasus_ideas_tradition_1: "Caucasian Traditions I"
 abm_caucasus_ideas_tradition_1_desc: "Caucasian Traditions I"
 abm_caucasus_ideas_tradition_2: "Caucasian Traditions II"
 abm_caucasus_ideas_tradition_2_desc: "Caucasian Traditions II"

 abm_crossroads_of_cultures: "Crossroad of Cultures"
 abm_crossroads_of_cultures_desc: "The Caucasus mountains have always been a meeting point of civilizations — Persians, Turks, Arabs, Mongols, and Russians have all left their mark upon our lands. We have learned to draw strength from this diversity, incorporating the best of every culture into our own."

 abm_alan_mercenaries: "Alan Mercenaries"
 abm_alan_mercenaries_desc: "Alans have always lived in the highlands of the Caucasus, and their warriors are renowned for their skill in battle. By opening our coffers to these fierce tribesmen, we can add a formidable force to our armies."

 abm_caucasus_hit_and_run: "Hit and Run"
 abm_caucasus_hit_and_run_desc: "The nature of the Caucasian terrain has taught our warriors the value of swift strikes and rapid retreats. Our soldiers excel at guerrilla tactics, making the mountains themselves a weapon against any invader foolish enough to enter our domain."

 abm_persian_poetry: "Persian Poetry"
 abm_persian_poetry_desc: "Even in the remote regions of Caucasus, the influence of Persian culture is felt through poetry, art, and philosophy. Patronizing poets and scholars brings refinement to our courts and prestige throughout the civilized world."

 abm_highland_khans: "Highland Khans"
 abm_highland_khans_desc: "Throughout the centuries our people have been led by mighty khans who ruled from mountain strongholds. This tradition of strong local leadership ensures that every valley and village remains loyal and well-governed."

 abm_eastern_influence: "Eastern Influence"
 abm_eastern_influence_desc: "Our lands are located at a crossroad between east and west, and the wealth and knowledge of the eastern empires are within our grasp. By opening ourselves to these influences, we can accelerate our development and strengthen our position."

 abm_caucasus_cavalry_armies: "Cavalry Armies"
 abm_caucasus_cavalry_armies_desc: "Rumors spread from the west of armies that rely entirely on dismounted soldiers. While our infantry is formidable, we know that the true strength of a Caucasian army lies in its cavalry. Let us maintain this proud tradition."

 abm_caucasus_ideas_ambition: "Caucasian Ambition"
 abm_caucasus_ideas_ambition_desc: "Caucasian Ambition"
