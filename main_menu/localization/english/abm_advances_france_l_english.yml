l_english:

 abm_bri_ideas_tradition_1: "Breton Tradition I"
 abm_bri_ideas_tradition_1_desc: "Breton Tradition I"
 abm_bri_ideas_tradition_2: "Breton Tradition II"
 abm_bri_ideas_tradition_2_desc: "Breton Tradition II"
 abm_legacy_of_breton_independence: "Legacy of Breton Independence"
 abm_legacy_of_breton_independence_desc: "Brittany has never been part of France. Though we have been ravaged by Franks, Vikings, and the English in the past, we have, thus far, maintained our identity as a people apart. Let all of our neighbors be aware that Brittany will remain free, the last home of true Gallic traditions."
 abm_estates_of_brittany: "The Estates of Brittany"
 abm_estates_of_brittany_desc: "First called in the 14th century, the Estates of Brittany allowed free men from all rungs of society, even the Third Estate, to share their grievances and petition the Duke for redress. By calling in the Estates, we can vent some of the tension in our lands."
 abm_breton_march: "Breton March"
 abm_breton_march_desc: "The old kings of Francia called the militarized frontier between their lands and Brittany the Breton March. At the time, they wanted it to keep us out. Let us revive the fortifications of the Breton March, this time to keep our enemies out."
 abm_breton_catholicism: "Breton Catholicism"
 abm_breton_catholicism_desc: "The French may have claimed to be the 'eldest daughter of the Church' since the days of Clovis, but their observance is spotty and their fealty to Rome only evident when it suits them. The Breton doesn't hide his veneration of the Blessed Virgin or his loyalty to the teachings of His Holiness and the one true Catholic Church."
 abm_protect_the_coastline: "Protect the Coastline"
 abm_protect_the_coastline_desc: "Brittany is uniquely exposed to danger from invasion from the seas, as our country contains more than the usual amount of coastline. We need an adequate number and supply of ships to prevent ourselves from falling to foreign invaders."
 abm_league_of_the_public_weal: "League of the Public Weal"
 abm_league_of_the_public_weal_desc: "We must turn to other powers in order to protect our independence from centralized power, whether in England or France. The diplomat's gilded tongue does as much to defend us as the guns of our troops."
 abm_catholicon: "The Catholicon"
 abm_catholicon_desc: "In 1464, Jehan Lagadeuc wrote the first trilingual dictionary, which contained words in Latin, Breton, and French. This amazing book was the first dictionary in either the Breton or the French language. By distributing copies of the Catholicon, we can show that Breton is just as much a major language as French."
 abm_bri_ideas_ambition: "Breton Ambition"
 abm_bri_ideas_ambition_desc: "Breton Ambition"
 abm_bur_ideas_tradition_1: "Burgundian Tradition I"
 abm_bur_ideas_tradition_1_desc: "Burgundian Tradition I"
 abm_bur_ideas_tradition_2: "Burgundian Tradition II"
 abm_bur_ideas_tradition_2_desc: "Burgundian Tradition II"
 abm_golden_fleece: "The Order of the Golden Fleece"
 abm_golden_fleece_desc: "The order would go on to become one of Europe's foremost orders of chivalry. Being a Knight of the Golden Fleece is a mark of great status and reflects well upon us."
 abm_compagnies_ordonnance: "The Compagnies d'Ordonnance"
 abm_compagnies_ordonnance_desc: "Originally created by the French Monarchy to regularize the recruitment of troops. If we bring this into Burgundy, we will streamline the recruitment of troops."
 abm_bur_estates_general: "Promote the Estates General"
 abm_bur_estates_general_desc: "The State of Burgundy is a Feudal creation with various parts joined to Burgundy under different conditions, which has created strong local identities. By promoting the Estates General, we give a forum for these interests making people feel like they belong more."
 abm_reform_of_feudal_army: "Reform of the Feudal Army"
 abm_reform_of_feudal_army_desc: "The traditional army consists of feudal levies augmented by mercenaries. This is simply no longer effective - we need to modernize our army. The creation of a core of professionals will strengthen our army."
 abm_integrated_towns: "Integrate the Towns in the Estates General"
 abm_integrated_towns_desc: "The traditional Estates General is very much built around the interests of the first estate (clergy) and second estate (nobility) economic changes have strengthened the power of the third estate (everyone else). We need to refine the composition of the Estates General to increase the influence of the third estate without unduly impinging on the rights of the others."
 abm_freedom_of_worship: "Allow Freedom of Worship"
 abm_freedom_of_worship_desc: "Although the Church is putting pressure on us to enforce greater religious orthodoxy, the towns citing the doctrine of Renaissance Humanism have been urging greater toleration. Although we cannot completely ignore the clergy the towns are simply too important to ignore."
 abm_bur_regimental_system: "Create the Regimental System"
 abm_bur_regimental_system_desc: "In order to facilitate more efficient recruitment to our armies we are tying regiments to regions and making each region responsible for providing recruits to its local regiment. This will streamline the process of recruiting and result in more available manpower."
 abm_bur_ideas_ambition: "Burgundian Ambition"
 abm_bur_ideas_ambition_desc: "Burgundian Ambition"
 abm_pro_ideas_tradition_1: "Provençal Tradition I"
 abm_pro_ideas_tradition_1_desc: "Provençal Tradition I"
 abm_pro_ideas_tradition_2: "Provençal Tradition II"
 abm_pro_ideas_tradition_2_desc: "Provençal Tradition II"
 abm_memory_of_angevin_claims: "Memory of Angevin Claims"
 abm_memory_of_angevin_claims_desc: "After the collapse of the Hohenstaufen ambitions to dominate Christendom in the 13th century, in 1264 His Holiness Urban IV wisely removed the titles King of Naples and Sicily from the Hohenstaufen portfolio and bestowed them upon our ancestor Charles of Anjou, who also seized the title King of Albania by his own merits. The treacherous Aragonese, citing their marriage into the Hohenstaufen line, stole Sicily from us in 1282 and recently finished their violation of Papal will by usurping the title 'King of Naples' in 1442 away from our Good King René. The legacy of Charles of Anjou has fallen far, but we remember the vast holdings of our forefathers and their claims stretching all the way to Albania and Jerusalem."
 abm_revive_house_of_anjou: "Revive House of Anjou"
 abm_revive_house_of_anjou_desc: "The senior line of the House of Anjou went extinct in 1435 when Queen Joanna II of Naples passed away. Long live our junior line, the House of Valois-Anjou, fusion of the two greatest houses of France! Through the fusion of two dynasties, the royal blood of Hugh Capet flows twice over. With a little work and planning, the devious throne-snatching of our Angevin forebears and the military valor of our Valois ancestors can unite to make the House of Valois-Anjou greater than either."
 abm_composite_monarchy: "Composite Monarchy"
 abm_composite_monarchy_desc: "Composite monarchy is a technical term for a kingdom that contains different pieces that are governed by their own legal codes and traditions but are nonetheless united under one crown. Can there be a better description for the Angevin realms? Once upon a time our family had to govern lands from Anjou to Albania. Today, our reach might be somewhat smaller, but the duties of a Duke of Lorraine, a Duke of Bar, a Duke of Anjou, and a Count of Provence are considerably different even when all those titles are held by the same man. By our flexibility in running vastly different realms to one common goal, we placate our subjects and create a whole that is far greater than the sum total of its parts."
 abm_tarascon_castle: "Tarascon Castle"
 abm_tarascon_castle_desc: "Completed in 1449 by Good King René, this fortress is one of the mightiest in all Christendom and is one of the finest examples of military architecture of our day. Use it as a fortress, as an armory, as a prison, or just as a recreational chateau for a ruler in need of relaxation."
 abm_public_weal: "Public Weal"
 abm_public_weal_desc: "We are not subjects to the Valois of Paris. Sometimes, however, we feel that Paris has forgotten our ancient privileges. Perhaps if we make common cause with other noblemen trying to break out of Paris' grasp, we will find the strength in numbers needed to retain our prerogatives."
 abm_toulon_dockyard: "Toulon Dockyard"
 abm_toulon_dockyard_desc: "Our land is a natural Mediterranean port. The ancient Greeks realized the value of Marseilles when they settled it under the name Massilia at the dawn of memory. While Marseilles can remain the great commercial hub, Toulon would make a perfect place for a dockyard, naval armory, and staging ground for a fleet for our great country."
 abm_provencal_quilting: "Provençal Quilting"
 abm_provencal_quilting_desc: "One of the things that distinguishes our tongue from French is the use of 'oc' instead of 'oui' for yes. This can be observed at any hour of the day by people shouting 'Oc! Oc!' when presented with the chance to own boutis, stuffed wholecloth quilts. These distinctive pieces of Provence's heritage can be found in any place in Europe and their quality leaves foreigners swooning. Much like the Angevin holdings have always been a quilt of different peoples and heritages yet still one distinctive whole, the boutis is a glorious metaphor for our beautiful country."
 abm_pro_ideas_ambition: "Provençal Ambition"
 abm_pro_ideas_ambition_desc: "Provençal Ambition"
 abm_french_culture_ideas_tradition_1: "French Ducal Tradition I"
 abm_french_culture_ideas_tradition_1_desc: "French Ducal Tradition I"
 abm_french_culture_ideas_tradition_2: "French Ducal Tradition II"
 abm_french_culture_ideas_tradition_2_desc: "French Ducal Tradition II"
 abm_french_men_of_trade: "Men of Trade"
 abm_french_men_of_trade_desc: "It has always been known to the French kings that men from the provinces are best suited to dictate the trade policies of the kingdom as our people are masters in the art of trade. France is ideally located, at the crossroad of the Atlantic and the Mediterranean, between England and the Italian cities as well as Germany and the Iberian Peninsula. The wealth of the world flows through our lands!"
 abm_french_renaissance_palaces: "Renaissance Palaces"
 abm_french_renaissance_palaces_desc: "Our ancestors used to protect themselves in heavily fortified castles. With the coming of the renaissance, however, prestige and power no longer relies on such fortresses. Let us instead build magnificently decorated palaces to show our prosperity and splendor to other Frenchmen and foreigners alike."
 abm_french_qui_ruit_et_lethum: "Qui Ruit Et Lethum"
 abm_french_qui_ruit_et_lethum_desc: "From the wet areas of England to the dry regions of the Holy Land our knightly ancestors fought valiantly from horseback. Had they seen us today they might make fun of our ruffs and laces yet underneath this magnificent varnish we still exert the 'furor gallicus' and none can resist us on the battlefield!\nLet our musketmen be to the modern battlefield what the French Knights were to the medieval wars. All shall fear the might of our armies!"
 abm_french_religious_conviction: "Religious Conviction"
 abm_french_religious_conviction_desc: "Our people have always believed in standing strong for their cause. When the French people's opinion is set nobody can hinder us from expressing it. Whether we side with the pope or against hem we must remain firm in our convictions!"
 abm_french_cuisine: "French Cuisine"
 abm_french_cuisine_desc: "France is to many known as the land of good cooking. Every province is famed for its wines, dishes, cheeses and cakes and it is a proven proverb here that good food builds good character. As our region is home to some of the most delicious food its reputation goes beyond that of many of the other areas of France. We must cherish and guard our culinary traditions and strengthen our regional identity."
 abm_french_enlightenment: "French Enlightenment"
 abm_french_enlightenment_desc: "French culture and French language is the carrier of the ideas of the modern age. As the enlightenment spreads from court to court so does the respect for all things French. It would be wrong, however, to presume that this is strictly a spread of Parisian ideas and values. As French becomes the language of all courts, books and plays our influence spreads worldwide with it."
 abm_french_la_petite_nation: "La Petite Nation"
 abm_french_la_petite_nation_desc: "The foreigners always speak of France as the country with one king. This well may be true but this does not mean in any way that the king is alone to undertake anything positive for our fellow Frenchmen. The French provinces have a life of their own, and be it under the royal authority or in a more autonomous way they are able to produce strong men and beautiful wives, great philosopher, artists and learned men. Paris matters little to us in day-to-day matters. We must stand up for our own people for we are the true Frenchmen and without us the French region would be both weaker and blander."
 abm_french_culture_ideas_ambition: "French Ducal Ambition"
 abm_french_culture_ideas_ambition_desc: "French Ducal Ambition"
