l_english:

 abm_pol_ideas_tradition_1: "Polish Tradition I"
 abm_pol_ideas_tradition_1_desc: "Polish Tradition I"
 abm_pol_ideas_tradition_2: "Polish Tradition II"
 abm_pol_ideas_tradition_2_desc: "Polish Tradition II"
 abm_folwark_system: "Promote the Folwark System"
 abm_folwark_system_desc: "The Folwark system was a system of production that encouraged the production of agricultural surpluses. Peasants were encouraged to work in them through either the use of rents of compulsion. It would form the bedrock of the Polish economy."
 abm_nihil_novi: "Nihil Novi"
 abm_nihil_novi_desc: "Was the principal that no law could be enacted without the full support of the nobility. Although it would act as a break on royal power it would also ensure that the commonwealth enjoyed the support of the nobility."
 abm_peichota_wybraniecka: "Piechota Wybraniecka"
 abm_peichota_wybraniecka_desc: "The Chosen Infantry (Piechota Wybraniecka) were regular infantry drafts from the Royal Peasants. The system was developed to allow the Kingdom to have a standing army of infantry."
 abm_winged_hussars: "Winged Hussars"
 abm_winged_hussars_desc: "The hussars were originally light cavalry troops used for scouting, but with the decline of the old feudal army we have switched over to professional regiments. The new heavier hussars will form the core of it. People will soon fear Poland's winged Hussars."
 abm_wojsko_komputoe: "Wojsko Komputowe"
 abm_wojsko_komputoe_desc: "The Compute Army (Wojsko Komputowe), was based around an annual budget calculated (computed) and approved by the Sejm. The idea was to give the Commonwealth a stable standing army for the defense."
 abm_foreign_section: "Found the Foreign section"
 abm_foreign_section_desc: "The Foreign Section (Cudzodziemski Autorament) were units trained in the German manner and initially had German officers. They provided the spine of the new Polish army, improving the performance."
 abm_focus_on_field_defences: "Focus on Field Defenses"
 abm_focus_on_field_defences_desc: "There is nothing quite like seeing your comrades die in terrible agony to make you wonder if staying on the battlefield is really such a good idea. Using field fortifications can give the illusion of protection and give our troops more heart."
 abm_pol_ideas_ambition: "Polish Ambition"
 abm_pol_ideas_ambition_desc: "Polish Ambition"
 abm_plc_ideas_tradition_1: "PLC Tradition I"
 abm_plc_ideas_tradition_1_desc: "PLC Tradition I"
 abm_plc_ideas_tradition_2: "PLC Tradition II"
 abm_plc_ideas_tradition_2_desc: "PLC Tradition II"
 abm_plc_prosperous_folwarks: "The Folwark System"
 abm_plc_prosperous_folwarks_desc: "A nobleman's landholding in the Commonwealth is usually comprised of what we call a folwark. It is a large farm worked by various serfs to produce surpluses for trade that is both internal and external. So long as we can keep this system functional and perhaps reform the laws surrounding it over time, the folwark system will continue to contribute great amounts to our trade routes and our stockpiles."
 abm_pol_jagiellonian_university: "Jagiellonian University"
 abm_pol_jagiellonian_university_desc: "Established in 1364, Krakow's Jagiellonian University is perhaps one of the greatest places in all of Europe! It has brought in, taught, and cultivated a variety of philosophical and scientific minds the likes of which Europe could almost never live without, let alone the Polish and Lithuanian people. Going forth, Jagiellonian University will continue to be one of the brightest points in our grand Commonwealth."
 abm_plc_the_obrona_potoczna: "Obrona Potoczna"
 abm_plc_the_obrona_potoczna_desc: "What we term a 'continuous defense' is really a standing army that is paid for by the monarch from their own pocket. They are stationed traditionally in troubled areas or places where the border with a neighbor is not clearly defined so that Commonwealth interests are not intruded upon. Over time, this military sector of ours is going to yield for us highly trained soldiers and skilled generals who know just how to deal with enemies of all types, whether they're of Polish, Lithuanian, Ukranian, or foreign descent."
 abm_plc_winged_hussars: "Winged Hussars"
 abm_plc_winged_hussars_desc: "The hussars were originally light cavalry troops used for scouting, but with the decline of the old feudal army we have switched over to professional regiments. The new heavier hussars will form the core of it. People will soon fear Poland's winged Hussars."
 abm_plc_refine_our_golden_liberty: "Refinement of Golden Liberty"
 abm_plc_refine_our_golden_liberty_desc: "Our political doctrine: 'Our State is a republic under the presidency of the king'. It is by this statement that we abide by and the following aspects: having an election of a king by all nobles, a Sejm, a Pacta Conventa, religious freedom, legal right to rebel against a king who has violated guaranteed freedoms, liberum veto, and forming an organization to force a common political aim. By keeping these aspects of our republic enshrined and also refining them with new laws and legislation as we go forth, the Commonwealth will never become outdated nor stagnant in its politics."
 abm_pol_royal_guards: "The Polish Royal Guards"
 abm_pol_royal_guards_desc: "Responsibly directly for the protection of the monarch and his family, the Polish Royal Guards are set to be the peak of Commonwealth power. Fitted with the best equipment we can obtain and trained in a variety of methods throughout their lives, the Polish Royal Guards will only embolden and harden our military in the future, especially our infantry, all whilst keeping the monarch and his family safe from harm."
 abm_plc_tempered_by_neighbors: "Tempered by Neighbors"
 abm_plc_tempered_by_neighbors_desc: "All around us there is conflict. Swedish people? Baltic conflicts. Hungarians? Border disputes. Teutons? Old grudges and lusts for land. Russians? Ambition for land on both sides. Time and time again we have been tested in combat since our borders in the east and west are hard to define beyond a hand-drawn map, but these times of war did not break down the Polish and Lithuanian people, it only made them stronger."
 abm_plc_ideas_ambition: "PLC Ambition"
 abm_plc_ideas_ambition_desc: "PLC Ambition"
 abm_plc_lit_ideas_tradition_1: "LPC Tradition I"
 abm_plc_lit_ideas_tradition_1_desc: "LPC Tradition I"
 abm_plc_lit_ideas_tradition_2: "LPC Tradition II"
 abm_plc_lit_ideas_tradition_2_desc: "LPC Tradition II"
 abm_warlord_dukes: "Warlord Dukes"
 abm_warlord_dukes_desc: "In remarkable two centuries of fierce warfare, Lithuanian warlord dukes managed to unify into a proper warrior state a country that was nothing more than a loose federation of tribes before, mount resistance against the aggression of the Catholic holy orders and conquer vast swathes of land in the East. Our military leaders are inspired by those achievements."
 abm_plc_lit_plc_tempered_by_neighbors: "Tempered by Neighbors"
 abm_plc_lit_plc_tempered_by_neighbors_desc: "All around us there is conflict. Swedish people? Baltic conflicts. Hungarians? Border disputes. Teutons? Old grudges and lusts for land. Russians? Ambition for land on both sides. Time and time again we have been tested in combat since our borders in the east and west are hard to define beyond a hand-drawn map, but these times of war did not break down the Polish and Lithuanian people, it only made them stronger."
 abm_lit_new_magdeburg_laws: "New Magdeburg Laws"
 abm_lit_new_magdeburg_laws_desc: "One of the consequences of Lithuania's drift towards the west is the introduction of German city laws to many urban areas of the country. Magdeburg laws in their custom local form will govern many different economic and political aspects of urbanization of the country, from city planning to trade and taxation."
 abm_reciprocal_guarantee_of_two_nations: "Reciprocal Guarantee of Two Nations"
 abm_reciprocal_guarantee_of_two_nations_desc: "For centuries the many political entities within our realm have roamed around causing conflict with relative autonomy. The time is nigh for us to seize the reigns and rule those elements is, ensuring the smooth and efficient performance of our internal matters."
 abm_lithuanian_hussars: "Lithuanian Hussars"
 abm_lithuanian_hussars_desc: "Winged Hussars are the heavy cavalry of Lithuania as much as of Poland. Introduced in both countries by reforms of Stephen Batory, King of Poland and Grand Duke of Lithuania, they will remain undefeated on the battlefields of Eastern Europe for more than a century."
 abm_statutes_of_lithuania: "Statutes of Lithuania"
 abm_statutes_of_lithuania_desc: "Statutes of Lithuania are a set of three different legal reforms which gather, unify and update the laws of the realm. Known for their harsh punishments and the introduction of death penalty, they are in line with many contemporary western penal codes. Each crime is supposed to be punished the same regardless of the class of the person committing it, but in practice many disadvantages for peasantry will be maintained. Lithuanian Statutes will later inspire a similar reform in Russia."
 abm_lithuanian_renaissance: "Lithuanian Renaissance"
 abm_lithuanian_renaissance_desc: "Lithuania experiences a Renaissance in the late 15th and early 16th centuries. Inspired by the ideas of Reformation and Italian influences, education, arts, architecture and literature will flourish in this era. Lithuanian language will be formulated in its written form and first works of Lithuanian literature will be created."
 abm_plc_lit_ideas_ambition: "LPC Ambition"
 abm_plc_lit_ideas_ambition_desc: "LPC Ambition"
 abm_lit_ideas_tradition_1: "Lithuanian Tradition I"
 abm_lit_ideas_tradition_1_desc: "Lithuanian Tradition I"
