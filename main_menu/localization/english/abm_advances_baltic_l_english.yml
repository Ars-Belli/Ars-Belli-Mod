 abm_lit_ideas_ambition: "Lithuanian Ambition"
 abm_lit_ideas_ambition_desc: "Lithuanian Ambition"
 abm_liv_ideas_tradition_1: "Livonian Knight Tradition I"
 abm_liv_ideas_tradition_1_desc: "Livonian Knight Tradition I"
 abm_liv_ideas_tradition_2: "Livonian Knight Tradition II"
 abm_liv_ideas_tradition_2_desc: "Livonian Knight Tradition II"
 abm_liv_knights_of_livonia: "Livonian Brothers of the Sword"
 abm_liv_knights_of_livonia_desc: "In 1236, the old order of the Livonian Brothers of the Sword were defeated by the Samogitians at the Battle of Schaulen. Their remnants were then incorporated into the Teutonic Order, and eventually became the Livonian Order in 1237. While the Brothers of the Sword ceased to exist, their old battle tactics are still used within our own Order."
 abm_liv_hanseatic_merchants: "Merchants of the Hansa"
 abm_liv_hanseatic_merchants_desc: "The land of the Baltics is the window between West Europe and the Russian lands of Novgorod. Traders and merchants from the Hansa ofen travel through our cities in order to trade with the Russians to our east and vice versa."
 abm_liv_livonian_castles: "Castles of the Order"
 abm_liv_livonian_castles_desc: "Castles are strategic fortifications which help defending our land from the infidels and the heretics. It is imperative that we ensure their maintenance at any time to protect our land."
 abm_liv_baptizers_of_terra_mariana: "Baptizers of Terra Mariana"
 abm_liv_baptizers_of_terra_mariana_desc: "The Land of Livonia was dedicated to Virgin Mary and named Terra Mariana for spreading the word of God. We must follow the footsteps of our brothers who baptized the local pagans, and continue spreading the True Faith."
 abm_liv_local_serfs: "Local Serfs"
 abm_liv_local_serfs_desc: "Most of our lands are owned by the German nobles, but farmed by the local serfs. While they toil in the fields, we can collect the benefits of these large centralized holdings."
 abm_liv_promote_local_bishops: "Promote Local Bishops"
 abm_liv_promote_local_bishops_desc: "Our strength lies not only in crusading knights, but the support of local bishops. By showing them the appropriate respect and ruling over them justly, we can rely on them to maintain our subjects' spiritual integrity."
 abm_liv_the_new_infantry: "Military Reforms"
 abm_liv_the_new_infantry_desc: "The time of cavarly combat is coming to its end. It is now the infantry which wins the battles for our Order. We should develop new tactics, adopt the new weapons, and reform our medieval approach of infantry combat into our main fighting force."
 abm_liv_ideas_ambition: "Livonian Knight Ambition"
 abm_liv_ideas_ambition_desc: "Livonian Knight Ambition"
 abm_lva_ideas_tradition_1: "Livonian Tradition I"
 abm_lva_ideas_tradition_1_desc: "Livonian Tradition I"
 abm_lva_ideas_tradition_2: "Livonian Tradition II"
 abm_lva_ideas_tradition_2_desc: "Livonian Tradition II"
 abm_lva_legacy_of_the_knights: "Legacy of the Knights"
 abm_lva_legacy_of_the_knights_desc: "Our state is completely secularized, and the value religion once had is no longer as high as it used to be during our monastic times. Anyway though, we must not forget the military achievements and lessons from the Livonian Knights and the Schwertbrüderorden - the Livonian Brothers of the Sword."
 abm_lva_border_between_east_and_west: "Border between East and West"
 abm_lva_border_between_east_and_west_desc: "Our land is what some might consider "the Window to the West" or "to the East" - depending who you ask. We are the border between West Europe and the lands of Russia. Our position draws merchants and potential foes from either direction. We must be prepared for both potential guests."
 abm_lva_livonian_hanseatic_cities: "Hanseatic Cities"
 abm_lva_livonian_hanseatic_cities_desc: "The Livonian Order - our predecessor - is the result of the German merchants from Lübeck and Bremen who acquired commercial interests in the lands around the mouth of the Dvina River. Said merchants founded cities, which have been members of the Hansa for centuries."
 abm_lva_livlandischer_landtag: "Livländischer Landtag"
 abm_lva_livlandischer_landtag_desc: "Even back in the times of the Livonian Order, our land is made of different factions, cultures and estates - all struggling for power. Conflicts occur rather commonly between the state, the Clergy and the powerful Hanseatic cities. To solve these internal disputes the Order established the Livländischer Landtag - the Livonian Diet.\nTo this very day the diet is in active service in order to keep the many different groups in check."
 abm_lva_livonian_colonization: "Livonian Colonization"
 abm_lva_livonian_colonization_desc: "Although we are quite far away from the New World, we cannot ignore the changes brought by the discovery of the New World. The powers of Europe are seizing the opportunities of the New World, and extend their influence outside the continent. We cannot allow us to fall back!"
 abm_lva_naval_professionalism: "Naval Professionalism"
 abm_lva_naval_professionalism_desc: "Our Prussian neighbors boast about their army professionalism. Granted, their military is impressive, but it is bound to the land only.\nDue to our historical connection from the times of the crusades, we have good connections with the Prussians, which means we can use our resources for an impressive naval professionalism while they play soldiers and defend our lands."
 abm_lva_religious_tolerance: "Religious Tolerance"
 abm_lva_religious_tolerance_desc: "The Reformation has shown the rotten side of the Catholic faith, and their persecution of these they deem as "heretic". We shall embrace these who flee from the inquisitions done by the Catholic church, and grant them a new home in our country."
 abm_lva_ideas_ambition: "Livonian Ambition"
 abm_lva_ideas_ambition_desc: "Livonian Ambition"
