 abm_lit_warlord_dukes_desc: "In remarkable two centuries of fierce warfare, Lithuanian warlord dukes managed to unify into a proper warrior state a country that was nothing more than a loose federation of tribes before, mount resistance against the aggression of the Catholic holy orders and conquer vast swathes of land in the East. Our military leaders are inspired by those achievements."
 abm_auksine_laisve: "Auksine Laisve"
 abm_auksine_laisve_desc: "Auksine Laisve, Lithuanian for Golden Liberty, is a set of laws and privileges that put the nobles of the country above other classes, and often even above monarch's and parliament's power. Arriving in Lithuania from Poland, this unique system will increase their loyalty to the crown, as long as the monarch doesn't attempt to renege on the promise of maintaining the golden state of liberty for the nobility."
 abm_magdeburg_laws: "Magdeburg Laws"
 abm_magdeburg_laws_desc: "One of consequences of Lithuania's drift towards the west is introduction of German city laws too many urban areas of the country. Magdeburg laws in their custom local form will govern many different economic and political aspects of urbanization of the country, from city planning to trade and taxation."
 abm_magnate_estates: "Magnate Estates"
 abm_magnate_estates_desc: "Magnates of Lithuania are called 'little kings' for their vast estates and private armies. Defending the indivisibility of their domains and trying to maximize the profits from them, they will develop a system in many regards resembling that of ancient Roman latifundia."
 abm_lit_lithuanian_hussars: "Lithuanian Hussars"
 abm_lit_lithuanian_hussars_desc: "Winged Hussars are the heavy cavalry of Lithuania as much as of Poland. Introduced in both countries by reforms of Stephen Batory, King of Poland and Grand Duke of Lithuania, they will remain undefeated on the battlefields of Eastern Europe for more than a century."
