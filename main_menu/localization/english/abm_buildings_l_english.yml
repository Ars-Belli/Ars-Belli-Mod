l_english:
 matenadaran: "Matenadaran"
 matenadaran_desc: "A great repository of manuscripts and a school of scribes, where the sacred texts of the Miaphysite faith are copied, illuminated, and preserved for future generations."
 abm_church_school: "Church School"
 abm_church_school_desc: "A parish school where the clergy teach the faithful to read from the scriptures, spreading literacy and the Catholic faith through the countryside."

 # Capital buildings (in_game/common/building_types/abm_capital_buildings.txt)
 abm_genoese_arsenal: "Genoese Arsenal"
 abm_genoese_arsenal_desc: "The celebrated arsenal of Genoa — a fortified basin beneath vaulted halls where galleys are laid down, rigged, and armed at a pace no rival can match. Its docks raise more ships at once and swell the pool of sailors in our capital, while cutting the cost of keeping our fleets at sea far from home."
 abm_gazarian_arsenal: "Gazarian Arsenal"
 abm_gazarian_arsenal_desc: "When the Genoese carried their shipbuilding to the Black Sea, Gazaria raised an arsenal to rival the motherland's own. Its yards turn out warships in numbers and train sailors across our coasts, while our galleys are converted into swift light vessels that extend our maritime reach wherever the flag of Saint George flies."
 abm_gazarian_headquarters: "Gazarian Headquarters"
 abm_gazarian_headquarters_desc: "A headquarters rising in the heart of our capital, where the captains and veterans of Gazaria drill fresh regiments and keep the city's walls ever ready. It concentrates the manpower of the realm, reinforces the defense of our capital, and widens the front our armies can hold."

