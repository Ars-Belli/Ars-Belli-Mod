l_english:
 matenadaran: "Matenadaran"
 matenadaran_desc: "A great repository of manuscripts and a school of scribes, where the sacred texts of the Miaphysite faith are copied, illuminated, and preserved for future generations."
 abm_church_school: "Church School"
 abm_church_school_desc: "A parish school where the clergy teach the faithful to read from the scriptures, spreading literacy and the Catholic faith through the countryside."

