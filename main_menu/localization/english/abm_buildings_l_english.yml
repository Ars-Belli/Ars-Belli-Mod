 abm_merchant_enclave: "Merchant Enclave"
 abm_merchant_enclave_desc: "A walled quarter of warehouses, counting-houses and lodgings where foreign merchants live and trade under their own laws. Less grand than a Fondaco and less entrenched than a Hanseatic Kontor, it still earns its keep by drawing [merchant_power|e] and [merchant_capacity|e] through the host's [markets|e]."

 # Governor offices (building_types/abm_governor_offices.txt)
 abm_provincial_chancellery: "Provincial Chancellery"
 abm_provincial_chancellery_desc: "A college of nobles and clerks that takes over the work of a local governor, turning the abandoned post into capacity for another government reform. Each office absorbs one unused local governor post and opens one reform slot, so a second one can be built in another location. Must be built in the capital or in a cored town or city of the capital's area."
 abm_provincial_chancellery_abolished_tt: "Demolishing this office restores the governor post but costs #R three months of income#!, #R 10#! [stability|e] and #R 10#! [political_influence|e] - reforms already enacted with the extra slots are not undone."
 abm_court_secretariat: "Court Secretariat"
 abm_court_secretariat_desc: "A permanent secretariat of nobles that replaces a local governor with a seat in the cabinet, giving the crown another voice at court. Each office absorbs one unused local governor post and grants one cabinet seat, so a second one can be built in another location. Must be built in the capital or in a cored town or city of the capital's area."
 abm_court_secretariat_abolished_tt: "Demolishing this office restores the governor post but costs #R three months of income#!, #R 10#! [stability|e] and #R 10#! [political_influence|e]."

 abm_admiralty_board: "Admiralty Board"
 abm_admiralty_board_desc: "A standing board of nobles and sea officers that takes over a naval governor's duties and turns the freed post into a voice at court. Each board absorbs one unused naval governor post and grants one cabinet seat, so a second one can be built in another port city. Must be built in a port city that is not our capital."
 abm_proconsulate: "Proconsulate"
 abm_proconsulate_desc: "An annex to a local governor's seat, staffed by nobles and paid for out of a naval governor's post. It extends the governor's reach beyond the city walls: the proximity source this location radiates is a quarter stronger (+25%). Can only be built where a local governor already stands, and is abandoned if he leaves."

 # Provincial Administration (building_types/abm_provincial_administration.txt)
 abm_provincial_administration: "Provincial Administration"
 abm_provincial_administration_desc: "A permanent civil administration for a province: its clerks, surveyors and courts extend the state's reach across the whole area. One per area, and only where every one of our locations there is a [core|e] with our [religion|e] and a [primary_culture|e] or [accepted_culture|e] - and where our average [control|e] is at least 70%. It is staffed by an unused naval governor post. Every owned location in the area gains monthly control, development, prosperity and population growth, and the administration is abandoned if our average control falls below 50% or if its seat is captured."

