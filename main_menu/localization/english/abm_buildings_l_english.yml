 abm_proconsulate_maintenance: "$abm_proconsulate$ Maintenance"
 abm_area_has_no_other_copy_of_building_tt: "No other [location|e] under our control in this [area|e] already has this [building|e]"

# --- from abm_steppe_buildings_l_english.yml ---
 abm_steppe_redoubts: "Steppe Redoubts"
 abm_steppe_redoubts_desc: "Open grassland offers an attacker no line to hold and no wall to break. The answer of the steppe peoples was the redoubt: a ditch, a bank of earth and a palisade, thrown up wherever a ford, a well or a road had to be denied. A garrison behind them can hold a fortification far longer than its walls alone would allow."
 abm_steppe_redoubts_advance: "$abm_steppe_redoubts$"
 abm_steppe_redoubts_advance_desc: "$abm_steppe_redoubts_desc$"

# --- from abm_unique_buildings_l_english.yml ---
 abm_buddhist_monastery_stronghold: "Buddhist Monastery Stronghold"
 abm_buddhist_monastery_stronghold_desc: "A fortified Buddhist monastery built in defensible terrain, strengthening the local garrison and providing trained recruits."

# --- from abm_town_rights_l_english.yml ---
 abm_abtau_black_soil_rights: "Black Soil Rights"
 abm_abtau_black_soil_rights_desc: "This [location|e] has been granted the right to break the black earth of the steppe, extending cultivation far beyond its old bounds and drawing a richer harvest from every field. Whatever the plough can raise from the deep soil - grain, vine, pulse or orchard - flourishes as never before."
 abm_abtau_black_soil_rights_arable_tt: "Location's [raw_material|e] is an arable crop"
 abm_abtau_black_soil_rights_rank_tt: "Location is a [ShowLocationRankName('town')]"
