 abm_merchant_enclave: "Merchant Enclave"
 abm_merchant_enclave_desc: "A walled quarter of warehouses, counting-houses and lodgings where foreign merchants live and trade under their own laws. Less grand than a Fondaco and less entrenched than a Hanseatic Kontor, it still earns its keep by drawing [merchant_power|e] and [merchant_capacity|e] through the host's [markets|e]."

 # Governor offices (building_types/abm_governor_offices.txt)
 abm_provincial_chancellery: "Provincial Chancellery"
 abm_provincial_chancellery_desc: "A college of nobles and clerks that takes over the work of a local governor, turning the abandoned post into capacity for another government reform. Each level absorbs one unused local governor post and opens one more reform slot. Must be built in the capital or in a cored town or city of the capital's area."
 abm_provincial_chancellery_abolished_tt: "Demolishing this office restores the governor post but costs #R three months of income#!, #R 10#! [stability|e] and #R 10#! [political_influence|e] - reforms already enacted with the extra slots are not undone."
 abm_court_secretariat: "Court Secretariat"
 abm_court_secretariat_desc: "A permanent secretariat of nobles that replaces a local governor with a seat in the cabinet, giving the crown another voice at court. Each level absorbs one unused local governor post and grants one cabinet seat. Must be built in the capital or in a cored town or city of the capital's area."
 abm_court_secretariat_abolished_tt: "Demolishing this office restores the governor post but costs #R three months of income#!, #R 10#! [stability|e] and #R 10#! [political_influence|e]."
