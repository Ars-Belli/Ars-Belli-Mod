# ============================================================
# Genoese / Gazaria (GEN) Advances Localization
# Source: .tools/eu4/localisation/powers_and_ideas_l_english.yml
# ============================================================

 abm_gen_tradition_1: "Genoese Traditions I"
 abm_gen_tradition_1_desc: "Genoa's wealth was built upon the twin pillars of trade and finance. Our merchants have sailed every sea and our bankers have financed empires. This mercantile legacy remains the foundation of our power."

 abm_gen_tradition_2: "Genoese Traditions II"
 abm_gen_tradition_2_desc: "The Republic of Genoa has long understood that a sound financial system is the bedrock of naval supremacy. By maintaining low interest rates for our merchants, we ensure that trade continues to flow through our ports."

 abm_gen_reunited_genoa: "Reuniting the Nation"
 abm_gen_reunited_genoa_desc: "The Treaty of Turin, between ourselves and Venice, in 1381 on paper looked as a draw. The crippling loss of our fleet led to infighting between various factions inside the country. We must bring this to an end if Genoa is to rise again."

 abm_gen_lessons_of_chiogga: "The Lessons of Chioggia"
 abm_gen_lessons_of_chiogga_desc: "In 1380 our fleet suffered a heavy defeat at the hands of the Venetians at the battle of Chioggia. The resulting peace of Turin has handed Venice dominance of the Mediterranean trade. The smaller more maneuverable Venetian Galleys proved superior to ours, we must remedy this."

 abm_gen_genoese_trade: "Rebuilding Genoese Trade"
 abm_gen_genoese_trade_desc: "Venice has been in the box seat for trade for far too long, we need to ensure that our Merchants can retake markets. We must overhaul our legal system to ensure that our merchant families can meet the Venetians on an equal footing."

 abm_gen_the_genoese_arsenal: "Build the Genoese Arsenal"
 abm_gen_the_genoese_arsenal_desc: "Venice began the construction of its arsenal in 1104 and since then Venice has enjoyed an advantage when it comes to ship construction. Genoa cannot allow this to stand, we must have our own arsenal to ensure we too can have a fleet to defend our interests."

 abm_gen_overhauled_bureaucracy: "Overhaul the Bureaucracy"
 abm_gen_overhauled_bureaucracy_desc: "To be blunt money is power. If we wish to remain a player in the Mediterranean, we will need more of it to support our fleet and army. Thus we must overhaul our bureaucracy to ensure we can maximize our revenue."

 abm_gen_the_office_of_grand_admiral: "Setup the Office of Grand Admiral"
 abm_gen_the_office_of_grand_admiral_desc: "The life blood of Genoa is trade and trade relies on a fleet. We must ensure that our fleet is properly administered. The setting up of an office of Grand Admiral responsible for the administration of our fleet will make sure our fleet will be better run."

 abm_gen_standardisation_of_designs: "Standardization of Designs"
 abm_gen_standardisation_of_designs_desc: "Each shipyard and even each shipwright has their own design for a ship. Although they are pretty much the same ship in practice, those small differences mean that supplying the materials for the ships becomes more time consuming. Setting up a design board to supply standard designs to our yards will allow us to speed up construction."

 abm_gen_ambition: "Genoese Ambition"
 abm_gen_ambition_desc: "A powerful fleet is the ultimate guarantor of Genoese independence and prosperity. By reducing the cost of maintaining our navy, we ensure that the flag of Saint George will forever fly over the waters of the Mediterranean and the Black Sea."
