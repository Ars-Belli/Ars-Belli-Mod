l_english:

 # Japan - Rangaku (Ars Belli event at vanilla's flavor_jap.2 slot; vanilla runs .1 -> .3)
 flavor_jap.2.title: "Rangaku"
 flavor_jap.2.entry: "$flavor_jap.2.title$"
 flavor_jap.2.desc: "For a century the Dutch have kept to their little island in the bay of [target_location.GetName], and year by year they bring more than pepper and cloth. Their physicians mend wounds our own doctors give up on, their astronomers correct our calendars, their gunners weigh powder to the grain. Their books, printed in a barbarian script, are copied by hand and passed among our scholars under the name #italic Rangaku#! - Dutch learning.\n\nSome of our advisors call this curiosity a rot that will eat away our traditions from within. Others answer that a country which refuses to learn from the outside world will be taught by it at the muzzle of a cannon. [target_country.GetName] offers to send its learned men in earnest: not as spies, and not as preachers, but as teachers."
 flavor_jap.2.a: "Let them teach us what they know."
 flavor_jap.2.a.tt: "Establishes #bold Rangaku#! - Dutch learning - in Japan."
 flavor_jap.2.b: "We have nothing to learn from barbarians."

 # Enforce Peace chain (fired from common/country_interactions/abm_enforce_peace.txt)
 abm_enforce_peace.1.title: "An Enforcer Demands Peace"
 abm_enforce_peace.1.desc: "[scope:ep_enforcer.GetName] has taken up the cause of [scope:ep_defender.GetName] and demands that we end our war against them. Their envoy makes no secret of the alternative: refuse, and [scope:ep_enforcer.GetName] enters the war on our enemy's side."
 abm_enforce_peace.1.a: "We have bled enough. Let it end in a white peace."
 abm_enforce_peace.1.b: "We will not be dictated to."
 abm_enforce_peace.2.title: "Peace Enforced"
 abm_enforce_peace.2.desc: "Our demand was heeded. The war against [scope:ep_defender.GetName] is ended in a white peace, and our name is spoken with respect at courts that had forgotten it."
 abm_enforce_peace.2.a: "The peace of Christendom is preserved."
 abm_enforce_peace.3.title: "Our Demand Was Refused"
 abm_enforce_peace.3.desc: "Our demand was refused. Having pledged our word to [scope:ep_defender.GetName], we take up arms at their side - the war is now ours as well."
 abm_enforce_peace.3.a: "Then let it be settled by the sword."

 # Papacy - Kingdom of God on Earth (mod event, abm_pap_kog.1)
 abm_pap_kog.1.title: "The Kingdom of God on Earth"
 abm_pap_kog.1.entry: "$abm_pap_kog.1.title$"
 abm_pap_kog.1.desc: "Rome is no longer a bishopric among the powers of Italy but a principality in its own right. From the Alps to the Regno our legates collect tithes, appoint governors and settle disputes that kings once judged themselves, and the Curia has begun to speak of a #italic Kingdom of God on Earth#! - one in which the vicar of Christ holds both the keys and the sword.\n\nTo proclaim it openly would bind our temporal domains to the Holy See for good, and would be remembered long after the last of our enemies is forgotten."
 abm_pap_kog.1.a: "Crown him King of Italy, and let the State of the Church be a state indeed."
 abm_pap_kog.1.b: "Declare it to all Christendom, and let the proclamation be our crown."
