l_english:

 # Japan - Rangaku (Ars Belli event at vanilla's flavor_jap.2 slot; vanilla runs .1 -> .3)
 flavor_jap.2.title: "Rangaku"
 flavor_jap.2.entry: "$flavor_jap.2.title$"
 flavor_jap.2.desc: "For a century the Dutch have kept to their little island in the bay of [target_location.GetName], and year by year they bring more than pepper and cloth. Their physicians mend wounds our own doctors give up on, their astronomers correct our calendars, their gunners weigh powder to the grain. Their books, printed in a barbarian script, are copied by hand and passed among our scholars under the name #italic Rangaku#! - Dutch learning.\n\nSome of our advisors call this curiosity a rot that will eat away our traditions from within. Others answer that a country which refuses to learn from the outside world will be taught by it at the muzzle of a cannon. [target_country.GetName] offers to send its learned men in earnest: not as spies, and not as preachers, but as teachers."
 flavor_jap.2.a: "Let them teach us what they know."
 flavor_jap.2.a.tt: "Establishes #bold Rangaku#! - Dutch learning - in Japan."
 flavor_jap.2.b: "We have nothing to learn from barbarians."

