l_english:
 abm_player_coalition: "Player Coalition"
 abm_player_coalition_desc: "A Player Coalition is a league of player-controlled [countries|e] banded together against a #R Great Power#! or #Y Major Power#!. Joining requires more than 50 [antagonism|e] towards the target, and members leave once it falls below 30 while not at [war|e] with the target. Unlike a regular [coalition|e] it needs no [opinion|e] of the target, and only players may join. Members defend each other if the target attacks one of them, and may collectively declare [war|e] on the target with the regular Coalition [casus_belli|e]."
 abm_player_coalition_leader: "Player Coalition Leader"
 abm_player_coalition_hint_1: "A Player Coalition can only be started against a #R Great Power#! or #Y Major Power#!, and only player-controlled [countries|e] can join it. It cannot exist without its leader: if the leading country leaves, it immediately dissolves."
 abm_player_coalition_players_only_tt: "Is controlled by a player"
 abm_player_coalition_target_rank_tt: "Is a #R Great Power#! or #Y Major Power#!"
 io_opinion_abm_player_coalition: "In Coalition Together"
 diplomatic_status_abm_player_coalition_name: "Player Coalition"
 diplomatic_status_abm_player_coalition_tooltip: "#T Player Coalition#!\nThis country is in a Player Coalition. If they are attacked by the coalition target, all other [members|e] of the coalition will be called to arms. The coalition may decide to declare war on the target, at which time all other coalition members will be called too."
 abm_player_coalition_list_who_tt: "$WHO$ is in a Player Coalition with $LIST$. They will protect each other against the coalition target"

 abm_dissolve_player_coalition: "Dissolve Player Coalition"
 abm_dissolve_player_coalition_entry: "Disallow members of the player coalition to form another one against us in the next 15 years."
 abm_dissolve_player_coalition_entry_short: "$abm_dissolve_player_coalition$"
 abm_dissolve_player_coalition_desc: "This league of rivals shall be scattered, its members cowed and divided, no longer united against us."
