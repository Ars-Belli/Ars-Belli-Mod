l_english:
# ============================================================
# Pontic / Trebizond (PON) Advances Localization
# Based on Empire of Trebizond and Kingdom of Pontus history
# ============================================================

 abm_pon_ideas_tradition_1: "Pontic Tradition I"
 abm_pon_ideas_tradition_1_desc: "The Pontic people have endured centuries of upheaval on the southern shores of the Euxine Sea. From the ancient Kingdom of Pontus to the Empire of Trebizond, our ancestors mastered the art of survival between greater powers, turning the sea and mountains into our greatest allies."

 abm_pon_ideas_tradition_2: "Pontic Tradition II"
 abm_pon_ideas_tradition_2_desc: "Our realm bridges the worlds of Greek civilization, Anatolian hinterlands, and the vast Black Sea trade networks. This unique position has forged a people as resilient as the Pontic Alps themselves."

 abm_pon_euxine_border_harassment: "Euxine Border Harassment"
 abm_pon_euxine_border_harassment_desc: "The Pontic Mountains have always been our shield and our weapon. From these heights, our warriors have harassed invading armies for millennia — from the Romans of Lucullus to the Seljuk Turks. Swift raids from mountain passes, coupled with the rugged terrain, make our borders a nightmare for any invader foolish enough to test them."

 abm_pon_ancient_colony_heritage: "Ancient Colony Heritage"
 abm_pon_ancient_colony_heritage_desc: "Trebizond was founded by Milesian Greeks as early as 756 BC, making it one of the oldest Hellenic colonies on the Black Sea. This ancient heritage lives on in our architecture, our traditions, and our unbroken connection to the Hellenic world. The wisdom of the ages flows through our city's walls."

 abm_pon_black_sea_guilds: "Black Sea Trade Guilds"
 abm_pon_black_sea_guilds_desc: "The Black Sea — the Euxine Pontus — has been our livelihood since antiquity. Our merchant guilds control the flow of silk from Persia, furs from the Rus', silver from our own mountains, and the famed Pontic hazelnuts and wine. By strengthening our guilds, we can ensure Trebizond remains the wealthiest port on this ancient sea."

 abm_pon_workshop_networks: "Workshop Networks"
 abm_pon_workshop_networks_desc: "From the forges of Chaldia to the shipyards of Trebizond's harbor, our craftsmen produce goods renowned throughout the East and West. By linking our workshops into cooperative networks, we can share techniques, reduce costs, and produce wares that rival those of Constantinople and Venice."

 abm_pon_republic_admiralty: "Republic Admiralty"
 abm_pon_republic_admiralty_desc: "Though ruled by emperors, Trebizond has always maintained a republican spirit in its naval affairs. Our admiralty draws upon the expertise of Greek, Laz, and Italian sailors who call our harbors home. The Trapezuntine fleet once projected power across the Black Sea to our Crimean outposts — a tradition we must revive."

 abm_pon_border_military_contracts: "Border Military Contracts"
 abm_pon_border_military_contracts_desc: "The Grand Komnenoi have long understood that direct military rule of our mountainous frontiers is impractical. Instead, we contract with local border lords, Lazic chieftains, and even trusted Turkmen tribes to guard our passes. These military contracts ensure our borders are defended by those who know the terrain best."

 abm_pon_young_can_serve: "The Young Can Serve"
 abm_pon_young_can_serve_desc: "In Pontus, even the youngest are taught the arts of war from an early age. Our rugged homeland demands that every able body can defend their village when invaders come. By formalizing this tradition of youth service, we can ensure a steady stream of capable recruits who already know the mountains and valleys like their own homes."

 abm_pon_urban_promotion_networks: "Urban Promotion Networks"
 abm_pon_urban_promotion_networks_desc: "Trebizond is not merely our capital — it is the beating heart of Pontic civilization. By promoting trade and culture between our coastal cities — Trebizond, Kerasous, Sinope, and Amisos — we create a network of urban centers that enriches every corner of our realm and attracts merchants and scholars from across the known world."

 abm_pon_ideas_ambition: "Pontic Ambition"
 abm_pon_ideas_ambition_desc: "From the Komnenian emperors who styled themselves 'Emperor and Autocrat of all the East, the Iberians and Perateia' to the indomitable spirit of our mountain people, Pontus has always dreamed of greatness. We shall not rest until our banners fly over a realm worthy of the legacy of Mithridates and the Grand Komnenoi."

 abm_cil_ideas_tradition_1: "Cilician Tradition I"
 abm_cil_ideas_tradition_1_desc: "The Taurus and the Amanus close around Cilicia like a gate, and whoever holds the passes holds the road between Anatolia, Syria and Mesopotamia. Our castles watch the defiles, and no army enters the plain of Adana without our leave."

 abm_cil_ideas_tradition_2: "Cilician Tradition II"
 abm_cil_ideas_tradition_2_desc: "The nakharar houses of Armenia did not vanish when they crossed the mountains. They became the barons of Cilicia, armoured riders who serve the crown with lance and mail in the manner of the Franks, while keeping the customs of their fathers."

 abm_cil_ayas_entrepot: "Ayas, Gate of the Silk Road"
 abm_cil_ayas_entrepot_desc: "The caravans come down from Tabriz and Erzurum to Ayas, where the spices and silks of the East are loaded onto the galleys of the Italians. Our port has been one of the great marketplaces of the Levant for a century, and its customs houses fill the royal treasury."

 abm_cil_frankish_quarters: "Quarters of the Franks"
 abm_cil_frankish_quarters_desc: "Genoese, Venetian and Pisan merchants keep their own streets and their own privileges in our ports, with consuls, churches and warehouses of their own. Their quarrels are many, but their ships and their credit keep our harbours alive, and their treaties bind them to our defence."

 abm_cil_armenian_scriptorium: "The Cilician Scriptorium"
 abm_cil_armenian_scriptorium_desc: "The masters of the Cilician school, heirs to Toros Roslin, illumine gospels of a beauty that the homeland under foreign rule can no longer produce. In our scriptoria the Armenian letters live, and with them the memory of a crowned nation."

 abm_cil_tauros_ambushes: "Ambushes of the Taurus"
 abm_cil_tauros_ambushes_desc: "Our soldiers are herdsmen and hunters before they are soldiers, and the Taurus is their home. They know every defile, goat track and hidden spring in the range, and a column that tries to force the passes into the plain of Adana will be harried, starved and bled by men who never offer a fair fight."

 abm_cil_catholicosate_of_sis: "Catholicosate of Sis"
 abm_cil_catholicosate_of_sis_desc: "The Catholicos of all Armenians sits in Sis, in the shadow of our crown. The monasteries and bishoprics look to us for protection, and the loyalty of the Church is the surest bond that holds the scattered Armenian people to this kingdom."

 abm_cil_western_artillery: "Western Artillery"
 abm_cil_western_artillery_desc: "Cilician envoys have bought more than silks and spices in the West: they have hired the gunners, founders and engineers of France and Italy, and shipped bronze cannon up to the castles of the Taurus. Our own smiths cannot yet cast such pieces, and our nobles still trust the lance, but a train of foreign guns now answers to the crown - and the walls of Antioch and Aleppo were not built to withstand them."

 abm_cil_last_christian_kingdom: "The Last Christian Kingdom"
 abm_cil_last_christian_kingdom_desc: "In the whole of the East, only Cilicia still bears a Christian crown. Pilgrims, exiles and soldiers of fortune come to us from every Armenian community and from the courts of the West, and the name of the kingdom is spoken with reverence wherever the Cross is honoured."

 abm_cil_ideas_ambition: "Cilician Ambition"
 abm_cil_ideas_ambition_desc: "Our kingdom may be small against the Mamluks and distant from its homeland, but the Armenian people are not small. From Caffa to Lvov, from Tabriz to Venice, our merchants and bishops keep the nation alive. Let Cilicia be the heart of a people that no conquest can extinguish."
 abm_cyp_ideas_tradition_1: "Cypriot Tradition I"
 abm_cyp_ideas_tradition_1_desc: "Cyprus is an island kingdom, and its strength floats. The timber of the Troodos and the shipyards of Famagusta and Kyrenia give us galleys cheaper than any rival can build them, and no fleet in the eastern Mediterranean is raised so quickly from its harbours."
 abm_cyp_ideas_tradition_2: "Cypriot Tradition II"
 abm_cyp_ideas_tradition_2_desc: "A Latin crown rules a Greek island, and between them live Maronites, Armenians, Syriacs and Jews. Our kings have learned that Cyprus endures not by forcing one faith on all, but by letting every community keep its church, its courts and its customs under the crown's peace."
 abm_cyp_king_of_jerusalem: "King of Jerusalem"
 abm_cyp_king_of_jerusalem_desc: "In 1291, the last bastion of the continental holdings of the Kingdom of Jerusalem fell to the Mamluk sultan Baibars, but we have never forgotten that for the last hundred years of the Kingdom of Jerusalem, all the legitimate kings have been Lusignans. Even now, over a hundred years in exile, new Lusignan kings have been known to sail to the Holy Land in the dead of night to be crowned in secret in our once and future kingdom."
 abm_cyp_frankish_crusaders: "Frankish Crusaders"
 abm_cyp_frankish_crusaders_desc: "It's not a coincidence that the Saracens collectively refer to the people of Christendom as Franks: French presence in the Crusades has been critical ever since the earliest days. The spirit of the crusader kings like Philippe II Auguste and St. Louis IX isn't absent in Cyprus: our own King Peter once heroically seized a bit of the Anatolian coastline. Let's prove we still have that fire in us."
 abm_cyp_commandaria_wine: "Commandaria Wine"
 abm_cyp_commandaria_wine_desc: "In the aftermath of the Third Crusade, Philippe II Auguste of France held a contest to determine the greatest wine in the world. Does it shock anyone that our Commandaria proved the Apostle of Wines in this greatest of competitions? Commandaria is ancient and just as tasty as it was hundreds of years ago. Even the Turks have developed a taste for it, despite supposedly refraining from alcohol."
 abm_cyp_lusignan_diplomacy: "Lusignan Diplomacy"
 abm_cyp_lusignan_diplomacy_desc: "What king of Christendom doesn't covet the title King of Jerusalem? Sadly, many have claimed it despite our continued hold on the title, but others respect us enough to wish to infuse their own dynasties with Lusignan blood to bring themselves closer to the Holy Land in name and spirit. This last redoubt of Christendom in the East cannot survive without Western help, so we must take advantage of this."
 abm_cyp_cypriot_fortifications: "Cypriot Fortifications"
 abm_cyp_cypriot_fortifications_desc: "Many, many powers have swept through Cyprus over the centuries, and the Crusaders have no desire to be just one in a succession of owners. Everywhere you look, this island is fortified with the finest examples of Medieval castles and fortifications, proof that we are here to stay, to the dismay of both the Turks and the Greek locals."
 abm_cyp_repel_the_corsairs: "Repel the Corsairs"
 abm_cyp_repel_the_corsairs_desc: "The memories of the legendary Barbarossa brothers who bedeviled the Eastern Mediterranean in the late 15th and early 16th centuries is vivid, but they were only the most famous of the many corsairs that are the bane of Mediterranean sea travel. Our navy needs to gain the strength to match these freebooters on their own terms."
 abm_cyp_raid_turkish_commerce: "Raid Turkish Commerce"
 abm_cyp_raid_turkish_commerce_desc: "Perhaps the brothers Barbarossa, brutes that they were, hit on a valuable strategy. We can utilize our critical position in the Eastern Mediterranean to launch unrestricted raiding on Turkish vessels and reap the economic rewards of their wealth. Pirates may be the enemies of all nations, but privateers are merely contracted businessmen, right?"
 abm_cyp_ideas_ambition: "Cypriot Ambition"
 abm_cyp_ideas_ambition_desc: "We are a small island with a great name: the last kingdom of the Lusignans, the heir of Jerusalem and the one Latin power left in the Levant. If we hold the sea, we need not fear the mainland. Let every galley we launch remind the Turks that Cyprus is not a prize to be taken, but a power to be reckoned with."
 abm_kar_ideas_tradition_1: "Karamanid Tradition I"
 abm_kar_ideas_tradition_1_desc: "Karamanid Tradition I"
 abm_kar_ideas_tradition_2: "Karamanid Tradition II"
 abm_kar_ideas_tradition_2_desc: "Karamanid Tradition II"
 abm_kar_mehmet_bey_firman: "Mehmet Bey's Firman"
 abm_kar_mehmet_bey_firman_desc: "The Vizier Mehmet I issued a decree stating: 'starting from today, in dervish convent, in council, in the assembly, and in the squares, no language other than Turkish should be spoken.' The Seljuks in Anatolia had previously used Persian in literature and Arabic in government and science, but the Turkmen could not understand these languages."
 abm_kar_ghazi: "Ghazi"
 abm_kar_ghazi_desc: "Our sultans emphasize their role as gazis, leaders in war against the non-believers. Warriors thus flock to our banner, seeking to win wealth, glory, and salvation in the fight to expand the Abode of Islam"
 abm_kar_karamanid_cavalry: "Karamanid Cavalry"
 abm_kar_karamanid_cavalry_desc: "We need to ensure that our cavalry are well maintained as good horsemanship and high quality horses will allow us to raise feared cavalry."
 abm_kar_seize_the_opportunity: "Seize the Opportunity"
 abm_kar_seize_the_opportunity_desc: "Ever since the foundation of our state we have faced threats from every corner. To preserve our independence against the Mamluks of Egypt, the heirs of Osman Bey, and the nomads of the East, and to increase our holdings at their expense, we need to make use of diplomacy, marriage, and appeasement."
 abm_kar_karamanid_architecture: "Karamanid Architecture"
 abm_kar_karamanid_architecture_desc: "We have started building an extensive network of mosques, hammams, caravanserais and schools to the prosperity of our people. These buildings will represent some of the most distinctive and impressive constructions in the entire region."
 abm_kar_home_of_the_whirling_dervishes: "Home of the Whirling Dervishes"
 abm_kar_home_of_the_whirling_dervishes_desc: "Our city of Konya is the home to the followers of Mevlana, known as the Whirling Dervishes due to their practice of whirling as a form of remembrance of God. The symbolic ritual is performed by spinning on the left foot in a circle around their leader, who is the only one whirling around his axis. The dervishes wear a white gown symbolizing the death, a wide black cloak that symbolizes the grave and a tall brown hat that symbolizes the tombstone."
 abm_kar_true_heirs_seljuk_empire: "True Heirs of the Seljuk Empire"
 abm_kar_true_heirs_seljuk_empire_desc: "As we have grown strong enough to proclaim our state as the successor to the great empire of our forefathers. Let it be known from this day on that we are leaders of the Turks and the true heirs to the Seljuk empire!"
 abm_kar_ideas_ambition: "Karamanid Ambition"
 abm_kar_ideas_ambition_desc: "Karamanid Ambition"
 abm_cnd_ideas_tradition_1: "Candarid Tradition I"
 abm_cnd_ideas_tradition_1_desc: "Candarid Tradition I"
 abm_cnd_ideas_tradition_2: "Candarid Tradition II"
 abm_cnd_ideas_tradition_2_desc: "Candarid Tradition II"
 abm_cnd_genoese_connections: "Genoese Connections"
 abm_cnd_genoese_connections_desc: "The Genoese established themselves a vast trade-network of colonies in the Mediterranean and Black Seas. By maintaining close relations with the Republic of Genoa we will be able to have easy access to the European markets."
 abm_cnd_candarid_literature: "Candarid Literary Reform"
 abm_cnd_candarid_literature_desc: "Thanks to the support of our Beys many Turkish literary works have emerged, such as the Kitâb Miftâh-ün-Nur, a book on many sicknesses, especially those of the eye. Historically the Candar dynasty contributed to the development of Turkish as a literary language and were renowned for their patronage of men of letters."
 abm_cnd_ismail_bey_complex: "Ismail Bey Complex"
 abm_cnd_ismail_bey_complex_desc: "Built in 1451 on a mound along the river, the Ismail Bey complex included several buildings like a hospice, mosque, mausoleum, college, imaret, and baths. It said that viewed from a distance the geometrical shapes on the mausoleum's gate reflected the face of Ismail Bey."
 abm_cnd_anatolian_center_of_learning: "Anatolian Center for Learning"
 abm_cnd_anatolian_center_of_learning_desc: "Our support for the various scientists and artists at court is bearing its fruits as our lands have become a center for learning in Anatolia. Many Emirs and Beys are envy of our achievements in science, architecture, and art."
 abm_cnd_candar_corps: "Legacy of the Candar Corps"
 abm_cnd_candar_corps_desc: "Assigned to guard palaces and the heads of state, the Candar Corps consisted of specially trained men. One of them was Semseddin Yaman Candar, who served in the army of the Seljuq Sultan Masud II and was awarded the Eflani region in return for his services, where he founded the principality of Candar."
 abm_cnd_sinop_shipyard: "Sinop Shipyard"
 abm_cnd_sinop_shipyard_desc: "To defend our interests around the Black Sea and to dominate the oversea trade we must expand our main shipyard so that we have the ships to do so. Historically in the 16th century Sinop's old tradition of shipbuilding was promoted into a full-scale industry changing the city into a flourishing center of trade and shipbuilding. In 1571 alone 25 major warships were produced in the shipyard of Sinop."
 abm_cnd_kure_copper_mine: "Kure Copper Mine"
 abm_cnd_kure_copper_mine_desc: "The copper mines at Kure are known for their quality copper deposits, taken from us once by the heirs of Osman Bey, now they belong to us again. We must ensure that we make more use of these mines to the benefit of our people."
 abm_cnd_ideas_ambition: "Candarid Ambition"
 abm_cnd_ideas_ambition_desc: "Candarid Ambition"
 abm_anatolian_beyliks_ideas_tradition_1: "Anatolian Tradition I"
 abm_anatolian_beyliks_ideas_tradition_1_desc: "Anatolian Tradition I"
 abm_anatolian_beyliks_ideas_tradition_2: "Anatolian Tradition II"
 abm_anatolian_beyliks_ideas_tradition_2_desc: "Anatolian Tradition II"
 abm_anatolian_beyliks_travelling_ozan: "Traveling Ozan"
 abm_anatolian_beyliks_travelling_ozan_desc: "Ozans sing and play the saz, they continue the traditions of Yunus Emre, Kaygusuz Abdal and Pir Sultan. Thanks to these traveling bards many interesting stories and epics have thrived throughout the years. We should support them as they are a part of our culture."
 abm_anatolian_beyliks_seljuq_marches: "Seljuq Marches"
 abm_anatolian_beyliks_seljuq_marches_desc: "Many independent Turkmen beyliks existed already under the Sultanate of Seljuq as well, especially in border areas, in order to ensure safety against the Byzantine empire."
 abm_anatolian_beyliks_akinci_cavalry: "Akîncî Cavalry"
 abm_anatolian_beyliks_akinci_cavalry_desc: "Our light cavalry would often go raiding the neighboring infidel lands and would sometimes even settle them. Historically, they were one of the first divisions to face the opposing military, would attack trading routes to cut enemy's supply and transportation. Known for their courage in battle, unpaid they lived and operated as raiders on the frontiers."
 abm_anatolian_beyliks_ghazi: "Ghazi"
 abm_anatolian_beyliks_ghazi_desc: "Our sultans emphasize their role as gazis, leaders in war against the non-believers. Warriors thus flock to our banner, seeking to win wealth, glory, and salvation in the fight to expand the Abode of Islam"
 abm_anatolian_beyliks_caravanserais: "Caravanserais"
 abm_anatolian_beyliks_caravanserais_desc: "Our caravanserais are supporting the flow of commerce, information, and people from China to Europe across our lands. By building more of them along our part of the Silk Road will ensure that we gain more of it."
 abm_anatolian_beyliks_anatolian_architecture: "Anatolian Architecture"
 abm_anatolian_beyliks_anatolian_architecture_desc: "Our architecture flourishes as numerous libraries, caravanserais, hammams, madrassas and other buildings are being built in increasingly different styles resulting in innovative and original works."
 abm_anatolian_beyliks_legacy_seljuqs_empire: "Legacy of the Great Seljuq Empire"
 abm_anatolian_beyliks_legacy_seljuqs_empire_desc: "From their homelands near the Aral Sea, the Seljuq Turks advanced in the 10th century first into Khorasan and then into mainland Persia before eventually conquering Anatolia. They established an empire later called the Great Seljuk empire and had profound effects on the Near East. We have grown strong enough to proclaim our state as the successor to this great empire of our forefathers. Rejoice!"
 abm_anatolian_beyliks_ideas_ambition: "Anatolian Ambition"
 abm_anatolian_beyliks_ideas_ambition_desc: "Anatolian Ambition"
 abm_rum_ideas_tradition_1: "Rûmi Tradition I"
 abm_rum_ideas_tradition_1_desc: "Rûmi Tradition I"
 abm_rum_ideas_tradition_2: "Rûmi Tradition II"
 abm_rum_ideas_tradition_2_desc: "Rûmi Tradition II"
 abm_rum_abul_fath: "Abul-Fath"
 abm_rum_abul_fath_desc: "We have enemies in all directions, making a strong army a necessity for a state such as ours. Fortunately we are not a weak people. From the irregular Gazis and the Akinci raiders to the Sipahis of the Ottoman Empire the world have come to know the military might of the Turkish people. Let us build an army for an Empire, taking inspiration from wherever military competence can be found while also drawing from the strengths and experiences of those that came before us."
 abm_rum_king_of_the_east_and_west: "Sultan al-Sharq wa al-Gharb"
 abm_rum_king_of_the_east_and_west_desc: "Since the fall of Rûm the Turkish people have been divided, serving minor Beys from the bosphorus to the mountains of Kurdistan. It was our duty to restore the legacy of the Seljuk Sultans of Rûm and unite the Anatolian Turks. Our ambition however must be much higher than that. The Seljuk Turks once ruled one of the greatest empires known to man, it is evident to anyone who sees our empire that the restoration of this state is now our destiny, as is the reclamation of the Roman lands that were once ruled from what is now our heartland."
 abm_rum_shahanshah: "Shahanshah"
 abm_rum_shahanshah_desc: "Rûm was not only an Anatolian state but also one that strongly honored the Persian traditions of kingship. Especially as Persia itself fell to Mongol conquerors. Under the sultans before us Persianate culture blossomed and Persian poets and scholars found patronage. Men such as Najm al-Din Razi, Qane'i Tusi, Baha' al-Din Walad and Rumi himself made their homes under Rûm’s protection and the Sultans themselves were versed in Persian literature and poetry.\nWe must cherish our Persian legacy as well as our Turkish and aspire to make our homeland a paragon of Persianate culture, the foremost of Islamic nations."
 abm_rum_sultan_of_rum: "Sultan of Rûm"
 abm_rum_sultan_of_rum_desc: "The Sultans of Rûm ruled over the people of Anatolia, Muslims and Christians. It was during their reign that Islam became the dominant religion in the region but their policies accepted all subjects. Often inviting even Christians from the nearby lands to seek out the domain of Rûm. We would do well to learn from their example."
 abm_rum_sulan_al_bahrayn: "Sultan al-Bahrayn"
 abm_rum_sulan_al_bahrayn_desc: "Like the Rûm sultans of the past we must establish a strong and durable navy that can withstand both Christian pirates and the fleets of other Muslims. The ability to control and expand over the Mediterranean and protect our coastlines is going to be one of the main challenges of our Empire."
 abm_rum_sultan_al_muazzam: "al-Sultan al-Muazzam"
 abm_rum_sultan_al_muazzam_desc: "The greatest of Sultans require grand monuments and buildings. Let us make the lands of Rûm the envy of the Islamic world, with mosques, madrasas, caravanserai, gardens, canals and palaces unlike any other. Through architectural patronage we can create an enduring and unique legacy for our dynasty."
 abm_rum_protector_of_dar_al_islam: "Protector of Dar al-Islam"
 abm_rum_protector_of_dar_al_islam_desc: "Our predecessors were always ready to defend the righteous and to combat the spread of heretical sects. So too must we do our utmost to promote the pure forms of religious worship and limit the the influence of heretical rulers who would otherwise try to seduce and mislead the faithful."
 abm_rum_ideas_ambition: "Rûmi Ambition"
 abm_rum_ideas_ambition_desc: "Rûmi Ambition"
