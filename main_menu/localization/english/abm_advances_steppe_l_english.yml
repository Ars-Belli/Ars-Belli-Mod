# ============================================================
# Steppe Advances Localization
# Source: .tools/eu4/localisation/powers_and_ideas_l_english.yml
# Tags: GAZ (Gazaria/Genoa), ZAZ (Zaporozhia), CRI (Crimea),
#       Horde (generic), KAZ (Kazan)
# ============================================================

# --- Gazaria / Genoa (GAZ) ---
 abm_gen_ideas_tradition_1: "Gazarian Traditions I"
 abm_gen_ideas_tradition_1_desc: "gazaria's wealth was built upon the twin pillars of trade and finance. Our merchants have sailed every sea and our bankers have financed empires."

 abm_gen_ideas_tradition_2: "Gazarian Traditions II"
 abm_gen_ideas_tradition_2_desc: "The Republic of gazaria has long understood that a sound financial system is the bedrock of naval supremacy."

 abm_reunited_genoa: "Reuniting the Nation"
 abm_reunited_genoa_desc: "The Treaty of Turin, between ourselves and Venice, in 1381 on paper looked as a draw. The crippling loss of our fleet led to infighting between various factions inside the country. We must bring this to an end if gazaria is to rise again."

 abm_lessons_of_chiogga: "The Lessons of Chioggia"
 abm_lessons_of_chiogga_desc: "In 1380 our fleet suffered a heavy defeat at the hands of the Venetians at the battle of Chioggia. The resulting peace of Turin has handed Venice dominance of the Mediterranean trade. The smaller more maneuverable Venetian Galleys proved superior to ours, we must remedy this."

 abm_genoese_trade: "Rebuilding Gazarian Trade"
 abm_genoese_trade_desc: "Venice has been in the box seat for trade for far too long, we need to ensure that our Merchants can retake markets. We must overhaul our legal system to ensure that our merchant families can meet the Venetians on an equal footing."

 abm_the_genoese_arsenal: "Build the Gazarian Arsenal"
 abm_the_genoese_arsenal_desc: "Venice began the construction of its arsenal in 1104 and since then Venice has enjoyed an advantage when it comes to ship construction. gazaria cannot allow this to stand, we must have our own arsenal to ensure we too can have a fleet to defend our interests."

 abm_overhauled_bureaucracy: "Overhaul the Bureaucracy"
 abm_overhauled_bureaucracy_desc: "To be blunt money is power. If we wish to remain a player in the Mediterranean, we will need more of it to support our fleet and army. Thus we must overhaul our bureaucracy to ensure we can maximize our revenue."

 abm_the_office_of_grand_admiral: "Setup the Office of Grand Admiral"
 abm_the_office_of_grand_admiral_desc: "The life blood of gazaria is trade and trade relies on a fleet. We must ensure that our fleet is properly administered. The setting up of an office of Grand Admiral responsible for the administration of our fleet will make sure our fleet will be better run."

 abm_standardisation_of_designs: "Standardization of Designs"
 abm_standardisation_of_designs_desc: "Each shipyard and even each shipwright has their own design for a ship. Although they are pretty much the same ship in practice, those small differences mean that supplying the materials for the ships becomes more time consuming. Setting up a design board to supply standard designs to our yards will allow us to speed up construction."

 abm_gen_ideas_ambition: "Gazarian Ambition"
 abm_gen_ideas_ambition_desc: "A powerful fleet is the ultimate guarantor of Gazarian independence and prosperity. By reducing the cost of maintaining our navy, we ensure that the flag of Saint George will forever fly over the Mediterranean and the Black Sea."

# --- Zaporozhia (ZAZ) ---
 abm_zaz_tradition_1: "Zaporozhian Traditions I"
 abm_zaz_tradition_1_desc: "The Cossacks of the Dnieper have always lived by the sword, raiding and pillaging to sustain their free way of life. This martial tradition is the foundation of our Sich."

 abm_zaz_tradition_2: "Zaporozhian Traditions II"
 abm_zaz_tradition_2_desc: "Life on the frontier demands resilience. Our people recover quickly from losses and are always ready for the next campaign."

 abm_zaz_fort_builders: "Fast Fort Builders"
 abm_zaz_fort_builders_desc: "Everything in Zaporozhian society revolves around the military and the military is the main trade of our people. Always ready to be on the move, whether to flee from a more powerful foe, or to swiftly move in and claim a better land, our people have over time, and out of need, developed an ability to always remain mobile. Some build their walls tall and thick, we build our forts quickly."

 abm_zaz_hetmanate: "Hetmanate"
 abm_zaz_hetmanate_desc: "All shall be equal and none above any. While Europe ponders as to how can a state without aristocrats exist, our people enjoy freedom without match."

 abm_zaz_steppe_riders: "Steppe Riders"
 abm_zaz_steppe_riders_desc: "The Steppe is a peculiar and treacherous place to live and when it comes to dying, the variety of choices is endless when you are horseless. When you enter the Endless Sea of Grass, your horse stops being an animal or piece of property, and truly becomes a part of you. Just as your body cannot survive without a heart or a liver, in the steppes it certainly won't survive without a horse."

 abm_zaz_cossack_hit_and_run: "Hit And Run"
 abm_zaz_cossack_hit_and_run_desc: "The steppe can be alluring with its would-be conquerors. Like a mirage, it can give you the false impression of abundance and opportunity, but only those who know this land well can ever hope to survive in it. In our steppes we are the ones who will choose the time to fight."

 abm_zaz_classy_diplomacy: "Brutal Diplomacy"
 abm_zaz_classy_diplomacy_desc: "Although quality usually beats quantity, quantity also has a quality of its own. Our people may be a little rough, or rather somewhat lacking in refinement, but nobody should doubt their ability to express themselves painfully clearly."

 abm_zaz_zaporzhian_tolerance: "Steppe Tolerance"
 abm_zaz_zaporzhian_tolerance_desc: "The Zaporozhian steppe is many things to many people. But its only one thing for everyone is the promise of freedom, without match in the known world. Here there are no nobles, church or kings who rule, and only God and the skies above you, as far as the eye can see."

 abm_zaz_army_first: "Army First"
 abm_zaz_army_first_desc: "Most countries raise armies by recruiting peasants, some countries hire sell-sword mercenaries to fight their wars for them. Our state is our army."

 abm_zaz_ambition: "Zaporozhian Ambition"
 abm_zaz_ambition_desc: "The free Cossack way of life shall never perish. Our regiments will multiply until no power on earth can threaten our beloved Sich."

# --- Crimea (CRI) ---
 abm_cri_tradition_1: "Crimean Traditions I"
 abm_cri_tradition_1_desc: "The Crimean Khanate sits at the crossroads of civilizations, and we have learned to deal fairly with all peoples who cross our path."

 abm_cri_tradition_2: "Crimean Traditions II"
 abm_cri_tradition_2_desc: "Our Khans descend from the Golden Horde and command the respect of all who dwell upon the steppe."

 abm_cri_despoilers: "Despoilers"
 abm_cri_despoilers_desc: "Our raiders strike rapidly and without warning. Utterly unable to anticipate our attacks, our enemies will surely cower before us."

 abm_cri_settle_the_steppes: "Settle the Crimean Steppe"
 abm_cri_settle_the_steppes_desc: "It is time that we established more permanent settlements. We should identify suitable locations to establish these settlements, making sure to take into account the flow of trade and the most defensible terrain."

 abm_cri_ambition: "Crimean Ambition"
 abm_cri_ambition_desc: "The legacy of the Great Khan lives on in Crimea. We shall expand our realm until all the lands of the Golden Horde are united once more."

# --- Generic Horde Ideas ---
 abm_horde_ideas_tradition_1: "Horde Traditions I"
 abm_horde_ideas_tradition_1_desc: "The steppe breeds warriors, not farmers. Our people are born in the saddle and raised with the bow."

 abm_horde_ideas_tradition_2: "Horde Traditions II"
 abm_horde_ideas_tradition_2_desc: "Unity under a strong Khan is what separates a horde from a mere band of raiders."

 abm_horde_ideas_traditions_of_the_great_khan: "Traditions of the Great Khan"
 abm_horde_ideas_traditions_of_the_great_khan_desc: "The Great Khan made the world tremble with the fearsomeness of his horsemen and the breath of his ambition. We must bring back these traditions so we too can make the world tremble at our armies."

 abm_horde_ideas_horse_supplies: "Horse Supplies"
 abm_horde_ideas_horse_supplies_desc: "War is harder on horses than it is on men. We need to ensure that our fearsome cavalry are well maintained. We must ensure that we have enough horses at all times to keep our armies strong and do so cheaply."

 abm_horde_ideas_steppe_leaders: "Steppe Leaders"
 abm_horde_ideas_steppe_leaders_desc: "By preserving our ancient traditions of the hunt we ensure that our armies are lead by men who understand the use of the horse in combat. This will lead to better leadership."

 abm_horde_ideas_life_of_steppe_warrior: "The Life of a Steppe Warrior"
 abm_horde_ideas_life_of_steppe_warrior_desc: "The Arid steppe is a foreboding and unforgiving place for the unprepared. We as a people are used to living in the harshest of environments and as such our people are sturdy and have a knack for survival. We will ensure that all of our soldiers share these experiences and are thus able to survive much better."

 abm_horde_ideas_tradition_of_conquest: "The Tradition of Conquest"
 abm_horde_ideas_tradition_of_conquest_desc: "Conquering people can be a tricky business, not everyone is ready for our enlightened government. Still we have discovered that there are easier ways than building a mountain of skulls to bring people into our empire. It is something that our ancestors never learned."

 abm_horde_ideas_logistics_of_khan: "Logistics of the Khan"
 abm_horde_ideas_logistics_of_khan_desc: "People forget that the conquests of the Great Khan were as much by superior logistics as by superior military strength. We must emulate the techniques of the Great Khan while making them current with the times. This will give us greater scope for conquest."

 abm_horde_ideas_glory_of_conquest: "The Glory of Conquest"
 abm_horde_ideas_glory_of_conquest_desc: "Let it be known that boy cannot be a man unless he has rode first with our invincible host, that he can take no wife until he has defiled another man's wife, that he is not worthy of a hut until he has burnt down someone else's. Let service in our armies be the only route to manhood."

 abm_horde_ideas_ambition: "Horde Ambition"
 abm_horde_ideas_ambition_desc: "Where our horses tread, the grass shall never grow again. Our legacy shall be written in the ashes of empires."

# --- Kazan (KAZ) ---
 abm_kaz_tradition_1: "Kazani Traditions I"
 abm_kaz_tradition_1_desc: "The Khanate of Kazan commands the confluence of the Volga and Kazanka rivers, a crossroads of trade and cultures."

 abm_kaz_tradition_2: "Kazani Traditions II"
 abm_kaz_tradition_2_desc: "Our people have long lived alongside those of different faiths, and we have learned the value of tolerance in maintaining a stable realm."

 abm_kaz_religious_unity: "Steppe Tolerance"
 abm_kaz_religious_unity_desc: "The steppe is so large, that we cannot hear the prayers of heathens."

 abm_kaz_core_creation: "Tribal Legacy"
 abm_kaz_core_creation_desc: "In the sea of grass concepts of legitimacy and justification of conquest become irrelevant. In the steppe bad news don't travel at all as nobody hears the screams of the vanquished."

 abm_kaz_cavalry_power: "Warrior Society"
 abm_kaz_cavalry_power_desc: "A man is man, and a woman is woman, only as long as they can ride and fight. In the steppe everyone is a warrior, because only the toughest survive. The steppe does not forgive."

 abm_kaz_manpower: "Legacy of the Great Horde"
 abm_kaz_manpower_desc: "Oral tradition is the basis of our society. A long time ago, our elders say, a young boy rose from nothing to become the Khan of Khans and conquered the whole world in the mere blink of a lifetime. The world still trembles from his name and it shall learn to fear the steppes once again."

 abm_kaz_leadership: "Steppe Warfare"
 abm_kaz_leadership_desc: "Since the dawn of time, when our forefathers knew nothing of the one God and his Prophet, steppe warfare revolved around one thing: unity of a horse and a man. In the steppe they become one, a single life, and a single fighting force. No army has ever managed to beat the steppe hit and run tactics, even the mighty Iskender fell before us."

 abm_kaz_defensiveness: "Settle Down"
 abm_kaz_defensiveness_desc: "Time has come to abandon our nomadic life style and settle down like the Westerners do. We shall build mighty walls that will never fall."

 abm_kaz_trade: "End Western Domination"
 abm_kaz_trade_desc: "For the very long time our tribes have traded with Russian and Western merchants, letting these foreigners take most profits. Now the time has come for us to claim our own presence in the great Western and Eastern centers of trade!"

 abm_kaz_ambition: "Kazani Ambition"
 abm_kaz_ambition_desc: "The heirs of the Golden Horde shall rise again. Our cavalry shall sweep across the steppe like a storm, and none shall stand before us."

