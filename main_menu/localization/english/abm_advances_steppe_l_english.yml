# --- Taurica (ABTAU) ---
 abm_abtau_tradition_1: "Tauric Tradition I"
 abm_abtau_tradition_1_desc: "Tauric Tradition I"

 abm_abtau_tradition_2: "Tauric Tradition II"
 abm_abtau_tradition_2_desc: "Tauric Tradition I"

 abm_abtau_gothic_discipline: "Gothic Discipline"
 abm_abtau_gothic_discipline_desc: "The Crimean Goths, heirs of the warriors who once sacked Rome, still drill upon the mountain plateaus of Gothia. Their stern martial code stiffens the resolve of all who serve beneath the Tauric banner."

 abm_abtau_harbours_of_gazaria: "Harbours of Gazaria"
 abm_abtau_harbours_of_gazaria_desc: "The Genoese founded Caffa, Soldaia and a score of lesser havens to knit the Black Sea into a single web of trade. We perfect this network of harbours, so that every wave of the Pontus carries our ships and our goods."

 abm_abtau_steppe_warriors: "Steppe Horsemen"
 abm_abtau_steppe_warriors_desc: "Born in the saddle upon the endless sea of grass, our riders inherit the tactics of the Scythians, Alans and Cumans who roamed these plains. Light horse to scout and harry, heavy horse to break the line — the Pontic steppe offers no finer cavalry."

 abm_abtau_emporia_of_the_steppe: "Emporia of the Steppe"
 abm_abtau_emporia_of_the_steppe_desc: "Where the great caravan roads of the steppe meet the Black Sea, fortunes are made by those who build the markets. We raise emporia at every crossroads, drawing merchants and the ideas they carry from the whole known world."

 abm_abtau_tauric_granaries: "Tauric Granaries"
 abm_abtau_tauric_granaries_desc: "The black earth of Taurica yields wheat enough to feed the Aegean. By improving our granaries and extending our cultivation into the steppe, we turn the Tauric countryside into a source of unending prosperity."

 abm_abtau_commune_of_caffa: "Commune of Caffa"
 abm_abtau_commune_of_caffa_desc: "Under the Genoese, Caffa was governed as a commune of merchants who chose their own consuls. We restore this republican spirit, so that the burghers of Taurica may feel a true stake in the state they enrich."

 abm_abtau_cave_cities_of_gothia: "Cave Cities of Gothia"
 abm_abtau_cave_cities_of_gothia_desc: "Chufut-Kale, Mangup and Eski-Kermen — the Goths carved their strongholds into the very cliffs. These enduring stone cities, cheap to maintain and near impossible to storm, shelter our people from every invader that rides out of the steppe."

 abm_abtau_ambition: "Tauric Ambition"
 abm_abtau_ambition_desc: "Tauric Ambition"

