 abm_expel_fondacos_effect_text: "[SCOPE.sCountry('actor').GetName] expel the Fondacos, Kontors and Enclaves of [SCOPE.sCountry('recipient').GetName] from their lands and revoke their [ShowRelationTypeName('fondaco_rights')]."
