# --- from abm_economic_support_l_english.yml ---
 abm_economic_support_relation: "Economic Support"
 abm_economic_support_relation_desc: "A wealthier [country|e] sends an agreed sum of [gold_i] to another every month. The sum is capped at a quarter of the recipient's [tax_base|e], and can never exceed two and a half months of the sender's income. Both parties spend a #H Defensive Point#! and #R -0.10#! monthly [diplomats|e] for as long as the arrangement stands."

 # The interaction that starts the relation - this is what players click.
 abm_send_economic_support: "Send $abm_economic_support_relation$"
 abm_send_economic_support_desc: "Send a country a sum of [gold_i] every month. We may send at most a quarter of their [tax_base|e] each month, and never more than two and a half months of our own income - a small economy cannot absorb a large [country|e]'s gold. It costs us a #H Defensive Point#! and #R -0.10#! monthly [diplomats|e], and costs them the same."
 CATEGORY_ECONOMY_ACTIONS_abm_send_economic_support: "Send $abm_economic_support_relation$"
 abm_send_economic_support_act: "Offer $abm_economic_support_relation$"
 INCOMING_OFFER_abm_send_economic_support: "$ACTOR$ have offered to send us $abm_economic_support_relation$. Accepting will cost us a #H Defensive Point#! and #R -0.10#! monthly [diplomats|e] for as long as it lasts. Do we wish to accept?\n\n$INFO$"
 PROPOSE_abm_send_economic_support: "Offer $abm_economic_support_relation$ to $RECIPIENT$?\n$INFO$."
 abm_send_economic_support_effect_text: "[SCOPE.sCountry('actor').GetName] begins sending $abm_economic_support_relation$ to [SCOPE.sCountry('recipient').GetName]"
 abm_send_economic_support_effect_text_past: "[SCOPE.sCountry('actor').GetName] began sending $abm_economic_support_relation$ to [SCOPE.sCountry('recipient').GetName]"
 abm_send_economic_support_reject_effect_text: "$generic_reject_demand_effect_string$"
 abm_send_economic_support_reject_effect_text_past: "$generic_reject_demand_effect_string_past$"
 dip_abm_send_economic_support_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 INCOMING_OFFER_TITLE_abm_send_economic_support: "Economic Support Offered"

 # Auto-generated relation keys the engine asks for (see game.log on load).
 abm_economic_support_effect_text: "[SCOPE.sCountry('actor').GetName] sends $abm_economic_support_relation$ to [SCOPE.sCountry('recipient').GetName]"
 abm_economic_support_effect_text_past: "[SCOPE.sCountry('actor').GetName] sent $abm_economic_support_relation$ to [SCOPE.sCountry('recipient').GetName]"
 diplomatic_status_giving_abm_economic_support_name: "Sending $abm_economic_support_relation$"
 diplomatic_status_giving_abm_economic_support_tooltip: "We are sending them [gold_i] every month."
 giving_abm_economic_support_list_who_tt: "We are sending $abm_economic_support_relation$ to:"
 diplomatic_status_receiving_abm_economic_support_name: "Receiving $abm_economic_support_relation$"
 diplomatic_status_receiving_abm_economic_support_tooltip: "They are sending us [gold_i] every month."
 receiving_abm_economic_support_list_who_tt: "We are receiving $abm_economic_support_relation$ from:"
 STATIC_MODIFIER_NAME_giving_abm_economic_support: "Sending $abm_economic_support_relation$"
 STATIC_MODIFIER_DESC_giving_abm_economic_support: "We send this country a monthly sum of [gold_i], capped at their [tax_base|e]."
 STATIC_MODIFIER_NAME_receiving_abm_economic_support: "Receiving $abm_economic_support_relation$"
 STATIC_MODIFIER_DESC_receiving_abm_economic_support: "This country sends us a monthly sum of [gold_i], capped at our [tax_base|e]."

 # Relation action and popup keys. The engine builds these from the offer_/cancel_/
 # break_ prefixes (the same set vanilla gives every scripted relation in
 # scripted_relations_l_english.yml). The offer popup appears when the interaction's
 # create_relation fires, so its text names no country - the effect list under it
 # already does.
 offer_abm_economic_support_happened_title: "$abm_economic_support_relation$ Agreed"
 offer_abm_economic_support_happened_desc: "A new $abm_economic_support_relation$ arrangement has been agreed. Both sides spend a #H Defensive Point#! and #R -0.10#! monthly [diplomats|e] for as long as it lasts."
 cancel_abm_economic_support: "Cancel $abm_economic_support_relation$"
 cancel_abm_economic_support_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 cancel_abm_economic_support_cta: "Stop sending $abm_economic_support_relation$ to [SCOPE.sCountry('recipient').GetName]"
 cancel_abm_economic_support_desc: "We will stop sending them gold, freeing the #H Defensive Point#! and the monthly [diplomats|e] it costs us."
 cancel_abm_economic_support_cta_to_unknown: "Stop sending $abm_economic_support_relation$ to a [country|e]"
 cancel_abm_economic_support_desc_to_unknown: "$cancel_abm_economic_support_desc$"
 cancel_abm_economic_support_happened_title: "$abm_economic_support_relation$ Cancelled"
 cancel_abm_economic_support_happened_desc: "[SCOPE.sCountry('actor').GetName] stopped sending $abm_economic_support_relation$ to [SCOPE.sCountry('recipient').GetName]."
 cancel_abm_economic_support_proposal_question: "Stop sending $abm_economic_support_relation$ to [TARGET_COUNTRY.GetName]?\n$INFO$"
 break_abm_economic_support: "Refuse $abm_economic_support_relation$"
 break_abm_economic_support_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 break_abm_economic_support_cta: "Stop accepting $abm_economic_support_relation$ from [SCOPE.sCountry('recipient').GetName]"
 break_abm_economic_support_desc: "We will refuse further gold, freeing the #H Defensive Point#! and the monthly [diplomats|e] it costs us."
 break_abm_economic_support_cta_to_unknown: "Stop accepting $abm_economic_support_relation$ from a [country|e]"
 break_abm_economic_support_desc_to_unknown: "$break_abm_economic_support_desc$"
 break_abm_economic_support_happened_title: "$abm_economic_support_relation$ Refused"
 break_abm_economic_support_happened_desc: "[SCOPE.sCountry('actor').GetName] refused further $abm_economic_support_relation$ from [SCOPE.sCountry('recipient').GetName]."
 break_abm_economic_support_proposal_question: "Stop accepting $abm_economic_support_relation$ from [TARGET_COUNTRY.GetName]?\n$INFO$"

 abm_economic_support_select_amount: "Gold sent each month - limited by their [tax_base|e]"
 abm_economic_support_one_patron_tt: "They must not already be receiving $abm_economic_support_relation$ from another [country|e]"
 abm_economic_support_points_tt: "We must not be over our #H Defensive Point#! limit"
 abm_economic_support_recipient_points_tt: "They must not be over their #H Defensive Point#! limit"

 # ---------------------------------------------------------------------------
 # The vanilla engine action cannot be removed - it is not exposed to script in
 # any form - so it is relabelled to steer players onto the mod action instead. The
 # warning leads the title because the diplomacy list truncates long button labels.
 # ---------------------------------------------------------------------------
 ECONOMIC_SUPPORTTITLE: "(#R AGAINST THE RULES#!) Send Economic Support"
 ECONOMIC_SUPPORT_TOOLTIP_HEADER: "#R Do not use#! - Send Economic Support to [TARGET_COUNTRY.GetName]"
 ECONOMIC_SUPPORT_TOOLTIP_HEADER_NO_TARGET: "#R Do not use#! - Send Economic Support to a [country|e]"
 ECONOMIC_SUPPORT_DESC: "#R This is the vanilla action and is against the rules in Ars Belli.#!\n\nIt bypasses the recipient's consent, costs no #H Defensive Point#!, and costs no monthly [diplomats|e]. Use $abm_economic_support_relation$ instead.\n\nSelect how much [gold_i] we should send them each month."
 ECONOMIC_SUPPORT_FLAVOR: "#R Against the rules.#! Use $abm_economic_support_relation$ instead - it asks the recipient first and charges both sides properly."
 CANCEL_ECONOMIC_SUPPORTTITLE: "Cancel Economic Support (vanilla)"
 CANCEL_ECONOMIC_SUPPORT_TOOLTIP_HEADER: "Cancel our vanilla Economic Support to [TARGET_COUNTRY.GetName]"
 CANCEL_ECONOMIC_SUPPORT_TOOLTIP_HEADER_NO_TARGET: "Cancel our vanilla Economic Support to a [country|e]"
 CANCEL_ECONOMIC_SUPPORT_FLAVOR: "This ends a vanilla Economic Support arrangement, which should not have been started. Use $abm_economic_support_relation$ instead."

# --- from abm_enforce_peace_l_english.yml ---
 abm_enforce_peace: "Enforce Peace"
 abm_enforce_peace_desc: "Demand that a war be brought to a white peace. The defender is asked first, and only if they agree is the demand put to the attacker. If the attacker refuses, we enter the war on the defender's side."
 CATEGORY_MILITARY_ACTIONS_abm_enforce_peace: "Enforce Peace"
 abm_enforce_peace_act: "Demand a white peace in a war"
 abm_enforce_peace_select_defender: "Select a Defender to Offer Peace To"
 abm_enforce_peace_select_war: "Select a War to End"
 abm_enforce_peace_no_defenders: "@trigger_no! No country is currently defending a war we could demand a [white_peace|e] in."
 abm_enforce_peace_no_wars: "$no_valid_wars$"
 abm_enforce_peace_select_a_war: "Select a war to bring to a white peace"
 abm_enforce_peace_standing_tt: "We must be a #H Great Power#! or a #H Major Power#!, or one of the war's leaders must be our [rival|e]"
 # War-view button requirement lines. Shown passed or failed so a player who cannot
 # use the action still learns what it needs.
 abm_ep_req_standing_met: "@trigger_yes! We are a #H Great Power#! or a #H Major Power#!, or one of the war's leaders is our [rival|e]"
 abm_ep_req_standing_unmet: "@trigger_no! We must be a #H Great Power#! or a #H Major Power#!, or one of the war's leaders must be our [rival|e]"
 abm_ep_req_not_participant_met: "@trigger_yes! We are not fighting in this [war|e]"
 abm_ep_req_not_participant_unmet: "@trigger_no! We cannot demand peace in a [war|e] we are fighting in ourselves"
 abm_enforce_peace_defender_refused_tt: "The war continues unchanged"
 INCOMING_OFFER_abm_enforce_peace: "$ACTOR$ demands that our war be brought to a white peace. If we agree, the demand will then be put to the enemy, and $ACTOR$ will join the war on our side should they refuse. Do we accept?\n\n$INFO$"
 PROPOSE_abm_enforce_peace: "Demand a white peace from $RECIPIENT$?\n$INFO$."
 abm_enforce_peace_effect_text: "[SCOPE.sCountry('actor').GetName] demands a white peace in the [SCOPE.sWar('target').GetName]"
 abm_enforce_peace_effect_text_past: "[SCOPE.sCountry('actor').GetName] demanded a white peace in the [SCOPE.sWar('target').GetName]"
 abm_enforce_peace_reject_effect_text: "$generic_reject_demand_effect_string$"
 abm_enforce_peace_reject_effect_text_past: "$generic_reject_demand_effect_string_past$"
 dip_abm_enforce_peace_CATEGORY: "CATEGORY_MILITARY_ACTIONS"
 INCOMING_OFFER_TITLE_abm_enforce_peace: "Enforce Peace"

 abm_enforce_peace.1.title: "A Demand for Peace"
 abm_enforce_peace.1.desc: "[SCOPE.sCountry('ep_enforcer').GetNameWithNoTooltip] has demanded that we bring our war against [SCOPE.sCountry('ep_defender').GetNameWithNoTooltip] to a close, and [SCOPE.sCountry('ep_defender').GetNameWithNoTooltip] has already consented to a white peace.\n\nThe choice now rests with us. We may lay down our arms and accept that nothing is to be gained from this war, or we may press on regardless - though if we do, [SCOPE.sCountry('ep_enforcer').GetNameWithNoTooltip] has made plain that they will take the field against us."
 abm_enforce_peace.1.a: "Very well. Let there be peace."
 abm_enforce_peace.1.b: "We will not be dictated to. The war goes on."

 abm_enforce_peace.2.title: "The War Is Ended"
 abm_enforce_peace.2.desc: "Both sides have accepted our terms. The war has been brought to a white peace, and neither party takes anything from the other. Our word carried weight where armies would otherwise have marched."
 abm_enforce_peace.2.a: "As it should be."

 abm_enforce_peace.3.title: "Our Demand Is Refused"
 abm_enforce_peace.3.desc: "[SCOPE.sWar('ep_war').GetName] continues. Though the defenders were willing to accept a white peace, the attackers have refused our demand outright.\n\nWe said we would stand with the defenders if it came to this, and so we shall. We are now at war."
 abm_enforce_peace.3.a: "Then we honour our word."

 # Retarget the vanilla rival-war alert: it used to advertise Intervene in War.
 ALERT_INTERVENE_RIVAL_WAR_AVAILABLE_TITLE: "Enforce Peace on a Rival"
 ALERT_INTERVENE_RIVAL_WAR_AVAILABLE: "One of our [rivals|e] is at war. We can demand a [white_peace|e] to bring it to an end."
 ALERT_INTERVENE_RIVAL_WAR_ENTRY: "[WAR.GetName]: Demand a [white_peace|e] against [COUNTRY.GetName]."

 # Shown in the emptied Intervene in War picker (in_game/gui/select_war_to_intervene.gui).
 # That window is the last gate on every remaining path to the action, including the
 # rival path the engine grants regardless of rank, so it lists no wars at all.
 abm_intervene_removed_popup: "#R Intervene in War has been removed in Ars Belli.#!\n\nIt dragged one country into another's [war|e] with no say from either side. No rank grants it, the HRE Emperor does not get it, and being someone's [rival|e] does not bring it back - there is nothing here to pick.\n\nUse #Y Enforce Peace#! instead: the defender is asked for a [white_peace|e] first, and only if they accept is the demand put to the attacker, who takes us into the war against them if they refuse."

