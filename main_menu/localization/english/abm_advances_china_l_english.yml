 abm_mng_single_whip_law: "Single Whip Law"
 abm_mng_single_whip_law_desc: "The collection of taxes may sound like an easy thing but for an enormous empire like ours it is in fact an extremely complicated task. By turning most obligations towards the central government - from poll taxes to the labor obligations of the peasantry or the tributes of local officials - into a single silver payment at a level based on the population and cultivated land in each prefecture, the effort needed for tax collection is reduced and our income will increase."
 abm_mng_the_red_cannon: "The Red Cannon"
 abm_mng_the_red_cannon_desc: "The red haired barbarians from Europe may be uncivilized and ill-mannered, but they do know how to make artillery and firearms of good quality. Importing and duplicating their weapons will improve our army and make it much more effective against the barbarian invaders."
