 abm_mng_revived_three_grand_divisions_desc: "In the elite special forces founded by Emperor Yongle the Divine Engine Division specialized in firearms, the Three Thousand Division in mounted combat and the Five Barracks Division in drilling infantry to perform tactical maneuvers. This system stagnated in the 1450s but now the time has come to revive it. The elites forces of our imperial army are vital if we are to resist the barbarians that surround us."
