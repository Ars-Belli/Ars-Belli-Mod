 # YUA
 abm_yua_tradition_1: "Yuán Tradition I"
 abm_yua_tradition_1_desc: "Yuán Tradition I"
 abm_yua_tradition_2: "Yuán Tradition II"
 abm_yua_tradition_2_desc: "Yuán Tradition II"
 abm_yua_a_savage_kingdom_holy_and_enchanted: "A Savage Kingdom Holy and Enchanted"
 abm_yua_a_savage_kingdom_holy_and_enchanted_desc: "Weaker nations fear our might and name us savages. Yet they crave strength such as ours and gasp at our grandeur while sighing at their own cowardice. Let us bear the name of 'Savage' proudly, no one excels at fierceness like the sons of the Great Khan.\n"
 abm_yua_da_zai_qian_yuan: "Da Zai Qian Yuan"
 abm_yua_da_zai_qian_yuan_desc: "Kublai Khan, the Shizu Emperor of Great Yuan Ulus, named our incomparable empire based on this famous phrase from I-Ching Tuanzhuan, pleased by its auspiciousness and appropriateness. We have at last begun to live up to this name again by reclaiming the legacy of the Great Yuan.\n\n'Vast Ye Qian Yuan, the heavenly, the primal, the dominant nation of all under heaven!'\n"
 abm_yua_keshik_and_weijun: "Keshik and Weijun"
 abm_yua_keshik_and_weijun_desc: "As the One Khagan of all Hordes our ruler should be accompanied by his Keshiktens, and as the Son of Heaven over the Middle Kingdom he is to be defended by Weijun, the Imperial Guards. They are the two wings of our leader, and will balance each other's power as factions in our state.\n"
 abm_yua_the_three_teachings_and_nine_schools_respected: "The Three Teachings and Nine Schools All Respected"
 abm_yua_the_three_teachings_and_nine_schools_respected_desc: "The Yuan Empire is not a mere nation of conquest. We learn from our subjects and strive to better our rule. All the schools and branches of Chinese philosophy must be revered. We must gain the wisdom of these masters as our own and use it to hold together and expand an Empire worthy of its name.\n"
 abm_yua_a_thousand_miles_as_if_at_home: "A Thousand Miles as if at Home"
 abm_yua_a_thousand_miles_as_if_at_home_desc: "The Grand Ulus of the Yuan, was once universally praised for its extraordinary road system. Along its well-guarded routes it was possible to travel effortlessly over vast distances. We should strive to recreate this legacy if we are to rule an empire as vast as that of Kublai Khan.\n"
 abm_yua_sino_mongol_administration: "Sino-Mongol Administration"
 abm_yua_sino_mongol_administration_desc: "The Chinese have a long and stable tradition of government that could serve us well. In order to maintain an empire as great as ours, however, we must not let ourselves be blinded by the Chinese ideals of meritocracy and service. Mongol government stresses loyalty and reliability and has a long tradition of employing able men from all over the empire.\nWe should strive to find a golden balance between Mongol and Chinese traditions in order to create a hybrid government that is just as able to rule the highlands of Tibet, the vast Steppes and the great expanse of China itself.\n"
 abm_yua_pax_mongolica: "Pax Mongolica"
 abm_yua_pax_mongolica_desc: "The pacification of Mongolia, of China, Tibet and all other parts of the Great Yuan Empire, once allowed an unprecedented economic growth to take place. Now that we have reclaimed the Yuan heritage we should also live up to the name and protect all within our borders. Let the trade flow freely, under the benevolent protection of the Great Khagan and his kin.\n"
 abm_yua_ambition: "Yuán Ambition"
 abm_yua_ambition_desc: "Yuán Ambition"
