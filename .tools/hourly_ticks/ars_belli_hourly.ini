; Ars Belli hourly ticks (version.dll in the game's binaries folder).
; Every player in a multiplayer game needs the same DLL and the same hours_per_tick;
; the DLL salts the multiplayer checksum with it, so a mismatch can't join.
[ticks]
; 0 = off (the DLL only passes calls through, checksum unchanged)
enabled=1
; Hours per tick: 1 2 3 4 6 8 12 or 24 (24 = vanilla 1.4, one tick a day).
; Battles get 24 / hours_per_tick rounds a day. 1.3 had 2 (12 rounds a day).
hours_per_tick=4
