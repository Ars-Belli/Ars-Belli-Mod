; Ars Belli hourly ticks (version.dll in the game's binaries folder).
; Every player in a multiplayer game needs the same DLL and the same hours_per_tick;
; the DLL salts the multiplayer checksum with it, so a mismatch can't join.
[ticks]
; 0 = off (the DLL only passes calls through, checksum unchanged)
enabled=1
; Hours per tick: 1 2 3 4 6 8 12 or 24 (24 = vanilla 1.4, one tick a day).
; Battles get 24 / hours_per_tick rounds a day. 1.3 had 2 (12 rounds a day).
hours_per_tick=2
; Hour the clock shows on the first tick of a day. The clock goes one hour a tick,
; so at 2 hours a tick a day shows 07:00 to 18:00 (1.3's own MORNING_OFFSET was 8).
; Only the text: the day still starts at midnight inside the game.
first_hour=7
; 1 = armies and navies move every tick (a day's distance split over the day's ticks),
; battles start at the hour armies meet. 0 = movement daily, only battle rounds every tick.
; The march morale cost, sieges, supply and the AI stay daily either way.
hourly_movement=1
