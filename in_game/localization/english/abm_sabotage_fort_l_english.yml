l_english:
 abm_sabotage_fort: "Sabotage Fort"
 abm_sabotage_fort_desc: "Our agents buy off, scatter and discharge the men who man the walls of a single [location|e]. Every [pop|e] of [ShowPopTypeName('soldiers')] living there is turned into [ShowPopTypeName('peasants')], leaving the [fort|e] with nobody to work it until the [location] raises new soldiers of its own.\n\nBuying off a garrison costs [gold_i] scaled to the target's own monthly income, so the richer the realm we strike at, the dearer the bribe.\n\nA [capital|e] cannot be sabotaged this way - its garrison is too close to the throne to be bought.\n\nOnly usable against a [country|e] we are at [war|e] with, at most once every 2 years, and a country that has just been sabotaged cannot be targeted again by anyone for 2 years. Unlocked by the #Y Espionage#! focus pick."
 abm_sabotage_fort_victim_cd_tt: "Has not had a [fort|e] sabotaged in the last 2 years"
 abm_sabotage_fort_cd_cooldown: "Sabotage Fort"
 CATEGORY_COVERT_ACTIONS_abm_sabotage_fort: "Sabotage Fort"
 abm_sabotage_fort_act: "Sabotage a Fort of [SCOPE.sCountry('recipient').GetName]"
 PROPOSE_abm_sabotage_fort: "Sabotage a fort belonging to $RECIPIENT$?\n$INFO$."

 abm_sabotage_fort_select_country: "Select a [country|e] whose [fort|e] we will sabotage"
 abm_sabotage_fort_no_countries: "We are not at [war|e] with any [country|e] in [diplomatic_range|e] whose [fort|e] we could sabotage."
 abm_sabotage_fort_select_location: "Select the [location|e] whose [fort|e] we will sabotage"
 abm_sabotage_fort_no_locations: "They hold no [location|e] with a [fort|e] that we can reach. Their [capital|e] cannot be targeted."

 abm_sabotage_fort_tt: "Every [pop|e] of [ShowPopTypeName('soldiers')] in the selected [location|e] becomes [ShowPopTypeName('peasants')], leaving its [fort|e] unmanned."
 abm_sabotage_fort_needs_a_fort_tt: "They must own at least one [location|e] with a [fort|e] outside their [capital|e]"
 abm_sabotage_fort_needs_soldiers_tt: "The [location|e] must still have [ShowPopTypeName('soldiers')] living in it"

 abm_sabotage_fort_effect_text: "[SCOPE.sCountry('actor').GetName] sabotages the [fort|e] in [SCOPE.sLocation('target').GetName]"
 abm_sabotage_fort_effect_text_past: "[SCOPE.sCountry('actor').GetName] sabotaged the [fort|e] in [SCOPE.sLocation('target').GetName]"

 # ---------------------------------------------------------------------------
 # Notification messages. Country interactions raise these automatically unless
 # the action sets show_message / show_message_to_target = no, which this one
 # deliberately does not - the victim is meant to find out, and to be told which
 # location it was, so they can garrison or rebuild. Key set mirrors vanilla
 # move_subject_capital, the closest vanilla action with a location target.
 # ---------------------------------------------------------------------------
 WE_PERFORM_abm_sabotage_fort_ACTION_SETUP: "When we sabotage the fort of another country."
 WE_PERFORM_abm_sabotage_fort_ACTION_HEADER: "$MESSENGER$"
 WE_PERFORM_abm_sabotage_fort_ACTION_TITLE: "[SCOPE.sCountry('recipient').GetAdjective] Fort Sabotaged!"
 WE_PERFORM_abm_sabotage_fort_ACTION_EFFECTS: "Our agents have emptied the [fort|e] in [SCOPE.sLocation('target').GetName] of the [ShowPopTypeName('soldiers')] who manned it."
 WE_PERFORM_abm_sabotage_fort_ACTION_FLAVOR: "Walls without men on them are only stone."
 WE_PERFORM_abm_sabotage_fort_ACTION_LOG: "We did $ACTION$"
 WE_PERFORM_abm_sabotage_fort_ACTION_BTN1: "OK"
 WE_PERFORM_abm_sabotage_fort_ACTION_BTN2: "OK"
 WE_PERFORM_abm_sabotage_fort_ACTION_BTN3: "$common_string_go_to$"
 WE_PERFORM_abm_sabotage_fort_ACTION_MAP: ""

 ACTION_abm_sabotage_fort_PERFORMED_ON_US_SETUP: "When one of our forts is sabotaged."
 ACTION_abm_sabotage_fort_PERFORMED_ON_US_HEADER: "$MESSENGER$"
 ACTION_abm_sabotage_fort_PERFORMED_ON_US_TITLE: "Our Fort Has Been Sabotaged!"
 ACTION_abm_sabotage_fort_PERFORMED_ON_US_EFFECTS: "[SCOPE.sCountry('actor').GetAdjective] agents have emptied the [fort|e] in [SCOPE.sLocation('target').GetName] of the [ShowPopTypeName('soldiers')] who manned it. It will stand unmanned until the [location|e] raises new soldiers of its own."
 ACTION_abm_sabotage_fort_PERFORMED_ON_US_FLAVOR: "The walls still stand, but there is nobody left on them."
 ACTION_abm_sabotage_fort_PERFORMED_ON_US_LOG: "[SCOPE.sCountry('actor').GetAdjective] did $ACTION$"
 ACTION_abm_sabotage_fort_PERFORMED_ON_US_BTN1: "OK"
 ACTION_abm_sabotage_fort_PERFORMED_ON_US_BTN2: "OK"
 ACTION_abm_sabotage_fort_PERFORMED_ON_US_BTN3: "$common_string_go_to$"
