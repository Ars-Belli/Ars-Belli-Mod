l_english:
 abm_economic_support_relation: "Economic Support"
 abm_economic_support_relation_desc: "A wealthier [country|e] sends an agreed sum of [gold_i] to another every month. The sum is capped at the recipient's [tax_base|e], and can never exceed ten months of the sender's income. Both parties spend a #H Defensive Point#! and #R -0.10#! monthly [diplomats|e] for as long as the arrangement stands."

 # The interaction that starts the relation - this is what players click.
 abm_send_economic_support: "Send $abm_economic_support_relation$"
 abm_send_economic_support_desc: "Send a country a sum of [gold_i] every month. We may send at most their [tax_base|e] each month, and never more than ten months of our own income - a small economy cannot absorb a large [country|e]'s gold. It costs us a #H Defensive Point#! and #R -0.10#! monthly [diplomats|e], and costs them the same."
 CATEGORY_ECONOMY_ACTIONS_abm_send_economic_support: "Send $abm_economic_support_relation$"
 abm_send_economic_support_act: "Offer $abm_economic_support_relation$"
 INCOMING_OFFER_abm_send_economic_support: "$ACTOR$ have offered to send us $abm_economic_support_relation$. Accepting will cost us a #H Defensive Point#! and #R -0.10#! monthly [diplomats|e] for as long as it lasts. Do we wish to accept?\n\n$INFO$"
 PROPOSE_abm_send_economic_support: "Offer $abm_economic_support_relation$ to $RECIPIENT$?\n$INFO$."
 abm_send_economic_support_effect_text: "[SCOPE.sCountry('actor').GetName] begins sending $abm_economic_support_relation$ to [SCOPE.sCountry('recipient').GetName]"
 abm_send_economic_support_effect_text_past: "[SCOPE.sCountry('actor').GetName] began sending $abm_economic_support_relation$ to [SCOPE.sCountry('recipient').GetName]"
 abm_send_economic_support_reject_effect_text: "$generic_reject_demand_effect_string$"
 abm_send_economic_support_reject_effect_text_past: "$generic_reject_demand_effect_string_past$"
 dip_abm_send_economic_support_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 INCOMING_OFFER_TITLE_abm_send_economic_support: "Economic Support Offered"

 # Auto-generated relation keys the engine asks for (see game.log on load).
 abm_economic_support_effect_text: "[SCOPE.sCountry('actor').GetName] sends $abm_economic_support_relation$ to [SCOPE.sCountry('recipient').GetName]"
 abm_economic_support_effect_text_past: "[SCOPE.sCountry('actor').GetName] sent $abm_economic_support_relation$ to [SCOPE.sCountry('recipient').GetName]"
 diplomatic_status_giving_abm_economic_support_name: "Sending $abm_economic_support_relation$"
 diplomatic_status_giving_abm_economic_support_tooltip: "We are sending them [gold_i] every month."
 giving_abm_economic_support_list_who_tt: "We are sending $abm_economic_support_relation$ to:"
 diplomatic_status_receiving_abm_economic_support_name: "Receiving $abm_economic_support_relation$"
 diplomatic_status_receiving_abm_economic_support_tooltip: "They are sending us [gold_i] every month."
 receiving_abm_economic_support_list_who_tt: "We are receiving $abm_economic_support_relation$ from:"
 STATIC_MODIFIER_NAME_giving_abm_economic_support: "Sending $abm_economic_support_relation$"
 STATIC_MODIFIER_DESC_giving_abm_economic_support: "We send this country a monthly sum of [gold_i], capped at their [tax_base|e]."
 STATIC_MODIFIER_NAME_receiving_abm_economic_support: "Receiving $abm_economic_support_relation$"
 STATIC_MODIFIER_DESC_receiving_abm_economic_support: "This country sends us a monthly sum of [gold_i], capped at our [tax_base|e]."

 cancellation_abm_economic_support: "Cancel $abm_economic_support_relation$"
 cancellation_abm_economic_support_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 cancellation_abm_economic_support_cta: "Stop sending $abm_economic_support_relation$ to [TARGET_COUNTRY.GetName]."
 cancellation_abm_economic_support_desc: "We will stop sending them gold, freeing the #H Defensive Point#! and the monthly [diplomats|e] it costs us."
 break_abm_economic_support: "Refuse $abm_economic_support_relation$"
 break_abm_economic_support_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 break_abm_economic_support_cta: "Stop accepting $abm_economic_support_relation$ from [TARGET_COUNTRY.GetName]."
 break_abm_economic_support_desc: "We will refuse further gold, freeing the #H Defensive Point#! and the monthly [diplomats|e] it costs us."

 abm_economic_support_select_amount: "Gold sent each month - limited by their [tax_base|e]"
 abm_economic_support_one_patron_tt: "They must not already be receiving $abm_economic_support_relation$ from another [country|e]"
 abm_economic_support_points_tt: "We must not be over our #H Defensive Point#! limit"
 abm_economic_support_recipient_points_tt: "They must not be over their #H Defensive Point#! limit"

 # ---------------------------------------------------------------------------
 # The vanilla engine action cannot be removed - it is not exposed to script in
 # any form - so it is relabelled to steer players onto the mod action instead.
 # ---------------------------------------------------------------------------
 ECONOMIC_SUPPORTTITLE: "Send Economic Support (#R AGAINST THE RULES#!)"
 ECONOMIC_SUPPORT_TOOLTIP_HEADER: "#R Do not use#! - Send Economic Support to [TARGET_COUNTRY.GetName]"
 ECONOMIC_SUPPORT_TOOLTIP_HEADER_NO_TARGET: "#R Do not use#! - Send Economic Support to a [country|e]"
 ECONOMIC_SUPPORT_DESC: "#R This is the vanilla action and is against the rules in Ars Belli.#!\n\nIt bypasses the recipient's consent, costs no #H Defensive Point#!, and costs no monthly [diplomats|e]. Use $abm_economic_support_relation$ instead.\n\nSelect how much [gold_i] we should send them each month."
 ECONOMIC_SUPPORT_FLAVOR: "#R Against the rules.#! Use $abm_economic_support_relation$ instead - it asks the recipient first and charges both sides properly."
 CANCEL_ECONOMIC_SUPPORTTITLE: "Cancel Economic Support (vanilla)"
 CANCEL_ECONOMIC_SUPPORT_TOOLTIP_HEADER: "Cancel our vanilla Economic Support to [TARGET_COUNTRY.GetName]"
 CANCEL_ECONOMIC_SUPPORT_TOOLTIP_HEADER_NO_TARGET: "Cancel our vanilla Economic Support to a [country|e]"
 CANCEL_ECONOMIC_SUPPORT_FLAVOR: "This ends a vanilla Economic Support arrangement, which should not have been started. Use $abm_economic_support_relation$ instead."
