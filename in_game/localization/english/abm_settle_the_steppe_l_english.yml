l_english:
 abm_settle_the_steppe: "Settle the Steppe"
 abm_settle_the_steppe_desc: "The grassland between the rivers is empty of ploughland and full of grass. We will send settlers out to break the turf, dig wells and raise villages where only herds have been, so that the steppe is peopled by our own folk rather than left to wanderers."
 abm_settle_the_steppe_action: "Settle [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 abm_settle_the_steppe_active: "Settling [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 abm_settle_the_steppe_action_progress: "[SCOPE.sProvince('target').GetAverageDevelopment]@development!"
 abm_settle_the_steppe_action_progress_wordier: "$abm_settle_the_steppe_action_progress$"
 abm_settle_the_steppe_action_progress_tooltip: "#T Settle the Steppe#!\nAverage [development|e] per [location|e] in [SCOPE.sProvince('target').GetName]: [SCOPE.sProvince('target').GetAverageDevelopmentInfo]\n\n#T Completed When#!\nEvery [location|e] in the province has at least 20 [development|e] and is at least 50% of its [population_capacity|e] full.\n\n[SCOPE.sCabinet('cabinet').GetActionEndConditions]"
 abm_settle_the_steppe_select_province: "Which province shall we settle?"
 abm_settle_the_steppe_no_provinces: "@trigger_no! No suitable [provinces|e] found. A target province must:\nBe in the steppes region and entirely ours;\nHave a primary or accepted [culture|e] of ours as the dominant culture in every location;\nStill have a [location|e] below 20 [development|e] or below 50% of its [population_capacity|e];\nNot already be supported by this action.\n\nThis action also requires a [monarchy|e], [theocracy|e] or [republic|e], and a non-pagan [religion|e]."
 abm_settle_the_steppe_advance: "$abm_settle_the_steppe$"
 abm_settle_the_steppe_advance_desc: "$abm_settle_the_steppe_desc$"
