l_english:
 abm_develop_or_qapi_rgos.title: "Develop the Or Qapi Province"
 abm_develop_or_qapi_rgos.desc: "Good stone lies close under the plain at Kezlev, within easy reach of the coast and the salt pans. Once every land in the province is held by a settled government and its people share the culture and faith of their rulers, we can open the quarries and set the province to work."
 abm_develop_or_qapi_rgos.a: "Set the province to work."
 abm_develop_cafa_rgos.title: "Develop the Cafa Province"
 abm_develop_cafa_rgos.desc: "The coast of the Cafa province can be made to serve a settled realm. Timber from the hills above Soldaia, iron from the workings at Vosporo, and dyes from the looms of Kaffa would free us from the merchants of the steppe. Once every land in the province is held by a settled government and its people share the culture and faith of their rulers, the work can begin."
 abm_develop_cafa_rgos.a: "Set the province to work."
 abm_develop_gothia_rgos.title: "Develop the Gothia Province"
 abm_develop_gothia_rgos.desc: "The old Gothic lands behind the coast have long lain fallow. Coal seams run beneath the plain at Qirq Yer and Qarasuvbazar, while the wooded hills around Lusta and Theodoro can supply timber for the shipyards of the Pontus. Once every land in the province is held by a settled government and its people share the culture and faith of their rulers, we can put these resources to work."
 abm_develop_gothia_rgos.a: "Set the province to work."
