l_english:
 abm_develop_or_qapi_coal.title: "Develop the Or Qapi Coal Seams"
 abm_develop_or_qapi_coal.desc: "The steppe around Or Qapi hides seams of coal beneath its salt marshes. Once every land in the province is held by a settled government and its people share the culture and faith of their rulers, we can sink the first shafts and put the black earth to work."
 abm_develop_or_qapi_coal.a: "Open the collieries."
