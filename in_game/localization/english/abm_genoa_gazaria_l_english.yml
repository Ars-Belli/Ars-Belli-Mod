l_english:
 abm_gazaria_independence.title: "The Independence of Gazaria"
 abm_gazaria_independence.desc: "Though the Republic of Genoa long ruled our shores, the two are now commanded by separate captains. Genoa has agreed to release us from vassalage — but on what terms?"
 abm_gazaria_independence.a: "We break free from Genoa."
 abm_gazaria_independence.b: "We break free and ally with Genoa."
 abm_gazaria_culture_choice.title: "The People of Gazaria"
 abm_gazaria_culture_choice.desc: "With the Republic's writ at an end, the captains of Gazaria must say what manner of state they keep. These colonies were built by Ligurian merchants, and Ligurian is still the tongue of our counting-houses and our law — yet the land beneath them is the old Crimea of the Goths, and a state that called itself Gothic would be heard very differently along these shores."
 abm_gazaria_culture_choice.a: "We remain Ligurian."
 abm_gazaria_culture_choice.b: "We are Goths, and shall be called so."
 abm_gazaria_culture_choice.b.tt: "Our primary culture becomes Gothic. Ligurian remains an accepted culture, so our Ligurian pops keep their rights. The Gothic advances become available to research."
