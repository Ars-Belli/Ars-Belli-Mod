l_english:
 abm_gazaria_independence.title: "The Independence of Gazaria"
 abm_gazaria_independence.desc: "Though the Republic of Genoa long ruled our shores, the two are now commanded by separate captains. Genoa has agreed to release us from vassalage — but on what terms?"
 abm_gazaria_independence.a: "We break free from Genoa."
 abm_gazaria_independence.b: "We break free and ally with Genoa."
 abm_gazaria_culture_choice.title: "The People of Gazaria"
 abm_gazaria_culture_choice.desc: "Theodoro and Lusta are ours, and with them the last principality of the Crimean Goths. The captains of Gazaria must now say what manner of state they keep. These colonies were built by Ligurian merchants, and Ligurian is still the tongue of our counting-houses and our law — yet the land beneath them is the old Crimea of the Goths, and most of the people in our streets are Greeks. A state that called itself Gothic, or Greek, would be heard very differently along these shores."
 abm_gazaria_culture_choice.a: "We remain Ligurian."
 abm_gazaria_culture_choice.b: "We are Goths, and shall be called so."
 abm_gazaria_culture_choice.b.tt: "Our primary culture becomes Gothic. Ligurian remains an accepted culture, so our Ligurian pops keep their rights. The Gothic advances become available to research."
 abm_gazaria_culture_choice.c: "We are Greeks, and shall be called so."
 abm_gazaria_culture_choice.c.tt: "Our primary culture becomes Pontic Greek. Ligurian remains an accepted culture, so our Ligurian pops keep their rights. The Pontic Greek advances become available to research."
 abm_the_genoese_arsenal: "The Gazarian Arsenal"
 abm_the_genoese_arsenal_desc: "Genoa's yards were built for the Tyrrhenian and cannot be moved. If Gazaria is to keep a squadron at Kaffa, it must build slips of its own on the Black Sea, and train men to work them."
