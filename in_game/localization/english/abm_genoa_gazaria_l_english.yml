l_english:
 abm_genoa_gazaria.1.title: "Independence of Gazaria"
 abm_genoa_gazaria.1.desc: "Though the Republic of Genoa long ruled our lands, the two are now commanded by separate captains. Genoa has agreed to release us from vassalage — but on what terms?"
 abm_genoa_gazaria.1.a: "We break free from Genoa."
 abm_genoa_gazaria.1.b: "We break free and ally with Genoa."
