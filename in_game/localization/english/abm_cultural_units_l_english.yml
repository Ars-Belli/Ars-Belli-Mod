l_english:
 abm_crimean_horse_archers_2: "Crimean Horse Archers"
 abm_crimean_horse_archers_2_desc: "Tatar riders who fight at a distance and never close. They loose, wheel away and loose again, wearing an enemy down without ever giving him a line to break."
 abm_crimean_horse_archers_3: "Crimean Tatar Raiders"
 abm_crimean_horse_archers_3_desc: "The Crimean Khanate's raiding parties ride light, live off the country and fight only on their own terms. Fine skirmishers, poor at holding ground."
 abm_mishar_horsemen_2: "Mishar Horsemen"
 abm_mishar_horsemen_2_desc: "Among the Mishar the horse is not a skirmisher's mount but a soldier's. These men charge home with the sabre and expect the first shock to settle the matter."
 abm_mishar_horsemen_3: "Mishar Lancers"
 abm_mishar_horsemen_3_desc: "Mishar service cavalry, armed and drilled in the Tatar manner. They break an enemy quickly and suffer badly when not broken at once."
 abm_astrakhani_horse_archers_3: "Astrakhani Horse Archers"
 abm_astrakhani_horse_archers_3_desc: "Astrakhan breeds horse archers by the thousand: cheap, hardy and used to the salt flats at the mouth of the Volga."
 abm_astrakhani_horse_archers_4: "Astrakhani Steppe Riders"
 abm_astrakhani_horse_archers_4_desc: "Horsemen of the lower Volga, raised in numbers rather than in quality. What they lack in drill they make up in supply."
 abm_gothic_cataphracts_2: "Gothic Cataphracts"
 abm_gothic_cataphracts_2_desc: "The lords of the Crimean mountains still arm in the old manner, horse and rider both, and would rather stand a charge than deliver one."
 abm_gothic_cataphracts_3: "Theodoran Cataphracts"
 abm_gothic_cataphracts_3_desc: "Heavy horse of the Theodoro principality: slow, costly, and very hard to kill."
 abm_gothic_spearmen_3: "Gothic Spearmen"
 abm_gothic_spearmen_3_desc: "Gothic infantry of the mountain valleys, standing close and taking the enemy's charge on the spear. They will not be moved."
 abm_gothic_spearmen_4: "Theodoran Guard"
 abm_gothic_spearmen_4_desc: "The principality's household foot, kept to hold a defile or a wall until relieved. Endurance is the whole of their craft."
 abm_cossack_cavalry_3: "Cossack Horsemen"
 abm_cossack_cavalry_3_desc: "Free riders of the steppe frontier: quick to raise, quick to move, and dangerous in open country."
 abm_cossack_cavalry_4: "Registered Cossacks"
 abm_cossack_cavalry_4_desc: "Entered on the register and paid for service, these men buy their own mounts and carry their own sabres. Fast, lightly burdened and hard to bring to battle."
 abm_cossack_cavalry_5: "Sich Cavalry"
 abm_cossack_cavalry_5_desc: "Horsemen of the Sich, raised in the open steppe. Nothing in the Tsar's army moves as fast or needs as little."
 abm_cossack_infantry_4: "Cossack Foot"
 abm_cossack_infantry_4_desc: "Infantry of the frontier rather than of the line: they dig, they hold, and they do not much care for manoeuvre."
 abm_cossack_infantry_5: "Sich Infantry"
 abm_cossack_infantry_5_desc: "The Sich's foot, fighting from behind carts, banks and ditches. Poor in the open, stubborn behind cover."
 abm_ligurian_infantry_4: "Ligurian Pikemen"
 abm_ligurian_infantry_4_desc: "Genoa's own companies, drilled to press an attack rather than wait for one."
 abm_ligurian_infantry_5: "Ligurian Tercio"
 abm_ligurian_infantry_5_desc: "Pike and shot in the Ligurian fashion, handled with the arrogance of men who expect to win by attacking."
 abm_ruthenian_infantry_4: "Ruthenian Registered Infantry"
 abm_ruthenian_infantry_4_desc: "Registered foot of the Ruthenian lands, good enough at everything and exceptional at nothing."
 abm_ruthenian_infantry_5: "Ruthenian Line Infantry"
 abm_ruthenian_infantry_5_desc: "Steady infantry of the Ukrainian provinces, drilled in the ordinary pattern and willing to stand where they are put."
 abm_ruthenian_infantry_6: "Ruthenian Musketeers"
 abm_ruthenian_infantry_6_desc: "Infantry of the later Ruthenian establishment, competent in the open and better still in the woods."
 abm_circassian_cavalry_4: "Circassian Horsemen"
 abm_circassian_cavalry_4_desc: "Circassian riders, all nerve and no patience. They attack, and they keep attacking."
 abm_circassian_cavalry_5: "Circassian Noble Cavalry"
 abm_circassian_cavalry_5_desc: "Knights of the Circassian valleys, armoured and proud, whose value lies entirely in the charge."
 abm_circassian_cavalry_6: "Circassian Lancers"
 abm_circassian_cavalry_6_desc: "The last of the Circassian horse. Superb at the charge, brittle when the charge fails."
