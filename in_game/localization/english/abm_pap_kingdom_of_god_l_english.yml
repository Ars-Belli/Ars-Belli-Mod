l_english:
 abm_pap_kog.1.title: "The Kingdom of God on Earth"
 abm_pap_kog.1.entry: "$abm_pap_kog.1.title$"
 abm_pap_kog.1.desc: "Having united the whole of [ShowRegionName('italy_region')] under the banner of [ShowReligionName('catholic')], the [GetCountry('PAP').GetGovernment.GetRulerTitle] has seen fit to declare it '[ShowGovernmentReformName('kingdom_of_god_reform')]'. [ShowReligionNameWithNoTooltip('catholic')] believers from all over [ShowContinentName('europe')] flock to [target_character.GetHerHis] banner, eager to live in this model nation of [ShowReligionGroupAdjective('christian')] virtue. Foreign powers can no longer control the College of Cardinals, but neither will they pay much heed to any [GetCountry('PAP').GetAdjective] bulls or decrees."
 abm_pap_kog.1.a: "All Men under one God!"
 abm_pap_kog.1.b: "Amen."
