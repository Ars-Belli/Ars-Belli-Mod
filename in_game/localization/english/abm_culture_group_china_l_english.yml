 abm_south_china_yao_culture_2: "Yao Cultural Tradition II"
 abm_south_china_yao_culture_2_desc: "The Yao know the forests of the southern hills, and their timber feeds the realm."
 abm_south_china_zhuang_culture_1: "Zhuang Cultural Tradition I"
