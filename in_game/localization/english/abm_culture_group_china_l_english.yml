l_english:
 abm_south_china_yuehai_culture_1: "Yuehai Cultural Tradition I"
 abm_south_china_yuehai_culture_1_desc: "The Yuehai have long turned the sea to profit; their merchants are trusted with a larger share of the state's dues."
 abm_south_china_yuehai_culture_2: "Yuehai Cultural Tradition II"
 abm_south_china_yuehai_culture_2_desc: "Guangdong's seafarers extend our reach across the waves."
 abm_south_china_yao_culture_1: "Yao Cultural Tradition I"
