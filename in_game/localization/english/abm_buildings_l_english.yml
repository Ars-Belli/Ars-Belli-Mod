l_english:
 abm_genoese_arsenal: "Genoese Dockyard"
 abm_genoese_arsenal_desc: "Behind the walls of the Darsena the Republic builds, refits and stores its galleys under one administration. Shipwrights, ropewalks and sail lofts stand side by side, so that a hull can be laid down and launched within the year, and a galley taken from the water can be made ready again without ever leaving the yard."
 abm_gazarian_arsenal: "Gazarian Arsenal"
 abm_gazarian_arsenal_desc: "The Black Sea has no sheltered yard to compare with the Darsena, so Gazaria builds its own: slips, storehouses and a ropewalk gathered at the water's edge, kept to the Genoese pattern and staffed by Genoese masters. From here the colonies can fit out a squadron without waiting on a convoy from Liguria."
 abm_gazarian_headquarters: "Gazarian Headquarters"
 abm_gazarian_headquarters_desc: "The captains of Gazaria keep a house in the capital where the colony's soldiers are mustered, paid and quartered. It is a warehouse, a treasury and a barracks in one, and its officers answer to the Republic while taking their orders from the Black Sea."
 abm_church_school: "Church School"
 abm_church_school_desc: "Where the Society of Jesus has planted a college, a parish may keep a school beside it: letters, Latin and the catechism taught to boys who would otherwise never see a book. The parish gains clerks and converts in equal measure, and the priest who runs it gains influence over every family whose sons pass through his hands."
 matenadaran: "Matenadaran"
 matenadaran_desc: "A scriptorium and repository of the Eastern churches, where manuscripts are copied, corrected and kept against the next sack or fire. Its scribes make the location a seat of learning out of all proportion to its size, and the crown that endows it gains a hold over the clergy who depend on its shelves."
