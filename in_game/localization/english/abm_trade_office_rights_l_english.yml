 diplomatic_status_giving_abm_trade_office_rights_name: "Granting Trade Office Rights"
 diplomatic_status_giving_abm_trade_office_rights_tooltip: "#T Granting Trade Office Rights#!\nThis country grants the following countries the right to construct Trade Offices."
 diplomatic_status_receiving_abm_trade_office_rights_name: "Receiving Trade Office Rights"
 diplomatic_status_receiving_abm_trade_office_rights_tooltip: "#T Receiving Trade Office Rights#!\nThis country has the right to construct Trade Offices in the following countries."
 giving_abm_trade_office_rights_list_who_tt: "$WHO$ is granting the right to construct Trade Offices to $LIST$"
 receiving_abm_trade_office_rights_list_who_tt: "$WHO$ may construct Trade Offices in $LIST$"

 # Shared single slot: a location takes one fondaco OR one hanseatic kontor, whoever owns it
 # (see building_types/abm_foreign_buildings.txt).
 abm_fondaco_slot_taken_tt: "This location already has a Fondaco or Hanseatic Kontor"

 # Requirement shown on the disabled build button for a foreign location owned by a player.
 abm_trade_office_rights_required_tt: "Owner gives [ShowRelationTypeName('abm_trade_office_rights')] to us"

 # Overrides of vanilla fondaco_rights text: the same right now also permits a Merchant Enclave for
 # the ABM merchant governments (see the shadowed scripted_relations/fondaco_rights.txt).
 fondaco_rights_relation_desc: "A [country|e] will grant another country the right to build [ShowBuildingTypeName('fondaco')] - or, for merchant governments of their own tradition, a [ShowBuildingTypeName('abm_merchant_enclave')] - in their territory."
 offer_fondaco_rights_cta: "Grant Rights to [SCOPE.sCountry('recipient').GetName] to construct Fondacos or a Merchant Enclave"
 offer_fondaco_rights_desc: "This will allow them to construct Fondacos or a Merchant Enclave in our territory, which grant them increased [merchant_power|e] in our [markets|e] in exchange for a monthly fee."
 request_fondaco_rights_cta: "Request the Right from [TARGET_COUNTRY.GetName] to construct Fondacos or a Merchant Enclave"
 request_fondaco_rights_desc: "This will allow us to construct Fondacos or a Merchant Enclave in their territory, which grant us increased [merchant_power|e] in their [markets|e] in exchange for a monthly fee."
