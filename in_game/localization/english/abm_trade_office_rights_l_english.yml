l_english:
 abm_trade_office_rights_relation: "Trade Office Rights"
 abm_trade_office_rights_relation_desc: "A [country|e] will grant another country the right to build [ShowBuildingTypeName('trade_office')] in their territory. In Ars Belli a player needs this permission before constructing a Trade Office in another player's [locations|e]."
 offer_abm_trade_office_rights: "Grant Trade Office Rights"
 offer_abm_trade_office_rights_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 offer_abm_trade_office_rights_cta: "Grant [SCOPE.sCountry('recipient').GetName] the right to construct Trade Offices"
 offer_abm_trade_office_rights_desc: "This will allow them to construct Trade Offices in our territory, granting them [merchant_power|e] and [merchant_capacity|e] in our [markets|e]."
 offer_abm_trade_office_rights_cta_to_unknown: "Grant a [country|e] the right to construct Trade Offices"
 offer_abm_trade_office_rights_desc_to_unknown: "This will allow them to construct Trade Offices in our territory, granting them [merchant_power|e] and [merchant_capacity|e] in our [markets|e]."
 offer_abm_trade_office_rights_happened_title: "Trade Office Rights Granted"
 offer_abm_trade_office_rights_happened_desc: "[SCOPE.sCountry('recipient').GetName] is free to construct Trade Offices within our borders."
 offer_abm_trade_office_rights_proposal_question: "Offer the right to construct Trade Offices in [COUNTRY.GetName]'s territory?\n$INFO$"
 offer_abm_trade_office_rights_incoming_proposal_title: "Trade Office Rights Offer"
 offer_abm_trade_office_rights_incoming_proposal_question: "[COUNTRY.GetName] has offered us Trade Office Rights. Do we wish to accept?"
 request_abm_trade_office_rights: "Request Trade Office Rights"
 request_abm_trade_office_rights_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 request_abm_trade_office_rights_cta: "Request the right from [TARGET_COUNTRY.GetName] to construct Trade Offices"
 request_abm_trade_office_rights_desc: "This will allow us to construct Trade Offices in their territory, granting us [merchant_power|e] and [merchant_capacity|e] in their [markets|e]."
 request_abm_trade_office_rights_cta_to_unknown: "Request the right from a [country|e] to construct Trade Offices"
 request_abm_trade_office_rights_desc_to_unknown: "This will allow us to construct Trade Offices in their territory, granting us [merchant_power|e] and [merchant_capacity|e] in their [markets|e]."
 request_abm_trade_office_rights_happened_title: "Trade Office Rights Granted"
 request_abm_trade_office_rights_happened_desc: "[SCOPE.sCountry('recipient').GetName] now allows us to construct Trade Offices within their borders."
 request_abm_trade_office_rights_proposal_question: "Request the right to construct Trade Offices in [TARGET_COUNTRY.GetName]'s territory?\n$INFO$"
 request_abm_trade_office_rights_incoming_proposal_title: "Trade Office Rights Request"
 request_abm_trade_office_rights_incoming_proposal_question: "[COUNTRY.GetName] has requested Trade Office Rights. Do we wish to accept?"
 cancel_abm_trade_office_rights: "Revoke Trade Office Rights"
 cancel_abm_trade_office_rights_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 cancel_abm_trade_office_rights_cta: "Cancel [SCOPE.sCountry('recipient').GetName]'s right to construct Trade Offices"
 cancel_abm_trade_office_rights_desc: "This stops them from constructing new Trade Offices in our territory. Ones they already built remain."
 cancel_abm_trade_office_rights_cta_to_unknown: "Cancel a [country|e]'s right to construct Trade Offices"
 cancel_abm_trade_office_rights_desc_to_unknown: "This stops them from constructing new Trade Offices in our territory. Ones they already built remain."
 cancel_abm_trade_office_rights_happened_title: "Revoked Trade Office Rights"
 cancel_abm_trade_office_rights_happened_desc: "Revoked [SCOPE.sCountry('recipient').GetName]'s right to construct Trade Offices."
 cancel_abm_trade_office_rights_proposal_question: "Revoke the right to construct Trade Offices in [COUNTRY.GetName]'s territory?\n$INFO$"
 break_abm_trade_office_rights: "Cancel Trade Office Rights"
 break_abm_trade_office_rights_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 break_abm_trade_office_rights_cta: "Cancel our right to construct Trade Offices in [SCOPE.sCountry('recipient').GetName]"
 break_abm_trade_office_rights_desc: "We will no longer be able to construct new Trade Offices in their territory. Ones we already built remain."
 break_abm_trade_office_rights_cta_to_unknown: "Cancel our right to construct Trade Offices in a [country|e]"
 break_abm_trade_office_rights_desc_to_unknown: "We will no longer be able to construct new Trade Offices in their territory. Ones we already built remain."
 break_abm_trade_office_rights_happened_title: "Cancelled Trade Office Rights"
 break_abm_trade_office_rights_happened_desc: "We cancelled our right to construct Trade Offices in [SCOPE.sCountry('recipient').GetName]"
 break_abm_trade_office_rights_proposal_question: "We will no longer be able to construct Trade Offices in [TARGET_COUNTRY.GetName]."
 abm_trade_office_rights_effect_text: "[SCOPE.sCountry('actor').GetName] receive the right to construct Trade Offices within [SCOPE.sCountry('recipient').GetAdjective] borders."
