l_english:
 abm_reorganize_pastoral_rgo: "Reorganise Pastoral Province"
 abm_reorganize_pastoral_rgo_desc: "The pasturelands of the Pontic steppe have long fed nothing but herds. Where the land is secure, settled, and thickly peopled with our own culture and faith, we may turn a valley to another crop, another herd, or — on the coast — even to the sand pits that feed the glassworks. Choose a province, choose the land, and choose what it shall produce."
 abm_reorganize_pastoral_rgo_select_province: "Which province shall we reorganise?"
 abm_reorganize_pastoral_rgo_select_location: "Which land within it?"
 abm_reorganize_pastoral_rgo_cost: "10 [stability|e], 10 [political_influence|e] and 100-300 [gold|e] depending on the location [development|e]"
 abm_reorganize_pastoral_rgo_select_good: "What shall it produce?"
 abm_reorganize_pastoral_rgo_no_province: "@trigger_no! No pastoral steppe province meets the requirements: every land in it must be a full core of ours, held by our own culture and faith, and have at least 10 development."
 abm_reorganize_pastoral_rgo_no_location: "@trigger_no! No land in this province can be reorganised: it must be a full core of ours, of our culture and faith, with a pastoral raw material, and each location may be reorganised only once."
 abm_reorganize_pastoral_rgo_no_good: "@trigger_no! No other raw material is available for this land."
 abm_reorganize_pastoral_rgo_decision.title: "Reorganise a Pastoral Province"
 abm_reorganize_pastoral_rgo_decision.desc: "The pasturelands of the Pontic steppe have long fed nothing but herds. Where the land is secure, settled, and thickly peopled with our own culture and faith, we may turn a valley to another crop, another herd, or — on the coast — even to the sand pits that feed the glassworks."
 abm_reorganize_pastoral_rgo_decision.a: "Choose a province to reorganise."
