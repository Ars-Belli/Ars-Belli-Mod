l_english:
 ars_belli_economic_support_relation: "Economic Support"
 ars_belli_economic_support_relation_desc: "A wealthier [country|e] sends a share of its monthly income to another. Both parties spend a #H Defensive Point#! and #R -0.10#! monthly [diplomats|e] for as long as the arrangement stands."

 offer_ars_belli_economic_support: "Send $ars_belli_economic_support_relation$"
 offer_ars_belli_economic_support_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 offer_ars_belli_economic_support_cta: "Send $ars_belli_economic_support_relation$ to [TARGET_COUNTRY.GetName]."
 offer_ars_belli_economic_support_desc: "We will send [TARGET_COUNTRY.GetName] a tenth of our monthly income. It costs us a #H Defensive Point#! and #R -0.10#! monthly [diplomats|e], and costs them the same."
 offer_ars_belli_economic_support_cta_to_unknown: "Send $ars_belli_economic_support_relation$ to a [country|e]."
 offer_ars_belli_economic_support_desc_to_unknown: "We will send them a tenth of our monthly income. It costs us a #H Defensive Point#! and #R -0.10#! monthly [diplomats|e], and costs them the same."
 offer_ars_belli_economic_support_happened_title: "$ars_belli_economic_support_relation$ agreed!"
 offer_ars_belli_economic_support_happened_desc: "[TARGET_COUNTRY.GetName] have accepted our support. Gold will flow to them each month until either of us ends the arrangement."
 offer_ars_belli_economic_support_proposal_question: "Send $ars_belli_economic_support_relation$ to [TARGET_COUNTRY.GetName]?\n$INFO$"
 offer_ars_belli_economic_support_incoming_proposal_title: "$ars_belli_economic_support_relation$ Offered"
 offer_ars_belli_economic_support_incoming_proposal_question: "[COUNTRY.GetName] have offered to send us $ars_belli_economic_support_relation$. Accepting will cost us a #H Defensive Point#! and #R -0.10#! monthly [diplomats|e] for as long as it lasts. Do we wish to accept?"
 offer_ars_belli_economic_support_declined_title: "$ars_belli_economic_support_relation$ Declined"
 offer_ars_belli_economic_support_declined_desc: "[TARGET_COUNTRY.GetName] have turned down our offer of support."

 cancellation_ars_belli_economic_support: "Cancel $ars_belli_economic_support_relation$"
 cancellation_ars_belli_economic_support_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 cancellation_ars_belli_economic_support_cta: "Stop sending $ars_belli_economic_support_relation$ to [TARGET_COUNTRY.GetName]."
 cancellation_ars_belli_economic_support_desc: "We will stop sending them gold, freeing the #H Defensive Point#! and the monthly [diplomats|e] it costs us."
 break_ars_belli_economic_support: "Refuse $ars_belli_economic_support_relation$"
 break_ars_belli_economic_support_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
 break_ars_belli_economic_support_cta: "Stop accepting $ars_belli_economic_support_relation$ from [TARGET_COUNTRY.GetName]."
 break_ars_belli_economic_support_desc: "We will refuse further gold, freeing the #H Defensive Point#! and the monthly [diplomats|e] it costs us."

 ars_belli_economic_support_points_tt: "We must not be over our #H Defensive Point#! limit"
 ars_belli_economic_support_recipient_points_tt: "They must not be over their #H Defensive Point#! limit"

 # ---------------------------------------------------------------------------
 # The vanilla engine action cannot be removed - it is not exposed to script in
 # any form - so it is relabelled to steer players onto the mod action instead.
 # ---------------------------------------------------------------------------
 ECONOMIC_SUPPORTTITLE: "Send Economic Support (#R AGAINST THE RULES#!)"
 ECONOMIC_SUPPORT_TOOLTIP_HEADER: "#R Do not use#! - Send Economic Support to [TARGET_COUNTRY.GetName]"
 ECONOMIC_SUPPORT_TOOLTIP_HEADER_NO_TARGET: "#R Do not use#! - Send Economic Support to a [country|e]"
 ECONOMIC_SUPPORT_DESC: "#R This is the vanilla action and is against the rules in Ars Belli.#!\n\nIt bypasses the recipient's consent, costs no #H Defensive Point#!, and costs no monthly [diplomats|e]. Use $ars_belli_economic_support_relation$ instead.\n\nSelect how much [gold_i] we should send them each month."
 ECONOMIC_SUPPORT_FLAVOR: "#R Against the rules.#! Use $ars_belli_economic_support_relation$ instead - it asks the recipient first and charges both sides properly."
 CANCEL_ECONOMIC_SUPPORTTITLE: "Cancel Economic Support (vanilla)"
 CANCEL_ECONOMIC_SUPPORT_TOOLTIP_HEADER: "Cancel our vanilla Economic Support to [TARGET_COUNTRY.GetName]"
 CANCEL_ECONOMIC_SUPPORT_TOOLTIP_HEADER_NO_TARGET: "Cancel our vanilla Economic Support to a [country|e]"
 CANCEL_ECONOMIC_SUPPORT_FLAVOR: "This ends a vanilla Economic Support arrangement, which should not have been started. Use $ars_belli_economic_support_relation$ instead."
