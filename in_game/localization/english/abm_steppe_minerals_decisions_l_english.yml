l_english:
 abm_develop_luhan_rgos.title: "Develop the Luhansk Coalfield"
 abm_develop_luhan_rgos.desc: "The western end of the Donets basin runs beneath the pasture at Luhansk and Mityakinskaya. Once every land in the province is a full core of ours, held by our own culture and faith, we can sink the first shafts and open the Donets coalfield."
 abm_develop_luhan_rgos.a: "Open the pits."
 abm_develop_bakhmut_rgos.title: "Develop the Bakhmut Coalfield"
 abm_develop_bakhmut_rgos.desc: "Coal seams reach the surface along the northern Donets around Lysychansk and Kreminna, close to the salt works at Bakhmut. Once every land in the province is a full core of ours, held by our own culture and faith, we can work them properly."
 abm_develop_bakhmut_rgos.a: "Open the pits."
 abm_develop_tana_rgos.title: "Develop the Kalmius Coalfield"
 abm_develop_tana_rgos.desc: "The eastern Donets basin runs through the Kalmius country, where the seams lie shallow under the grass. Once every land in the province is a full core of ours, held by our own culture and faith, we can begin to mine them."
 abm_develop_tana_rgos.a: "Open the pits."
 abm_develop_izium_rgos.title: "Open the Donets Ridge Iron Mines"
 abm_develop_izium_rgos.desc: "Iron ore outcrops along the Donets Ridge near Barvinkove. Once every land in the province is a full core of ours, held by our own culture and faith, we can open workings there and feed the forges of the steppe."
 abm_develop_izium_rgos.a: "Open the mines."
 abm_develop_kursk_rgos.title: "Prospect the Kursk Iron Field"
 abm_develop_kursk_rgos.desc: "The iron ore of the Kursk field lies close to the surface around Stary Oskol, beneath the farmland of the northern forest-steppe. Once every land in the province is a full core of ours, held by our own culture and faith, we can begin to work it."
 abm_develop_kursk_rgos.a: "Open the mines."
 abm_develop_belgorod_rgos.title: "Open the Belgorod Iron Mines"
 abm_develop_belgorod_rgos.desc: "The southern edge of the iron field reaches the lands around Muzhech. Once every land in the province is a full core of ours, held by our own culture and faith, we can open workings and supply our foundries."
 abm_develop_belgorod_rgos.a: "Open the mines."
 abm_develop_donetsk_rgos.title: "Establish Timber Works on the Donets"
 abm_develop_donetsk_rgos.desc: "The wooded valleys of the upper Donets tributaries around Khotmyzh and Kotelva carry timber enough for the shipyards and mines of the south. Once every land in the province is a full core of ours, held by our own culture and faith, we can put the woods to work."
 abm_develop_donetsk_rgos.a: "Fell the woods."

 abm_develop_majar_rgos.title: "Develop the Kuma Copper Shows"
 abm_develop_majar_rgos.desc: "Where the Caucasus foothills break out of the steppe around Pyatigorsk, copper ores lie close to the surface. Once every land in the province is a full core of ours, held by our own culture and faith, we can work them."
 abm_develop_majar_rgos.a: "Open the copper pits."

 abm_develop_terek_rgos.title: "Develop the Terek Copper"
 abm_develop_terek_rgos.desc: "The Terek basin has long carried copper shows that the mountain communities worked by hand. Once every land in the province is a full core of ours, held by our own culture and faith, we can work them."
 abm_develop_terek_rgos.a: "Open the copper pits."

 abm_develop_stavropol_rgos.title: "Work the Foothill Lead"
 abm_develop_stavropol_rgos.desc: "Argentiferous galena runs through the North Caucasus foothills, carrying lead and a little silver with it. Once every land in the province is a full core of ours, held by our own culture and faith, we can work it."
 abm_develop_stavropol_rgos.a: "Open the lead mine."

 abm_develop_taskala_rgos.title: "Work the Orenburg Copper and Tin"
 abm_develop_taskala_rgos.desc: "On the Ural margin at Taskala lies the old Kargaly copper field, worked since the Bronze Age, and further out towards the Kazakh steppe a workable tin. Once every land in the province is a full core of ours, held by our own culture and faith, we can work them."
 abm_develop_taskala_rgos.a: "Open the copper and tin workings."
