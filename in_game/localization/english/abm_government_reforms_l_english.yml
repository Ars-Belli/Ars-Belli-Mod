l_english:
 abm_eastern_christian_militant_church: "Militant Church"
 abm_eastern_christian_militant_church_desc: "The Eastern churches have never known a single shepherd, only a communion of patriarchs and catholicoi. Let the throne bind them to one purpose: the defence of the faith by the sword where preaching fails. Our clergy will march with our armies, our monasteries will keep our archives, and the heathen on every frontier will learn what an Orthodox war looks like."
