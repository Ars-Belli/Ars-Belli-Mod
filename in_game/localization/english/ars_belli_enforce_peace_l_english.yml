l_english:
 ars_belli_enforce_peace: "Enforce Peace"
 ars_belli_enforce_peace_desc: "Demand that a war be brought to a white peace. The defender is asked first, and only if they agree is the demand put to the attacker. If the attacker refuses, we enter the war on the defender's side."
 CATEGORY_MILITARY_ACTIONS_ars_belli_enforce_peace: "Enforce Peace"
 ars_belli_enforce_peace_act: "Demand a white peace in a war"
 ars_belli_enforce_peace_select_defender: "Select a Defender to Offer Peace To"
 ars_belli_enforce_peace_select_war: "Select a War to End"
 ars_belli_enforce_peace_no_defenders: "No country is currently defending a war we could intervene in."
 ars_belli_enforce_peace_no_wars: "$no_valid_wars$"
 ars_belli_enforce_peace_select_a_war: "Select a war to bring to a white peace"
 ars_belli_enforce_peace_standing_tt: "We must be a #H Great Power#! or a #H Major Power#!, or one of the war's leaders must be our [rival|e]"
 # AI weighting reasons.
 ars_belli_ep_reason_standing: "Our standing among the powers"
 ars_belli_ep_reason_outmatched: "The attacker outweighs us"
 # War-view button requirement lines. Shown passed or failed so a player who cannot
 # use the action still learns what it needs.
 ars_belli_ep_req_standing_met: "@trigger_yes! We are a #H Great Power#! or a #H Major Power#!, or one of the war's leaders is our [rival|e]"
 ars_belli_ep_req_standing_unmet: "@trigger_no! We must be a #H Great Power#! or a #H Major Power#!, or one of the war's leaders must be our [rival|e]"
 ars_belli_ep_req_not_participant_met: "@trigger_yes! We are not fighting in this [war|e]"
 ars_belli_ep_req_not_participant_unmet: "@trigger_no! We cannot demand peace in a [war|e] we are fighting in ourselves"
 ars_belli_enforce_peace_defender_refused_tt: "The war continues unchanged"
 INCOMING_OFFER_ars_belli_enforce_peace: "$ACTOR$ demands that our war be brought to a white peace. If we agree, the demand will then be put to the enemy, and $ACTOR$ will join the war on our side should they refuse. Do we accept?\n\n$INFO$"
 PROPOSE_ars_belli_enforce_peace: "Demand a white peace from $RECIPIENT$?\n$INFO$."
 ars_belli_enforce_peace_effect_text: "[SCOPE.sCountry('actor').GetName] demands a white peace in the [SCOPE.sWar('target').GetName]"
 ars_belli_enforce_peace_effect_text_past: "[SCOPE.sCountry('actor').GetName] demanded a white peace in the [SCOPE.sWar('target').GetName]"
 ars_belli_enforce_peace_reject_effect_text: "$generic_reject_demand_effect_string$"
 ars_belli_enforce_peace_reject_effect_text_past: "$generic_reject_demand_effect_string_past$"

 ars_belli_enforce_peace.1.title: "A Demand for Peace"
 ars_belli_enforce_peace.1.desc: "[SCOPE.sCountry('ep_enforcer').GetNameWithNoTooltip] has demanded that we bring our war against [SCOPE.sCountry('ep_defender').GetNameWithNoTooltip] to a close, and [SCOPE.sCountry('ep_defender').GetNameWithNoTooltip] has already consented to a white peace.\n\nThe choice now rests with us. We may lay down our arms and accept that nothing is to be gained from this war, or we may press on regardless - though if we do, [SCOPE.sCountry('ep_enforcer').GetNameWithNoTooltip] has made plain that they will take the field against us."
 ars_belli_enforce_peace.1.a: "Very well. Let there be peace."
 ars_belli_enforce_peace.1.b: "We will not be dictated to. The war goes on."

 ars_belli_enforce_peace.2.title: "The War Is Ended"
 ars_belli_enforce_peace.2.desc: "Both sides have accepted our terms. The war has been brought to a white peace, and neither party takes anything from the other. Our word carried weight where armies would otherwise have marched."
 ars_belli_enforce_peace.2.a: "As it should be."

 ars_belli_enforce_peace.3.title: "Our Demand Is Refused"
 ars_belli_enforce_peace.3.desc: "[SCOPE.sWar('ep_war').GetName] continues. Though the defenders were willing to accept a white peace, the attackers have refused our demand outright.\n\nWe said we would stand with the defenders if it came to this, and so we shall. We are now at war."
 ars_belli_enforce_peace.3.a: "Then we honour our word."

 # Retarget the vanilla rival-war alert: it used to advertise Intervene in War.
 ALERT_INTERVENE_RIVAL_WAR_AVAILABLE_TITLE: "Enforce Peace on a Rival"
 ALERT_INTERVENE_RIVAL_WAR_AVAILABLE: "One of our [rivals|e] is at war. We can demand a [white_peace|e] to bring it to an end."
 ALERT_INTERVENE_RIVAL_WAR_ENTRY: "[WAR.GetName]: Demand a [white_peace|e] against [COUNTRY.GetName]."
