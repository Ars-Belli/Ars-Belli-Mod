l_english:
 abm_expel_fondacos: "Expel Fondacos, Kontors and Enclaves"
 abm_expel_fondacos_desc: "Destroy every Fondaco, Hanseatic Kontor and Merchant Enclave they hold in our lands and revoke their [ShowRelationTypeName('fondaco_rights')], so they cannot build here again. Costs one [diplomats|e]. They gain a #R claim for war#! against us for 10 years, and our own trade suffers $STATIC_MODIFIER_NAME_abm_expelled_foreign_merchants$ (#R -10%#! [trade_income|e], [merchant_capacity|e] and [trade_range|e]) for 10 years."
 abm_expel_fondacos_act: "Expel the Fondacos, Kontors and Enclaves held by [SCOPE.sCountry('recipient').GetName] in our lands"
 abm_expel_fondacos_SELECT_TITLE: "Select Country"
 abm_expel_fondacos_no_countries: "@trigger_no! No countries available."
 abm_expel_fondacos_has_fondacos_tt: "They must hold a Fondaco, Kontor or Merchant Enclave in our lands"
 abm_expel_fondacos_effect_text: "[SCOPE.sCountry('actor').GetName] expel the Fondacos, Kontors and Enclaves of [SCOPE.sCountry('recipient').GetName] from their lands and revoke their [ShowRelationTypeName('fondaco_rights')]."
 abm_expel_fondacos_effect_text_past: "[SCOPE.sCountry('actor').GetName] expelled the Fondacos, Kontors and Enclaves of [SCOPE.sCountry('recipient').GetName] from their lands and revoked their [ShowRelationTypeName('fondaco_rights')]."
 PROPOSE_abm_expel_fondacos: "Expel every Fondaco, Kontor and Enclave $RECIPIENT$ holds in our lands, and revoke their rights?\n\n$INFO$"

 # Game 1.3.11 key family (dip_<action>_CATEGORY). The older CATEGORY_<KIND>_<action> form is kept
 # alongside it, as the mod's other country actions do, in case a UI path still reads it.
 CATEGORY_ECONOMY_ACTIONS_abm_expel_fondacos: "Expel Fondacos, Kontors and Enclaves"
 dip_abm_expel_fondacos_CATEGORY: "CATEGORY_ECONOMY_ACTIONS"
