 abm_expel_fondacos_effect_text_past: "[SCOPE.sCountry('actor').GetName] expelled the Fondacos and Kontors of [SCOPE.sCountry('recipient').GetName] from their lands and revoked their [ShowRelationTypeName('fondaco_rights')]."
